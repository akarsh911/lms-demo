<title>emerge-core architecture map</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #1b2330;
  --muted: #5b6676;
  --line: #dde2ea;
  --accent: #2f5fd0;
  --code-bg: #eef1f6;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 20px rgba(20,30,50,.06);
  --entry: #d6f2de; --entry-s: #2e9b57;
  --iface: #e6dcf8; --iface-s: #7a4fd0;
  --shared: #e1e6ee; --shared-s: #6b7a93;
  --db: #fbecc2; --db-s: #c28a0b;
  --external: #fbdcc6; --external-s: #d8661d;
  --async: #cdeef4; --async-s: #1b8ea6;
  --error: #f9d2d2; --error-s: #cf3a3a;
  --auth: #d3e1fb; --auth-s: #2f5fd0;
}
:root[data-theme="dark"] {
  --bg: #0f141b;
  --panel: #171e28;
  --ink: #e4e9f1;
  --muted: #98a3b5;
  --line: #2a3443;
  --accent: #7ba2ff;
  --code-bg: #212b39;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --entry: #17402a; --entry-s: #4cc77f;
  --iface: #2f2550; --iface-s: #a583f0;
  --shared: #2a3342; --shared-s: #8d9bb4;
  --db: #4a3a0c; --db-s: #e0b13c;
  --external: #4d2a14; --external-s: #f0894a;
  --async: #0f3d47; --async-s: #4cc5dc;
  --error: #4f1c1c; --error-s: #ef6a6a;
  --auth: #1c2f58; --auth-s: #7ba2ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 118px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
header.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.search { position: relative; flex: 1 1 260px; max-width: 520px; }
.search input {
  width: 100%; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.results {
  position: absolute; top: 44px; left: 0; right: 0; max-height: 60vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: none;
}
.results.open { display: block; }
.results button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
  padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font: inherit;
}
.results button:hover, .results button:focus { background: var(--code-bg); outline: none; }
.results small { display: block; color: var(--muted); }
.results mark { background: color-mix(in srgb, var(--db-s) 35%, transparent); color: inherit; border-radius: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--cs); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--cs); }
.tool {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
.tool:hover { border-color: var(--accent); }
.tool[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 0; }
nav.side {
  position: sticky; top: 108px; align-self: start; height: calc(100vh - 108px); overflow: auto;
  padding: 16px 10px 40px 16px; border-right: 1px solid var(--line);
}
nav.side h4 { margin: 14px 8px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
nav.side a {
  display: block; padding: 5px 10px; border-radius: 8px; text-decoration: none; color: var(--ink);
  font-size: 13.5px; line-height: 1.35; border-left: 3px solid transparent;
}
nav.side a:hover { background: var(--code-bg); }
nav.side a.page { font-weight: 650; }
nav.side a.page.active { background: var(--code-bg); border-left-color: var(--accent); }
nav.side a.sub { padding-left: 22px; color: var(--muted); font-size: 13px; }
nav.side a.sub.h3 { padding-left: 34px; font-size: 12.5px; }
nav.side a.sub.on { color: var(--ink); border-left-color: var(--accent); background: var(--code-bg); }
main { padding: 24px clamp(16px, 4vw, 48px) 120px; min-width: 0; }
main .page { max-width: 1180px; margin: 0 auto; animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 14px; }
h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 12px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 28px 0 8px; }
h4 { font-size: 15px; margin: 20px 0 6px; }
p { margin: 10px 0; }
code {
  font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--code-bg); padding: 1px 6px; border-radius: 5px; word-break: break-word;
}
code.path { cursor: copy; border: 1px dashed transparent; }
code.path:hover { border-color: var(--accent); }
code.path.copied { background: var(--entry); border-color: var(--entry-s); }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 10px; overflow: auto; }
pre code { background: transparent; padding: 0; }
.tw { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--code-bg); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .15s; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody tr.hit { background: color-mix(in srgb, var(--db-s) 28%, transparent); animation: flash 1.6s ease; }
@keyframes flash { from { background: color-mix(in srgb, var(--db-s) 60%, transparent); } }
blockquote { margin: 12px 0; padding: 4px 14px; border-left: 4px solid var(--accent); background: var(--code-bg); border-radius: 0 8px 8px 0; }
.dg {
  margin: 18px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  overflow: hidden; opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease;
}
.dg.seen { opacity: 1; transform: none; }
.dg-bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dg-bar .kind { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.dg-bar .caption { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 120px; text-align: right; }
.dg-body { padding: 14px; overflow: auto; text-align: center; min-height: 80px; }
.dg-body svg { max-width: 100%; height: auto; }
.dg-load { color: var(--muted); font-size: 13px; padding: 24px; }
.dg-load::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.dg-src { display: none; margin: 0; border-radius: 0; border-top: 1px solid var(--line); max-height: 320px; text-align: left; }
.dg.show-src .dg-src { display: block; }
.dg-info {
  display: none; border-top: 1px solid var(--line); padding: 10px 14px; text-align: left; font-size: 13.5px;
  background: color-mix(in srgb, var(--accent) 6%, var(--panel));
}
.dg-info.open { display: block; animation: rise .25s ease both; }
.dg-info b { color: var(--accent); }
.dg-info .miss { color: var(--muted); }
.dg-err { color: var(--error-s); padding: 14px; text-align: left; }
.dg svg g.node, .dg svg .actor, .dg svg .messageText, .dg svg .edgePath path, .dg svg .flowchart-link, .dg svg .messageLine0, .dg svg .messageLine1 { transition: opacity .25s ease, stroke-width .2s ease, filter .25s ease; }
.dg svg g.node { cursor: pointer; }
.dg svg g.cat { cursor: pointer; }
.dg svg g.node.cat-ENTRY :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-ENTRY > rect { fill: var(--entry) !important; stroke: var(--entry-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-INTERFACE :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-INTERFACE > rect { fill: var(--iface) !important; stroke: var(--iface-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-SHARED :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-SHARED > rect { fill: var(--shared) !important; stroke: var(--shared-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-DB :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-DB > rect { fill: var(--db) !important; stroke: var(--db-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-EXTERNAL :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-EXTERNAL > rect { fill: var(--external) !important; stroke: var(--external-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-ASYNC :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-ASYNC > rect { fill: var(--async) !important; stroke: var(--async-s) !important; stroke-width: 2px !important; stroke-dasharray: 6 3; }
.dg svg g.node.cat-ERROR :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-ERROR > rect { fill: var(--error) !important; stroke: var(--error-s) !important; stroke-width: 2px !important; }
.dg svg g.node.cat-AUTH :is(rect, polygon, circle, ellipse, path), .dg svg g.cat-AUTH > rect { fill: var(--auth) !important; stroke: var(--auth-s) !important; stroke-width: 2px !important; }
:root[data-theme="dark"] .dg svg g.node :is(.nodeLabel, span, p), :root[data-theme="dark"] .dg svg g.cat text { fill: var(--ink) !important; color: var(--ink) !important; }
:root:not([data-theme="dark"]) .dg svg g.node :is(.nodeLabel, span, p), :root:not([data-theme="dark"]) .dg svg g.cat text { color: #1b2330; }
.dg svg .dim { opacity: .14; }
.dg svg g.node.sel :is(rect, polygon, circle, ellipse, path), .dg svg g.cat.sel > rect { stroke-width: 4px !important; filter: drop-shadow(0 0 6px var(--accent)); }
.dg svg g.node.on :is(rect, polygon, circle, ellipse, path) { filter: drop-shadow(0 0 8px var(--accent)); stroke: var(--accent) !important; stroke-width: 4px !important; }
.dg.flow svg path.flowchart-link { stroke-dasharray: 7 5; animation: dash .9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -12; } }
.dg svg path.flowchart-link.lit { stroke: var(--accent) !important; stroke-width: 3.5px !important; stroke-dasharray: 7 5; animation: dash .5s linear infinite; }
.dg svg path.flowchart-link.on { stroke: var(--accent) !important; stroke-width: 4px !important; stroke-dasharray: 7 5; animation: dash .4s linear infinite; }
.dg svg .step-hidden { opacity: .08; }
.dg svg .step-now { filter: drop-shadow(0 0 5px var(--accent)); }
.dg svg text.messageText.step-now { font-weight: 700; }
.overlay { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 94%, transparent); display: none; flex-direction: column; }
.overlay.open { display: flex; animation: rise .25s ease both; }
.overlay .obar { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.overlay .stage { flex: 1; overflow: hidden; cursor: grab; position: relative; }
.overlay .stage.drag { cursor: grabbing; }
.overlay .stage .inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin: 14px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); transition: transform .2s ease, border-color .2s ease; }
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card h3 { margin: 0 0 4px; font-size: 16px; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.card ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
.card li a { display: block; padding: 3px 0; font-size: 13px; text-decoration: none; color: var(--ink); border-bottom: 1px dashed var(--line); }
.card li a:hover { color: var(--accent); }
.card li.h3 a { padding-left: 14px; color: var(--muted); }
.menu { display: none; }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 80;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  nav.side {
    position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: 290px; z-index: 50; background: var(--panel);
    transform: translateX(-102%); transition: transform .25s ease; padding-top: 70px; box-shadow: var(--shadow);
  }
  nav.side.open { transform: none; }
  .menu { display: inline-block; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  html { scroll-behavior: auto; }
}

<script>
const PAGES = [{"id":"0","nav":"Overview, flow index, findings","title":"emerge-core: architecture and flow map","md":"# emerge-core: architecture and flow map\n\nemerge-core is a Go 1.25 modular HTTP backend (chi router, ent ORM, pgx) for a school OS. It is **two-plane multi-tenant**: one control-plane Postgres (`emerge_control`) holds `schools`, `school_profiles` (AES-256-GCM encrypted per-tenant credentials) and the mail outbox, and **every school has its own Postgres database**. Identity and permissions come from an external service called **CAS**.\n\nThis map was produced by five parallel read-only investigations of the code, one per area, then assembled here. Every diagram is followed by a table that maps each node to a `path:Function`. All 61 Mermaid diagrams (59 from the investigations, 2 written here) were run through Mermaid's parser; they were not individually checked by eye, and the code was not executed. Anything an investigator could not confirm is listed in the *Verified vs unverified* section at the end of its part and is left out of the diagrams.\n\n## How to read this page\n\n| Colour | Tag in node text | Meaning |\n|---|---|---|\n| green | ENTRY | where a request or process starts |\n| purple | INTERFACE | a Go interface or contract |\n| slate | SHARED | shared or common module |\n| amber | DB | database access |\n| orange | EXTERNAL | a system outside this repository |\n| cyan | ASYNC | async, goroutine, cache or process boundary |\n| red | ERROR | error or refusal path |\n| blue | AUTH | authentication or authorization boundary |\n\nClick a node to highlight its edges and see the matching row of the code table. Use the toolbar above a diagram to expand it, trace the edges in order, or view the source. Click any file path in the tables to copy it. The chips in the top bar dim everything except one tag.\n\n## 1. High-level architecture\n\n```mermaid\nflowchart TB\n    CL[\"ENTRY clients: web apps, scripts/e2e.sh, scripts/smoke.sh, api/ Bruno collection\"]\n    NG[\"SHARED deploy/nginx/core.tryemerge.in.conf proxies to 127.0.0.1:8077\"]\n    subgraph PROC[\"cmd/api process (cmd/api/main.go:run)\"]\n        RT[\"ENTRY transport/http/server.go:Router\"]\n        MW[\"AUTH middleware.Authenticate, RequireTenant, Server.can\"]\n        HD[\"handlers transport/http/*.go\"]\n        AZ[\"INTERFACE authorization.Guard and data/access predicates\"]\n        EN[\"SHARED ent clients and internal/data helpers\"]\n        subgraph BG[\"ASYNC in-process workers\"]\n            IX[\"indexing.Dispatcher and Sweeper\"]\n            TG[\"timetablegen.Dispatcher\"]\n            ML[\"mail.Sender\"]\n        end\n    end\n    CP[(\"DB control plane: schools, school_profiles, outbox\")]\n    TD[(\"DB one Postgres per school\")]\n    CAS[\"EXTERNAL CAS: JWKS, policies, admin, login\"]\n    RE[\"EXTERNAL retrieval engine\"]\n    S3[\"EXTERNAL S3 object store via infrastructure/blob\"]\n    PY[\"EXTERNAL Python timetable solver tools/timetable-solver\"]\n    CL --> NG --> RT --> MW --> HD\n    MW -. \"token verify, policies\" .-> CAS\n    HD --> AZ --> EN\n    EN --> TD\n    MW --> CP\n    HD -. \"enqueue\" .-> IX\n    HD -. \"enqueue\" .-> TG\n    IX --> RE\n    TG --> PY\n    ML --> CP\n    HD --> S3\n    IX --> TD\n    TG --> TD\n```\n\n| Node | Code |\n|---|---|\n| process wiring | `cmd/api/main.go:run` |\n| router | `internal/transport/http/server.go:Server.Router` |\n| middleware | `internal/transport/http/middleware/auth.go`, `tenant.go`; `server.go:Server.can` |\n| guard | `internal/authorization/authorization.go:Guard`; row scoping in `internal/data/access/*` |\n| control / tenant pools | `internal/infrastructure/postgres/control.go`, `tenant.go` (Registry) |\n| CAS clients | `internal/infrastructure/cas/{verifier,policies,proxy,admin}.go` |\n| retrieval engine client | `internal/service/indexing/client.go` |\n| blob store | `internal/infrastructure/blob/client.go` |\n| solver client | `internal/service/timetablegen/client.go` |\n| mail sender | `internal/service/mail/sender.go` |\n\nOther binaries in `cmd/`: `migrate` (applies SQL migrations per plane or tenant), `seed`, `seeddemo`, `assetreap`, `mailpurge`, `catalogdump`. Only `api` and `migrate` are in the API image; `assetreap` and `mailpurge` are manual, dry-run by default (see part C).\n\n## 2. Request lifecycle at a glance\n\n```mermaid\nflowchart TD\n    A[\"ENTRY HTTP request\"] --> B[\"SHARED chimw.RequestID, RealIP\"]\n    B --> C[\"ERROR path mw.Recoverer: panic becomes 500\"]\n    C --> D[\"SHARED mw.RequestLogger\"]\n    D --> E[\"ASYNC requestTimeout: 30s, longer for asset content\"]\n    E --> F{\"route\"}\n    F -- \"/health, /api/v1/health, /api/v1/\" --> Z[\"public handlers\"]\n    F -- \"/api/v1/auth/*\" --> R[\"EXTERNAL relay to CAS, no token needed\"]\n    F -- \"rest of /api/v1\" --> G[\"AUTH s.authenticate: bearer JWT or DevSubject\"]\n    G -- \"no or bad token\" --> G1[\"ERROR 401\"]\n    G -- \"CAS keys unavailable\" --> G2[\"ERROR 503\"]\n    G --> H{\"plane\"}\n    H -- \"control: /schools\" --> I[\"AUTH s.can(SchoolsRead|Write|Delete)\"]\n    H -- \"tenant\" --> J[\"AUTH mw.RequireTenant: resolve X-School-Id\"]\n    J -- \"missing or unknown\" --> J1[\"ERROR 400 or 404\"]\n    J --> K[\"AUTH s.can(permission)\"]\n    K -- \"denied\" --> K1[\"ERROR 403\"]\n    K --> L[\"handler: scopeFor, validate, ent query\"]\n    L --> M[(\"DB tenant ent client\")]\n    L --> N[\"SHARED pkg/response JSON\"]\n```\n\n| Node | Code |\n|---|---|\n| global middleware, order | `internal/transport/http/server.go:Router` |\n| Recoverer / RequestLogger | `internal/transport/http/middleware/recover.go`, `logging.go` |\n| requestTimeout | `server.go:requestTimeout`, `streamsItsBody` |\n| relay | `internal/transport/http/auth.go:Server.relay`, `relayAndForget` |\n| authenticate | `server.go:Server.authenticate`, `middleware/auth.go:Authenticate`, `DevSubject` |\n| RequireTenant | `internal/transport/http/middleware/tenant.go:RequireTenant` |\n| can | `internal/transport/http/server.go:Server.can` |\n| response writer | `pkg/response/response.go` |\n\nDetailed sequence diagrams for a tenant-plane and a control-plane request are in part A section 3; the auth-specific ones are in part B.\n\n## 3. Where each of the seven asks lives\n\n| Ask | Where |\n|---|---|\n| 1. High-level architecture | section 1 above; startup wiring in A section 2 |\n| 2. Request lifecycle | section 2 above; A section 3 (sequence diagrams, error source map) |\n| 3. Business flows | D1 (onboarding, people, structure, library, curriculum, papers), D2 (timetable, attendance, exams, results, engagement) |\n| 4. Authentication and authorization | B |\n| 5. Database and data flow | A sections 4, 5 (tenant resolution, ER diagrams by domain, migrations) |\n| 6. Background jobs, queues, events, schedules | C sections 1 to 6 and 8 |\n| 7. External integrations | C section 7; B for CAS |\n\n## 4. Facts that differ from what you might assume\n\nThese are the points most likely to surprise a new engineer. Each was confirmed by reading code by the investigator named; see the matching part for evidence.\n\n| Assumption | What the code does | Part |\n|---|---|---|\n| There is an event bus or message broker | None exists. \"Queues\" are in-memory buffered channels (index dispatcher 64, timetable dispatcher 16, mail per-school 64) or Postgres rows. Three tickers: index sweeper 5m, mail sender 10s, per-job index poll 2s | C |\n| Mail is sent when people are provisioned | `mail.Submitter` is never constructed outside tests. The sender drains an outbox nothing fills; provisioning returns the password in the API response | C |\n| `POST /schools` creates the school database | It writes one control-plane row and makes a best-effort CAS tenant group. The database is created out of band, then `PUT /schools/{id}/profiles/postgres`, then `cmd/migrate apply -plane tenant`. `deploy/README.md` saying otherwise is stale | D1, A |\n| MySQL is used per tenant | A `mysql` profile is stored and probed with a TCP dial only. No driver in `go.mod`; nothing calls `MySQLCredentials` or `DSN()` | C |\n| The API migrates on boot | It never does. `cmd/migrate` has its own `schema_migrations` ledger and ignores `atlas.sum`; a tenant can be migrated only after its school is registered | A |\n| Tenant is chosen only by school UUID | `RequireTenant` tries the `X-School-Id` header as a UUID, then a school code, then a CAS tenant slug | A |\n| Tenant connection pools are bounded | The pool cache has no TTL or LRU; pools are dropped only by `Registry.Evict` | A |\n| Authorization can use attribute conditions | Every `guard.Allow` passes `attrs == nil`, so CAS grants whose condition is neither row nor reach are skipped and never grant | B |\n| Policies fail closed when CAS is down | Cached policies are served stale up to 2x the 60s TTL, then 503. Cached JWKS keys are trusted with no maximum age; only an uncached `kid` gives 503 | B |\n| Curriculum content resolution is \"fail-open\" | `resolveCurriculumNodeContent` fails closed: 409 above 500 placements, 403 on a partial field tuple, and it needs both `ContentPlacementsRead` and `LibraryRead`. \"Fail-open\" is only the name of the bug class avoided | D1 |\n| Student timetable service | `service/timetable/students.go` only builds enrolment sets for the `student_set` clash rule. Students read via `GET /timetable-occurrences` and `GET /sections/{id}/calendar` | D2 |\n| Substitution is automated | It is a deviation row with `kind=substitution`; absences only classify lessons as covered, uncovered or cancelled | D2 |\n| `/student-assignments` is homework | It is role assignments (class monitor and similar); homework is `/assignments` | D2 |\n| `proto/cas/v1` generates Go stubs | No Go code uses it; the `casv1` stubs and `scripts/proto.sh` named in `proto/README.md` do not exist | B |\n\n## 5. Gaps and hazards found while tracing\n\nThese are observations from reading code, not runtime findings. Severity is a judgement for triage, not a measured impact.\n\n| # | Observation | Where | Part |\n|---|---|---|---|\n| 1 | `createTimetable` and `updateTimetable` accept `status=published` without calling `timetable.Service.Publish`, skipping cover-exclusivity, predecessor and conflict checks. `Publish` itself does not re-run the clash check | `internal/transport/http/timetable.go`, `internal/service/timetable/publish.go` | D2 |\n| 2 | Timetable generation rows in `queued` or `running` are never reaped. A crash mid-run leaves `running`, and the partial unique index then blocks new generation for that timetable | `internal/service/timetablegen/runner.go` | C |\n| 3 | A solver 503 \"busy\" becomes a failed job with reason `refused`; there is no retry in the Go client | `internal/service/timetablegen/client.go` | C |\n| 4 | `Dispatcher.Close` waits for all queued work with no deadline (indexing up to 15m per job, timetable up to 5m), so shutdown can outlast `ShutdownTimeout` | `internal/service/indexing/dispatcher.go` | C |\n| 5 | Failed index items retry forever with capped jittered backoff (5m base, 6h cap); `parked` and `held` are terminal. The retrieval client never deletes, so unpublishing never removes a document from the engine (search re-checks results against the tenant DB) | `internal/service/indexing` | C |\n| 6 | `academic_sessions.is_current` has no unique constraint; two sessions can end up current because demotion is a separate statement | `internal/transport/http/academic.go` | D1 |\n| 7 | One active elective arm per group is enforced in code only (`holdsNoOtherArm`), so concurrent requests can race | `internal/transport/http/subjectenrollments.go:holdsNoOtherArm` | D1 |\n| 8 | Inline person creation has no transaction across CAS user creation, person upsert and the downstream insert; a failing student insert leaves the CAS user and person behind | `internal/transport/http/inlineperson.go` | D1 |\n| 9 | Missing provisioning fields (`username`, `first_name`) surface as 502 \"identity service could not create that person\" rather than 400 | `internal/service/provisioning.go`, `internal/transport/http/persons.go:writeProvisioningErr` | D1 |\n| 10 | `createAddress`, `createDocument`, `createNote` do not check the caller can reach the student; update and delete do | `internal/transport/http/studentsub.go` | D1 |\n| 11 | `PATCH /papers/{id}` on a published paper is refused (422 `paper_is_published`) before the new status is read, so it cannot even be archived; `DELETE` on a published paper returns 404 | `internal/transport/http/papers.go` | D1 |\n| 12 | `createEnrollment`, `createOffering`, `createTeacherAssignment` do not cross-check section, session and offering | `internal/transport/http/enrollments.go`, `subjects.go:createOffering`, `teacherassignments.go` | D1 |\n| 13 | No handler can set `exams.delivery=online`, so the online-test endpoints answer 422 unless the row was changed outside the API | `internal/transport/http/exams.go`, `onlinetests.go` | D2 |\n| 14 | `award_mode=auto_rule` is never evaluated; `assignments.max_attempts` is stored but not enforced by `submitAssignment` | `internal/transport/http/recognition.go`, `assignments.go:submitAssignment` | D2 |\n| 15 | Stream post, assignment and online-test submit write multiple rows without a transaction | `internal/transport/http/stream.go`, `assignments.go`, `onlinetests.go` | D2 |\n| 16 | `exam_subjects.grading_scheme_id` is written but never read; report cards use the offering's scheme | `internal/transport/http/reportcards.go` | D2 |\n| 17 | `writeTenancyErr` maps only `ErrNoTenant` to 400 and everything else to 500, so a handler-level DB deadline looks like 500 rather than 504 (inferred, not run) | `internal/transport/http/schools.go:writeTenancyErr` | A |\n| 18 | A CAS refusal of the user token on `/v1/policies` returns 503, not 401; an upstream error inside `scopeFor` returns 500 | `internal/infrastructure/cas/policies.go`, `scopeFor` | B |\n| 19 | Dead code: `Server.viewerFor`, `cas.TokenSource`, the relay table's `me` entry, and `roleassignments.go` (payload helpers only) | `internal/transport/http/viewer.go`, `cas/admin.go`, `cas/proxy.go` | A, B |\n| 20 | Two untested hazards: a send-on-closed-channel race between the sweeper and `Dispatcher.Close`, and a duplicate mail send after a lapsed lease | `internal/service/indexing`, `internal/service/mail` | C |\n\n## 6. Flow index\n\nThe index below is generated from the parts of this document. Each card opens that part; each line jumps to the section.\n"},{"id":"A","nav":"A. Foundations and data flow","title":"A. Foundations and data flow (emerge-core)","md":"# A. Foundations and data flow (emerge-core)\n\nLegend for every diagram: node prefixes ENTRY, INTERFACE, SHARED, DB, EXTERNAL, ASYNC, ERROR, AUTH. Each diagram is followed by a table giving path:Function for every node.\n\n## 1. Repo inventory\n\nModule: github.com/Harbour-Emerge/emerge-core (go.mod, Go 1.25, chi v5.3.2, ent v0.14.6, atlas, pgx v5, excelize, aws-sdk s3, golang-jwt).\n\n| Path | Purpose (verified) |\n|---|---|\n| cmd/api | The HTTP server binary (main.go: run) |\n| cmd/migrate | Versioned SQL migration tool: make (atlas diff via ent), apply, status, for control and per-tenant planes |\n| cmd/seed | Registers a school + encrypted DB creds in control plane, creates first admin in tenant DB (idempotent) |\n| cmd/seeddemo | Fills one school with a demo year (classes, sections, teachers, students, timetable, attendance, exams) |\n| cmd/assetreap | Sweeps stale pending/soft-deleted library assets across tenants; dry run unless -destroy |\n| cmd/mailpurge | Purges terminal rows of the control-plane mail outbox; dry run unless -destroy |\n| cmd/catalogdump | Prints authorization/catalog.Build() as JSON |\n| internal/authorization | Entities (permission keys), Guard interface (AllowAll, DenyAll), PolicySet, constraints, field policies, catalog |\n| internal/config | Env-driven Config + .env loader |\n| internal/data/{access,academic,enrollment,filter,guardian,person,school,staff,student,studentrecord,teacher} | Query builders and predicates over tenant ent client; access = viewer scoping |\n| internal/domain/{shared,tenancy} | Tenant struct, credential structs, tenancy errors, ctx helpers; shared types (Metadata, Address) |\n| internal/ent/schema, internal/ent/control/schema | ent schemas for tenant plane and control plane; generated code in internal/ent/generated and internal/ent/control/generated |\n| internal/infrastructure/{blob,cas,crypto,postgres} | S3 client; CAS verifier/policy client/admin/auth proxy; AES-GCM keyring; pgx opening, Control, tenant Registry |\n| internal/observability | Context-carried slog helpers (Step/Decision/Problem) |\n| internal/retrieval | labels.go and tests only (no runtime wiring seen in main) |\n| internal/service | Provisioner, TenantProvisioner; subpackages assets, indexing, mail, results, timetable, timetablegen |\n| internal/testsupport | tenantdb.go: DB-backed test helper with skip marker |\n| internal/transport/http | chi Server, handlers, middleware/ (auth, logging, recover, tenant) |\n| pkg/response | JSON/Error/Decode helpers |\n| migrations/control, migrations/tenant | Atlas-format SQL files plus atlas.sum |\n| proto/cas/v1 | CAS proto (not inspected further: unverified use) |\n| tools/timetable-solver | Python CP-SAT solver service (run.py, server.py, tests) |\n| scripts | dev.sh, smoke.sh, e2e.sh, genkey.sh, cas-*.py/sh helpers for registering CAS entities/roles |\n| api | Bruno collection (folders 01-health .. 14-cleanup, environments/local.bru) mirroring the e2e flow |\n| deploy | Dockerfile.tools, Dockerfile.timetable-solver, docker-compose.yml (prod), docker-compose.timetable-solver.yml, nginx/core.tryemerge.in.conf, setup-db.sh, README.md |\n| docs | DESIGN-NOTES, STATUS, ROADMAP, TODO etc. |\n| .github/workflows | ci.yml, nocomments.py |\n| Dockerfile, docker-compose.yml (root) | api image (api + migrate); local control-db, dev-db, tenant-db, MinIO |\n| seeddemo.exe, ttprobe.exe | stray binaries in repo root (purpose of ttprobe unverified) |\n\n## 2. Process startup (cmd/api/main.go run)\n\n```mermaid\nflowchart TD\n  E1[\"ENTRY main/run\"] --> C1[\"SHARED config.Load\"]\n  C1 --> L1[\"SHARED newLogger\"]\n  L1 --> S1[\"ASYNC signal.NotifyContext SIGINT SIGTERM\"]\n  S1 --> D1[\"DB postgres.NewControl\"]\n  D1 --> K1[\"SHARED crypto.ParseKeyring\"]\n  K1 --> R1[\"SHARED postgres.NewRegistry\"]\n  R1 --> A1[\"AUTH newAuth: Verifier + Guard\"]\n  A1 --> P1[\"EXTERNAL newAuthProxy\"]\n  P1 --> V1[\"SHARED newProvisioner and newTenantProvisioner\"]\n  V1 --> M1[\"ASYNC go sender.Run mail outbox\"]\n  M1 --> T1[\"ASYNC timetablegen Dispatcher workers\"]\n  T1 --> I1[\"ASYNC indexing Dispatcher workers + go sweeper.Run\"]\n  I1 --> H1[\"ENTRY http.Server ListenAndServe goroutine\"]\n  H1 --> W1[\"wait select errCh or ctx.Done\"]\n  W1 --> X1[\"ERROR/exit srv.Shutdown with ShutdownTimeout, deferred Close calls\"]\n```\n\n| Node | Where |\n|---|---|\n| main/run | cmd/api/main.go:main, run |\n| config.Load | internal/config/config.go:Load (LoadDotEnv reads ./.env, does not override existing env) |\n| newLogger | cmd/api/main.go:newLogger (JSON when APP_ENV=production or LOG_FORMAT=json) |\n| NotifyContext | cmd/api/main.go:run |\n| NewControl | internal/infrastructure/postgres/control.go:NewControl (errors if CONTROL_DATABASE_URL empty, checked in run) |\n| ParseKeyring | internal/infrastructure/crypto/aesgcm.go:ParseKeyring (fails if SECRETS_MASTER_KEY empty, even in development) |\n| NewRegistry | internal/infrastructure/postgres/tenant.go:NewRegistry |\n| newAuth | cmd/api/main.go:newAuth: AuthDisabled -> nil verifier + AllowAll; no client creds -> DenyAll; else cas.NewGuard |\n| newAuthProxy | cmd/api/main.go:newAuthProxy (only if auth enabled and CAS_AUTH_PROXY) |\n| provisioners | cmd/api/main.go:newProvisioner, newTenantProvisioner (CAS admin client) |\n| sender.Run | cmd/api/main.go:newMailSender; internal/service/mail/sender.go:Run (ticker Tick loop; reads control-plane outbox) |\n| timetablegen | internal/service/timetablegen/dispatcher.go:DispatcherFor, NewDispatcher (go d.work per worker); injected via transport.UseTimetableSolver |\n| indexing | cmd/api/main.go:newIndexDispatcher, newIndexSweeper; internal/service/indexing/dispatcher.go:NewDispatcher, sweeper.go:Run; injected via transport.UseIndexer; search via transport.UseSearcher (newSearchClient) |\n| http.Server | cmd/api/main.go:run (Read/Write/Idle timeouts from config); handler is transport.NewServer(...).WithMail(...).Router() |\n| shutdown | cmd/api/main.go:run (srv.Shutdown; defers close registry, control, dispatchers, sender) |\n\nNotes: the API does not run migrations on boot (deploy/README.md; verified no migrate call in main). Only mail sender and index sweeper are long-lived goroutines with ctx; dispatchers are worker pools drained on Close. Note: the HTTP server and registry start before the sender goroutine finishes; there is no ordering guarantee beyond code order.\n\n### Config / env table (internal/config/config.go)\n\n| Env var | Default | Gates |\n|---|---|---|\n| APP_ENV | development | production requires CONTROL_DATABASE_URL, SECRETS_MASTER_KEY, CAS_CLIENT_ID/SECRET; forbids AUTH_DISABLED; JSON logs |\n| PORT | 8081 | listen port (must be numeric) |\n| CONTROL_DATABASE_URL | \"\" | control plane DSN (main errors if empty) |\n| SECRETS_MASTER_KEY | \"\" | keyring \"ver:hex64[,ver:hex64]\" |\n| CAS_BASE_URL | \"\" | enables auth (AuthEnabled = !AUTH_DISABLED and base url set); required unless AUTH_DISABLED |\n| CAS_ISSUER, CAS_AUDIENCE(mentis), CAS_SERVICE_KEY(core) | | JWT issuer/audience checks; service key = audience for policy fetch |\n| CAS_CLIENT_ID, CAS_CLIENT_SECRET | \"\" | policy client; absent -> DenyAll guard |\n| CAS_POLICY_TTL | 60s | policy cache TTL |\n| CAS_AUTH_PROXY | true | /auth/* login relay |\n| AUTH_DISABLED | false | AllowAll guard + dev subject |\n| PLATFORM_SMTP_* , RECIPIENT_HASH_PEPPER/VERSION | | platform fallback mail and recipient hashing (mail.FromConfig) |\n| MAIL_SENDER_ENABLED (true), MAIL_SENDER_INTERVAL (10s), MAIL_SENDER_INSTANCE_ID | | outbox sender goroutine |\n| RETRIEVAL_INDEX_ENABLED (false), RETRIEVAL_ENGINE_BASE_URL/ADMIN_TOKEN/TIMEOUT(60s), RETRIEVAL_INDEX_POLL_INTERVAL(2s)/POLL_TIMEOUT(15m)/WORKERS(2) | | indexing dispatcher (needs base URL) |\n| RETRIEVAL_SEARCH_ENABLED (false) | | GET /library/search client |\n| RETRIEVAL_SWEEP_ENABLED (true), _INTERVAL 5m, _PENDING_AGE 30m, _RETRY_BASE 5m, _RETRY_CAP 6h, _BATCH 32, _PER_TENANT 8 | | sweeper (only if indexing on) |\n| TIMETABLE_SOLVER_ENABLED (false), _BASE_URL, _TOKEN, _TIMEOUT 5m, _MAX_SECONDS 60, _WORKERS 1, _QUEUE 16 | | solver dispatcher; validate requires url+token when enabled |\n| LOG_LEVEL (info), LOG_FORMAT | | logging |\n| HTTP_READ_TIMEOUT 10s, WRITE 30s, IDLE 120s, SHUTDOWN 15s | | http.Server |\n\nOther env read outside config: DEV_DATABASE_URL (cmd/migrate make), TEST_* vars (internal/testsupport/tenantdb.go).\n\n## 3. Request lifecycle\n\nRouter (internal/transport/http/server.go:Router) global order: chimw.RequestID, chimw.RealIP, mw.Recoverer, mw.RequestLogger, requestTimeout(30s, assetUploadWindow=30m for streaming asset content GET/PUT). Public: GET /health, /api/v1/, /api/v1/health, /api/v1/auth/* relay (and /auth/me which does authenticate + OptionalTenant). Everything else sits in a Group with authenticate(); control plane (mountControlPlane: /schools) then has only s.can; tenant plane (mountTenantPlane) adds mw.RequireTenant first, then per-route s.can.\n\nOrder for a tenant route: authenticate -> RequireTenant -> can(entity) -> handler.\n\n### 3a. Sequence: GET /api/v1/students (tenant plane)\n\n```mermaid\nsequenceDiagram\n  participant C as ENTRY Client\n  participant G as INTERFACE chi global mw\n  participant A as AUTH Authenticate\n  participant T as INTERFACE RequireTenant\n  participant Z as AUTH Authorize can\n  participant H as INTERFACE listStudents\n  participant D as SHARED data/student Query\n  participant P as DB tenant Postgres\n  participant X as EXTERNAL CAS\n  C->>G: GET /api/v1/students with Authorization and X-School-Id\n  G->>A: RequestID RealIP Recoverer Logger Timeout\n  A->>X: verify JWT via cached JWKS\n  X-->>A: key or ERROR 503 upstream\n  A-->>C: ERROR 401 no or invalid token\n  A->>T: ctx with Subject\n  T->>P: Registry.Get resolves school then pool\n  T-->>C: ERROR 400 missing header, 404 unknown, 403 inactive or tenant mismatch, 503 no profile\n  T->>Z: ctx with Tenant and TenantConn\n  Z->>X: Guard.Allow via PolicyClient cache\n  Z-->>C: ERROR 403 not permitted, 503 policy upstream\n  Z->>H: ctx with Decision\n  H->>H: timeout 10s, school.From, ParseFilters\n  H-->>C: ERROR 400 bad filter\n  H->>X: scopeFor reads guard again, access.Resolve queries persons staff teachers\n  H->>D: ForViewer ApplyFilters Basic Newest All\n  D->>P: SELECT students WITH person\n  P-->>D: rows\n  H->>H: studentProjection field policy\n  H-->>C: 200 JSON students count page\n```\n\n| Node | Where |\n|---|---|\n| Client | external |\n| chi global mw | server.go:Router; middleware/recover.go:Recoverer (panic -> 500 \"something went wrong\", re-panics http.ErrAbortHandler); middleware/logging.go:RequestLogger (adds request_id, school header to log; logs 5xx Error, 4xx Warn); server.go:requestTimeout wraps chimw.Timeout |\n| Authenticate | middleware/auth.go:Authenticate (DevSubject when verifier nil); infrastructure/cas/verifier.go:VerifyAccessToken (RS256, exp required, iss/aud optional by config, sub must be UUID; claims sid, tenant_id, client_id, scope) |\n| RequireTenant | middleware/tenant.go:RequireTenant, resolveTenant, writeTenantErr |\n| Authorize | middleware/auth.go:Authorize; cas/policies.go:Guard.Allow, PolicyClient.Policies (cache by user+tenant, serves stale up to 2x TTL on fetch failure) |\n| listStudents | transport/http/students.go:listStudents; common via schools.go:timeout (10s), data/school/school.go:From, data/student/filters.go:ParseFilters, viewer.go:scopeFor |\n| data/student | data/student/query.go: New, ForViewer (data/access:StudentsFor), ApplyFilters, Basic, Newest, All |\n| tenant Postgres | ent client from postgres.ConnFromContext (context.go) |\n| field projection | transport/http/reach.go:studentProjection, fields.go:projectAll |\n\nSection list is simpler: sections.go:listSections uses tenantClient(ctx) then academic.ParseSectionFilters(...).Apply(client.Section.Query().WithGradeLevel().WithBranch()) ordered by code, no viewer scoping.\n\nWrite path (createStudent/updateStudent, students.go): decode via response.DecodeFields (1 MiB cap, unknown fields rejected), scopeFor, field rejection (reach/fields.go), parse dates (400), ent Create/Update. updateStudent does reachStudent/mustReach (404), then Update with predicate access.StudentsFor, wroteScopedRow (0 rows -> 404), then re-read. Ent errors via common.go:writeTenantEntErr.\n\n### 3b. Sequence: GET /api/v1/schools/{id} (control plane, no tenant)\n\n```mermaid\nsequenceDiagram\n  participant C as ENTRY Client\n  participant G as INTERFACE global mw\n  participant A as AUTH Authenticate\n  participant Z as AUTH can SchoolsRead\n  participant H as INTERFACE getSchool\n  participant P as DB control Postgres\n  C->>G: GET /api/v1/schools/id\n  G->>A: chain\n  A-->>C: ERROR 401 or 503\n  A->>Z: Subject in ctx\n  Z-->>C: ERROR 403\n  Z->>H: Decision in ctx\n  H-->>C: ERROR 400 id not UUID\n  H->>P: School.Get via control ent client\n  P-->>H: row or NotFound\n  H-->>C: ERROR 404 school not found, 500 ServerError\n  H-->>C: 200 school JSON\n```\n\n| Node | Where |\n|---|---|\n| getSchool | transport/http/schools.go:getSchool |\n| control client | postgres/control.go:Control.Client (controlent) |\n| other control handlers | schools.go: listSchools (status validator 400), createSchool (slug validation 400, addressingClash 409, constraint 409, then ensureTenant CAS provisioning), updateSchool, deleteSchool (tx deletes profiles then school, 404/409 via writeControlEntErrFor, then registry.Evict), putSchoolProfile (encrypt creds via registry.EncryptCredentials, upsert, probe reachability, registry.Evict) |\n\n### 3c. Error source map\n\n| Status | Source |\n|---|---|\n| 400 | idParam (common.go), filter.Error, DecodeFields failure, parseDate, ErrNoTenant (schools.go:writeTenancyErr), missing X-School-Id (tenant.go), ent ValidationError (common.go:writeTenantEntErr), rejectNull |\n| 401 | Authenticate (no header or invalid token), Authorize when Subject absent |\n| 403 | Authorize deny; RequireTenant (school inactive; token tenant_id claim differs from school CASTenantID); routeDecision with no decision; field rejection helpers (reach/fields.go) |\n| 404 | writeTenantEntErr NotFound; wroteScopedRow n==0; mustReach not found; tenant ErrUnknownSchool; chi NotFound handler |\n| 405 | chi MethodNotAllowed handler (server.go) |\n| 409 | ent ConstraintError (unique or FK) in writeTenantEntErr; school addressing clash; ~82 explicit StatusConflict sites in transport |\n| 422 | explicit StatusUnprocessableEntity in absences.go, academic.go (end_date), assignments.go and others (no common helper; domain-rule rejections) |\n| 500 | response.ServerError (logs then \"something went wrong\"); writeTenancyErr default (any non-ErrNoTenant error, including DB errors and context deadline hit inside a handler); Recoverer |\n| 503 | CAS upstream (ErrUpstream) in Authenticate/Authorize; ErrNoProfile in RequireTenant; readiness degraded; optional-capability handlers (solver, search, mail) |\n| 504 | chimw.Timeout writes 504 in a defer if request ctx deadline (30s) exceeded; handlers also use their own 10s timeout() so a slow DB usually surfaces first as 500 via writeTenancyErr (inference from code, not runtime-tested) |\n\nAll errors are JSON {\"error\": StatusText, \"message\": ...} via pkg/response/response.go:Error.\n\n## 4. Tenant resolution and DB access\n\n```mermaid\nflowchart TD\n  H1[\"ENTRY header X-School-Id\"] --> R1[\"AUTH middleware/tenant.go RequireTenant\"]\n  R1 --> U1{\"uuid.Parse ok?\"}\n  U1 -->|yes| G1[\"SHARED Registry.Get by school id\"]\n  U1 -->|no| G2[\"SHARED Registry.GetByCode\"]\n  G2 -->|ErrUnknownSchool| G3[\"SHARED Registry.GetByCASTenant slug\"]\n  G1 --> CH{\"pool cached in conns map?\"}\n  CH -->|yes| OUT[\"SHARED TenantConn\"]\n  CH -->|no| O1[\"SHARED Registry.open\"]\n  G2 --> DBC[\"DB control School query by code\"]\n  G3 --> DBC2[\"DB control School query by cas_tenant_id\"]\n  O1 --> DBC3[\"DB control School.Get status active check\"]\n  O1 --> DBP[\"DB control SchoolProfile postgres primary active\"]\n  DBP --> KR[\"SHARED Keyring.Decrypt AES-GCM aad school id\"]\n  KR --> OP[\"SHARED postgres.Open pgx pool plus ping\"]\n  OP --> OUT\n  O1 -.-> ER1[\"ERROR ErrSchoolInactive 403 / ErrNoProfile 503 / ErrUnknownSchool 404\"]\n  OUT --> CK[\"AUTH token tenant_id claim vs CASTenantID, mismatch 403\"]\n  CK --> CTX[\"SHARED ctx WithTenant and WithConn\"]\n  CTX --> F1[\"SHARED tenantClient or school.From or student.New\"]\n```\n\n| Node | Where |\n|---|---|\n| RequireTenant / resolveTenant | internal/transport/http/middleware/tenant.go (const SchoolHeader = \"X-School-Id\"); OptionalTenant skips when header absent (used by /auth/me) |\n| Registry.Get/GetByCode/GetByCASTenant/open/Evict/Close | internal/infrastructure/postgres/tenant.go |\n| Keyring | internal/infrastructure/crypto/aesgcm.go:ParseKeyring, Encrypt, Decrypt (AES-256-GCM, 12-byte nonce, key versions, current = highest version; AAD = school id bytes) |\n| Open | internal/infrastructure/postgres/open.go:Open |\n| ctx helpers | postgres/context.go:WithConn, ConnFromContext, ClientFromContext; domain/tenancy/context.go:WithTenant, FromContext |\n| handler access | transport/http/common.go:tenantClient -> postgres.ClientFromContext (295 uses); data/school/school.go:From; data/*/query.go:New |\n\nFacts:\n- Resolution order is code (case-sensitive eq on school.Code) then CAS slug; createSchool/updateSchool enforce that no slug equals another school's code (addressingClash), because the header tries codes first.\n- Pool defaults (open.go:withDefaults): MaxOpen 10, MaxIdle 2, ConnMaxLifetime 1h, ConnMaxIdleTime 15m, connect ping timeout 5s. Registry and Control both use zero Options so these defaults apply per tenant.\n- Caching: unbounded map keyed by school id, double-checked locking in Get; there is NO TTL eviction or LRU. Eviction is explicit: Registry.Evict called from schools.go (putSchoolProfile, updateSchool, deleteSchool) and cmd/seed/main.go. A suspended school is only refused when its pool is opened or after eviction; updateSchool evicts so status change takes effect (schools.go:updateSchool).\n- Resolution by code or slug does a control DB query on every request; the pool lookup itself is cached.\n- Credentials: control table school_profiles stores key_version, nonce, ciphertext; decrypted JSON into tenancy.PostgresCredentials (host, port, database, user, password, sslmode, optional dsn; sslmode default \"require\"). Also S3, MySQL, SMTP credential structs.\n- Tenant tables carry no school_id (verified: grep school_id in internal/ent/schema returns nothing); isolation is a separate database per school.\n- The deploy README states emerge-core creates a database per school; no CREATE DATABASE exists in Go code (grep), so that is unverified/likely stale: the database is created externally and registered via PUT /schools/{id}/profiles/postgres or cmd/seed.\n- logger.go in postgres only provides Discard().\n\n## 5. Database and data flow\n\n### 5.0 Setup facts\n- Two ent codegens, both declared in internal/ent/generate.go (`go:generate go run -mod=mod entgo.io/ent/cmd/ent generate ...` with features sql/upsert, sql/execquery, sql/versioned-migration, intercept): tenant schema internal/ent/schema -> internal/ent/generated; control schema internal/ent/control/schema -> internal/ent/control/generated. Run `go generate ./internal/ent/...` (README.md).\n- No atlas.hcl or entc.go found (find over repo): migrations are produced by cmd/migrate via ent's generated `migrate.NamedDiff` (Atlas replay mode against a DEV_DATABASE_URL scratch DB, docker-compose dev-db on 5433), written as Atlas-format files with atlas.sum.\n- Control plane (3 entities, internal/ent/control/schema): School, SchoolProfile, OutboxMessage. Tenant plane: 83 entities (83 *_query.go files in internal/ent/generated; each uses BaseMixin id/created_at/updated_at; table names set by the `table()` annotation).\n- No tenant table has a school_id column (grep over internal/ent/schema). Isolation is one database per school, located via control-plane school_profiles.\n- Soft references (uuid column with no ent edge, so no FK in schema): Person.profile_photo_asset_id, Staff.department_id, StudentAchievement.source_id, Praise.recipient_id, AssignmentTarget.target_id, StreamTarget.target_id, AssignmentItem.question_id, AssignmentSubmissionItem.question_response_id, and School.logo_asset_id (control).\n- JSON-only structs, not entities: CognitiveBand, CognitiveScheme, UnitWeight, UnitWeightage (blueprint.go), GradeBand (grading.go).\n- ER method: every line below is an ent edge that carries `Field(\"x_id\")`, drawn from the FK holder (many side) to the target. `o|` marks a non-Required edge. Edges were extracted by a script over the schema files (edge name, target, Unique/Required, Field) and cross-read.\n\n### 5.1 Control plane ER\n\n```mermaid\nerDiagram\n  School ||--o{ SchoolProfile : \"profiles\"\n  School ||--o{ OutboxMessage : \"school_id cascade\"\n```\n\n| Entity | File |\n|---|---|\n| School | internal/ent/control/schema/school.go (unique code and cas_tenant_id; status enum active, suspended, closed; index status,created_at) |\n| SchoolProfile | internal/ent/control/schema/schoolprofile.go (unique school_id+profile_type+name; key_version, nonce, ciphertext; types postgres, mysql, s3, smtp; edge From School Required Immutable, cascade) |\n| OutboxMessage | internal/ent/control/schema/outboxmessage.go (unidirectional edge to School, OnDelete Cascade; partial index next_attempt_at where pending or retrying) |\n\nUsed by: postgres/tenant.go (School, SchoolProfile), service/mail/sender.go (OutboxMessage), cmd/mailpurge.\n\n### 5.2 Tenant ER by domain\n\nDomain A: academic structure and teaching assignments\n\n```mermaid\nerDiagram\n  AcademicSession ||--o{ AcademicSession : \"previous_session_id\"\n  Section }o--|| AcademicSession : \"academic_session_id\"\n  Section }o--|| Branch : \"branch_id\"\n  Section }o--|| GradeLevel : \"grade_level_id\"\n  Section }o--o| Room : \"room_id\"\n  Section }o--o| Teacher : \"class_teacher_id\"\n  Room }o--|| Branch : \"branch_id\"\n  SubjectOffering }o--|| AcademicSession : \"academic_session_id\"\n  SubjectOffering }o--|| Section : \"section_id\"\n  SubjectOffering }o--|| Subject : \"subject_id\"\n  SubjectOffering }o--o| SubjectGroup : \"subject_group_id\"\n  SubjectOffering }o--o| GradingScheme : \"grading_scheme_id\"\n  SubjectOffering }o--o| ResultScheme : \"result_scheme_id\"\n  TeacherAssignment }o--|| AcademicSession : \"academic_session_id\"\n  TeacherAssignment }o--|| Teacher : \"teacher_id\"\n  TeacherAssignment }o--|| Section : \"section_id\"\n  TeacherAssignment }o--o| SubjectOffering : \"subject_offering_id\"\n  ElectiveGroup }o--|| AcademicSession : \"academic_session_id\"\n  ElectiveGroup }o--|| Section : \"section_id\"\n  ElectiveGroupOffering }o--|| ElectiveGroup : \"elective_group_id\"\n  ElectiveGroupOffering }o--|| SubjectOffering : \"subject_offering_id\"\n```\n\nSchema files: academic.go (AcademicSession, GradeLevel, SchoolHouse, Section), branch.go, room.go, subject.go (Subject, SubjectGroup, SubjectOffering), teacherassignment.go, elective.go. HTTP: academic.go, sections.go, branches.go, subjects.go, teacherassignments.go, electives.go. Scho Achievement }o--|| AcademicSession : \"academic_session_id\"\n  StudentAchievement }o--o| Person : \"awarded_by\"\n  Praise }o--|| Person : \"given_by_person_id\"\n  Praise }o--|| AcademicSession : \"academic_session_id\"\n  Praise }o--o| Achievement : \"related_achievement_id\"\n  PraiseReaction }o--|| Praise : \"praise_id\"\n  PraiseReaction }o--|| Person : \"reactor_person_id\"\n```\n\nSchema files: assignment.go, stream.go, recognition.go. HTTP: assignments.go, stream.go, recognition.go. TeacherAssignment and StudentAssignment (placing people into sections, domains A and B) are different from Assignment (homework).\n\n### 5.3 Academic-session dependence (an academic_session_id column or edge)\n- Required: Section, Assignment, AttendanceDay, AttendancePeriod, CalendarDay, Curriculum, ElectiveGroup, StudentEnrollment, StudentNote, Exam, GradingScheme, Paper, PeriodScheme, PeriodSchemeGradeLevel, ResultScheme, StudentAchievement, Praise, StudentAssignment, SubjectOffering, StudentSubjectEnrollment, TeacherAssignment, Timetable.\n- Optional (nullable): Blueprint, PaperGenerationRun, StreamPost, StudentDocument.\n- Indirect via a parent: Period, BellSchedule, CalendarDaySchedule, CalendarDaySectionPattern, TimetableSlot, TimetableSection, TimetableDeviation, TimetableGenerationJob, ExamSubject, ExamSitting, marks and online-test tables, ResultComponent and its links, CurriculumNode, ContentPlacement, paper children.\n- Session-agnostic: Person, Student, Staff, Teacher, Guardian, StudentGuardian, StudentAddress, Branch, GradeLevel, SchoolHouse, Subject, SubjectGroup, Room, Asset, ContentItem, ContentNode, QuestionPaper, Question, QuestionVersion, Achievement, TeacherAbsence.\n- AcademicSession has an is_current flag (used by data/student/query.go:InCurrentSession, WithCurrentEnrollment) and a previous_session_id self edge.\n\n### 5.4 Migrations and per-tenant application\n- migrations/control: 4 files (2026-09-04 to 09-09). migrations/tenant: 31 files (2026-09-04 to 09-30). Each dir has atlas.sum.\n- cmd/migrate/main.go: `make <name> [-plane control|tenant|all]` needs DEV_DATABASE_URL and uses ent NamedDiff in replay mode with DropColumn and DropIndex; `apply` and `status` take -plane and -school (code or all). Default plane is all.\n- Control plane apply: one target from CONTROL_DATABASE_URL.\n- Tenant plane apply: tenantTargets opens the control DB, ParseKeyring(SECRETS_MASTER_KEY), iterates every School row (optionally filtered by code), registry.PostgresCredentials then ConnString; a school without a postgres profile is printed SKIPPED. So tenant DB migration depends on the school being registered first.\n- applyDir: ensures a schema_migrations(version, checksum, applied_at) table (custom ledger, not Atlas revisions), errors if an applied file's checksum changed, applies each pending .sql in its own transaction (DSN forced to default_query_exec_mode=simple_protocol) and inserts the ledger row. atlas.sum is not read by apply (no reference in main.go).\n- The API never migrates at boot (cmd/api/main.go has no migrate call; deploy/README.md says so deliberately).\n- cmd/seed: creates school in control plane, stores encrypted postgres profile, calls registry.Evict, then writes first admin Person and Staff in the tenant DB; CI runs it twice because the tenant tables must exist before the admin insert (ci.yml). cmd/seeddemo: fills one school (resolved by code or id), idempotent, optional CAS identity minting.\n\n## 6. Deploy and ops\n\n```mermaid\nflowchart LR\n  DEV[\"ENTRY developer\"] --> DS[\"scripts/dev.sh\"]\n  DS --> DC[\"INTERFACE docker-compose.yml local DBs and MinIO\"]\n  DS --> MG[\"SHARED cmd/migrate apply control\"]\n  DS --> API[\"ENTRY cmd/api\"]\n  CI[\"ENTRY GitHub Actions ci.yml\"] --> ST[\"static job: build vet gofmt nocomments.py\"]\n  CI --> TS[\"test job: 2 postgres services, migrate, seed x2, seeddemo, go test and -race\"]\n  IMG[\"INTERFACE Dockerfile api + migrate image\"] --> PROD[\"EXTERNAL editone-prod service on 8099, no DB, bearer token TIMETABLE_SOLVER_TOKEN, loopback publish, CPU limit |\n| deploy/README.md | procedure: build SHA-tagged image with VERSION, docker save | ssh load, run migrate container for control plane, compose up; there is no automated deploy; /health is the only liveness path |\n| .github/workflows/ci.yml | job static: go build, go vet, gofmt -l, python3 nocomments.py cmd internal pkg. job test: control-db 5432 and tenant-db 5434 services, AUTH_DISABLED=true, random SECRETS_MASTER_KEY, migrate control, seed (first pass allowed to fail), migrate tenant, seed again, seeddemo, `go test -v ./...`, check log for TENANT-DB-TEST-SKIPPED, list skips, `go test -race -v ./...`, upload logs |\n| .github/workflows/nocomments.py | enforces the no-comments-in-Go rule (skips files marked Code generated) |\n| scripts/smoke.sh | curl checks: /health 200, /api/v1 200, /api/v1/health 200, /api/v1/schools 200, /api/v1/students 400 without header, unknown route 404 |\n| scripts/e2e.sh | end-to-end curl script: registers a school E2E-<time>, builds structure, tests scoping, cleans up; assumes AUTH_DISABLED=true |\n| scripts/genkey.sh | prints `1:<64 hex>` master key |\n| scripts/cas-*.py, cas-token.sh, cas-tunnel.sh | CAS admin helpers to register entities, roles, grants, tenant (not code paths of the server) |\n| api/ | Bruno collection (bruno.json, collection.bru, folders 01-health to 14-cleanup, environments/local.bru) equivalent to e2e.sh; run in order, each request saves ids for the next; headless via `bru run --env local`. Note api/ also contains two token-issuing .bru files at the folder root (Issue master token.bru, Issue Token Anyone.bru) |\n\nOps facts verified: production health URL http://127.0.0.1:8081/health inside the container; nginx forwards X-Forwarded-For using $remote_addr and chi RealIP trusts it. The sender, sweeper and dispatchers run in the same API process, there is no separate worker binary. Maintenance CLIs (assetreap, mailpurge) are not scheduled by anything in the repo (no cron/compose entry found).\n\n## 7. Shared and common modules (usage counts from grep over non-test, non-generated Go in cmd, internal, pkg)\n\n| Module | Purpose | Usage |\n|---|---|---|\n| pkg/response/response.go | JSON, Error (ErrorBody{error,message}), NoContent, Decode, DecodeFields (1 MiB limit, DisallowUnknownFields, returns the list of keys actually sent, blame() names the offending field), ServerError (logs, hides detail) | response.Error 943 call sites in 56 files; JSON 337; ServerError 177; DecodeFields 140 in 34 files; Decode 10 |\n| internal/transport/http/common.go | tenantClient, idParam (400 on bad uuid), parseDate, writeTenantEntErr (NotFound 404, ConstraintError 409, ValidationError 400, else writeTenancyErr), deleteRow, deleteScoped (narrow/wide entity scope + scoped delete), wroteScopedRow, mustReach, pageOf, wasCleared, rejectNull, DefaultPageSize 50, MaxPageSize 200 | tenantClient 295 uses/42 files; writeTenantEntErr 315/42; idParam 202/41; wroteScopedRow 46; mustReach 44; deleteScoped 39/23 files; pageOf 65/35; deleteRow 11/7 |\n| internal/transport/http/schools.go | also hosts timeout(r) (10s per-handler ctx; 318 uses/47 files), writeTenancyErr (ErrNoTenant->400 else 500; 834 uses/47 files), control-plane handlers, credential probing and scrubbing | as stated |\n| internal/transport/http/viewer.go | scopeFor(ctx, narrow, wide): checks the wide entity for an unconstrained grant, evaluates narrow entity, builds access.Viewer, traces scope | 209 uses/39 files. viewerFor has zero callers (grep shows only its definition): unreferenced |\n| internal/transport/http/reach.go | reachStudent/Person/Staff/Teacher/Guardian/Enrollment/..., attribution checks, studentProjection, studentWriteFields, enrollmentProjection (row-level reach plus field projection) | used by students.go, persons.go etc. |\n| internal/transport/http/fields.go | project, projectAll (field policy to JSON), rejectUnauthorizedFields, rejectFields, projectPerRow, trace helpers | projectAll 74/29 files; rejectUnauthorizedFields 128/31 files; rejectFields 6/4 |\n| internal/transport/http/resolve.go | curriculum-node content resolution (placements -> items -> assets -> index/retrieval state) for GET /curriculum-nodes/{id}/content; not a generic helper | resolve.go only (plus tests) |\n| internal/transport/http/inlineperson.go | withoutPerson, rejectInlinePerson, personIDFor: create a Person inline when creating student/staff/teacher/guardian | students, staff, teachers, guardians handlers |\n| internal/transport/http/middleware/{auth,logging,recover,tenant}.go | Authenticate, DevSubject, Authorize; RequestLogger; Recoverer; RequireTenant, OptionalTenant, SchoolHeader | server.go and /auth/me |\n| internal/data/filter/parse.go | Params builder over url.Values: String, Bool, UUID, Int, Enum, Page(default,max), Allow, Err (typed *filter.Error -> 400) | filter.New 71 uses/33 files: all data/*/filters.go and ~25 transport files |\n| internal/data/{student,person,staff,teacher,guardian}/query.go | fluent query builders keyed off the ctx tenant client: New, filters, ForViewer, Basic, Newest, Paginate, All/First/Only/Count/IDs | via data/school/school.go (school.From 10 uses/5 files) mainly in persons/students/staff/teachers/guardians handlers |\n| internal/data/{academic,enrollment,studentrecord}/filters.go | ParseXFilters + Apply helpers (e.g. academic.ParseSectionFilters(...).Apply used by listSections) | transport academic/sections/enrollments/student record handlers |\n| internal/data/access | Viewer (who the caller is in this school: person, guardian, staff, teacher, sections, offerings, own students), Resolve (queries the tenant DB by sub.CASUserID), predicates StudentsFor etc., StudentRowValues, constraint translation | access.Resolve 3 uses/2 files (viewer.go, auth.go); predicates used across handlers |\n| internal/authorization | Entity keys (core.<area>.<action>), Guard, Decision (Allowed, Rule, Reach, Fields, Constraints, PerRow), PolicySet.Allows, ctx WithSubject/WithDecision | every s.can(...) route guard and scopeFor |\n| internal/domain/tenancy | Tenant, credentials, errors, ctx | middleware/tenant.go, registry, cas/policies.go (tenant key for cache) and library/search/scopes handlers |\n| internal/domain/shared | Metadata and Address types | ent schemas (academic.go etc., control school.go) |\n| internal/observability | Step/Decision/Problem logging with component tags carried in ctx logger | 27 observability.Step calls in 13 files plus middleware |\n| internal/infrastructure/postgres | Open, Control, Registry, context helpers, Discard | main, migrate, seed, assetreap, mailpurge, handlers, services |\n| internal/infrastructure/crypto | Keyring | main, migrate, seed, seeddemo, assetreap, mail sender |\n| internal/testsupport/tenantdb.go | resolves tenant DB for tests via control plane (or TEST_TENANT_DATABASE_URL), SkipMarker | *_test.go (DB-backed) |\n\n## Verified vs unverified\n\nVerified by reading the code:\n- cmd/api startup sequence, goroutines (mail sender, index sweeper) and worker pools (indexing, timetablegen dispatchers), shutdown; every config var and default in config.go.\n- Router middleware order, route mounting (control vs tenant), authenticate/RequireTenant/can ordering, middleware behaviours and status codes; chi Timeout 504 behaviour (read from chi v5.3.2 source in module cache).\n- Registry resolution (id, code, CAS slug), pool options, unbounded cache with explicit Evict only, keyring AES-GCM with school-id AAD, PostgresCredentials DSN construction.\n- students list/create/update/delete path down to ent, sections list, schools get; error helper mapping.\n- All ER edges: extracted from the schema files with Field FKs (script plus reading); migrate command flow; CI steps; Dockerfile/compose/deploy contents.\n- Usage counts in section 7 (grep, excluding tests and generated code; counts are line matches, not unique callers).\n\nUnverified or not examined:\n- Behaviour of /auth/* relay handlers (internal/transport/http/auth.go relay) and cas.AuthProxy beyond wiring.\n- PolicySet.Allows/field-policy semantics and authorization/catalog internals (only the call sites were traced).\n- access.Resolve internals beyond the first half (teachingScope, enrolledScope) and predicate.go logic.\n- Whether index/ent names in migrations match the schema exactly (migration SQL not diffed against schema); the control migration named \"fix_outbox_index_drift\" suggests drift has occurred.\n- proto/cas/v1 usage; internal/retrieval purpose at runtime (labels.go only); ttprobe.exe and seeddemo.exe origin.\n- deploy README claim that emerge-core creates a database per school: no CREATE DATABASE found in Go code, treated as stale/inaccurate.\n- Production state of the host (README is a record of a 2026-09-23 deployment, not re-verified).\n- Entity count 83 comes from counting *_query.go in internal/ent/generated; a hand count of Fields() methods gave 84 (discrepancy unexplained, likely my miscount).\n- Whether a slow DB query in a handler yields 500 or 504 at runtime was inferred from code, not exercised.\n"},{"id":"B","nav":"B. Authentication and authorization","title":"B. Authentication and Authorization (emerge-core)","md":"# B. Authentication and Authorization (emerge-core)\n\nAll paths are relative to `D:\\emerge-core`. Everything below was read from code; items I could not confirm are marked \"unverified\".\n\n## Legend (node prefixes used in every diagram)\n\n| Prefix | Meaning |\n|---|---|\n| ENTRY | Where a request or process starts |\n| INTERFACE | A Go interface or contract |\n| SHARED | Shared helper or type used by many callers |\n| DB | Tenant or control-plane Postgres access |\n| EXTERNAL | Call to CAS (outside this repo) |\n| ASYNC | Process or cache boundary (not on the request goroutine, or cross-request state) |\n| ERROR | Error or refusal path |\n| AUTH | Authentication or authorization boundary |\n\n## 0. Selecting the auth mode: `cmd/api/main.go:newAuth`\n\n```mermaid\nflowchart TD\n    A[\"ENTRY main.go:newAuth\"] --> B{\"AUTH: config.go:AuthEnabled<br/>not AuthDisabled and CASBaseURL set\"}\n    B -- \"no\" --> C[\"ERROR-ish dev: verifier=nil, guard=AllowAll\"]\n    B -- \"yes\" --> D[\"EXTERNAL cas.NewVerifier + Warm (JWKS preload)\"]\n    D --> E{\"CAS_CLIENT_ID and SECRET set\"}\n    E -- \"no\" --> F[\"ERROR guard=DenyAll, every can() is 403\"]\n    E -- \"yes\" --> G[\"cas.NewPolicyClient + cas.NewGuard\"]\n    C --> H[\"server.go:authenticate picks DevSubject\"]\n    F --> I[\"server.go:authenticate picks Authenticate\"]\n    G --> I\n```\n\n| Node | Code |\n|---|---|\n| newAuth | `cmd/api/main.go:newAuth` |\n| AuthEnabled | `internal/config/config.go:AuthEnabled` (`!AuthDisabled && CASBaseURL != \"\"`) |\n| AllowAll / DenyAll | `internal/authorization/authorization.go:AllowAll.Allow` / `DenyAll.Allow` |\n| Verifier / Warm | `internal/infrastructure/cas/verifier.go:NewVerifier`, `Verifier.Warm` (warm failure only logs a warning) |\n| PolicyClient / Guard | `internal/infrastructure/cas/policies.go:NewPolicyClient`, `NewGuard` |\n| authenticate | `internal/transport/http/server.go:Server.authenticate` |\n| DevSubject | `internal/transport/http/middleware/auth.go:DevSubject` (zero-UUID subject, `ClientID: \"development\"`) |\n\nConfig guard rails (`internal/config/config.go:validate`): `CAS_BASE_URL` empty requires `AUTH_DISABLED=true`; `AUTH_DISABLED` is refused when `ENV=production`; production requires `CAS_CLIENT_ID` and `CAS_CLIENT_SECRET`. Defaults: `CAS_AUDIENCE=mentis`, `CAS_SERVICE_KEY=core`, `CAS_ISSUER=\"\"`, `CAS_POLICY_TTL=60s`, `CAS_AUTH_PROXY=true`.\n\n## 1. AuthN\n\n### 1.1 Components\n\n| Piece | Behaviour (verified) |\n|---|---|\n| `cas/verifier.go:Verifier.VerifyAccessToken` | Strips `Bearer `. Parses with `jwt.WithValidMethods(RS256)`, `WithExpirationRequired`, `WithIssuer` only if `CAS_ISSUER` set, `WithAudience` only if audience set (default `mentis`). Key chosen by header `kid`. `sub` must be a UUID. Returns `authorization.Subject{CASUserID, SessionID(sid), TenantID(tenant_id), ClientID(client_id), Scopes(scope split), RawToken}`. Errors: `ErrNoToken`, `ErrInvalidToken`, `ErrUnknownKey`; JWKS-fetch failure surfaces as `authorization.ErrUpstream`. |\n| `Verifier.keyFor` | Cache hit and age < `JWKSTTL` (15 min default) returns key. Otherwise `refresh()` (GET `{CAS}/.well-known/jwks.json`, RSA keys with kid only). If refresh fails and the kid is cached, the stale key is used with no age limit. If refresh fails and kid not cached, `ErrUpstream`. After refresh, unknown kid gives `ErrUnknownKey`. No rate limit on refresh for unknown kids. |\n| `cas/proxy.go:AuthProxy` | Login relay. Fixed route table: `login`, `login-verify`, `otp-start`, `refresh`, `logout`, `password-change`, `password-reset` (POST) and `me` (GET `/v1/me`). Body capped at 256 KiB both ways. Relays request headers Content-Type, Accept, Accept-Language, User-Agent, Authorization, X-Forwarded-For, X-Request-Id; sets X-Forwarded-For to client IP (`clientAddr`). Returns response status, body, and Content-Type, WWW-Authenticate, Retry-After, X-Request-Id only. 15 s default client timeout. |\n| `transport/http/auth.go:Server.relay(name)` | If `authProxy==nil` returns 501. Calls `AuthProxy.Do`. Transport failure gives 502 \"identity service is unreachable\". Otherwise copies headers, writes CAS's status and body verbatim (so CAS 401/429 pass through). |\n| `auth.go:Server.relayAndForget(name)` | Before relaying, best-effort `verifier.VerifyAccessToken` on the Authorization header to learn the user; after relaying, if the guard implements `Forget(uuid)`, calls it, dropping that user's cached policies. Used for `logout`, `password-change`, `password-reset`. It forgets whether or not CAS accepted the call. |\n| Relay route `me` | Present in the `AuthProxy.routes` map but not registered in `server.go` (no `relay(\"me\")`). `/auth/me` is served locally by `Server.me`. Dead route entry. |\n| `cas/admin.go:AdminClient` | Calls CAS `/v1/admin/*` with the caller's own bearer token (`callerToken` reads `Subject.RawToken`, no token gives `ErrProvisioningUnavailable`). 401 from CAS gives `ErrCallerRejected`, 403 gives `ErrCallerForbidden`. Methods: `CreateUser` (POST `/v1/admin/users`, 409 mapped by `conflictKind` to `ErrUsernameTaken`/`ErrEmailTaken`/`ErrUserExists`), `LookupGroup`/`FindGroup` (GET `/v1/admin/groups?q=`), `CreateGroup` (POST; 409 falls back to lookup), `TagGroupTenant` (PUT `/v1/admin/groups/{id}/tenant`), `AddUserToGroup` (POST `/v1/admin/groups/{gid}/users/{uid}`), `FindUser` (GET `/v1/admin/users?q=`, any failure becomes `ErrLookupUnsupported`). `TokenSource` interface is declared but nothing in the repo consumes it. |\n| `cas/policies.go:PolicyClient` | `serviceToken`: OAuth2 client_credentials against `{CAS}/oauth/token` with basic auth, token cached until 30 s before expiry (5 min if no `expires_in`), mutex-guarded. `fetch`: POST `{CAS}/v1/policies` with header `X-Service-Authorization: Bearer <service token>` and JSON `{token: <user raw token>, services:[CAS_SERVICE_KEY], audience: CAS_AUDIENCE, tenant: <CASTenantID from tenancy ctx, if any>}`. Response limited to 4 MiB, non-200 gives `ErrUpstream`. Parsed by `authorization.ParsePolicySet`. |\n| `PolicyClient.Policies` | Cache key is (user UUID, tenant slug). Fresh within `CacheTTL` (60 s) is a hit. On fetch error, an entry younger than 2x TTL is served stale (logged \"serving stale\"); older means the error is returned. On success, if `PolicyEpoch` rises above the last seen (and last was non-zero), every other cache entry is evicted. No singleflight. |\n| `policies.go:Guard.Allow` | Nil subject gives `ErrNoSubject`. Gets policy set, runs `PolicySet.Allows(entity, attrs)`. Fetch error is returned with `Decision{Reason:\"policy source unavailable\"}`. |\n| `middleware/auth.go:Authenticate` | Missing Authorization header gives 401. `ErrUpstream` gives 503. Any other verify error gives 401 \"token is not valid\". Success puts `Subject` in context (`authorization.WithSubject`). |\n\n### 1.2 Sequence: login via relay\n\n```mermaid\nsequenceDiagram\n    participant C as \"ENTRY client\"\n    participant R as \"ENTRY chi router (server.go:Router)\"\n    participant H as \"SHARED auth.go:relay\"\n    participant P as \"SHARED cas/proxy.go:AuthProxy.Do\"\n    participant CAS as \"EXTERNAL CAS /v1/auth/login\"\n    C->>R: \"POST /api/v1/auth/login (no token, no X-School-Id)\"\n    R->>H: \"public route, no authenticate, no RequireTenant\"\n    H->>H: \"authProxy nil gives 501\"\n    H->>P: \"Do(ctx, login, request)\"\n    P->>CAS: \"POST /v1/auth/login with whitelisted headers, body max 256 KiB\"\n    CAS-->>P: \"status + body (tokens or OTP challenge)\"\n    P-->>H: \"Response\"\n    H-->>C: \"same status and body, Content-Type and Retry-After relayed\"\n    Note over H,C: \"ERROR: CAS unreachable returns 502\"\n    C->>R: \"POST /api/v1/auth/logout with Bearer\"\n    R->>H: \"relayAndForget: VerifyAccessToken, relay, then Guard.Forget(user)\"\n```\n\n| Participant | Code |\n|---|---|\n| router | `internal/transport/http/server.go:Server.Router` (`/api/v1/auth/*` registered before the authenticated group) |\n| relay | `internal/transport/http/auth.go:Server.relay`, `Server.relayAndForget` |\n| AuthProxy | `internal/infrastructure/cas/proxy.go:AuthProxy.Do` |\n| CAS | EXTERNAL; paths from `proxy.go:NewAuthProxy` route table |\n\n### 1.3 Sequence: authenticated tenant request\n\n```mermaid\nsequenceDiagram\n    participant C as \"ENTRY client\"\n    participant A as \"AUTH middleware.Authenticate\"\n    participant V as \"SHARED cas.Verifier\"\n    participant T as \"AUTH middleware.RequireTenant\"\n    participant Z as \"AUTH middleware.Authorize (s.can)\"\n    participant G as \"INTERFACE authorization.Guard\"\n    participant PC as \"ASYNC cas.PolicyClient cache\"\n    participant CAS as \"EXTERNAL CAS\"\n    participant H as \"handler\"\n    C->>A: \"GET /api/v1/students, Bearer, X-School-Id\"\n    A->>V: \"VerifyAccessToken\"\n    V->>CAS: \"GET jwks.json only if cache stale or kid unknown\"\n    V-->>A: \"Subject\"\n    A->>T: \"ctx with Subject\"\n    T->>T: \"resolveTenant, open tenant DB conn, compare token tenant_id with school cas_tenant_id\"\n    T->>Z: \"ctx with Tenant and DB conn\"\n    Z->>G: \"Allow(subject, entity, nil)\"\n    G->>PC: \"Policies(ctx, subject)\"\n    PC->>CAS: \"POST /oauth/token (cached) then POST /v1/policies on miss\"\n    PC-->>G: \"PolicySet\"\n    G-->>Z: \"Decision (Allowed, Reach, Constraints, Fields, Grants)\"\n    Z->>H: \"ctx with Decision, or 401/403/503\"\n    H->>G: \"s.scopeFor: Allow(wide), Allow(narrow) (cache hits)\"\n    H->>H: \"access.Resolve viewer, ent predicates, field projection\"\n```\n\n| Participant | Code |\n|---|---|\n| Authenticate | `middleware/auth.go:Authenticate` |\n| RequireTenant | `middleware/tenant.go:RequireTenant`, `resolveTenant` (UUID gives `Registry.Get`, else `GetByCode`, else `GetByCASTenant`) |\n| Authorize / s.can | `middleware/auth.go:Authorize`; `server.go:Server.can` |\n| Guard | `authorization/authorization.go:Guard` (INTERFACE), `cas/policies.go:Guard` |\n| PolicyClient | `cas/policies.go:PolicyClient.Policies` |\n| scopeFor | `transport/http/viewer.go:Server.scopeFor` |\n\n### 1.4 `GET /api/v1/auth/me`: `auth.go:Server.me`\n\nRoute: `authenticate` then `OptionalTenant` then `me` (no `can`). Without X-School-Id returns just the token claims (cas_user_id, session_id, tenant_id, client_id). With a tenant: `access.Resolve(ctx, subject, false)` gives roles (is_student/staff/teacher/guardian, ids, section and offering ids). The person block is projected with `ownFieldPolicy`: `guard.Allow(PersonsRead)`; on error or deny it falls back to `identityFloor` (include mode with no keys, so only `id/created_at/updated_at` survive `project`).\n\n## 2. AuthZ\n\n### 2.1 Vocabulary (as implemented)\n\n| Term | Meaning in code |\n|---|---|\n| Entity / permission key | `authorization.Entity` string `core.<area>.<verb>`; verbs seen: read, read_all, write, write_all, delete, delete_all, create, override, generate. Declared in `internal/authorization/authorization.go` and `entities.go`; all collected in `AllEntities`. `core.timetable.override` and `.generate` are separate powers. |\n| `_all` keys | A wider key checked by `scopeFor(narrow, wide)`. Holding `wide` with no row pins makes the viewer `Unrestricted` (predicates become \"any row\"). |\n| Feature key | Not an authorization concept in this backend. Frontend visibility keys are registered by `scripts/cas-register-features.py`. No Go code calls the entitlement RPC (grep found no use). |\n| Reach | Reserved field `reach` in a grant expression: `tenant`, `self`, `guardian_ward`, `teacher_assignment` (`authorization/scope.go`). Extracted by `Alternative.Reach()` (first `reach = X` leaf). If absent, `HasReach=false` and predicates fall back to \"any of the viewer's roles\". Unknown reach value yields a no-rows predicate. |\n| Constraint (\"row pin\") | A grant condition on a row field (`section` or `grade_level`, operators `=`/`IN`) turned into `Constraint{Field, Values}` by `Alternative.Constraints()` (`constraint.go:collect`). AND recurses; an OR of same-field leaves collapses to IN; any other OR or non-`=`/`IN` operator on a row field makes the alternative untranslatable, so it is skipped. |\n| Attribute condition | Any other field in an expression. `Satisfiable(attrs)` requires every non-reserved field to be present in `attrs`. Every call site in the repo passes `attrs == nil`, so an alternative with attribute conditions never admits (reason \"conditional grant needs attributes\"). |\n| Field narrowing | `FieldPolicy{Mode: all / include / all_except, Keys}` on each alternative. `Permits(field)`. Multiple admitted alternatives are intersected (`constraint.go:mergeFields`). Per-row variant: `Decision.Grants`, `Grant.Cover

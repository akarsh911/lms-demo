services:
  api:
    image: emerge-core:${CORE_TAG:-current}
    container_name: emerge-core
    restart: unless-stopped
    env_file: .env
    environment:
      RETRIEVAL_ENGINE_BASE_URL: ${RETRIEVAL_ENGINE_BASE_URL:-http://retrieval:8000}
    ports:
      - "127.0.0.1:${EMERGE_CORE_PORT:-8077}:8081"
    networks:
      - emerge-db
      - retrieval
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  emerge-db:
    external: true
    name: emerge-db_default
  retrieval:
    external: true
    name: retrieval

name: emerge-labs

services:
  emerge-labs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUBLIC_DEMO: ${PUBLIC_DEMO:-1}
    image: emerge-labs:latest
    container_name: emerge-labs
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8076:3005"
      - "172.17.0.1:8076:3005"
    mem_limit: 768m
    memswap_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

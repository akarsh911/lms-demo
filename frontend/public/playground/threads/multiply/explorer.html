<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal Groups, Animal Jumps</title>
<meta name="description" content="Class 4–5: animals hop along a number line in equal jumps — where do the frog and the squirrel both land? Will the cat catch the rat? Then arrange Radha's cupcakes in trays and turn them round.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../../play.css">
<style>
html{scrollbar-gutter:stable}
.tabs{display:flex; gap:8px; padding:10px 12px; background:var(--sunk); border-bottom:1px solid var(--hair)}
.tab{flex:1; min-height:48px; border-radius:var(--radius-sm); border:2px solid transparent; background:var(--card); cursor:pointer;
  font-family:var(--font-head); font-size:17px; font-weight:600; color:var(--ink-2); display:flex; align-items:center; justify-content:center; gap:8px}
.tab[aria-selected="true"]{border-color:var(--accent); color:var(--ink); box-shadow:0 2px 0 var(--accent)}
.tab:hover{border-color:var(--hair-2)}
#stageWrap{align-self:start; min-height:0}
.gate{position:absolute; left:0; right:0; top:84px; display:grid; place-items:center; pointer-events:none}
.gate span{background:rgba(15,26,43,.86); color:#fff; padding:12px 20px; border-radius:99px; font-weight:700; font-size:16px}
.missions{list-style:none; margin:0; padding:0; display:grid; gap:7px}
.missions li{display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:center; font-weight:700; font-size:15px; line-height:1.3; color:var(--ink-2)}
.missions li i{width:28px; height:28px; border-radius:50%; border:2.5px dashed var(--hair-2); display:grid; place-items:center; font-style:normal; font-size:15px; color:#fff}
.missions li.done{color:var(--ink)}
.missions li.done i{border:none; background:var(--good); animation:tickPop .5s var(--spring)}
.missions li.done span{text-decoration:line-through; text-decoration-color:var(--good); text-decoration-thickness:2px}
@keyframes tickPop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.pairs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0 10px}
.pair{min-height:52px; border-radius:var(--radius-sm); border:2px solid var(--hair-2); background:var(--card); cursor:pointer; font-weight:700; font-size:14px; line-height:1.15; color:var(--ink)}
.pair span{display:block; font-size:20px}
.pair[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.lane{display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:5px; align-items:center; margin:6px 0}
.lane .who{font-weight:800; font-size:15px; display:flex; align-items:center; gap:5px; min-width:0}
.lane .who i{font-style:normal; font-size:22px}
.lane .dot{width:12px; height:12px; border-radius:50%; display:inline-block}
.step{display:flex; align-items:center; gap:2px; background:var(--sunk); border-radius:12px; padding:2px}
.step button{width:30px; height:40px; border:none; border-radius:10px; background:var(--card); font-size:20px; font-weight:800; cursor:pointer; color:var(--ink)}
.step button:disabled{opacity:.4; cursor:default}
.step b{min-width:30px; text-align:center; font-size:19px; font-variant-numeric:tabular-nums}
.lane .btn{min-height:44px; padding:6px 10px}
.sums{margin:8px 0 0; display:grid; gap:4px; font-size:15px; color:var(--ink-2)}
.sums b{color:var(--ink); font-variant-numeric:tabular-nums}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.chip{min-height:40px; min-width:52px; border-radius:99px; border:2px solid var(--hair-2); background:var(--card); font-weight:800; font-size:16px; cursor:pointer; color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.ways{display:flex; gap:6px; flex-wrap:wrap}
.ways span{padding:4px 10px; border-radius:99px; background:var(--good-soft); font-weight:800; font-variant-numeric:tabular-nums}
.note{font-size:13px; color:var(--ink-3); margin:6px 0 0}
</style>
</head>
<body>
<header class="pg-top"></header>

<div class="pg-intro">
  <h1>Equal groups and animal jumps</h1>
  <p>Help Gulabo’s animal friends hop along the number line, and help Radha arrange her cupcakes in trays.</p>
</div>

<main class="pg-main">
  <section class="pg-stage" id="stageWrap">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabJump" role="tab" aria-selected="true">🐸 Animal jumps</button>
      <button class="tab" id="tabTray" role="tab" aria-selected="false">🧁 Radha’s trays</button>
    </div>
    <svg id="jumpStage" viewBox="0 0 1000 560" role="img" aria-label="A number line from 0 to 120 in a garden. Two animals hop along it in equal jumps. Numbers they land on are coloured; numbers both land on get a star."></svg>
    <svg id="trayStage" viewBox="0 0 1000 560" role="img" aria-label="Radha's bakery. Cupcakes are arranged in rows on a tray. Drag the knob on the ruler to choose how many go in each row." hidden></svg>
    <div class="gate" id="gate" hidden><span>Make a guess first →</span></div>
  </section>

  <aside class="pg-side">
    <div id="sideJump" class="pg-side" style="gap:12px">
      <div class="card">
        <div class="kicker">Missions</div>
        <ul class="missions" id="missionsJump"></ul>
      </div>
      <div class="card">
        <div class="kicker">Who is jumping?</div>
        <div class="pairs" id="pairs">
          <button class="pair" data-pair="FS" aria-pressed="true"><span>🐸 🐿️</span>Frog, squirrel</button>
          <button class="pair" data-pair="RK" aria-pressed="false"><span>🐇 🦘</span>Rabbit, kangaroo</button>
          <button class="pair" data-pair="CR" aria-pressed="false"><span>🐈 🐀</span>Cat and rat</button>
        </div>
        <div class="lane" id="laneA"></div>
        <div class="lane" id="laneB"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn primary" id="hopBoth">Hop both</button>
          <button class="btn" id="reset">↺ Start again</button>
        </div>
        <div class="sums" id="sums"></div>
      </div>
      <div id="poe" hidden></div>
    </div>

    <div id="sideTray" class="pg-side" style="gap:12px" hidden>
      <div class="card">
        <div class="kicker">Missions</div>
        <ul class="missions" id="missionsTray"></ul>
      </div>
      <div class="card">
        <div class="kicker">Cupcakes</div>
        <div class="row" style="justify-content:space-between">
          <div class="step"><button id="nMinus" aria-label="One cupcake fewer">−</button><b id="nOut">12</b><button id="nPlus" aria-label="One cupcake more">+</button></div>
          <div class="chips" id="nChips" style="margin:0">
            <button class="chip" data-n="12">12</button><button class="chip" data-n="13">13</button><button class="chip" data-n="36">36</button>
          </div>
        </div>
        <div class="kicker" style="margin-top:10px">Cupcakes in each row</div>
        <div class="row" style="justify-content:space-between">
          <div class="step"><button id="cMinus" aria-label="One fewer in each row">−</button><b id="cOut">4</b><button id="cPlus" aria-label="One more in each row">+</button></div>
          <button class="btn primary" id="turn">↻ Turn the tray</button>
        </div>
      </div>
      <div class="card">
        <div class="kicker" id="waysHead">Trays found for 12</div>
        <div class="ways" id="waysOut"></div>
        <p class="note" id="factNote"></p>
      </div>
    </div>

    <div class="card"><div class="kicker">Discoveries</div><div id="finds"></div></div>
  </aside>
</main>

<script src="../../play.js"></script>
<script>
'use strict';
const {$, esc, clamp, lerp, drag, loop, sound, say, track, toast, tween, predict, findings, discover, found,
       shareState, sharedState, mount, reduced, ease, confetti} = Play;
mount({thread: 'multiply', band: 'explorer'});

/* MODEL:start ==================================================================
   Two small models from Maths Mela (Class 4 Ch 9 "Equal Groups", Class 5 Ch 13
   "Animal Jumps").

   JUMPS. An animal that starts on s and jumps j each time lands on
   s + j, s + 2j, s + 3j, …  After k jumps from 0 it is on k × j, so the numbers it
   touches are the multiples of j. Two animals from 0 both touch the numbers that
   are multiples of both jumps: the common multiples. When two animals hop at the
   same moment (the cat and the rat), the chaser gains (its jump − the other's jump)
   on every hop, and catches up only if they land on the same number.

   TRAYS. N cupcakes put in rows of c make floor(N / c) full rows and N mod c left
   over. When nothing is left over, rows × c = N is an array, and rows and c are
   factors of N. Turning the tray swaps rows and columns; the cupcakes do not change,
   so rows × c = c × rows. A number with no array except one long line is prime.
   ============================================================================ */
const MAXN = 120;                                   // the end of the path
function landings(start, jump, max = MAXN){
  const out = [];
  for (let p = start + jump; p <= max; p += jump) out.push(p);
  return out;
}
function commonLandings(a, b, max = MAXN){
  const B = new Set(landings(b.start, b.jump, max));
  return landings(a.start, a.jump, max).filter(p => B.has(p));
}
/* How many jumps from start reach target exactly, or null if the animal jumps over it. */
function jumpsTo(target, start, jump){
  const d = target - start;
  return d > 0 && d % jump === 0 ? d / jump : null;
}
/* The first landing at or beyond a number. */
function firstFrom(n, start, jump){ const k = Math.ceil((n - start) / jump); return {at: start + k * jump, jumps: k}; }
/* Both hop together each turn: where (if anywhere) do they meet? */
function catchPoint(c, r, max = MAXN){
  for (let k = 1; c.start + k * c.jump <= max && r.start + k * r.jump <= max; k++)
    if (c.start + k * c.jump === r.start + k * r.jump) return {hops: k, at: c.start + k * c.jump};
  return null;
}
const rowsOf = (r, c) => `${r} ${r === 1 ? 'row' : 'rows'} of ${c}`;
function arrayOf(n, c){ const rows = Math.floor(n / c); return {rows, cols: c, left: n - rows * c}; }
function factorPairs(n){ const out = []; for (let a = 1; a * a <= n; a++) if (n % a === 0) out.push([a, n / a]); return out; }
const factors = n => factorPairs(n).flat().filter((v, i, a) => a.indexOf(v) === i).sort((x, y) => x - y);
const isPrime = n => n > 1 && factorPairs(n).length === 1;
/* MODEL:end */

/* ---- the animals of the book ------------------------------------------------- */
const KINDS = {
  frog:     {name: 'Frog',     icon: '🐸', col: '#3aa655', light: '#c9efc0', jump: 3, start: 0},
  squirrel: {name: 'Squirrel', icon: '🐿️', col: '#b0703a', light: '#f3d9bd', jump: 4, start: 0},
  rabbit:   {name: 'Rabbit',   icon: '🐇', col: '#8a8fa8', light: '#e2e4f2', jump: 6, start: 0},
  kangaroo: {name: 'Kangaroo', icon: '🦘', col: '#c98a3e', light: '#f6ddb6', jump: 8, start: 0},
  cat:      {name: 'Cat',      icon: '🐈', col: '#ef7d2a', light: '#ffdcbf', jump: 3, start: 6},
  rat:      {name: 'Rat',      icon: '🐀', col: '#6f7b86', light: '#dde3e8', jump: 2, start: 12},
};
const PAIRS = {FS: ['frog', 'squirrel'], RK: ['rabbit', 'kangaroo'], CR: ['cat', 'rat']};

/* ---- state: plain data --------------------------------------------------- */
const newAnimal = kind => ({kind, jump: KINDS[kind].jump, start: KINDS[kind].start, pos: KINDS[kind].start, hops: 0});
const S = {scene: 'jump', pair: 'FS', A: newAnimal('frog'), B: newAnimal('squirrel'), v: 0, running: null, locked: false,
           N: 12, c: 4, turned: 0, pairs: {}, tried: {}, missions: {}};
const shared = sharedState();
if (shared) {
  if (PAIRS[shared.pair]) { S.pair = shared.pair; S.A = newAnimal(PAIRS[S.pair][0]); S.B = newAnimal(PAIRS[S.pair][1]); }
  if (shared.scene === 'tray') S.scene = 'tray';
  S.N = clamp(Math.round(+shared.N || 12), 1, 40); S.c = clamp(Math.round(+shared.c || 4), 1, S.N);
}
shareState(() => ({scene: S.scene, pair: S.pair, N: S.N, c: S.c}));
const lands = a => landings(a.start, a.jump, a.pos);

/* ---- missions: a checklist that ticks itself when the model gets there ---- */
const MISSIONS = [
  {id: 'frog67',  scene: 'jump', text: 'The frog jumps 3 at a time. Will it land on 67?'},
  {id: 'sq60',    scene: 'jump', text: 'The squirrel jumps 4. How many jumps to reach 60?'},
  {id: 'fs',      scene: 'jump', text: 'Find a number both the frog and the squirrel land on'},
  {id: 'rab100',  scene: 'jump', text: 'The rabbit jumps 6. Find the smallest 3-digit number it lands on'},
  {id: 'rk48',    scene: 'jump', text: 'Rabbit and kangaroo: who needs more jumps to reach 48?'},
  {id: 'catrat',  scene: 'jump', text: 'Cat on 6, rat on 12. Will the cat catch the rat?'},
  {id: 'ways12',  scene: 'tray', text: 'Arrange 12 cupcakes in three different trays'},
  {id: 'turn',    scene: 'tray', text: 'Turn a tray round. Is 3 × 4 the same as 4 × 3?'},
  {id: 'sq36',    scene: 'tray', text: 'Make a square tray for 36 mini cupcakes'},
  {id: 'p13',     scene: 'tray', text: 'Can 13 cupcakes make a tray with more than one row?'},
];
function renderMissions(){
  for (const sc of ['jump', 'tray']) {
    $(sc === 'jump' ? 'missionsJump' : 'missionsTray').innerHTML = MISSIONS.filter(m => m.scene === sc).map(m =>
      `<li class="${S.missions[m.id] ? 'done' : ''}" data-m="${m.id}"><i aria-hidden="true">${S.missions[m.id] ? '✓' : ''}</i><span>${esc(m.text)}</span></li>`).join('');
  }
}
function tickMission(id){
  if (S.missions[id]) return false;
  S.missions[id] = true;
  renderMissions();
  sound('chime');
  track('mission', {id});
  return true;
}

/* ============================================================================
   Gulabo: a portrait and a speech bubble on both stages.
   ============================================================================ */
const f1 = n => (+n).toFixed(1);
const FONT = 'font-family="Fredoka, Nunito, sans-serif" font-weight="600"';
function wrap(text, n){
  const words = text.split(' '), lines = [''];
  for (const w of words) { const l = lines[lines.length - 1]; if ((l + ' ' + w).trim().length > n && l) lines.push(w); else lines[lines.length - 1] = (l + ' ' + w).trim(); }
  return lines;
}
function gulaboArt(id){
  return `<g transform="translate(74 80)">
    <circle r="58" fill="#fff4e0" stroke="#e0567a" stroke-width="4"/>
    <clipPath id="gClip${id}"><circle r="55"/></clipPath>
    <g clip-path="url(#gClip${id})">
      <path d="M-50 70 Q-44 26 0 24 Q44 26 50 70 Z" fill="#2f9e5b"/>
      <path d="M-14 26 Q0 40 14 26" fill="none" stroke="#1f7a3a" stroke-width="3"/>
      <rect x="-8" y="10" width="16" height="16" fill="#9a6440"/>
      <circle cy="-12" r="30" fill="#a8704a" stroke="#6b3f24" stroke-width="2.5"/>
      <path d="M-31 -14 Q-32 -48 0 -46 Q32 -48 31 -14 Q20 -32 0 -30 Q-20 -32 -31 -14 Z" fill="#2b1b12"/>
      <path d="M-30 -18 Q-40 10 -30 30" stroke="#2b1b12" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g transform="translate(24 -38)"><circle r="9" fill="#e0567a"/><circle r="4" fill="#ff9ab5"/><path d="M-6 8 q-6 6 -2 10" stroke="#2f9e5b" stroke-width="3" fill="none"/></g>
      <g id="gEyes${id}"><circle cx="-10" cy="-14" r="4.2" fill="#2b1b12"/><circle cx="10" cy="-14" r="4.2" fill="#2b1b12"/></g>
      <ellipse cx="-17" cy="-2" rx="6" ry="4" fill="#ff8f8f" opacity=".5"/><ellipse cx="17" cy="-2" rx="6" ry="4" fill="#ff8f8f" opacity=".5"/>
      <path id="gMouth${id}" d="M-8 2 Q0 9 8 2" stroke="#6b2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g></g>
  <g filter="url(#soft${id})">
    <path d="M150 24 H966 a14 14 0 0 1 14 14 V110 a14 14 0 0 1 -14 14 H150 a14 14 0 0 1 -14 -14 V86 L118 78 L136 66 V38 a14 14 0 0 1 14 -14 Z" fill="#fff" stroke="#e0567a" stroke-width="3"/>
  </g>
  <text id="gT${id}" x="158" y="0" ${FONT} font-size="21" fill="#3a2330"></text>`;
}
function gulabo(id, text, speak = true){
  const lines = wrap(text, 70).slice(0, 3);
  const t = $('gT' + id);
  const y0 = lines.length === 1 ? 82 : lines.length === 2 ? 68 : 56;
  t.innerHTML = lines.map((l, i) => `<tspan x="158" y="${y0 + i * 27}">${esc(l)}</tspan>`).join('');
  $('gMouth' + id).setAttribute('d', 'M-8 1 Q0 12 8 1');
  clearTimeout(gulabo.t); gulabo.t = setTimeout(() => { $('gMouth' + id).setAttribute('d', 'M-8 2 Q0 9 8 2'); }, 1400);
  if (speak) say(text);
}

/* ============================================================================
   Scene 1: the number line in the garden. Built once, then patched.
   ============================================================================ */
const jumpSvg = $('jumpStage');
const W = 30, STEP = 30, LX = 64, LY = 340;             // 30 steps in view, 30 units each
const X = n => LX + n * STEP;                            // content x of number n (the content group pans)
const OX = n => 50 + n * 7.5, OY = 488;                  // the overview strip, 0 to 120
function critter(kind){
  const k = KINDS[kind], c = k.col;
  const face = (x, y) => `<circle cx="${x - 6}" cy="${y}" r="3.6" fill="#1b1b1b"/><circle cx="${x + 6}" cy="${y}" r="3.6" fill="#1b1b1b"/>
    <circle cx="${x - 5}" cy="${y - 1.4}" r="1.2" fill="#fff"/><circle cx="${x + 7}" cy="${y - 1.4}" r="1.2" fill="#fff"/>
    <path d="M${x - 5} ${y + 8} Q${x} ${y + 12} ${x + 5} ${y + 8}" stroke="#1b1b1b" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const st = `stroke="${shade(c)}" stroke-width="2.5"`;
  if (kind === 'frog') return `<ellipse cx="-14" cy="-6" rx="10" ry="6" fill="${c}" ${st}/><ellipse cx="14" cy="-6" rx="10" ry="6" fill="${c}" ${st}/>
    <ellipse cy="-22" rx="24" ry="20" fill="${c}" ${st}/><ellipse cy="-16" rx="14" ry="10" fill="#c9efc0"/>
    <circle cx="-11" cy="-42" r="9" fill="${c}" ${st}/><circle cx="11" cy="-42" r="9" fill="${c}" ${st}/>
    <circle cx="-11" cy="-42" r="5" fill="#fff"/><circle cx="11" cy="-42" r="5" fill="#fff"/><circle cx="-10" cy="-42" r="2.8" fill="#1b1b1b"/><circle cx="12" cy="-42" r="2.8" fill="#1b1b1b"/>
    <path d="M-10 -24 Q0 -16 10 -24" stroke="#1b1b1b" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if (kind === 'squirrel') return `<path d="M-14 -12 Q-44 -20 -36 -52 Q-28 -70 -12 -58 Q-26 -44 -14 -28 Z" fill="#c98a4f" ${st}/>
    <ellipse cx="2" cy="-18" rx="16" ry="18" fill="${c}" ${st}/><ellipse cx="6" cy="-14" rx="8" ry="10" fill="#f3d9bd"/>
    <circle cx="6" cy="-42" r="14" fill="${c}" ${st}/><path d="M-2 -54 l-2 -10 l8 6 Z M12 -54 l4 -10 l2 10 Z" fill="${c}" ${st}/>${face(6, -44)}`;
  if (kind === 'rabbit') return `<ellipse cy="-18" rx="18" ry="18" fill="#f4f4fa" ${st}/>
    <ellipse cx="-7" cy="-66" rx="6" ry="17" fill="#f4f4fa" ${st}/><ellipse cx="7" cy="-66" rx="6" ry="17" fill="#f4f4fa" ${st}/>
    <ellipse cx="-7" cy="-66" rx="2.5" ry="11" fill="#ffb3c6"/><ellipse cx="7" cy="-66" rx="2.5" ry="11" fill="#ffb3c6"/>
    <circle cy="-42" r="15" fill="#f4f4fa" ${st}/><circle cx="-20" cy="-12" r="6" fill="#fff" ${st}/>${face(0, -44)}`;
  if (kind === 'kangaroo') return `<path d="M-12 -8 Q-40 -2 -46 8" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cy="-24" rx="16" ry="24" fill="${c}" ${st}/><ellipse cx="4" cy="-18" rx="8" ry="11" fill="#f6ddb6"/>
    <circle cx="4" cy="-56" r="13" fill="${c}" ${st}/><ellipse cx="-3" cy="-72" rx="4" ry="9" fill="${c}" ${st}/><ellipse cx="10" cy="-72" rx="4" ry="9" fill="${c}" ${st}/>${face(5, -58)}`;
  if (kind === 'cat') return `<path d="M-16 -10 Q-38 -14 -34 -40" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cy="-16" rx="18" ry="16" fill="${c}" ${st}/><circle cy="-40" r="15" fill="${c}" ${st}/>
    <path d="M-13 -50 l-2 -14 l10 7 Z M13 -50 l2 -14 l-10 7 Z" fill="${c}" ${st}/>
    <path d="M-20 -38 h-10 M-20 -34 h-10 M20 -38 h10 M20 -34 h10" stroke="#5a3a1a" stroke-width="1.4"/>${face(0, -42)}`;
  return `<path d="M-14 -8 Q-40 -6 -42 -22" stroke="#e6a3b0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cy="-13" rx="17" ry="12" fill="${c}" ${st}/><circle cx="-7" cy="-36" r="7" fill="${c}" ${st}/><circle cx="7" cy="-36" r="7" fill="${c}" ${st}/>
    <circle cy="-28" r="12" fill="${c}" ${st}/><circle cy="-22" r="2.6" fill="#ff8fa6"/>${face(0, -31)}`;
}
function shade(hex){ const p = [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * 0.62)); return '#' + p.map(v => v.toString(16).padStart(2, '0')).join(''); }

function buildJump(){
  let ticks = '', labels = '';
  for (let n = 0; n <= MAXN; n++) {
    ticks += `<path d="M${X(n)} ${LY - (n % 5 ? 7 : 12)} V${LY + (n % 5 ? 7 : 12)}" stroke="#3b3b3b" stroke-width="${n % 5 ? 2 : 3}"/>`;
    labels += `<g id="lb${n}"><circle id="lp${n}" cx="${X(n)}" cy="${LY + 34}" r="15" fill="none"/><text x="${X(n)}" y="${LY + 40}" text-anchor="middle" ${FONT} font-size="${n > 99 ? 14 : 17}" fill="#27323a">${n}</text></g>`;
  }
  let oticks = '';

  jumpSvg.innerHTML = `

    <linearGradient id="jGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e08a"/><stop offset="1" stop-color="#7cc462"/></linearGradient>
    <filter id="softJ" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b3a1b" flood-opacity=".18"/></filter>
    <clipPath id="lineClip"><rect x="24" y="130" width="962" height="290"/></clipPath>
  </defs>
  <rect width="1000" height="560" fill="url(#jSky)"/>

  <g>${flowers}</g>

  ${gulaboArt('J')}
  <g clip-path="url(#lineClip)"><g id="content">
    <path d="M${X(0) - 10} ${LY} H${X(MAXN) + 10}" stroke="#3b3b3b" stroke-width="4" stroke-linecap="round"/>

  <rect id="ownHit" x="30" y="${OY - 30}" width="940" height="70" fill="transparent" style="cursor:grab" role="slider" tabindex="0" aria-label="The part of the path on show. Drag to look along it."/>

  $('animAj').innerHTML = critter(S.A.kind); $('animBj').innerHTML = critter(S.B.kind);

/* ---- paint the number line from the state ---- */
let VIEW = 0;                                               // the view's left number, animated
function paintJump(){
  const la = lands(S.A), lb = lands(S.B), A = new Set(la), Bs = new Set(lb);
  for (let n = 0; n <= MAXN; n++) {
    const a = A.has(n) || (n === S.A.start && S.A.start > 0), b = Bs.has(n) || (n === S.B.start && S.B.start > 0);
    const both = A.has(n) && Bs.has(n);
    const p = $('lp' + n);
    p.setAttribute('fill', both ? '#ffd23f' : a ? KINDS[S.A.kind].light : b ? KINDS[S.B.kind].light : 'none');
    p.setAttribute('stroke', both ? '#d99a12' : a ? KINDS[S.A.kind].col : b ? KINDS[S.B.kind].col : 'none');
    p.setAttribute('stroke-width', both ? 3 : 2);
  }
  /* stars above the line on common landings */
  const common = la.filter(n => Bs.has(n));
  $('marks').innerHTML = common.map(n => `<path transform="translate(${X(n)} ${LY + 64}) scale(.55)" d="M0 -20 L6 -6 L21 -6 L9 3 L13 18 L0 9 L-13 18 L-9 3 L-21 -6 L-6 -6 Z" fill="#ffb400" stroke="#b77800" stroke-width="2"/>`).join('');
  /* arcs of every jump made */
  const arcs = (a, h, id) => { let s = ''; for (let k = 1; k <= a.hops; k++) { const p0 = a.start + (k - 1) * a.jump, p1 = p0 + a.jump; s += `<path d="M${X(p0)} ${LY - 4} Q${(X(p0) + X(p1)) / 2} ${LY - h * 2} ${X(p1)} ${LY - 4}" fill="none" stroke="${KINDS[a.kind].col}" stroke-width="3" stroke-dasharray="${id === 'B' ? '7 5' : 'none'}" opacity=".85"/>`; } $('arcs' + id).innerHTML = s; };
  arcs(S.A, 46, 'A'); arcs(S.B, 72, 'B');
  if (!HOPPING.A) placeAnimal('A', S.A.pos, 0);
  if (!HOPPING.B) placeAnimal('B', S.B.pos, 0);
  /* the overview strip */
  let od = '';
  for (const n of la) od += `<circle cx="${OX(n)}" cy="${OY - 6}" r="3.4" fill="${KINDS[S.A.kind].col}"/>`;
  for (const n of lb) od += `<circle cx="${OX(n)}" cy="${OY + 6}" r="3.4" fill="${KINDS[S.B.kind].col}"/>`;
  for (const n of common) od += `<path transform="translate(${OX(n)} ${OY - 22}) scale(.32)" d="M0 -20 L6 -6 L21 -6 L9 3 L13 18 L0 9 L-13 18 L-9 3 L-21 -6 L-6 -6 Z" fill="#ffb400" stroke="#b77800" stroke-width="3"/>`;
  $('odots').innerHTML = od;
  paintView();
  paintSide();
}
function placeAnimal(id, p, lift){
  const same = S.A.pos === S.B.pos;
  const dx = same ? (id === 'A' ? -17 : 17) : 0;
  $('anim' + id).setAttribute('transform', `translate(${f1(X(p) + dx)} ${f1(LY - 6 - lift)})`);
}
function paintView(){
  $('content').setAttribute('transform', `translate(${f1(-VIEW * STEP)} 0)`);
  $('owin').setAttribute('x', f1(OX(VIEW)));
  $('leftMore').setAttribute('opacity', VIEW > 0 ? 0.7 : 0);
}
let viewTok = 0;
function panTo(v, ms = 450){
  v = clamp(Math.round(v), 0, MAXN - W);
  S.v = v;
  const tok = ++viewTok, from = VIEW;
  if (reduced() || ms <= 0) { VIEW = v; paintView(); return; }
  tween(from, v, ms, x => { if (tok === viewTok) { VIEW = x; paintView(); } }, ease.inOut);
}
function follow(p){
  if (p > S.v + W - 3) panTo(Math.floor((p - 8) / 5) * 5);
  else if (p < S.v + 1) panTo(Math.floor((p - 4) / 5) * 5);
}

/* ---- hopping ---- */
const HOPPING = {A: false, B: false};
const HOP_MS = 300;
function canHop(a){ return a.pos + a.jump <= MAXN; }
function hop(id, quiet){
  const a = S[id];
  if (!canHop(a)) { if (!quiet) { sound('boing'); gulabo('J', `${KINDS[a.kind].name} is at the end of the path! Press “Start again” to go back.`); } return false; }
  const p0 = a.pos;
  a.pos += a.jump; a.hops++;
  const k = a.hops;
  sound('pop'); Play.sound('note', 330 + (a.jump * 30) + (id === 'B' ? 110 : 0), 0.1);
  follow(a.pos);
  if (reduced()) { HOPPING[id] = false; paintJump(); }
  else {
    HOPPING[id] = true;
    const h = id === 'A' ? 46 : 72, p1 = a.pos;
    paintJump();
    placeAnimal(id, p0, 0);
    tween(0, 1, HOP_MS, t => {
      if (a.hops !== k) return;
      $('anim' + id).setAttribute('transform', `translate(${f1(lerp(X(p0), X(p1), t))} ${f1(LY - 6 - Math.sin(t * Math.PI) * h * 1.1)})`);
    }, v => v).then(() => { if (a.hops === k) { HOPPING[id] = false; placeAnimal(id, a.pos, 0); placeAnimal(id === 'A' ? 'B' : 'A', S[id === 'A' ? 'B' : 'A'].pos, 0); squash($('anim' + id + 'j')); } });
  }
  track('hop', {who: a.kind, jump: a.jump, pos: a.pos, hops: a.hops});
  return true;
}
function squash(el){
  if (reduced()) return;
  tween(0, 1, 260, t => { const k = Math.sin(t * Math.PI) * 0.18; el.setAttribute('transform', `scale(${(1 + k).toFixed(3)} ${(1 - k).toFixed(3)})`); }, v => v).then(() => el.removeAttribute('transform'));
}
function hopOne(id){
  if (!ready()) return;
  stopRun();
  if (hop(id)) { narrate(id); checkJump(); }
}
function hopBoth(){
  if (!ready()) return;
  stopRun();
  const a = canHop(S.A), b = canHop(S.B);
  if (!a || !b) { sound('boing'); gulabo('J', 'Someone is at the end of the path! Press “Start again”.'); return; }
  hop('A', true); hop('B', true);
  narrate('both'); checkJump();
}
/* Keep hopping: one animal (or both, for the cat and the rat) until the path ends or a mission is met. */
function run(id){
  if (!ready()) return;
  if (S.running === id) { stopRun(); return; }
  stopRun();
  S.running = id;
  paintSide();
  const step = () => {
    if (S.running !== id) return;
    const ok = id === 'both' ? (canHop(S.A) && canHop(S.B) && (hop('A', true), hop('B', true), true)) : hop(id, true);
    const stop = !ok || checkJump();
    if (stop || (id === 'both' ? !(canHop(S.A) && canHop(S.B)) : !canHop(S[id]))) { narrate(id === 'both' ? 'both' : id); stopRun(); return; }
    RUNT = setTimeout(step, reduced() ? 20 : HOP_MS + 90);
  };
  step();
}
let RUNT = 0;
function stopRun(){ clearTimeout(RUNT); if (S.running) { S.running = null; paintSide(); } }
function ready(){
  if (S.pair === 'CR' && !S.locked) { sound('boing'); toast('Make your guess first!'); gulabo('J', 'Before they jump: will the cat catch the rat? Make a guess!'); return false; }
  return true;
}
function narrate(id){
  const line = a => `${KINDS[a.kind].name}: ${a.start ? a.start + ' + ' : ''}${a.hops} ${a.hops === 1 ? 'jump' : 'jumps'} of ${a.jump} = ${a.pos}.`;
  if (id === 'both') gulabo('J', line(S.A) + ' ' + line(S.B), false);
  else gulabo('J', line(S[id]) + (S[id].hops <= 3 ? ` It lands on ${lands(S[id]).join(', ')}.` : ''), false);
}

/* ---- missions and discoveries: states the number line reaches ---- */
function isA(a, kind, jump, start){ return a.kind === kind && a.jump === jump && a.start === start; }
function checkJump(){
  let stop = false;
  const at = centreOf(jumpSvg, 500, 300);
  for (const a of [S.A, S.B]) {
    if (isA(a, 'frog', 3, 0) && a.pos > 67) {
      if (tickMission('frog67')) { stop = true; gulabo('J', `The frog went ${firstFrom(67, 0, 3).at - 3}, ${firstFrom(67, 0, 3).at} — it jumped right over 67! 67 is not a multiple of 3.`); }
      discover('over', at);
    }
    if (isA(a, 'squirrel', 4, 0) && a.pos === 60) {
      if (tickMission('sq60')) { stop = true; gulabo('J', `${a.hops} jumps of 4 make 60. ${a.hops} × 4 = 60!`); }
      discover('times', at);
    }
    if (isA(a, 'rabbit', 6, 0) && a.pos >= 100) {
      if (tickMission('rab100')) { stop = true; const f = firstFrom(100, 0, 6); gulabo('J', `${f.at}! The smallest 3-digit number the rabbit lands on is ${f.at}, after ${f.jumps} jumps.`); }
    }
  }
  const both0 = S.A.start === 0 && S.B.start === 0 && S.A.jump !== S.B.jump;
  const common = lands(S.A).filter(n => lands(S.B).includes(n));
  if (both0 && common.length) {
    const kinds = [S.A.kind, S.B.kind].sort().join();
    if (kinds === 'frog,squirrel' && S.A.jump + S.B.jump === 7 && tickMission('fs')) { stop = true; gulabo('J', `Both land on ${common.join(', ')}! ${common[0]} is a common multiple of 3 and 4.`); }
    if (kinds === 'kangaroo,rabbit' && lands(S.A).includes(48) && lands(S.B).includes(48) && S.A.jump + S.B.jump === 14 && tickMission('rk48')) {
      stop = true; const r = S.A.kind === 'rabbit' ? S.A : S.B, k = r === S.A ? S.B : S.A;
      gulabo('J', `To reach 48 the rabbit jumps ${jumpsTo(48, 0, r.jump)} times and the kangaroo ${jumpsTo(48, 0, k.jump)} times. The bigger jump needs fewer jumps.`);
    }
    discover('common', at);
  }
  if (S.pair === 'CR' && S.A.pos === S.B.pos && S.A.hops > 0) {
    if (tickMission('catrat')) {
      stop = true;
      gulabo('J', `Caught on ${S.A.pos}! The cat gains ${S.A.jump - S.B.jump} on every hop, and it started ${S.B.start - S.A.start} behind.`);
      if (POE.locked) POE.explain(`The cat started on ${S.A.start} and the rat on ${S.B.start}: ${S.B.start - S.A.start} apart. Each hop the cat moves ${S.A.jump} and the rat ${S.B.jump}, so the gap shrinks by ${S.A.jump - S.B.jump}. After ${S.A.hops} hops both are on <b>${S.A.pos}</b>.`);
    }
    discover('caught', at);
  }
  return stop;
}
function centreOf(svg, x, y){
  const m = svg.getScreenCTM(); if (!m) return {x: innerWidth / 2, y: innerHeight / 2};
  const p = svg.createSVGPoint(); p.x = x; p.y = y; const q = p.matrixTransform(m); return {x: q.x, y: q.y};
}

/* ---- the side panel for the jumps ---- */
function laneHTML(id){
  const a = S[id], k = KINDS[a.kind], cr = S.pair === 'CR';
  return `<span class="who"><i>${k.icon}</i>${k.name}<span class="dot" style="background:${k.col}"></span></span>
    <div class="step"><button data-lane="${id}" data-d="-1" aria-label="${k.name}: smaller jump" ${a.jump <= 1 ? 'disabled' : ''}>−</button><b id="j${id}">${a.jump}</b><button data-lane="${id}" data-d="1" aria-label="${k.name}: bigger jump" ${a.jump >= 12 ? 'disabled' : ''}>+</button></div>
    <button class="btn" id="hop${id}" ${cr ? 'disabled title="The cat and the rat hop together"' : ''}>Hop</button>
    <button class="btn" id="run${id}" aria-label="${k.name}: keep hopping" ${cr ? 'disabled' : ''}>${S.running === id ? '❚❚' : '▶'}</button>`;
}
function paintSide(){
  $('laneA').innerHTML = laneHTML('A'); $('laneB').innerHTML = laneHTML('B');
  $('hopBoth').textContent = S.pair === 'CR' ? (S.running === 'both' ? '❚❚ Stop' : 'Hop both') : 'Hop both';
  const sum = a => `<div><b>${KINDS[a.kind].icon} ${a.start ? a.start + ' + ' : ''}${a.hops} × ${a.jump} = ${a.pos}</b></div>`;
  $('sums').innerHTML = sum(S.A) + sum(S.B) + (S.pair === 'CR' ? `<div>${S.A.pos === S.B.pos && S.A.hops ? '🎉 Caught!' : `The rat is ${S.B.pos - S.A.pos} ahead.`}</div>` : '');
  for (const b of document.querySelectorAll('#pairs .pair')) b.setAttribute('aria-pressed', b.dataset.pair === S.pair);
  $('poe').hidden = S.pair !== 'CR';
  $('gate').hidden = !(S.scene === 'jump' && S.pair === 'CR' && !S.locked);
}
function setPair(p){
  stopRun();
  S.pair = p; S.A = newAnimal(PAIRS[p][0]); S.B = newAnimal(PAIRS[p][1]);
  $('animAj').innerHTML = critter(S.A.kind); $('animBj').innerHTML = critter(S.B.kind);
  panTo(p === 'CR' ? 0 : 0, 300);
  paintJump();
  sound('pop');
  if (p === 'FS') gulabo('J', 'The frog jumps 3 at a time and the squirrel jumps 4. Press Hop, or ▶ to keep hopping!');
  if (p === 'RK') gulabo('J', 'The rabbit jumps 6 and the kangaroo jumps 8. Which numbers do both of them touch?');
  if (p === 'CR') gulabo('J', S.locked ? 'The cat is on 6 and the rat is on 12. Press “Hop both”!' : 'The cat is on 6, the rat is on 12. The cat jumps 3, the rat jumps 2. Will the cat catch the rat? Guess first!');
  track('pair', {pair: p});
}
function resetAnimals(){
  stopRun();
  for (const id of ['A', 'B']) { S[id].pos = S[id].start; S[id].hops = 0; }
  panTo(0, 300); paintJump(); sound('whoosh');
  gulabo('J', 'Back to the start!', false);
}

/* ============================================================================
   Scene 2: Radha's bakery. The tray is rebuilt from the model on every change;
   the knob's hit strip never moves.
   ============================================================================ */
const traySvg = $('trayStage');
const RU = {x0: 110, x1: 780, y: 188};                   // the ruler: cupcakes in each row
const maxC = () => Math.min(S.N, 20);
const ruX = c => RU.x0 + (c - 1) * (RU.x1 - RU.x0) / Math.max(1, maxC() - 1);
function cupcake(size, hue){
  const cols = [['#ff7aa2', '#e0567a'], ['#7ac8ff', '#3f7fd8'], ['#ffd23f', '#d99a12'], ['#b58cff', '#7b5cd6']][hue % 4];
  return `<g transform="scale(${(size / 60).toFixed(3)})">
    <path d="M-20 -2 L-15 24 H15 L20 -2 Z" fill="${cols[0]}" stroke="${cols[1]}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-10 0 L-8 22 M0 0 V22 M10 0 L8 22" stroke="${cols[1]}" stroke-width="2" opacity=".6"/>
    <path d="M-23 0 Q-26 -14 -12 -16 Q-10 -28 2 -26 Q14 -30 16 -18 Q28 -16 23 0 Z" fill="#fff3e6" stroke="#d9b48f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="2" cy="-28" r="6" fill="#e33b3b" stroke="#a82424" stroke-width="2"/><path d="M4 -33 q4 -6 8 -6" stroke="#2f8a3e" stroke-width="2" fill="none"/>
  </g>`;
}
function buildTray(){
  let tiles = '';
  for (let i = 0; i < 12; i++) tiles += `<rect x="${i * 84}" y="0" width="84" height="84" fill="${i % 2 ? '#fde7cf' : '#fbdcbc'}"/>`;
  traySvg.innerHTML = `
  <defs>
    <filter id="softT" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a3510" flood-opacity=".2"/></filter>
    <pattern id="tiles" width="84" height="84" patternUnits="userSpaceOnUse"><rect width="84" height="84" fill="#fde9d4"/><rect width="42" height="42" fill="#fbdfc2"/><rect x="42" y="42" width="42" height="42" fill="#fbdfc2"/></pattern>
  </defs>
  <rect width="1000" height="560" fill="url(#tiles)"/>
  <rect y="484" width="1000" height="76" fill="#c98a4b"/><rect y="484" width="1000" height="9" fill="#e3a765"/>
  ${gulaboArt('T')}
  <!-- the ruler: how many cupcakes in each row -->
  <text x="${RU.x0 - 8}" y="${RU.y - 26}" ${FONT} font-size="16" fill="#8a5a2b">In each row</text>
  <g id="ruler"></g>
  <g id="trayG"></g>
  <g id="plate"></g>
  <text id="stmt" x="455" y="534" text-anchor="middle" ${FONT} font-size="30" fill="#fff"></text>
  <rect id="knobHit" x="${RU.x0 - 30}" y="${RU.y - 26}" width="${RU.x1 - RU.x0 + 60}" height="52" fill="transparent" style="cursor:grab" role="slider" tabindex="0" aria-label="How many cupcakes in each row. Drag along the ruler."/>
  `;
}
let TRAY_ROT = 0;
function paintTray(){
  const {rows, cols, left} = arrayOf(S.N, S.c), m = maxC();
  /* the ruler */
  let ru = `<path d="M${RU.x0} ${RU.y} H${RU.x1}" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>`;
  for (let c = 1; c <= m; c++) ru += `<path d="M${f1(ruX(c))} ${RU.y - 6} V${RU.y + 6}" stroke="#8a5a2b" stroke-width="2.5"/>` + (m <= 12 || c % 5 === 0 || c === 1 ? `<text x="${f1(ruX(c))}" y="${RU.y + 24}" text-anchor="middle" ${FONT} font-size="15" fill="#8a5a2b">${c}</text>` : '');
  ru += `<g transform="translate(${f1(ruX(Math.min(S.c, m)))} ${RU.y})" filter="url(#softT)"><circle r="17" fill="#2f7de1" stroke="#fff" stroke-width="3"/><text y="6" text-anchor="middle" ${FONT} font-size="17" fill="#fff">${S.c}</text></g>`;
  $('ruler').innerHTML = ru;
  /* the tray: full rows only */
  const cell = rows ? Math.min(58, 640 / cols, 222 / rows) : Math.min(58, 640 / cols);
  const tw = cols * cell + 24, th = Math.max(rows, 1) * cell + 24, cx = 455, cy = 350;
  let t = `<g transform="translate(${cx} ${cy}) rotate(${TRAY_ROT})"><rect x="${f1(-tw / 2)}" y="${f1(-th / 2)}" width="${f1(tw)}" height="${f1(th)}" rx="14" fill="#9aa4ad" stroke="#6b757e" stroke-width="3"/>
    <rect x="${f1(-tw / 2 + 6)}" y="${f1(-th / 2 + 6)}" width="${f1(tw - 12)}" height="${f1(th - 12)}" rx="10" fill="#c3cbd2"/>`;
  let k = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++, k++) {
    const x = -tw / 2 + 12 + (c + 0.5) * cell, y = -th / 2 + 12 + (r + 0.5) * cell;
    t += `<circle cx="${f1(x)}" cy="${f1(y + cell * 0.08)}" r="${f1(cell * 0.42)}" fill="#aab3bb"/><g transform="translate(${f1(x)} ${f1(y + cell * 0.1)})">${cupcake(cell * 0.85, r)}</g>`;
  }
  if (!rows) t += `<text y="6" text-anchor="middle" ${FONT} font-size="18" fill="#56636b">Not enough for one row</text>`;
  $('trayG').innerHTML = t + '</g>';
  /* the leftovers on a plate */
  let p = '';
  if (left) {
    const pc = Math.min(38, 150 / Math.ceil(left / 3));
    p += `<ellipse cx="895" cy="${cy + 30}" rx="92" ry="30" fill="#fff" stroke="#d9c7b0" stroke-width="3"/><text x="895" y="${cy - 60}" text-anchor="middle" ${FONT} font-size="17" fill="#8a5a2b">Left over: ${left}</text>`;
    for (let i = 0; i < left; i++) p += `<g transform="translate(${f1(862 + (i % 3) * 33)} ${f1(cy + 26 - Math.floor(i / 3) * pc * 0.8)})">${cupcake(34, 3)}</g>`;
  }
  $('plate').innerHTML = p;
  $('stmt').textContent = !rows ? `${S.N} cupcakes, ${S.c} in a row` : left ? `${rows} × ${cols} + ${left} = ${S.N}` : `${rows} ${rows === 1 ? 'row' : 'rows'} of ${cols}:  ${rows} × ${cols} = ${S.N}`;
  paintTraySide();
}
function paintTraySide(){
  $('nOut').textContent = S.N; $('cOut').textContent = S.c;
  $('nMinus').disabled = S.N <= 1; $('nPlus').disabled = S.N >= 40;
  $('cMinus').disabled = S.c <= 1; $('cPlus').disabled = S.c >= maxC();
  for (const b of document.querySelectorAll('#nChips .chip')) b.setAttribute('aria-pressed', +b.dataset.n === S.N);
  const got = (S.pairs[S.N] || []).slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  $('waysHead').textContent = `Trays found for ${S.N}`;
  $('waysOut').innerHTML = got.length ? got.map(([r, c]) => `<span>${r} × ${c}</span>`).join('') : '<span style="background:var(--sunk);color:var(--ink-3)">none yet</span>';
  const fs = [...new Set(got.flat())].sort((a, b) => a - b);
  $('factNote').textContent = fs.length ? `Rows and row-lengths that work for ${S.N}: ${fs.join(', ')}.` : 'A tray works when nothing is left over.';
}
/* record what the tray shows, then check missions */
function afterTray(kind){
  const {rows, cols, left} = arrayOf(S.N, S.c);
  (S.tried[S.N] = S.tried[S.N] || []).includes(S.c) || S.tried[S.N].push(S.c);
  if (rows && !left) {
    const L = (S.pairs[S.N] = S.pairs[S.N] || []);
    if (!L.some(p => p[0] === rows && p[1] === cols)) L.push([rows, cols]);
  }
  paintTray();
  checkTray(kind);
  track('tray', {kind, N: S.N, c: S.c, rows, left});
}
function checkTray(kind){
  const {rows, cols, left} = arrayOf(S.N, S.c), at = centreOf(traySvg, 455, 330);
  const unordered = n => new Set((S.pairs[n] || []).map(p => Math.min(...p) + 'x' + Math.max(...p))).size;
  if (S.N === 12 && unordered(12) >= 3 && tickMission('ways12')) gulabo('T', `Three different trays for 12: ${factorPairs(12).map(p => p.join(' × ')).join(', ')}. So 1, 2, 3, 4, 6 and 12 are factors of 12.`);
  if (kind === 'turn' && rows && !left && rows !== cols) {
    tickMission('turn');
    discover('turn', at);
  }
  if (S.N === 36 && rows === 6 && cols === 6 && !left) { if (tickMission('sq36')) gulabo('T', '6 rows of 6: a square tray! 6 × 6 = 36.'); }
  if (isPrime(S.N) && S.N > 3) {
    const tries = (S.tried[S.N] || []).filter(c => c > 1 && c < S.N).length;
    const line = (S.pairs[S.N] || []).length > 0;
    if (tries >= 3 && line) {
      if (S.N === 13) tickMission('p13');
      if (!found('prime')) gulabo('T', `${S.N} cupcakes only make one long line. ${S.N} has just two factors, 1 and ${S.N}. Numbers like 13 and 37 are called prime numbers.`);
      discover('prime', at);
    }
  }
  if (rows && !left && kind !== 'turn' && !S.missions.turn && rows !== cols) {
    if (!gulabo.saidTurn) { gulabo.saidTurn = true; setTimeout(() => gulabo('T', `${rowsOf(rows, cols)}. Now press “Turn the tray”. What happens?`), reduced() ? 0 : 900); }
  }
}
function setN(n){ S.N = clamp(n, 1, 40); S.c = clamp(S.c, 1, maxC()); sound('pop'); afterTray('n'); say(S.N + ' cupcakes.'); }
function setC(c){ c = clamp(c, 1, maxC()); if (c === S.c) return; S.c = c; sound('tick'); afterTray('c'); }
function turnTray(){
  const {rows, cols, left} = arrayOf(S.N, S.c);
  if (!rows) { sound('boing'); gulabo('T', 'Make a full row first!'); return; }
  if (rows > maxC()) { sound('boing'); gulabo('T', `Turned round, the rows would have ${rows} cupcakes — too long for the tray. Try another way.`); return; }
  sound('whoosh');
  const done = () => {
    TRAY_ROT = 0; S.c = rows; S.turned++;
    afterTray('turn');
    const b = arrayOf(S.N, S.c);
    if (!left) gulabo('T', rows === cols ? `A square! ${rows} × ${cols} = ${S.N} either way.` : `Before: ${rowsOf(rows, cols)}. Now: ${rowsOf(b.rows, b.cols)}. ${rows} × ${cols} = ${b.rows} × ${b.cols} = ${S.N}. The same cupcakes!`);
    else gulabo('T', `Turned round: ${rowsOf(b.rows, b.cols)}, and ${b.left} left over.`);
  };
  if (reduced()) return done();
  tween(0, 90, 520, a => { TRAY_ROT = a; paintTray(); }, ease.inOut).then(done);
}

/* ============================================================================
   Controls
   ============================================================================ */
buildJump(); buildTray();
function showScene(sc){
  S.scene = sc;
  stopRun();
  $('tabJump').setAttribute('aria-selected', sc === 'jump'); $('tabTray').setAttribute('aria-selected', sc === 'tray');
  $('jumpStage').toggleAttribute('hidden', sc !== 'jump'); $('trayStage').toggleAttribute('hidden', sc !== 'tray');
  $('sideJump').hidden = sc !== 'jump'; $('sideTray').hidden = sc !== 'tray';
  paintSide();
  if (sc === 'tray') { paintTray(); gulabo('T', 'Radha bakes cupcakes. Drag the blue knob to choose how many go in each row. When nothing is left over, you have made a tray!'); }
  else paintJump();
}
$('tabJump').addEventListener('click', () => { sound('tick'); showScene('jump'); track('scene', {scene: 'jump'}); });
$('tabTray').addEventListener('click', () => { sound('tick'); showScene('tray'); track('scene', {scene: 'tray'}); });
$('pairs').addEventListener('click', e => { const b = e.target.closest('[data-pair]'); if (b) setPair(b.dataset.pair); });
$('sideJump').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.lane) {
    const a = S[b.dataset.lane];
    stopRun();
    a.jump = clamp(a.jump + +b.dataset.d, 1, 12); a.pos = a.start; a.hops = 0;
    sound('tick'); paintJump();
    gulabo('J', `The ${KINDS[a.kind].name.toLowerCase()} now jumps ${a.jump} at a time.`, false);
    track('jump', {who: a.kind, jump: a.jump});
    return;
  }
  if (b.id === 'hopA') hopOne('A');
  if (b.id === 'hopB') hopOne('B');
  if (b.id === 'runA') run('A');
  if (b.id === 'runB') run('B');
});
$('hopBoth').addEventListener('click', () => S.pair === 'CR' ? run('both') : hopBoth());
$('reset').addEventListener('click', resetAnimals);
drag($('ownHit'), jumpSvg, {
  start(p){ stopRun(); panTo((p.x - 50) / 7.5 - W / 2, 0); },
  move(p){ panTo((p.x - 50) / 7.5 - W / 2, 0); },
  end(){ track('pan', {v: S.v}); },
});
$('ownHit').addEventListener('keydown', e => { const k = {ArrowRight: 5, ArrowLeft: -5}[e.key]; if (k) { e.preventDefault(); panTo(S.v + k, 200); } });

$('nMinus').addEventListener('click', () => setN(S.N - 1));
$('nPlus').addEventListener('click', () => setN(S.N + 1));
$('nChips').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (b) setN(+b.dataset.n); });
$('cMinus').addEventListener('click', () => setC(S.c - 1));
$('cPlus').addEventListener('click', () => setC(S.c + 1));
$('turn').addEventListener('click', turnTray);
drag($('knobHit'), traySvg, {
  start(p){ setC(Math.round((p.x - RU.x0) / ((RU.x1 - RU.x0) / Math.max(1, maxC() - 1))) + 1); },
  move(p){ setC(Math.round((p.x - RU.x0) / ((RU.x1 - RU.x0) / Math.max(1, maxC() - 1))) + 1); },
});
$('knobHit').addEventListener('keydown', e => { const k = {ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1}[e.key]; if (k) { e.preventDefault(); setC(S.c + k); } });

/* ============================================================================
   Start
   ============================================================================ */
findings($('finds'), [
  {id: 'over',   icon: '🐸', label: 'Jumped over 67',        hint: 'Does the frog land on 67?', say: 'The frog jumps over 67. It only lands on multiples of 3.'},
  {id: 'times',  icon: '✖️', label: '15 jumps of 4 make 60',  hint: 'Count the squirrel’s jumps', say: 'Fifteen jumps of four make sixty. Fifteen times four is sixty.'},
  {id: 'common', icon: '⭐', label: 'A common multiple',      hint: 'Where do two animals both land?', say: 'Both animals land here. It is a common multiple of their jumps.'},
  {id: 'caught', icon: '🐈', label: 'The cat catches the rat', hint: 'Cat and rat', say: 'The cat caught the rat! It gains one step on every hop.'},
  {id: 'turn',   icon: '🔄', label: '3 × 4 = 4 × 3',           hint: 'Turn a tray round', say: 'Turn the tray round, and the rows become columns. The number of cupcakes stays the same.'},
  {id: 'prime',  icon: '1️⃣', label: 'Only one long line',      hint: 'Try 13 cupcakes', say: 'This number makes only one long line. It is a prime number.'},
], () => toast('All six found! You are a real number detective.', 4200));

const POE = predict($('poe'), {
  id: 'cat-rat',
  q: 'The cat is on 6 and the rat is on 12. Each time, the cat jumps 3 and the rat jumps 2. Will the cat catch the rat?',
  options: [
    {id: 'yes',   text: '🐈 Yes — they will land on the same number', right: true},
    {id: 'ahead', text: '🐀 No — the rat started ahead, so it stays ahead'},
    {id: 'over',  text: '🦘 No — the cat will jump over the rat'},
  ],
  confidence: false,
  onLock(){
    S.locked = true;
    paintSide();
    gulabo('J', 'Now press “Hop both” and find out!');
  },
});
if (!Play.FF('predict')) S.locked = true;

renderMissions();
paintJump();
paintTray();
showScene(S.scene);
if (S.scene === 'jump') gulabo('J', 'Hello! I am Gulabo. The frog jumps 3 at a time and the squirrel jumps 4. Press Hop, or ▶ to keep hopping!');
window.applyFeatures = () => { paintJump(); paintTray(); };
window.PG_STATE = () => JSON.parse(JSON.stringify(Object.assign({}, S, {landsA: lands(S.A), landsB: lands(S.B), rows: arrayOf(S.N, S.c).rows, left: arrayOf(S.N, S.c).left})));
window.PG_MODEL = {landings, commonLandings, jumpsTo, firstFrom, catchPoint, arrayOf, factorPairs, factors, isPrime, KINDS, MAXN, RU, ruX};
</script>

\"load Timetable where writable\"\n    H->>H: \"checkSectionWritable (slot reach or unfiltered)\"\n    H->>O: \"Proposal ref=proposed\"\n    O->>DB: \"branchOfScheme\"\n    O->>SV: \"Check(ClashQuery)\"\n    SV->>DB: \"patternPass: versions + slots\"\n    SV->>DB: \"datedPass: buildPlan over deviation dates\"\n    SV->>DB: \"markOverrides: stored slot overrides\"\n    SV-->>O: \"ClashReport\"\n    alt blocking clashes and no fresh override\n        O-->>C: \"409 code timetable_clash (writeClashReport)\"\n    else blocking but rule not overridable (student_set)\n        O-->>C: \"409 timetable_clash\"\n    else clear or overridden\n        O-->>H: \"slotOverride (accepted clashes + reason + by + at)\"\n        H->>DB: \"TimetableSlot.Create + clash_override json\"\n        H-->>C: \"201 Location /timetable-slots/{id}\"\n    end\n```\n\n| Node | Code reference |\n|---|---|\n| route guard | transport/http/timetable.go:mountTimetable (`s.can(authorization.TimetableWrite)`) |\n| createTimetableSlot | transport/http/timetable.go:createTimetableSlot (900) |\n| updateTimetableSlot | transport/http/timetable.go:updateTimetableSlot (997); builds the proposal with `slotProposal` (1115), `ReplacesSlotID` set so the slot does not clash with itself |\n| scopeFor, TimetablesWritableBy | transport/http/viewer.go:scopeFor; data/access/timetable.go:TimetablesWritableBy (286) |\n| readSlotOverride, mayOverrideClash, settleSlotClash, applySlotOverride, updateSlotOverride | transport/http/timetableoverride.go |\n| Check | service/timetable/clash.go:Check |\n| patternPass / datedPass / markOverrides | service/timetable/clash.go, override.go |\n| buildPlan | service/timetable/plan.go:buildPlan |\n| writeClashReport | transport/http/timetable.go:writeClashReport (1164) |\n\nRules enforced in code:\n- Three rules, `service/timetable/clash.go:Rule`: `teacher`, `room`, `student_set`. Only teacher and room are overridable (`override.go:Rule.Overridable`). `student_set` (same pupil in two places) is never overridable; `settleSlotClash` returns 409 with message \"a pupil cannot be in two rooms at once\".\n- `judge` (clash.go) flags teacher/room only when both sides name the same non-null teacher/room; student_set flags when enrolment sets (`loadStudentSets`: active `StudentSubjectEnrollment` by offering; if the slot has no offering, active `StudentEnrollment` by section) intersect. Student ids are capped at `DefaultClashStudents = 25` in the reply, count is exact.\n- `patternPass`: loads all versions of the same period scheme in status published (plus the target's own status when it is not yet published), keeps those whose effective window overlaps the target (`overlap`), compares every pair where at least one side belongs to the target, same day_of_week and period. Does not look at deviations or day patterns.\n- `datedPass`: `datesToCheck` is either the `From..To` window of the request, or (default; this is the case for slot create/update) every date in `[EffectiveFrom, +399 days]` that has a timetable deviation in the branch. For each date it builds a `plan` (`wholeDay: true`) and compares occurrences pairwise using `concurrent` (minute overlap if both times resolved from the bell schedule, else same period id). Proposals are injected via `plan.proposalsOn`, only on dates the target timetable is in force and the calendar day is open.\n- Overrides are persisted on the slot (`clash_override`, `clash_override_reason`, `clash_overridden_by/at`, `clash_override_json` list of accepted counterpart slot/deviation ids). `markOverrides` re-reads stored overrides so a later clash check marks previously-accepted clashes `Overridden` instead of blocking. A fresh override needs `TimetableOverride` (separate entity, probed via `guard.Allow` in `mayOverrideClash`) and a non-empty reason (422).\n- Update that sends `clash_override=false` or no accepted list clears all override columns (`updateSlotOverride`).\n- `POST /timetables/{id}/clash-check` runs the same `Check` read-only (max 100 proposals, `maxClashProposals`) and returns 200 with `clear`, `blocking`, `overridden` counts, no write.\n- Slot writes need `checkSectionWritable`: either `timetableWriteUnfiltered` (tenant reach, no constraints) or an existing slot in that section/offering that the viewer may write (`access.TimetableSlotsWritableBy`).\n\n### 1.3 Publish (sequence)\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client\"\n    participant H as \"publishTimetable\"\n    participant U as \"unitOfWork (tx)\"\n    participant SV as \"timetable.Service.Publish\"\n    participant DB as \"Tenant DB\"\n    C->>H: \"POST /timetables/{id}/publish {supersedes_id, published_by}\"\n    H->>DB: \"timetable exists and writable by viewer?\"\n    H->>H: \"require timetableWriteUnfiltered (whole-school write grant)\"\n    H->>U: \"begin\"\n    H->>SV: \"Publish(PublishRequest) on tx client\"\n    SV->>DB: \"Get target, status switch\"\n    alt already published\n        SV-->>C: \"409 ErrAlreadyPublished\"\n    else superseded or archived\n        SV-->>C: \"422 ErrPublishRetired\"\n    end\n    SV->>SV: \"predecessorFor (same scheme, published, strictly earlier effective_from)\"\n    SV->>DB: \"CoveredSections (declared cover, else sections of slots)\"\n    alt no covered section\n        SV-->>C: \"422 ErrPublishCoversNothing\"\n    end\n    SV->>DB: \"publishConflicts (other published, overlapping dates, shared section)\"\n    alt conflicts\n        SV-->>C: \"409 code timetable_publish_conflict\"\n    end\n    SV->>DB: \"predecessor: status superseded, effective_to = target.from - 1 day\"\n    SV->>DB: \"target: status published, published_at, published_by, supersedes_id\"\n    H->>U: \"commit\"\n    H-->>C: \"200 timetable\"\n```\n\n| Node | Code reference |\n|---|---|\n| publishTimetable | transport/http/timetablepublish.go:publishTimetable (35) |\n| writeTimetablePublishErr | transport/http/timetablepublish.go:writeTimetablePublishErr (104) |\n| Publish, predecessorFor, CoveredSections, publishConflicts, sharedSections | service/timetable/publish.go |\n| begin, rollback, commit | transport/http/attendance.go:begin (746) |\n| attach cover | transport/http/timetablepublish.go:attachTimetableSections (205), `sectionsBelongToScheme`, `coverStaysExclusive`, `linkTimetableSections` |\n\nInvariants and observations:\n- `Publish` does not re-run the clash check; it only guards cover exclusivity: no two published timetables may cover the same section over overlapping dates, unless one is the declared predecessor (exempt list = target + predecessor).\n- Cover = rows in `timetable_sections` if any exist, else the distinct sections of the timetable's slots (`CoveredSections`). `sharedSections` applies the same rule to candidates (declared vs implied).\n- A successor must start strictly after the predecessor (`ErrSupersedesNotEarlier`), same period scheme (`ErrSupersedesScheme`), and the predecessor must be published (`ErrSupersedesUnpublished`). Predecessor is closed to `effective_to = successor.from - 1 day` only if its end was open or later.\n- Attaching sections to an already-published timetable re-runs `CoverConflicts` (`coverStaysExclusive`), so cover cannot be widened into a conflict after publish. Sections must belong to the scheme's branch and the timetable's academic session (`sectionsBelongToScheme`).\n- Observed bypass: `createTimetable` accepts `status=published` (sets `published_at`) and `updateTimetable` accepts `status` including `published`; neither calls `timetablesvc.Publish`, so neither runs the cover/conflict/predecessor checks. `POST /publish` is the only path that enforces them. (Unverified whether this is intentional; `published_at` itself is rejected as client input on both handlers.)\n- Generation (`generateTimetable`) refuses anything but `draft`.\n\n### 1.4 Occurrence expansion (calendar + timetable + deviations)\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY GET /timetable-occurrences\"]:::entry\n    E2[\"ENTRY GET /sections/{id}/calendar\"]:::entry\n    E3[\"ENTRY GET /teacher-absences/{id}/lessons\"]:::entry\n    E4[\"ENTRY GET /timetable-export.xlsx range mode\"]:::entry\n    E5[\"ENTRY attendance register (resolveClassWindow)\"]:::entry\n    A[\"AUTH scopeFor + access.TimetableSlotsFor and TimetableDeviationsFor\"]:::auth\n    RC[\"SHARED Service.ResolveCoverage / Resolve / ResolveDay\"]:::shared\n    BP[\"SHARED buildPlan\"]:::shared\n    D1[\"DB calendar_days + schedules + section patterns\"]:::db\n    D2[\"DB periods + bell_schedule_periods\"]:::db\n    D3[\"DB timetables (status filter, window)\"]:::db\n    D4[\"DB timetable_slots (scope predicates)\"]:::db\n    D5[\"DB timetable_deviations (per slot, additions)\"]:::db\n    OC[\"SHARED plan.occurrencesOn\"]:::shared\n    UN[\"uncovered days (open day, scheme, no timetable in force)\"]:::err\n    OUT[\"Occurrence list sorted by date, start minute, period, section\"]:::shared\n    E1 --> A\n    E2 --> A\n    E3 --> A\n    E4 --> A\n    E5 --> RC\n    A --> RC\n    RC --> BP\n    BP --> D1\n    BP --> D2\n    BP --> D3\n    BP --> D4\n    BP --> D5\n    BP --> UN\n    BP --> OC\n    OC --> OUT\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef auth fill:#ffe3b3,stroke:#b36b00\n    classDef shared fill:#e8e8e8,stroke:#555\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| resolveTimetableOccurrences | transport/http/timetable.go:resolveTimetableOccurrences (1874); `parseOccurrenceQuery` (1804) builds lenses (section, period, teacher, room, offering) |\n| getSectionCalendar | transport/http/sectioncalendar.go:getSectionCalendar (120) |\n| getTeacherAbsenceLessons | transport/http/absences.go:getTeacherAbsenceLessons |\n| exportTimetableWorkbook | transport/http/timetableexport.go:exportTimetableWorkbook |\n| resolveClassWindow | transport/http/attendance.go:resolveClassWindow (285) |\n| ResolveCoverage / Resolve / ResolveDay | service/timetable/occurrence.go |\n| buildPlan, pickTimetable, dayOfWeekFor, suppressed | service/timetable/plan.go |\n| occurrencesOn, fromSlot, fromAddition, applyDeviation, keepForHalf | service/timetable/occurrence.go |\n| access predicates | data/access/timetable.go:TimetableSlotsFor (221), TimetableDeviationsFor (443) |\n\nAlgorithm (`buildPlan` then `occurrencesOn`), all from code:\n1. Range validation (`validRange`): branch required, known half, `to >= from`, at most `MaxRangeDays = 400` days.\n2. Load calendar days of the branch in range with their schedules (`calendar_day_schedules`: one or more period-scheme + bell-schedule pairs per day), section day patterns, day-level `substitute_day_of_week`.\n3. Load periods of the involved schemes and bell spans (`start_minute`, `end_minute`, `runs`).\n4. Pick the timetable in force per (scheme, date): among versions with requested statuses (default only `published`) overlapping the range, `sortTimetablesNewestFirst` (effective_from desc, version desc, created_at desc) and `pickTimetable` takes the first whose window contains the date. An open calendar day with no timetable in force is recorded in `uncovered`.\n5. Load slots of those timetables (caller scope predicates ANDed in; `ErrScopeIncomplete` if only one of the slot/deviation predicate lists is supplied), then deviations in range: per-slot deviations keyed by `slot|date`, slotless ones (kind `added`) keyed by date.\n6. For each open day (`occurrencesOn`): a slot yields an occurrence when `slot.day_of_week == dayOfWeekFor(date, section)` and the bell span does not have `runs=false`. `applyDeviation` maps kind to state: cancelled, substituted (teacher), relocated (room), rescheduled (minutes), plus optional offering/reason. Added classes (`fromAddition`) are emitted only for the scheme that owns the period.\n7. `keepForHalf`: half derived from start minute (before 720 = forenoon); occurrence is dropped if that half of the day is closed, or does not match the requested half. `OmitCancelled` drops cancelled occurrences.\n8. Occurrence id is deterministic: `uuid.NewSHA1(NamespaceOccurrence, slotID|date)`; added classes use `NamespaceAddedOccurrence` with deviation id.\n\nDeviation write rules (`transport/http/timetable.go`): kind in {cancelled, substitution, room_change, time_change, added}; non-added kinds need `timetable_slot_id` (section/period are copied from the slot and must not be sent); `added` needs section, period and offering and forbids a slot id; substitution needs `substitute_teacher_id`, room_change `room_id`, time_change both minutes (0..1440, end > start); you cannot change an added deviation into another kind or the reverse. Deviation writes do not run the clash checker.\n\n### 1.5 Teacher absence and substitution\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY POST/PATCH /teacher-absences\"]:::entry\n    E2[\"ENTRY DELETE /teacher-absences/{id} (withdraw)\"]:::entry\n    E3[\"ENTRY GET /teacher-absences/{id}/lessons\"]:::entry\n    E4[\"ENTRY POST /timetable-deviations kind=substitution\"]:::entry\n    A[\"AUTH scopeFor TimetableWrite/Delete/Read + teacherAbsencesFor\"]:::auth\n    V[\"window validation: halves, 400 day cap, no overlap with recorded absence of same teacher\"]:::shared\n    X[\"409 overlap or already withdrawn\"]:::err\n    DB1[\"DB teacher_absences\"]:::db\n    DB2[\"DB timetable_deviations\"]:::db\n    BR[\"absenceBranches: branches of the teacher's slots\"]:::shared\n    RS[\"Service.Resolve per branch with teacher lens\"]:::shared\n    CL[\"absenceCoversOccurrence + absenceCoverOf: covered / uncovered / cancelled\"]:::shared\n    E1 --> A --> V\n    V --> X\n    V --> DB1\n    E2 --> A\n    A --> DB1\n    E2 -.-> DB2\n    E3 --> A --> BR --> RS --> CL\n    E4 --> A --> DB2\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef auth fill:#ffe3b3,stroke:#b36b00\n    classDef shared fill:#e8e8e8,stroke:#555\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| createTeacherAbsence / updateTeacherAbsence / withdrawTeacherAbsence | transport/http/absences.go |\n| window rules | absences.go:absenceWindowFrom, absenceWindowsOverlap, absenceOverlapping, absenceFreeOfOverlap |\n| access rule | absences.go:teacherAbsencesFor, teacherAbsenceWritableFor (own teacher id unless tenant reach) |\n| lessons | absences.go:getTeacherAbsenceLessons, absenceCoversOccurrence, absenceCoverOf, absenceBranches |\n| deviation create | transport/http/timetable.go:createTimetableDeviation (1569) |\n\nInvariants:\n- Half-day granularity: `from_half` default forenoon, `to_half` default afternoon; `absenceStartsAfter` orders by (date, half).\n- No two recorded (non-withdrawn) absences of the same teacher may overlap (409 naming the existing id). Withdrawn absences cannot be amended (409); status/withdrawn_* fields cannot be sent on create/update (`rejectWithdrawalFields`). Withdraw is DELETE with `?reason=`.\n- Withdrawal does not touch deviations: the DELETE response returns `cover_left_in_place` (substitution deviations on that teacher's slots in the window via `absenceCoverArranged`).\n- Cover classification: cancelled state => `cancelled`; occurrence teacher differs from the absent teacher => `covered`; otherwise `uncovered`.\n- The lessons endpoint resolves with caller-scoped slots plus the teacher lens, so a viewer sees only lessons they may read.\n\n### 1.6 Export workbook (xlsx)\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client\"\n    participant H as \"exportTimetableWorkbook\"\n    participant P as \"parseTimetableExportQuery\"\n    participant S as \"scopeFor(TimetableRead)\"\n    participant SV as \"timetable.Service.Export\"\n    participant W as \"Export.Workbook (excelize)\"\n    C->>H: \"GET /timetable-export.xlsx?branch_id&mode&on|from,to&section_id&status\"\n    H->>P: \"validate (branch_id required, mode pattern or range)\"\n    H->>S: \"viewer, decision\"\n    H->>SV: \"Export(Slots, Deviations predicates, Show subject/teacher/room by field policy)\"\n    alt mode=pattern\n        SV->>SV: \"exportPattern: in-force published versions on date\"\n    else mode=range\n        SV->>SV: \"exportRange: <= 62 days, Calendar + ResolveCoverage\"\n    end\n    SV-->>H: \"Export (one sheet per class)\"\n    H->>W: \"Workbook()\"\n    W-->>H: \"bytes\"\n    H-->>C: \"200 xlsx, Cache-Control private no-store, attachment filename\"\n    SV-->>C: \"404 ErrExportEmpty / 400 mode or range too wide\"\n```\n\n| Node | Code reference |\n|---|---|\n| handler, query, disposition | transport/http/timetableexport.go:exportTimetableWorkbook, parseTimetableExportQuery, workbookDisposition, writeTimetableExportErr |\n| Export, exportPattern, exportRange | service/timetable/export.go (lines 135, 433, 617) |\n| Workbook, writeSheet | service/timetable/workbook.go:Export.Workbook (88), writeSheet (204) |\n\nInvariants: `MaxExportRangeDays = 62`; `maxExportSections = 200`; subject/teacher/room columns appear only if the field policy `Permits` them (`decision.Fields.Permits(\"subject_offering_id\" | \"teacher_id\" | \"room_id\")`); slot/deviation scope predicates must be supplied together (`ErrScopeIncomplete`); `ErrExportEmpty` -> 404 \"no timetable here is readable\"; `SanitiseSheetName` and `sheetNamer` de-duplicate sheet titles.\n\n### 1.7 Auto-generation hand-off (internals belong to another investigator)\n\n```mermaid\nflowchart LR\n    E[\"ENTRY POST /timetables/{id}/generate (TimetableGenerate)\"]:::entry\n    H[\"generateTimetable: draft only, options, room check\"]:::auth\n    J[\"DB timetable_generation_jobs row (unique per timetable)\"]:::db\n    D[\"ASYNC timetablegen.Dispatcher.Submit (queue + workers)\"]:::async\n    R[\"timetablegen.Runner.Execute\"]:::async\n    X[\"EXTERNAL solver via timetablegen.Client\"]:::ext\n    K[\"timetable.Service.Check then slot bulk create in tx\"]:::shared\n    P[\"ENTRY GET /timetables/{id}/generate/{job}\"]:::entry\n    Q[\"503 queue full / 503 not configured\"]:::err\n    E --> H --> J --> D\n    D --> R --> X\n    R --> K\n    P --> J\n    D -.-> Q\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef auth fill:#ffe3b3,stroke:#b36b00\n    classDef shared fill:#e8e8e8,stroke:#555\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef ext fill:#e6d9f5,stroke:#6a3d9a\n    classDef async fill:#fff3b0,stroke:#8a6d00\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| generateTimetable / getTimetableGeneration | transport/http/timetablegenerate.go (58, 144); `UseTimetableSolver` (30) sets the package-level `timetableGenerator` |\n| wiring | cmd/api/main.go (around line 94): `timetablegen.DispatcherFor(cfg, logger)`; when nil and `TIMETABLE_SOLVER_ENABLED` false it logs and the endpoint answers 503 |\n| Dispatcher.Submit | service/timetablegen/dispatcher.go:Submit (96): non-blocking channel send; `ErrQueueFull` => handler `abandonGeneration` + 503 |\n| Runner.Execute / run / applyWeek | service/timetablegen/runner.go (79, 117, 231): `applyWeek` calls `timetable.New(client).Check` with all rules and aborts with `clashError` if anything blocks, then deletes `replaced` slots and bulk-creates new slots inside a tx |\n| daily contact | service/timetablegen/dailycontact.go:resolveDailyContact; called ONLY from `Runner.run` (runner.go:142). Rules arrive from `generateTimetable` `daily_contact` payload (`readDailyContact`, `shared.DailyContactRule`). It is a solver constraint input (a class teacher or listed offerings must meet a section N times a day), NOT an attendance feature. Attendance code never calls it. |\n\nHandler guards: target must be `draft` (422), `generateHasRoom` uses `timetablegen.OverlappingVersions`, job create hits a unique constraint -> 409 if one is already running, seconds bounded by `MinimumSolveSeconds/MaximumSolveSeconds`.\n\n---\n\n## 2. Attendance\n\n### 2.1 Route table (`transport/http/attendance.go:mountAttendance`, line 1452)\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET | /attendance/register | AttendanceRead | getAttendanceRegister |\n| POST | /attendance/register | AttendanceWrite | markAttendanceRegister |\n| GET | /attendance/periods | AttendanceRead | listAttendancePeriods |\n| GET | /attendance/periods/{id} | AttendanceRead | getAttendancePeriod |\n| PATCH | /attendance/periods/{id} | AttendanceWrite | updateAttendancePeriod |\n| DELETE | /attendance/periods/{id} | AttendanceDelete | deleteAttendancePeriod |\n| GET | /attendance/days | AttendanceRead | listAttendanceDays |\n| POST | /attendance/days | AttendanceWrite | createAttendanceDay |\n| GET | /attendance/days/{id} | AttendanceRead | getAttendanceDay |\n| PATCH | /attendance/days/{id} | AttendanceWrite | updateAttendanceDay |\n| DELETE | /attendance/days/{id} | AttendanceDelete | deleteAttendanceDay |\n\nTwo granularities: `attendance_periods` (per student per lesson: offering + period + date, status present/absent/late/excused) and `attendance_days` (per student per day: forenoon_status, afternoon_status, unique on student_id + attendance_date). Wide permission probes: `AttendanceReadAll/WriteAll/DeleteAll`. Rooms are not part of attendance (no room reference in attendance.go); `/rooms` belongs to the timetable (section 1).\n\n### 2.2 Register marking (sequence)\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client (teacher)\"\n    participant H as \"markAttendanceRegister\"\n    participant S as \"scopeFor(AttendanceWrite)\"\n    participant PL as \"planRegister\"\n    participant TT as \"timetable.Service (IsInSession, ResolveDay)\"\n    participant DB as \"Tenant DB\"\n    participant U as \"unitOfWork (tx)\"\n    C->>H: \"POST /attendance/register {offering, period, date, entries[]}\"\n    H->>S: \"viewer, decision\"\n    H->>H: \"rejectUnauthorizedFields\"\n    H->>PL: \"validate payload\"\n    PL->>DB: \"locateOffering (offering to section to branch)\"\n    PL->>TT: \"resolveClassWindow(branch, offering, period, date)\"\n    alt not a session day / not scheduled / cancelled\n        PL-->>C: \"422 attendance_not_in_session | attendance_not_scheduled | attendance_class_cancelled\"\n    end\n    PL->>DB: \"notEnrolledInOffering (active subject enrolments)\"\n    alt some students not enrolled\n        PL-->>C: \"422 attendance_not_enrolled + student list\"\n    end\n    H->>DB: \"existingMarks (student, date, period)\"\n    H->>U: \"begin\"\n    loop each entry\n        H->>DB: \"update existing (writable predicate) or create\"\n    end\n    alt any student outside the caller's write reach\n        H->>U: \"rollback\"\n        H-->>C: \"422 attendance_unreachable + students\"\n    else all ok\n        H->>U: \"commit\"\n        H-->>C: \"200 {created, updated, marks}\"\n    end\n```\n\n| Node | Code reference |\n|---|---|\n| markAttendanceRegister | transport/http/attendance.go (778) |\n| planRegister | attendance.go (843); `registerStatuses` (524) enforces 1..400 entries (`maxRegisterEntries`), no duplicate student, valid status |\n| resolveClassWindow, classAcceptsMarks | attendance.go (285, 332) |\n| timetable calls | service/timetable/calendar.go:IsInSession; service/timetable/occurrence.go:ResolveDay |\n| applyRegister | attendance.go (691); upsert per student and delete newly created rows that are outside write reach |\n| access predicates | data/access/attendance.go:AttendancePeriodsFor (282), AttendancePeriodsWritableBy (293), AttendanceDaysFor (304), AttendanceDaysWritableBy (315) |\n\nInvariants (all from code):\n- A register is accepted only for a class that exists on that date in the resolved timetable: the date must be an open calendar day, an occurrence for exactly this (offering, period) must exist, and it must not be in `cancelled` state. Substituted/relocated/rescheduled classes are accepted; the mark records `timetable_slot_id` and the occurrence's (possibly substituted) `teacher_id`.\n- Students must be in an active `StudentSubjectEnrollment` for that offering.\n- Upsert semantic: re-posting the same (student, date, period) updates the existing mark; `source` default manual.\n- Write reach: with `ReachTenant` any row; with `ReachTeacherAssignment` only offerings in `v.SubjectOfferingIDs` (`attendancePeriodMarkableArms`). Reading additionally allows self (student), ward (guardian) and section teaching arms. Reach `self`/`guardian_ward` can never write.\n- Day marks (`createAttendanceDay`): at least one half status required; each half sent must be open (`dayAcceptsMarks` -> `IsInSession(branch, date, half)`); create happens in a tx, then re-reads under `AttendanceDaysWritableBy` and deletes + rolls back if the creator could not then write it (403). Day write arm for teachers = sections in `v.SectionIDs` (class teacher), different from the period write arm (offerings taught).\n- `updateAttendancePeriod` and `updateAttendanceDay` do not re-check the timetable; they stamp `marked_by` and `marked_at`; day update forbids changing student/session/section/date.\n- No cross-check between period marks and day marks exists in code (no aggregation or derivation of day status from period marks was found).\n\n---\n\n## 3. Exams and marks\n\n### 3.1 Route tables\n\n`transport/http/exams.go:mountExams` (49), `marks.go:mountExamMarks` (65), `onlinetests.go:mountOnlineTests` (92). Exams reuse the timetable permissions (`TimetableRead/Write/Delete`; wide probes `TimetableReadAll/WriteAll/DeleteAll`).\n\n| Method | Path | Permission | Handler | File |\n|---|---|---|---|---|\n| GET/POST | /exams | TimetableRead / TimetableWrite | listExams / createExam | exams.go |\n| GET/PATCH/DELETE | /exams/{id} | Read / Write / Delete | getExam / updateExam / deleteExam | exams.go |\n| GET/POST | /exams/{id}/subjects | Read / Write | listExamSubjects / createExamSubject | exams.go |\n| GET/PATCH/DELETE | /exam-subjects/{id} | Read / Write / Delete | getExamSubject / updateExamSubject / deleteExamSubject | exams.go |\n| GET/POST | /exam-subjects/{id}/sittings | Read / Write | listExamSubjectSittings / createExamSitting | exams.go |\n| GET | /exam-sittings, /exam-sittings/{id} | Read | listExamSittings / getExamSitting | exams.go |\n| DELETE | /exam-sittings/{id} | Delete | deleteExamSitting | exams.go |\n| GET/POST | /exam-marks | Read / Write | listExamMarks / createExamMark | marks.go |\n| POST | /exam-marks/batch | Write | recordExamMarks | marks.go |\n| GET/PATCH/DELETE | /exam-marks/{uuid} | Read / Write / Delete | getExamMark / updateExamMark / deleteExamMark | marks.go |\n| GET/PUT | /online-tests/{id} (id = exam_subject id) | TimetableWrite (both) | getOnlineTest / setOnlineTestWindow | onlinetests.go |\n| POST | /online-tests/{id}/publish, /close | Write | publishOnlineTest / closeOnlineTest | onlinetests.go |\n| GET/POST | /online-tests/{id}/questions | Write | listOnlineTestQuestions / createOnlineTestQuestion | onlinetests.go |\n| GET | /online-tests/{id}/paper | Read | getOnlineTestPaper | onlinetests.go |\n| GET/POST | /online-tests/{id}/attempts | Read / Write | listOnlineTestAttempts / startOnlineTestAttempt | onlinetests.go |\n| PATCH/DELETE | /online-test-questions/{id} | Write / Delete | updateOnlineTestQuestion / deleteOnlineTestQuestion | onlinetests.go |\n| GET | /online-test-attempts/{id} | Read | getOnlineTestAttempt | onlinetests.go |\n| PUT | /online-test-attempts/{id}/responses | Write | saveOnlineTestResponses | onlinetests.go |\n| POST | /online-test-attempts/{id}/submit | Write | submitOnlineTestAttempt | onlinetests.go |\n| PATCH | /online-test-responses/{id} | Write | awardOnlineTestResponse | onlinetests.go |\n\nData model (ent schema `ent/schema/exam.go`, `marks.go`, `onlinetest.go`): `exams` (branch + session scoped, unique code per session+branch; `exam_type` unit_test/term/practice/board; `status` draft/published/archived; `assessment_kind` evaluative/practice; `delivery` in_person/online) -> `exam_subjects` (one per exam+offering; `maximum_marks` > 0, `pass_marks` <= max, optional `grading_scheme_id`) -> `exam_sittings` (calendar_day + period + section + optional room) and `student_exam_marks` (status marked/absent/exempt, `marks_obtained`, `provisional`).\n\n### 3.2 Exam lifecycle and sitting scheduling\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client\"\n    participant E as \"createExam / updateExam\"\n    participant ES as \"createExamSubject\"\n    participant SI as \"createExamSitting\"\n    participant SC as \"settleSittingClash\"\n    participant SV as \"timetable.Service.Check\"\n    participant DB as \"Tenant DB\"\n    participant U as \"unitOfWork (tx)\"\n    C->>E: \"POST /exams (whole-school TimetableWrite only)\"\n    E->>DB: \"Exam draft (status default draft, any status value accepted on PATCH)\"\n    C->>ES: \"POST /exams/{id}/subjects\"\n    ES->>DB: \"examOffering must match exam session + branch (422 otherwise)\"\n    ES->>DB: \"ExamSubject (grading_scheme defaults to offering's)\"\n    C->>SI: \"POST /exam-subjects/{id}/sittings {date, period_id, room_id}\"\n    SI->>DB: \"sittingDay: calendar day exists and a half open\"\n    SI->>DB: \"sittingPeriod: period of this branch, day runs the period's scheme\"\n    SI->>DB: \"sittingRoom: room of this branch\"\n    SI->>SC: \"fresh placement + all sittings of that day\"\n    SC->>DB: \"timetableInForce (published, date within window) else 422\"\n    SC->>SV: \"Check(From=To=date, all rules, ExcludeSlotIDs = displaced slots)\"\n    alt blocking clash\n        SC-->>C: \"409 timetable_clash (never overridable)\"\n    end\n    SI->>U: \"begin\"\n    SI->>DB: \"ExamSitting.Create\"\n    SI->>DB: \"cancelDisplacedLessons: one cancelled deviation per displaced slot (exam_sitting_id set)\"\n    SI->>U: \"commit\"\n    SI-->>C: \"201\"\n```\n\n| Node | Code reference |\n|---|---|\n| createExam / updateExam | transport/http/exams.go (352, 447): both require `timetableWriteUnfiltered` (campaign-wide) |\n| createExamSubject / examOffering | exams.go (668, 749) |\n| createExamSitting and helpers | exams.go (1375; `sittingDay` 1219, `sittingPeriod` 1252, `sittingRoom` 1289, `settleSittingClash` 1309, `cancelDisplacedLessons` 1505) |\n| clash check | service/timetable/clash.go:Check |\n| delete cascade | ent/schema/timetabledeviation.go: `exam_sitting` edge `OnDelete(Cascade)`, so `deleteExamSitting` removes the cancellations it created and lessons reappear |\n\nObservations on state transitions:\n- Exam `status` (draft/published/archived) has no transition guard in `updateExam`; any valid enum value can be set at any time. `assessment_kind` can be changed freely until the exam is linked to a result component (linking refuses `practice`; changing a linked exam to practice afterwards is not checked in `updateExam`, see section 4).\n- `delivery=online` cannot be set through any HTTP handler: `examPayload` (exams.go:146) has no delivery field and `SetDelivery` appears only in `onlinetests_test.go`. So the online-test endpoints return 422 `onlineTestNotOnline` unless the row was set to online outside the API (seed/DB). Unverified whether another provisioning path exists beyond Go code.\n- Sittings: existing sittings of the same day are re-checked together with the new one (`sittingsOfDay`), so sittings may not clash with each other on teacher/room/student set; teacher is the offering's primary active `TeacherAssignment` (`offeringTeacher`).\n- Sitting section = the offering's section; a `section_id` in the body that differs is 422.\n\n### 3.3 Marks recording (provisional marks, validation)\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY POST /exam-marks/batch\"]:::entry\n    E2[\"ENTRY POST /exam-marks\"]:::entry\n    E3[\"ENTRY PATCH /exam-marks/{id}\"]:::entry\n    A[\"AUTH scopeFor TimetableWrite + markableSubject (taught offerings) + examMarksWritableBy\"]:::auth\n    V[\"examMarkRefusal: marked needs value 0..max; absent/exempt must have none\"]:::shared\n    R[\"markableRoster: students reachable AND actively enrolled in offering\"]:::shared\n    S[\"sittingBelongsToSubject\"]:::shared\n    TX[\"unitOfWork: upsert per student, unreachable => rollback\"]:::shared\n    DB[\"DB student_exam_marks\"]:::db\n    X1[\"422 / 400 refusal (index + student id)\"]:::err\n    ON[\"SHARED online submit settles marks synchronously: provisional=true while answers await a teacher\"]:::shared\n    E1 --> A --> V --> S --> R --> TX --> DB\n    E2 --> A\n    E3 --> A\n    V --> X1\n    R --> X1\n    ON --> DB\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef auth fill:#ffe3b3,stroke:#b36b00\n    classDef shared fill:#e8e8e8,stroke:#555\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| recordExamMarks | transport/http/marks.go (758): max 200 entries (`maxExamMarkEntries`); `planExamMarks` (579), `applyExamMarks` (716) |\n| createExamMark / updateExamMark | marks.go (323, 432) |\n| markableSubject / markableExamSubjects | marks.go (159, 80) and exams.go `examSubjectScope` |\n| examMarkRefusal | marks.go (134) |\n| markableRoster | marks.go (403): `unreachableStudents` + `notEnrolledInOffering` (attendance.go:574) |\n| schema CHECKs | ent/schema/marks.go: `value_iff_marked`, `not_negative`, `provisional_only_when_marked` |\n\nRules:\n- Write reach: unfiltered / tenant reach, or teacher with the offering in `v.SubjectOfferingIDs`; otherwise no exam subject is markable (`markableExamSubjects`).\n- `status=marked` requires `marks_obtained` in [0, exam_subject.maximum_marks] (400 negative/missing, 422 above max); `absent`/`exempt` must carry no marks (422). The DB CHECK repeats this.\n- Duplicate (exam_subject, student) -> unique index `examMarkIndex` -> 409 `examMarkTaken` on single create; batch upserts instead.\n- Any manual create/update/batch amend sets `provisional=false` when the status is not marked, and the batch `amend` and `updateExamMark` never set `provisional=true`. The only writer that sets `provisional=true` is the online-test settle path (`onlinetests.go:settleOnlineExamMark`, lines 1727/1736). A manual correction of a mark that was provisional does not clear `provisional` when status stays `marked` (`updateExamMark` only resets it for non-marked). Unverified whether that is intended.\n- Batch is atomic: unreachable students roll the whole tx back (`refuseStudents`, 422), row errors return `index` + `student_id` (`refuseExamMarkRow`).\n\n### 3.4 Online test lifecycle (state machines)\n\n```mermaid\nstateDiagram-v2\n    [*] --> draft : PUT /online-tests/(id) creates window (exam delivery must be online)\n    draft --> draft : PUT amends window\n    draft --> published : POST publish - window not past, questions sum = maximum_marks, single_choice has >=2 options and exactly 1 correct\n    published --> published : PUT amends window\n    published --> closed : POST close\n    draft --> closed : POST close\n    closed --> [*]\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> in_progress : POST /online-tests/(id)/attempts (published and inside window, within attempts_allowed)\n    in_progress --> in_progress : PUT responses (upsert per question, until deadline unless late allowed)\n    in_progress --> submitted : POST submit on time\n    in_progress --> expired : POST submit late and allow_late_submission\n    submitted --> submitted : PATCH response award (manual marks)\n    expired --> expired : PATCH response award\n```\n\n| Node | Code reference |\n|---|---|\n| setOnlineTestWindow, publishOnlineTest, closeOnlineTest, onlinePublishRefusal | transport/http/onlinetests.go (307, 473, 519, 420) |\n| startOnlineTestAttempt, onlineTestOpen, sittingStudent | onlinetests.go (1136, 967, 1092) |\n| saveOnlineTestResponses, onlineAnswerShape | onlinetests.go (1363, 1316) |\n| submitOnlineTestAttempt, autoMarkAttempt, tallyAttempt | onlinetests.go (1570, 1486, 1547) |\n| settleOnlineExamMark, onlineStandingOf, onlineMarkRemark | onlinetests.go (1697, 1647, 1681) |\n| awardOnlineTestResponse | onlinetests.go (1747) |\n| schema | ent/schema/onlinetest.go: `exam_online_deliveries` (draft/published/closed), `exam_questions` (single_choice/free_text), `exam_attempts` (in_progress/submitted/expired, `awaiting_review`), `exam_responses` (marking unmarked/automatic/manual) |\n\nDetails:\n- Start attempt: returns the existing in-progress attempt (200) if one exists; otherwise 409 if attempts used >= `attempts_allowed`; `deadline_at = min(closes_at, now + duration_minutes)`. Student is taken from the caller's only pupil record or `student_id`; must be reachable and actively enrolled.\n- Submit: `autoMarkAttempt` marks single_choice by comparing the selected option to the correct one; empty free-text answers are awarded 0 automatically; non-empty free-text stays `unmarked`. `tallyAttempt` sums awarded marks and counts unmarked answers; `awaiting_review = pending > 0`. Late submission when `now > deadline_at` is 422 unless `allow_late_submission`, in which case status = `expired` and `submitted_late`.\n- `settleOnlineExamMark`: take the best submitted attempt by awarded marks; the exam mark is upserted as `status=marked`, `marks_obtained = best`, `provisional = (any attempt still awaits review)`, remark text names the best attempt and pending attempt. Manual award (`awardOnlineTestResponse`) re-tallies the attempt and re-settles the mark, so `provisional` flips to false when the last answer is marked.\n- The submit and award paths update responses, attempt and mark as separate statements on the plain client (no `begin` transaction); only `saveOnlineTestResponses` uses a unit of work.\n- The answer key is never in the sittable paper (`sittablePaperOf` vs `answerKeyOf`).\n\n---\n\n## 4. Results\n\nNote on names: `transport/http/periodgrades.go` is NOT a grade-per-period feature. It manages which grade levels run which period scheme (`period_scheme_grade_levels`) and clones period schemes (routes `/period-schemes/{id}/grade-levels`, `/clone`, `/period-scheme-grade-levels/{id}`). \"Standing debt\" is not a code feature either: it is section 8 of `docs/ROADMAP.md` (a list of known gaps) and `transport/http/standingdebt_test.go` which tests those fixes; no production symbol uses that name.\n\n### 4.1 Route table\n\n| Method | Path | Permission | Handler | File |\n|---|---|---|---|---|\n| GET/POST | /result-schemes | SubjectOfferingsRead / SubjectOfferingsWrite | listResultSchemes / createResultScheme | resultschemes.go (server.go mountCurriculum) |\n| GET/PATCH/DELETE | /result-schemes/{id} | Read / Write / SubjectOfferingsDelete | getResultScheme / reviseResultScheme / deleteResultScheme | resultschemes.go |\n| GET/POST | /result-schemes/{id}/components | Read / Write | listResultComponents / createResultComponent | resultschemes.go |\n| PATCH/DELETE | /result-components/{id} | Write / Delete | updateResultComponent / deleteResultComponent | resultschemes.go |\n| GET/POST | /result-components/{id}/exams | Read / Write | listResultComponentExams / linkResultComponentExam | resultschemes.go |\n| DELETE | /result-components/{id}/exams/{examID} | Delete | unlinkResultComponentExam | resultschemes.go |\n| GET/POST | /result-components/{id}/assignments | Read / Write | listResultComponentAssignments / linkResultComponentAssignment | resultschemes.go |\n| DELETE | /result-components/{id}/assignments/{assignmentID} | Delete | unlinkResultComponentAssignment | resultschemes.go |\n| GET/POST/PATCH | /grading-schemes (and /{id} PATCH) | SubjectOfferingsRead / Write | listGradingSchemes / createGradingScheme / reviseGradingScheme | grading.go |\n| GET | /subject-offerings/{id}/results | TimetableRead | listOfferingResults | results.go (route in server.go:373) |\n| GET | /students/{id}/report-card | TimetableRead | getStudentReportCard | reportcards.go (route in server.go:192) |\n| POST/PATCH | /subject-offerings (attach `result_scheme_id`, `grading_scheme_id`) | SubjectOfferingsWrite | createOffering / updateOffering | subjects.go, validators `resultSchemeAttachable`, `gradingSchemeAttachable` |\n\nBroad-key note: result schemes and grading schemes reuse `SubjectOfferingsRead/Write` as permission; grading schemes probe `CurriculumReadAll/WriteAll` as wide key (`grading.go`).\n\n### 4.2 Configuration flow (scheme composition and linking)\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY POST /result-schemes\"]:::entry\n    E2[\"ENTRY POST /result-schemes/{id}/components\"]:::entry\n    E3[\"ENTRY POST /result-components/{id}/exams | /assignments\"]:::entry\n    E4[\"ENTRY PATCH /result-schemes/{id} status=active\"]:::entry\n    E5[\"ENTRY POST/PATCH /subject-offerings result_scheme_id\"]:::entry\n    E6[\"ENTRY PATCH /result-schemes/{id} when in use\"]:::entry\n    D[\"created in draft only (422 result_scheme_starts_in_draft otherwise)\"]:::shared\n    G[\"resultSchemeIsDraft: components and links editable only in draft\"]:::shared\n    L1[\"exam link refuses assessment_kind=practice and other academic session\"]:::err\n    L2[\"assignment link needs maximum_marks > 0 and same session\"]:::err\n    AC[\"resultSchemeActivationRefusal: weights sum = total_marks, every component has a source, best_of take_best <= linked, no unmarked assignment\"]:::shared\n    AT[\"resultSchemeAttachable: same session and status active\"]:::shared\n    SU[\"supersedeResultScheme: new code required, copyResultScheme in tx (components + links)\"]:::shared\n    DB[\"DB result_schemes, result_components, result_component_exams, result_component_assignments, subject_offerings\"]:::db\n    E1 --> D --> DB\n    E2 --> G --> DB\n    E3 --> G\n    G --> L1\n    G --> L2\n    L1 --> DB\n    L2 --> DB\n    E4 --> AC --> DB\n    E5 --> AT --> DB\n    E6 --> SU --> DB\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef shared fill:#e8e8e8,stroke:#555\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| createResultScheme (186), reviseResultScheme (255), supersedeResultScheme (358), copyResultScheme (442) | transport/http/resultschemes.go |\n| resultSchemeActivationRefusal (543), resultComponentValid (686), resultSchemeIsDraft (674) | resultschemes.go |\n| linkResultComponentExam (1041), linkResultComponentAssignment (1225) | resultschemes.go |\n| resultSchemeAttachable | transport/http/subjects.go (587) |\n| keepsAssignmentMaximum | transport/http/assignments.go (658): refuses removing `maximum_marks` of an assignment composed into a scheme (422 `assignment_feeds_a_result`) |\n\nInvariants: scheme `total_marks` default 100, unique code per session; `reviseResultScheme` edits in place unless any offering uses it, then requires a new `code` and clones into a successor (`supersedes_id`) preserving links (warns with `carried_without_maximum` for assignments that lost their maximum); only `active` schemes can be attached to an offering; a scheme is not re-checked on exam `assessment_kind` change after linking. The grading scheme works the same way (`reviseGradingScheme`: in-place edit unless an offering uses it, else supersede by new code via `supersedeGradingScheme`).\n\n### 4.3 Computing a result (sequence)\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client\"\n    participant H as \"listOfferingResults\"\n    participant S as \"scopeFor(TimetableRead) + requireResultFields\"\n    participant PL as \"planOfferingResult\"\n    participant G as \"gatherResultMarks\"\n    participant CP as \"results.Compute\"\n    participant DB as \"Tenant DB\"\n    C->>H: \"GET /subject-offerings/{id}/results?student_id&limit&offset\"\n    H->>S: \"field policy must permit status, marks_obtained, provisional of exam marks (else 403)\"\n    H->>DB: \"offering in scope (resultOfferingScope)\"\n    alt no result_scheme_id\n        H-->>C: \"200 composed=false, reason\"\n    end\n    H->>DB: \"roster: active subject enrolments, paged\"\n    H->>PL: \"components + exam links + assignment links\"\n    PL->>DB: \"exam subjects of this offering, exam titles, assignments\"\n    PL-->>H: \"Scheme (dropped components/sources recorded in composition)\"\n    alt no component scorable\n        H-->>C: \"422 result_scheme_unfilled_for_offering\"\n    end\n    H->>G: \"marks for roster\"\n    G->>DB: \"student_exam_marks, assignment_submissions with marks\"\n    loop each student\n        H->>CP: \"Compute(scheme, marks)\"\n    end\n    alt Compute error (e.g. mark above maximum)\n        H-->>C: \"422 result_not_computable\"\n    else\n        H-->>C: \"200 results[{final, result}], composition\"\n    end\n```\n\n| Node | Code reference |\n|---|---|\n| listOfferingResults | transport/http/results.go (118) |\n| requireResultFields | results.go (101) |\n| planOfferingResult, componentShortfall, examSources, homeworkSources | results.go (265+) |\n| gatherResultMarks, examMarkOf, gradedSubmissions | results.go |\n| Compute, indexMarks, scoreComponent, aggregate, Validate | service/results/compute.go |\n| types | service/results/scheme.go (Scheme, Component, Source, Mark), result.go (Result, ComponentResult, SourceResult, Outcome) |\n| report card | transport/http/reportcards.go:getStudentReportCard (123), reportCardSubject (329), reportSubjectStatus (390), reportSubjectGrade (419), reportGradeBand (463) |\n\n### 4.4 Aggregation algorithm (what a result is, step by step)\n\nAdapter side (`transport/http/results.go`):\n1. For each component of the offering's scheme, sources = linked exams that have an exam subject for THIS offering (maximum = `exam_subjects.maximum_marks`) + linked assignments with `maximum_marks > 0`. Exams without a paper for this offering and assignments without a maximum go to `composition.sources_not_set`.\n2. A component with zero usable sources, or fewer than `take_best` for best_of, is dropped from the scheme (`componentShortfall`) and listed in `composition.components_not_scored` with its weight. So the denominator shrinks.\n3. Marks: exam marks via `examMarkOf`: status absent -> Absent, exempt -> Exempt, marked with value -> Scored (or ScoredProvisionally if `provisional`), a marked row with no value is ignored. Assignment marks: among submissions with non-null `marks_obtained` the highest `attempt_number` per (student, assignment) wins (`gradedSubmissions`); submission status is not consulted.\n\nPure computation (`service/results/compute.go:Compute`):\n1. `scheme.Validate()`: total_marks > 0, at least one component; per component maximum > 0, weight > 0, aggregation known, `take_best` required exactly for best_of and `<= len(sources)`, single has exactly one source, sources unique and with positive maximum.\n2. `indexMarks`: scored marks must be >= 0; absent/exempt must carry 0 obtained and not be provisional; one mark per source.\n3. Components are processed in `position` order. For each source: no mark => `not_entered`; exempt => `exempt`; absent => `absent`; scored => error if obtained > source maximum, else fraction = obtained / source maximum and the source is eligible.\n4. If no source is eligible: component fraction 0, contribution 0, `Excused = (every source is exempt)`.\n5. Otherwise `aggregate` over eligible fractions:\n   - single / average: arithmetic mean of eligible fractions (absent sources are not in the denominator).\n   - sum: sum of fractions, capped at 1 (`Capped` set if above 1 + 1e-9).\n   - best_of: sort fractions descending, mean of the top `take_best` (or fewer if fewer eligible); other eligible sources are `not_among_best`.\n6. Component values: `fraction = round6`, `obtained_marks = fraction * component.maximum_marks`, `contribution = fraction * component.weight` (round 2).\n7. Result totals: `component_total = sum of all weights`; for non-excused components `assessed_total += weight`, `score += contribution`, and `complete = false` if any source is `not_entered`. An `absent` source therefore counts as 0 in an assessed component (unlike exempt, which removes it only when all sources are exempt, otherwise the exempt source is just ignored).\n8. `provisional` = any counted source provisional (in non-excused components, also set on the component). `Final() = complete && !provisional`; the HTTP layer further requires `composition.whole()` (nothing dropped) for `final`.\n9. `Percentage() = round2(score / assessed_total * 100)`; `Balanced()` = component_total equals scheme total_marks; `Excused()` = assessed_total differs from component_total.\n\nReport card (`reportcards.go`): per active subject enrolment in the chosen session (default: the current session; 400 if none), same `planOfferingResult` + `gatherResultMarks` + `Compute` for the one student; status precedence: exempt (assessed_total 0) > awaiting_marks (incomplete and nothing decided) > in_progress (incomplete) > provisional > partly_composed (components dropped) > final. Grade band is named only when complete, whole, scale non-empty and the percentage matches a band (with a 1e-9 epsilon) in the OFFERING's grading scheme (`subject_offerings.grading_scheme_id`). Note: `exam_subjects.grading_scheme_id` is written at exam-subject creation but is not read by the result or report-card code (verified by the code read: `reportGradingSchemes` uses offerings only). No cross-subject aggregate is computed (`aggregate: null` with an explanatory reason).\n\n---\n\n## 5. Engagement\n\n### 5.1 Stream (posts, comments, targets)\n\nRoutes (`transport/http/stream.go:mountStream`, line 1030):\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET/POST | /stream-posts | StreamPostsRead / StreamPostsWrite | listStreamPosts / createStreamPost |\n| GET/PATCH/DELETE | /stream-posts/{id} | StreamPostsRead / Write / StreamPostsDelete | getStreamPost / updateStreamPost / deleteStreamPost |\n| GET/POST | /stream-posts/{id}/comments | StreamCommentsRead / StreamCommentsWrite | listStreamComments / createStreamComment |\n| PATCH | /stream-comments/{id} | StreamCommentsWrite | moderateStreamComment |\n| DELETE | /stream-comments/{id} | StreamCommentsDelete | deleteStreamComment |\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY POST /stream-posts\"]:::entry\n    E2[\"ENTRY GET /stream-posts\"]:::entry\n    E3[\"ENTRY POST /stream-posts/{id}/comments\"]:::entry\n    E4[\"ENTRY PATCH /stream-comments/{id}\"]:::entry\n    SW[\"streamWrite: scopeFor + access.WritableAudience\"]:::auth\n    SR[\"streamRead: scopeFor + access.ReadableAudience\"]:::auth\n    CT[\"checkStreamTargets: target exists AND within writable audience\"]:::auth\n    X1[\"422/403 target missing or beyond reach\"]:::err\n    P[\"DB stream_posts (author = viewer.PersonID)\"]:::db\n    T[\"DB stream_targets (CreateBulk, separate statement, no tx)\"]:::db\n    Q[\"access.StreamPostsFor(audience): post has a target inside audience\"]:::auth\n    M[\"moderate: status hidden/visible via StreamCommentsModeratableBy; body edit only own comment via StreamCommentsWritableBy\"]:::auth\n    E1 --> SW --> CT\n    CT --> X1\n    CT --> P --> T\n    E2 --> SR --> Q\n    E3 --> SR\n    SR --> Q\n    Q --> P\n    E4 --> M\n    classDef entry fill:#d6eaff,stroke:#1a5fb4\n    classDef auth fill:#ffe3b3,stroke:#b36b00\n    classDef db fill:#d9f2d9,stroke:#2b7a2b\n    classDef err fill:#ffd6d6,stroke:#b00020\n```\n\n| Node | Code reference |\n|---|---|\n| createStreamPost (498), updateStreamPost (611), deleteStreamPost (735) | transport/http/stream.go |\n| decodeStreamTargets (264), checkStreamTargets (320), streamTargetWithin (343), streamTargetExists (301) | stream.go |\n| streamRead / streamWrite (378, 391) | stream.go |\n| listStreamComments (770), createStreamComment (826), moderateStreamComment (896), deleteStreamComment (981) | stream.go |\n| ReadableAudience / WritableAudience / resolveAudience | data/access/audience.go (lines 54-110) |\n| StreamPostsFor, StreamPostsWritableBy, StreamCommentsFor, StreamCommentsWritableBy, StreamCommentsModeratableBy | data/access/stream.go |\n\nRules:\n- Audience model (`access.Audience`): `All`, `School`, branches, grades, sections, offerings, students (+ SelfStudents/WardStudents \"kin\"). `resolveAudience` builds it from the viewer's roles: reach tenant => All; teacher assignment => sections/offerings/grades the teacher holds; self (student) and ward (guardian) are read-only roles (`audienceRoles`); constraints (pins) are intersected (`intersectAudience`).\n- Read: a post is visible iff at least one of its targets matches an audience arm (`StreamPostsFor`). Write: ALL of the post's targets must be inside the writable audience (`StreamPostsWritableBy` uses `Not(HasTargetsWith(Not(Or(arms))))` plus `HasTargets`), so a teacher cannot edit a post that also targets something outside their reach.\n- Create: needs a person record (`viewer.PersonID`, 403 otherwise); 1..50 targets (`maxStreamTargets`) of types school/branch/grade/section/offering/student, distinct, each existing and within the writable audience; `expires_at` must be after `published_at`. Post row and target rows are two separate writes with no transaction, so a failure creating targets leaves a targetless post (visible only to `All` audiences). Verified: no `begin` call in `createStreamPost`.\n- Update: targets and `academic_session_id` are immutable (422). `status` draft/published/archived, `pinned`, window can change. The `live` query filter (`streamPostLive`) = published and `published_at <= now` and not expired; the plain list does not filter by status or liveness for readers unless `live=true` or `status=` is passed.\n- Comments: create requires the post to be readable (`StreamPostsFor`); only `visible` comments are listed; PATCH with `status` is moderation (post must be writable by caller, cannot be combined with a body edit); PATCH without status edits the caller's own comment (`StreamCommentsWritableBy`: author = viewer person and post readable); DELETE allowed for author or moderator.\n\n### 5.2 Assignments (homework) and submissions\n\nRoutes (`transport/http/assignments.go:mountAssignments`, line 1736):\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET/POST | /assignments | AssignmentsRead / AssignmentsWrite | listAssignments / createAssignment |\n| GET/PATCH/DELETE | /assignments/{id} | Read / Write / AssignmentsDelete | getAssignment / updateAssignment / deleteAssignment |\n| GET/POST | /assignments/{id}/items | Read / Write | listAssignmentItems / createAssignmentItem |\n| GET/POST | /assignments/{id}/submissions | AssignmentSubmissionsRead / AssignmentSubmissionsWrite | listAssignmentSubmissions / submitAssignment |\n| PATCH/DELETE | /assignment-items/{id} | Write / Delete | updateAssignmentItem / deleteAssignmentItem |\n| GET | /assignment-submissions, /{id} | SubmissionsRead | listSubmissions / getSubmission |\n| PATCH/DELETE | /assignment-submissions/{id} | SubmissionsWrite / SubmissionsDelete | gradeSubmission / deleteSubmission |\n| GET/PUT | /assignment-submissions/{id}/items | Read / Write | listSubmissionItems / answerSubmissionItem |\n| PATCH | /assignment-submission-items/{id} | Write | gradeSubmissionItem |\n\nStudent-assignment routes are a different thing (`/student-assignments`, `StudentAssignmentsRead/Write/Delete`, `studentassignments.go`): role assignments of a student (e.g. class_monitor, house_captain) per session/section/offering with validity dates and status active/revoked/completed. It is not homework. `listStudentAssignments`, `createStudentAssignment`, `updateStudentAssignment`, `deleteStudentAssignment`; reach through `access.StudentAssignmentsFor`; `studentRoleAllowed` validates role_type.\n\n```mermaid\nsequenceDiagram\n    participant T as \"Teacher\"\n    participant S as \"Student\"\n    participant CA as \"createAssignment\"\n    participant SA as \"submitAssignment\"\n    participant GS as \"gradeSubmission\"\n    participant DB as \"Tenant DB\"\n    T->>CA: \"POST /assignments {targets, maximum_marks, due_at, status}\"\n    CA->>CA: \"assignmentWrite: scopeFor + WritableAudience, caller must be a teacher (teacher_id from caller)\"\n    CA->>CA: \"targets (section/student/offering) must exist and be within audience, subject_offering within audience\"\n    CA->>DB: \"Assignment.Create\"\n    CA->>DB: \"AssignmentTarget.CreateBulk (separate statement, no tx)\"\n    S->>SA: \"POST /assignments/{id}/submissions\"\n    SA->>SA: \"must be own pupil (audience.SelfStudents)\"\n    SA->>DB: \"submittableAssignment: set to student (student, section, offering target) and status published and available_from passed\"\n    alt after due_at and late_submission_allowed false\n        SA-->>S: \"409\"\n    end\n    SA->>DB: \"update existing submission row to submitted, else create (late flag, total_marks = assignment max)\"\n    T->>GS: \"PATCH /assignment-submissions/{id} {marks_obtained, status}\"\n    GS->>DB: \"submission gradable (assignment writable, not kin's own), marks <= assignment maximum, graded needs marks\"\n    GS->>DB: \"status graded (default), graded_at, graded_by\"\n```\n\n| Node | Code reference |\n|---|---|\n| createAssignment (477), updateAssignment (711), deleteAssignment (829) | transport/http/assignments.go |\n| submittableAssignment (1262), submitAssignment (1288), studentReach (1219), assignmentSetTo (1240) | assignments.go |\n| gradeSubmission (1402), answerSubmissionItem (1571), gradeSubmissionItem (1681) | assignments.go |\n| access predicates | data/access/assignment.go: AssignmentsFor (48), AssignmentsWritableBy (69), AssignmentSubmissionsFor (114), AssignmentSubmissionsGradableBy (135), AssignmentSubmissionsSubmittableBy (152), exceptKinSubmissions (165) |\n| link into results | results.go:gradedSubmissions; resultschemes.go:linkResultComponentAssignment; assignments.go:keepsAssignmentMaximum |\n\nObservations:\n- Assignment status draft/published/closed; students can submit only when `published`. No `closed` check beyond status (closed is simply not published).\n- `max_attempts` is stored and validated (>= 1) but never enforced: `submitAssignment` updates the (assignment, student) row(s) or creates one, never creates `attempt_number` > 1 and never compares against `max_attempts`. Verified by grep: `MaxAttempts`/`AttemptNumber` occur only in create/update payload handling (assignments.go:66, 537, 583, 792). `gradedSubmissions` in results.go does assume multiple attempts exist (highest attempt number wins).\n- Graders cannot grade their own kin's submissions (`exceptKinSubmissions`).\n- Assignment immutables: academic_session, teacher, subject_offering, targets (`rejectImmutableAssignmentFields`).\n\n### 5.3 Recognition (achievements, awards, praise)\n\nRoutes (`transport/http/recognition.go:mountRecognition`, line 1593):\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET/POST | /achievements | AchievementsRead / AchievementsWrite | listAchievements / createAchievement |\n| GET/PATCH/DELETE | /achievements/{id} | Read / Write / AchievementsDelete | getAchievement / updateAchievement / deleteAchievement |\n| GET/POST | /student-achievements | StudentAchievementsRead / Write | listStudentAchievements / awardAchievement |\n| GET/PATCH/DELETE | /student-achievements/{id} | Read / Write / Delete | getStudentAchievement / updateStudentAchievement / deleteStudentAchievement |\n| PUT | /student-achievements/{id}/showcase | StudentAchievementsWrite | showcaseStudentAchievement |\n| GET/POST | /praises | PraisesRead / PraisesWrite | listPraises / createPraise |\n| GET/PATCH/DELETE | /praises/{id} | Read / Write / PraisesDelete | getPraise / updatePraise / deletePraise |\n| GET/POST | /praises/{id}/reactions | PraiseReactionsRead / PraiseReactionsWrite | listPraiseReactions / reactToPraise |\n| DELETE | /praise-reactions/{id} | PraiseReactionsDelete | deletePraiseReaction |\n\n```mermaid\nflowchart TD\n    E1[\"ENTRY POST /student-achievements (award)\"]:::entry\n    E2[\"ENTRY PUT /student-achievements/{id}/showcase\"]:::entry\n    E atcher`/`Runner`/`Client` are concrete types injected through a package-level variable (`transport/http/timetablegenerate.go:28` `timetableGenerator *timetablegen.Dispatcher`, set by `UseTimetableSolver` from `cmd/api/main.go`). The contracts that matter are function types over ent predicates (`predicate.TimetableSlot`, `predicate.TimetableDeviation`, `predicate.StudentExamMark`, ...) passed in as scope arguments, and the `access.Viewer`/`access.Audience`/`access.Recognition` structs.\n\n---\n\n## 7. Verified vs unverified\n\nVerified by reading the function bodies (not just docs):\n- All route tables and permission constants in sections 1-5 (from `mountTimetable`, `mountTeacherAbsences`, `mountExams`, `mountExamMarks`, `mountOnlineTests`, `mountAttendance`, `mountStream`, `mountAssignments`, `mountRecognition`, and `mountCurriculum`/`mountAcademic` in server.go).\n- Clash detection (3 rules, overridable subset, pattern pass vs dated pass, date selection, override persistence and re-marking).\n- Publish rules and transaction, supersession, cover exclusivity, and the status-write bypass on create/update of timetables.\n- Occurrence expansion algorithm (`buildPlan`, `occurrencesOn`, day patterns, runs=false suppression, half logic, deterministic ids).\n- Teacher absence rules and the fact that no code auto-creates substitutions.\n- Export (modes, limits, field-policy gating) and generation hand-off (job row, dispatcher queue, runner calling `Check`, dailycontact only called from `Runner.run`).\n- Attendance register and day flow, timetable gating, enrolment gating, tx/rollback behaviour.\n- Exam/sitting scheduling with clash check and cancellation deviations; marks validation; online test publish/attempt/submit/award and provisional marks; the missing delivery setter.\n- Results aggregation (`Compute`) and its adapter; scheme activation/supersession; report card status and grade rules.\n- Stream/assignment/recognition handlers and access predicates; non-transactional two-step creates for posts and assignments; unenforced `max_attempts`; unreachable auto_rule awards.\n\nUnverified or left out:\n- Not read in depth: list/get handlers for many entities (filters, paging), `data/access/recognition.go` Recognition resolution internals, `service/timetable/export.go` sheet-building details (`exportPattern` and `exportRange` internals past the entry), `workbook.go` styling, `timetablegen` internals (solver client, export builder, runner settle logic), and the room/period/bell/calendar CRUD validation bodies (only route-level facts and the bell-period create handler were read).\n- Whether the status-write bypass of `Publish` in `createTimetable`/`updateTimetable` is intended is unverified. Whether any seed path sets `exams.delivery=online` is unverified (no Go production path found).\n- Whether `updateExamMark` leaving `provisional=true` after a manual correction while status stays marked is intended is unverified.\n- DB-level uniqueness for praise reactions was not checked.\n- `docs/` were used only as a pointer (DESIGN-NOTES, ROADMAP section 8); every claim above was re-checked against code except the ROADMAP \"standing debt\" list, which is taken as documentation only.\n"}];

function slug(text) {
  return text.replace(/[`*_]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section";
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("on"), 1600);
}
function copy(text) {
  const done = () => toast("Copied " + (text.length > 60 ? text.slice(0, 57) + "..." : text));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => toast("Copy blocked by the browser"));
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Copy blocked by the browser"); }
  ta.remove();
}

function outline(page) {
  const seen = {};
  const out = [];
  for (const tok of marked.lexer(page.md)) {
    if (tok.type !== "heading") continue;
    let id = slug(tok.text);
    seen[id] = (seen[id] || 0) + 1;
    if (seen[id] > 1) id += "-" + seen[id];
    out.push({ depth: tok.depth, text: tok.text.replace(/[`]/g, ""), id });
  }
  return out;
}

function sections(page) {
  const seen = {};
  const out = [];
  let cur = { id: "", title: page.title, body: "" };
  for (const tok of marked.lexer(page.md)) {
    if (tok.type === "heading" && tok.depth > 1) {
      out.push(cur);
      let id = slug(tok.text);
      seen[id] = (seen[id] || 0) + 1;
      if (seen[id] > 1) id += "-" + seen[id];
      cur = { id, title: tok.text.replace(/[`]/g, ""), body: "" };
    } else {
      cur.body += " " + (tok.raw || "");
    }
  }
  out.push(cur);
  return out.map(s => ({ ...s, page: page.id, pageTitle: page.title, hay: (s.title + " " + s.body).toLowerCase() }));
}

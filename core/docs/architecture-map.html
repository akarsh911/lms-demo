s(RowValues)`, `Decision.FieldsForRow` (union of covering grants), `Decision.PerRow()`. |\n| Scope (library) | `retrieval.ScopesFor` turns viewer plus decision into scope labels for the retrieval engine (`GET /library/scopes`). Different meaning from \"reach\". |\n\n### 2.2 Evaluating a PolicySet: `authorization/policyset.go:PolicySet.Allows`\n\n```mermaid\nflowchart TD\n    A[\"INTERFACE Guard.Allow(entity, attrs)\"] --> B[\"AUTH PolicySet.Allows\"]\n    B --> C{\"entity in index\"}\n    C -- \"no\" --> D[\"ERROR deny: entity not granted\"]\n    C -- \"yes\" --> E{\"alternatives empty\"}\n    E -- \"yes\" --> F[\"allow, unconditional, Fields nil (all)\"]\n    E -- \"no\" --> G[\"per alternative: Constraints() translatable\"]\n    G -- \"no\" --> H[\"skip, remember untranslatable\"]\n    G -- \"yes\" --> I{\"Expression.Satisfiable(attrs)\"}\n    I -- \"no\" --> J[\"skip, remember missing attrs\"]\n    I -- \"yes\" --> K{\"Expression.Eval(attrs)\"}\n    K -- \"false\" --> L[\"skip\"]\n    K -- \"true\" --> M[\"admit alternative\"]\n    M --> N[\"Decision: Rule, Constraints unless any admitted alt unpinned, Fields intersect, Grants, Reach of first admitted\"]\n    H --> O[\"ERROR deny with reason if none admitted\"]\n    J --> O\n    L --> O\n```\n\n| Node | Code |\n|---|---|\n| Allows | `authorization/policyset.go:PolicySet.Allows` |\n| Constraints / collect | `authorization/constraint.go:Alternative.Constraints`, `collect`, `collapseOr` |\n| Satisfiable / Eval | `authorization/expression.go:Node.Satisfiable`, `Node.Eval`, `evalLeaf`, `matches` (`nonAttribute` fields `reach`, `section`, `grade_level` evaluate true) |\n| mergeFields | `constraint.go:mergeFields`, `intersectFields` |\n| Reach | `authorization/scope.go:Alternative.Reach` |\n| Parse | `authorization/policyset.go:ParsePolicySet`, `build` |\n\nNotes: `Decision.Constraints` is set only when every admitted alternative is pinned (`anyUnpinned` false); one unpinned admitted alternative removes row pins entirely. `Decision.Reach` comes from `admitted[0]` only. `PolicySet.AllowsField`/`DeniedFields`/`PermittedFields` (`fields.go`) exist but no non-test caller was found outside the authorization package (grep). Field checks use `Decision.Fields` directly.\n\n### 2.3 Catalog and `cmd/catalogdump`\n\n`authorization/catalog/catalog.go:Build` walks `authorization.AllEntities`, splits `core.<area>.<verb>`, and emits for each: key, human name, description, and fields. `narrowableAreas` marks areas having an `_all` verb; those entities (except `create`) get scope fields `reach` (enum, op `=`) and `section`/`grade_level` (ops `=`,`IN`). Non-delete verbs also get one field per ent column of the area (`areaColumns`, excluding `id/created_at/updated_at`). `cmd/catalogdump/main.go` prints `catalog.Build()` as indented JSON to stdout. `scripts/cas-sync-entity-fields.py` reads a `catalog.json` (default `~/.emerge-scratch/catalog.json`); how that file is produced is not scripted in the repo (unverified, presumably `go run ./cmd/catalogdump > catalog.json`). `transport/http/capabilities.go` uses `catalog.Build` through `sync.OnceValue`.\n\n### 2.4 Handler-side flow: `s.can` to row scope to field narrowing\n\n```mermaid\nflowchart TD\n    A[\"ENTRY route r.With(s.can(entity))\"] --> B[\"AUTH Authorize: Allow(entity,nil)\"]\n    B -- \"not allowed\" --> X[\"ERROR 403 not permitted\"]\n    B -- \"allowed\" --> C[\"handler: s.scopeFor(narrow, wide)\"]\n    C --> D[\"Allow(wide): allowed and no constraints sets unrestricted\"]\n    C --> E[\"Allow(narrow): Decision\"]\n    D --> F[\"DB access.Resolve(subject, unrestricted) builds Viewer\"]\n    E --> F\n    F --> G[\"SHARED access.XFor(viewer, decision) ent predicate\"]\n    G --> H[\"DB ent query .Where(predicate)\"]\n    H --> I{\"read or write\"}\n    I -- \"read\" --> J[\"AUTH fields.go:project / projectAll / projectPerRow\"]\n    I -- \"write\" --> K[\"AUTH reach.go:reachX then fields.go:rejectFields\"]\n    K -- \"denied fields\" --> Y[\"ERROR 403 not permitted to write\"]\n    K -- \"row not reachable\" --> Z[\"ERROR 404 not found\"]\n    K --> L[\"DB scoped Update/Delete with the same predicate\"]\n```\n\n| Node | Code |\n|---|---|\n| s.can | `server.go:Server.can` calls `middleware.Authorize` |\n| scopeFor | `transport/http/viewer.go:Server.scopeFor` (error from `Allow(wide)` is swallowed, so unrestricted stays false) |\n| Resolve | `internal/data/access/viewer.go:Resolve` |\n| predicates | `internal/data/access/*.go` (section 2.5) |\n| project | `transport/http/fields.go:project`, `projectAll`, `projectPerRow` (`id/created_at/updated_at` always readable; `edges` always dropped) |\n| rejectFields | `fields.go:rejectUnauthorizedFields`, `rejectFields` (uses `FieldPolicy.Denied`, unknown columns count as denied) |\n| reach | `transport/http/reach.go:reachStudent` etc., `common.go:mustReach` (404) |\n| scoped write | `common.go:wroteScopedRow` (0 rows gives 404), `deleteScoped` |\n\nExample read: `students.go:listStudents` uses `scopeFor(StudentsRead, StudentsReadAll)`, then `student.Query.ForViewer` which calls `access.StudentsFor`, then `studentProjection` (per-row when `Decision.PerRow()` using `access.StudentRowValues`). Example write: `updateStudent` uses `scopeFor(StudentsWrite, StudentsWriteAll)`, `reachStudent`, `studentWriteFields`, `rejectFields`, `client.Student.Update().Where(ID, access.StudentsFor)`. Create: `createStudent` uses `scopeFor(StudentsCreate, StudentsWriteAll)` and `rejectUnauthorizedFields` only (no row to scope).\n\n### 2.5 Row-level scoping: `internal/data/access`\n\n`Viewer` (`viewer.go`) is built per request by `Resolve`: person by `cas_user_id`, guardian, staff to teacher, teaching scope (current-session teacher assignments and class-teacher sections to `SectionIDs`, `SubjectOfferingIDs`), own student ids, enrolled and ward offerings, subject-grade pairs. If no person row exists the viewer is empty, so every role predicate collapses to a no-rows predicate. `Unrestricted` comes from the caller.\n\nCommon shape of every `XFor(v, d)`: `v==nil` gives No*; `v.Unrestricted` gives Any*; otherwise combine a reach-based scope (`switch d.Reach`: tenant gives Any, self/guardian_ward/teacher_assignment give role arms, `!HasReach` gives all-role union, default gives No*) AND the pinned `*ConstrainedBy(d.Constraints)` (section code IN, or grade level code IN, via `sectionsMatching`). Unusable pins (`translatable` false) give No*.\n\n```mermaid\nclassDiagram\n    class Viewer {\n        PersonID GuardianID StaffID TeacherID\n        SectionIDs SubjectOfferingIDs StudentIDs\n        Unrestricted\n    }\n    class Decision {\n        Allowed Reach HasReach\n        Constraints Fields Grants\n    }\n    class predicate_go {\n        StudentsFor\n        EnrollmentsFor\n        SubjectEnrollmentsFor\n        StudentAssignmentsFor\n        TeacherAssignmentsFor\n    }\n    class constraint_go {\n        sectionsMatching\n        StudentsConstrainedBy\n        EnrollmentsConstrainedBy\n        LibraryItemsConstrainedBy\n    }\n    class rowvalues_go {\n        StudentRowValues\n        EnrollmentRowValues\n    }\n    class audience_go {\n        Audience\n        ReadableAudience\n        WritableAudience\n    }\n    class stream_assignment_go {\n        StreamPostsFor\n        AssignmentsFor\n        AssignmentSubmissionsFor\n    }\n    class arms_go {\n        AttendancePeriodsFor\n        CurriculaFor\n        LibraryItemsFor\n        TimetableSlotsFor\n        PapersFor\n        QuestionsFor\n        BlueprintsFor\n    }\n    class recognition_go {\n        Recognition\n        ReadableRecognition\n        PraisesFor\n        StudentAchievementsFor\n    }\n    Viewer <-- predicate_go\n    Decision <-- predicate_go\n    constraint_go <-- predicate_go\n    Viewer <-- arms_go\n    Decision <-- arms_go\n    constraint_go <-- arms_go\n    Viewer <-- audience_go\n    Decision <-- audience_go\n    audience_go <-- stream_assignment_go\n    Viewer <-- recognition_go\n    Decision <-- recognition_go\n    Decision <-- rowvalues_go\n```\n\n| File | Role (verified from function lists and bodies) |\n|---|---|\n| `access/viewer.go` | `Viewer`, `Resolve` (DB: person, guardian, staff, teacher assignments, sections, enrollments, offerings). |\n| `access/predicate.go` | Student, enrollment, subject-enrollment, student-assignment, teacher-assignment predicates (`StudentsFor`, `StudentsForAcademic`, `EnrollmentsFor`, `SubjectEnrollmentsFor`, `StudentAssignmentsFor`, `TeacherAssignmentsFor`). Guardian arms require active link (`StudentsOfGuardianAcademic` also `can_view_academic`). |\n| `access/constraint.go` | Pin translation: `sectionsMatching`, `StudentsConstrainedBy`, `EnrollmentsConstrainedBy`, `TeacherAssignmentsConstrainedBy`, `LibraryItemsConstrainedBy`. |\n| `access/rowvalues.go` | `StudentRowValues`, `EnrollmentRowValues`: current-session section code and grade code per row, for per-row field policy. |\n| `access/audience.go` | `Audience` (All/School/Branches/Grades/Sections/Offerings/Students plus self and ward kin), `ReadableAudience`/`WritableAudience`, `pinnedAudience`, `intersectAudience`. Write audiences never include student/guardian roles. |\n| `access/stream.go`, `assignment.go` | `StreamPostsFor/WritableBy`, `StreamComments*`, `Assignments*`, `AssignmentSubmissions*`, `AssignmentItems*` driven by `*Audience` through target-table arms. |\n| `access/attendance.go` | Attendance period and day predicates with read vs write arms, `attendance*Narrowed`. |\n| `access/curriculum.go` | Curricula, nodes, content placements. |\n| `access/library.go` | `LibraryItemsFor`, `LibraryItemsWritableBy` (non-tenant writers limited to own items), `LibraryItemsPersonal`, `LibraryItemsAnyRole`. |\n| `access/papers.go` | Blueprints, questions, papers, generation runs via `bankReach`; `BankWriteReaches`, `ExamsWritableForPapers`, `SectionsWritableForPapers`, `GradeLevelsWritableForPapers`. |\n| `access/timetable.go` | Slots, timetables, deviations, period schemes, periods, bell schedules, calendar days, rooms (`*For`, `*WritableBy`). |\n| `access/recognition.go` | `Recognition` (like `Audience` for praises), `PraisesFor`, `StudentAchievementsFor`, `StudentsForAwarding`. |\n\nCallers: `internal/data/{student,person,staff,teacher,guardian,enrollment}/query.go` expose `ForViewer`; other handlers in `transport/http` call `access.*For/WritableBy` directly inside ent `Where` (see greps for `access.` in `absences.go`, `assignments.go`, `attendance.go`, `blueprints.go`, `curriculum.go`, `library.go`, `papers.go`, `questions.go`, `recognition.go`, `stream.go`, `timetable.go`, etc.).\n\n### 2.6 transport/http authorization files\n\n| File | What it does | data/access use |\n|---|---|---|\n| `viewer.go` | `scopeFor(ctx, narrow, wide)` returns Viewer plus Decision; `viewerFor(ctx, wide)` has no callers anywhere (dead code, verified by grep). | `access.Resolve` |\n| `scopes.go` | `GET /api/v1/library/scopes` (`can(LibraryRead)`): `scopeFor(LibraryRead, LibraryReadAll)` then `retrieval.ScopesFor` then `Scopes.Labels`. Unresolved scopes return 409 with code `scope_unresolved` or `scope_pinned_unexpressible`. | `Resolve` (via scopeFor); `retrieval/labels.go` |\n| `capabilities.go` | `GET /api/v1/capabilities` (authenticate and RequireTenant only, no `can`): calls `guard.Allow` for every catalog entity, returns held keys with reach, breadth (`school_wide`/`narrowed`/`not_applicable` from the matching `_all` key), `row_pinned`, permitted fields. Guard error `ErrUpstream` returns 503; nil guard or other errors return 500. | none |\n| `fields.go` | `project`, `projectAll`, `projectPerRow`, `rejectFields`, `rejectUnauthorizedFields`, trace helpers. | uses `Decision.FieldsForRow` |\n| `reach.go` | `reachStudent/Person/Staff/Teacher/Guardian/Enrollment/SubjectEnrollment/Document/Note/StudentAssignment/TeacherAssignment` (existence checks under the viewer's predicate so out-of-scope rows return 404), `documentsVisibleTo`, `attributedTo` (records person id from caller, rejects client-supplied attribution with 422), `studentProjection`, `studentWriteFields`, `enrollmentProjection`. | `student.ForViewer`, `access.StudentsForAcademic`, `StudentAssignmentsFor`, `TeacherAssignmentsFor`, `StudentRowValues`, `EnrollmentRowValues` |\n| `roleassignments.go` | No endpoints and no authz: payload struct, date parsing, `studentRoleAllowed` (rejects teacher-only role types for student assignments). | none |\n| `timetableoverride.go:mayOverrideClash` | Second guard call for `TimetableOverride` inside slot writes (403 if not held). | none |\n\n## 3. Provisioning\n\n```mermaid\nsequenceDiagram\n    participant C as \"ENTRY client\"\n    participant H as \"persons.go:provisionPerson\"\n    participant PV as \"SHARED service.Provisioner\"\n    participant AC as \"EXTERNAL cas.AdminClient (caller token)\"\n    participant DB as \"DB tenant persons table\"\n    C->>H: \"POST /api/v1/persons/provision (can PersonsWrite, tenant required)\"\n    H->>H: \"Available() false gives 501\"\n    H->>H: \"rejectUnauthorizedFields vs entperson.Columns\"\n    H->>PV: \"Provision(client, Request)\"\n    PV->>AC: \"FindGroup(primary group key) if group_keys given\"\n    PV->>AC: \"CreateUser POST /v1/admin/users\"\n    AC-->>PV: \"created, or 409 email/username taken\"\n    PV->>AC: \"FindUser(email or username) when 409: link existing\"\n    PV->>AC: \"AddUserToGroup for remaining groups (and primary if linked)\"\n    PV->>DB: \"upsertPerson by cas_user_id\"\n    PV-->>H: \"Result\"\n    H-->>C: \"201 or 200 plus password only if created in CAS and generated\"\n```\n\n| Node | Code |\n|---|---|\n| provisionPerson / linkPerson | `transport/http/persons.go:provisionPerson`, `linkPerson`, `writeProvisioningErr` |\n| Provisioner | `internal/service/provisioning.go:Provisioner.Provision`, `Link`, `upsertPerson`, `newPassword` (20 random chars, prefix `Eg#`) |\n| IdentityProvider | `provisioning.go:IdentityProvider` (INTERFACE, implemented by `cas.AdminClient`) |\n| wiring | `cmd/api/main.go:newProvisioner` (nil provider when auth disabled or admin client fails) |\n\nBehaviour: `POST /persons/link` (`Provisioner.Link`) does `FindUser(identifier)`, then upserts the Person with that CAS id (no CAS writes). `Provision` with a taken email or username links to the found identity (`LinkedToExist`). Lookup failure maps to `ErrUnrecoverable` (409). Status: 201 when created or linked, 200 otherwise. CAS 401/403 on the admin call returns 401/403 to the client (`writeProvisioningErr`); unconfigured returns 501; unknown error returns 502. All admin calls run as the caller (their token), so CAS must permit the caller to create users.\n\n### School creation and CAS root group\n\n```mermaid\nflowchart TD\n    A[\"ENTRY POST /api/v1/schools, can SchoolsWrite\"] --> B[\"schools.go:createSchool validate, slug check\"]\n    B --> C[\"DB control plane School.Create\"]\n    C --> D[\"schools.go:ensureTenant\"]\n    D --> E{\"cas_tenant_id and tenants.Available\"}\n    E -- \"no\" --> F[\"response cas_tenant: skipped with detail\"]\n    E -- \"yes\" --> G[\"service.TenantProvisioner.Ensure\"]\n    G --> H[\"EXTERNAL AdminClient.LookupGroup\"]\n    H -- \"not found\" --> I[\"EXTERNAL CreateGroup then TagGroupTenant, outcome created\"]\n    H -- \"found untagged\" --> J[\"EXTERNAL TagGroupTenant, outcome tagged\"]\n    H -- \"found same tenant\" --> K[\"outcome existing\"]\n    H -- \"tagged differently\" --> L[\"ERROR ErrTenantTaken, status failed\"]\n```\n\n| Node | Code |\n|---|---|\n| createSchool / ensureTenant | `transport/http/schools.go:createSchool`, `ensureTenant` (CAS failure does not fail school creation; it reports `status: failed` with manual `finish` curl hints) |\n| Ensure | `internal/service/tenant.go:TenantProvisioner.Ensure`, tenant id regex `^[a-z0-9][a-z0-9_-]{0,62}$` |\n| wiring | `cmd/api/main.go:newTenantProvisioner` |\n\n## 4. `proto/cas/v1` and `scripts/cas-*`\n\nProto files (vendored from CAS): `authorization.proto` (`PolicyService`: `GetPolicies`, `ResolveIdentity`), `entitlement.proto` (`EntitlementService.EvaluateFeatures`), `group.proto` (`GroupService`: `GetGroup`, `EnsureGroup`, `SetMembership`, `ListMembers`). Nothing in the Go code imports them: there is no `casv1` package and no `scripts/proto.sh` (both referenced by `proto/README.md` but absent). The running code uses CAS over HTTP (`/v1/policies`, `/v1/admin/*`) instead. Contract-only today.\n\nScripts (operator runs; all are dry-run unless `--apply` where I saw that flag; each needs a CAS token from `CAS_TOKEN` or `~/.emerge-scratch/tok`):\n\n| Script | What it does | When an operator runs it |\n|---|---|---|\n| `cas-token.sh` | Logs in as a CAS superadmin (including OTP challenge with dev_otp) and prints a 15-minute token. | Before any other script. |\n| `cas-tunnel.sh` | SSH tunnel to loopback-only CAS on the demo box. | Local dev against deployed CAS. |\n| `cas-register-entities.py` | Parses `core.x.y` keys from `docs/CAS-KEYS-TO-REGISTER.md`; POSTs missing folder and action entities to `/v1/admin/entities`. | After adding a key to `authorization`. |\n| `cas-sync-entity-fields.py` | PUTs `/v1/admin/entities/{id}/fields` from `catalog.json` (the `catalogdump` output). | After catalog or ent column changes. |\n| `cas-register-features.py` | Reads frontend `features.ts` keys; creates CAS features, feature group `emerge-all`. | When frontend feature keys change. |\n| `cas-roles.py`, `cas-admin-roles.py`, `cas-core-roles.py` | Create CAS rules, policies (reach, field includes) and, for core-roles, rule groups (bundles) under sections `Emerge Core/*`. | Initial role setup or role changes. |\n| `cas-timetable-rule.py` | Creates `core-timetable-manage` rule over timetable, attendance, rooms, calendar entities and adds to bundles. | When timetable keys are added. |\n| `cas-principal-grants.py` | Creates rule `core-principal-school-wide` (all `core.` entities at reach `tenant`) and grants to the principal user in a scope group. | Provisioning a principal. |\n| `cas-school-tenant.py` | Creates or finds the tenant root group, PUT tenant tag, adds principal user, grants bundle. | Onboarding a school when core's `ensureTenant` did not run or failed. |\n| `cas-school-admin.py` | Creates a school admin user, adds to root group, grants tenant-bound admin permission. | Demo or school onboarding. |\n| `cas-role-groups.py` | Creates `emerge-leadership/teachers/students/parents` groups under the tenant root and assigns demo users. | Demo seeding. |\n| `cas-structure-groups.py` | Reads branch/grade/section from tenant DB over ssh+psql, creates nested CAS groups. | After structure changes (demo tenant). |\n| `cas-grants.py` | Assigns bundles/rules to demo users by username pattern (teacherN, pupilN, guardianN, superadmin) for tenant `cms` by default. | Demo seeding. |\n\nDefault `CAS_BASE_URL` in these scripts is `https://auth.tryemerge.in` (scripts differ in tenant default: `cms`, `dps-ngp`).\n\n## 5. Boundary map\n\n```mermaid\nflowchart TD\n    REQ[\"ENTRY inbound HTTP\"] --> PUB{\"public?\"}\n    PUB -- \"GET /health, GET /api/v1/, GET /api/v1/health\" --> OPEN[\"public, no auth\"]\n    PUB -- \"POST /api/v1/auth/* (7 relays)\" --> RELAY[\"public relay, CAS authenticates\"]\n    PUB -- \"everything else under /api/v1\" --> AUTHN[\"AUTH middleware.Authenticate: JWT RS256, aud, exp, sub UUID\"]\n    AUTHN -- \"no or bad token\" --> E401[\"ERROR 401\"]\n    AUTHN -- \"JWKS unavailable, no cached key\" --> E503[\"ERROR 503\"]\n    AUTHN --> ME[\"GET /auth/me: OptionalTenant then me\"]\n    AUTHN --> CTRL[\"control plane /schools: can(Schools*)\"]\n    AUTHN --> RT[\"AUTH middleware.RequireTenant: X-School-Id, active school, token tenant match\"]\n    RT -- \"missing header 400, unknown 404, inactive 403, mismatch 403, no profile 503\" --> E4[\"ERROR\"]\n    RT --> CAP[\"GET /capabilities: no can, per-entity Allow\"]\n    RT --> CAN[\"AUTH s.can(entity) via Guard.Allow\"]\n    CAN -- \"denied\" --> E403[\"ERROR 403\"]\n    CAN --> ROW[\"AUTH row scope: scopeFor then access predicates, reach checks 404\"]\n    ROW --> FLD[\"AUTH field narrowing: project, rejectFields 403\"]\n```\n\n| Boundary | Code |\n|---|---|\n| Public routes | `server.go:Router`: `/health` (`health.go:liveness`), `/api/v1/` (`index`), `/api/v1/health` (`readiness`), `/api/v1/auth/login`, `/login/verify`, `/otp/start`, `/refresh`, `/logout`, `/password/change`, `/password/reset` (relays). `/auth/me` is not public (authenticate plus OptionalTenant). 404 and 405 handlers are also unauthenticated. Note: logout and password routes are public at this layer; the relayed token goes to CAS. |\n| authenticate | `server.go:Server.authenticate` applied to a `r.Group` containing `mountControlPlane` and `mountTenantPlane`. |\n| Control plane | `server.go:mountControlPlane`, `can` only (no tenant, no row scope; tenant context empty, so policy fetch is made without a tenant). |\n| RequireTenant | `server.go:mountTenantPlane` group `r.Use(mw.RequireTenant(...))`. |\n| can | `server.go:Server.can` on every tenant-plane route; grep of `r.Get/Post/...` outside `server.go` found no route lacking `s.can` except `/capabilities`. |\n| row scope | `viewer.go:scopeFor`, `data/access`. |\n| field narrowing | `fields.go`. |\n\nSecondary guard use: `timetableoverride.go:mayOverrideClash` (`TimetableOverride`), `auth.go:ownFieldPolicy` (`PersonsRead`), `capabilities.go:heldEntities`.\n\n## 6. Error and fail-closed behaviours\n\n| Status | Where / condition (verified) |\n|---|---|\n| 401 | `Authenticate`: no Authorization header; any verify failure other than `ErrUpstream` (bad signature, alg not RS256, expired or no exp, wrong issuer or audience when configured, unknown kid after refresh, missing kid, `sub` not UUID). `Authorize`/`me`/`getCapabilities`: no Subject in context. Provisioning: CAS rejected the caller's token (`ErrCallerRejected`). Relay: CAS's own 401 passes through verbatim. |\n| 403 | `Authorize`: `!decision.Allowed` (\"not permitted: <entity>\"). `RequireTenant`: token `tenant_id` differs from school `cas_tenant_id` (only when both non-empty); `ErrSchoolInactive`. `rejectFields`: write touches a denied or unregistered column. `routeDecision`: no decision in context. `studentWriteFields`: cannot find covering grant. `mayOverrideClash`. Provisioning: CAS 403. |\n| 400 / 404 | Missing `X-School-Id` 400; unknown school 404; out-of-scope row on read, write or delete is reported as 404 (`mustReach`, `wroteScopedRow`). |\n| 503 | `Authenticate` with `ErrUpstream` (JWKS fetch failed and kid not cached). `Authorize` when guard returns `ErrUpstream` (token endpoint or `/v1/policies` failed, or `/v1/policies` returned non-200 including CAS refusing the user token) and no usable stale entry. `getCapabilities` same. `RequireTenant` `ErrNoProfile`. |\n| 500 | `Authorize` with non-upstream guard error (e.g. bad policy JSON, no client secret decode). Handlers: `scopeFor` errors go through `writeTenancyErr`, which maps everything except `ErrNoTenant` to 500, so an `ErrUpstream` there (cache expired between `can` and `scopeFor`) is 500 not 503. |\n| 501 / 502 | Relay disabled 501; relay transport failure 502; provisioning unavailable 501; unclassified provisioning error 502. |\n| 409 | `/library/scopes` unresolved scope; provisioning conflicts and `ErrUnrecoverable`. |\n\nFail-closed behaviours:\n- No client credentials: `DenyAll` (every `can` returns 403 \"no policy source configured\").\n- CAS unreachable for policies: stale cached set served up to 2x `CAS_POLICY_TTL` (120 s default) after its fetch time, then 503. Not an automatic deny of cached users inside that window, so revocations can take up to about 3x TTL when CAS is down, 1x TTL when up (cache evicted early on `PolicyEpoch` rise or `Forget`).\n- JWKS unreachable: cached keys are trusted with no maximum age; only an uncached kid fails (503). This is fail-open for key retirement while CAS is down.\n- Entity absent from policy set: deny. Alternatives with untranslatable row conditions: skipped. Attribute conditions: skipped (attrs always nil).\n- `Allow(wide)` failure inside `scopeFor`/`viewerFor`: ignored, viewer stays restricted.\n- Missing person row: empty viewer, No* predicates.\n- Unusable pinned constraints or unknown reach: No* predicates.\n\nFail-open (by design, dev only): `AUTH_DISABLED` or empty `CAS_BASE_URL` gives `AllowAll` plus `DevSubject`; production refuses `AUTH_DISABLED`.\n\n## Verified vs unverified\n\nVerified by reading code: everything in sections 0 to 6 except the items below. This includes verifier claim checks, JWKS cache semantics, proxy route table and header whitelists, policy cache/stale/epoch logic, `Allows` algorithm, constraint collapse rules, field merging, `scopeFor`, the list of public routes, the absence of `can` on `/capabilities`, provisioning flows, school-to-CAS tenant provisioning, `viewerFor` having no callers, the `me` relay entry being unused, and the proto stubs and `scripts/proto.sh` being absent.\n\nUnverified or not examined:\n- Whether `golang-jwt` v5 checks `nbf`/`iat` in addition to `exp` for these tokens (default behaviour not read).\n- Whether the verifier rejects non-access tokens (no `typ`/token-type check found in `verifier.go`).\n- How `catalog.json` is generated (no script found); assumed from `cmd/catalogdump` output.\n- Full per-line behaviour of every predicate arm in `attendance.go`, `curriculum.go`, `papers.go`, `timetable.go`, `recognition.go` (read signatures and the representative arms in `attendance.go`, `audience.go`, `library.go`, `predicate.go`, `constraint.go`; other files summarized from function lists).\n- `Registry.Get/GetByCode/GetByCASTenant` internals (in `internal/infrastructure/postgres`, outside this scope).\n- Behaviour of CAS itself (the policy response shape beyond what `ParsePolicySet` parses; stale `D:\\CAS\\CLAUDE.md` intentionally not used).\n- Per-route entity assignments for every file mounted by `mountTimetable`, `mountAttendance`, `mountStream`, etc. (only `server.go`-registered routes and a grep for routes lacking `s.can` were checked).\n"},{"id":"C","nav":"C. Async jobs and integrations","title":"C. Background jobs, queues, schedules, external integrations","md":"# C. Background jobs, queues, schedules, external integrations\n\nScope: everything in D:\\emerge-core that runs off the request path or talks to another system. All claims below were read in code. Paths are relative to D:\\emerge-core.\n\nLegend for every diagram: node text prefixes are ENTRY, INTERFACE, SHARED, DB, EXTERNAL, ASYNC (goroutine or process boundary), ERROR (failure path), AUTH (auth boundary). classDef colours repeat the same meaning.\n\n**No event bus, message broker, pub/sub or external queue exists.** A repo-wide grep of non-test Go code for `go func`, `go x()`, `chan `, `NewTicker`, `time.After`, `signal.Notify`, `WithTimeout` found only: in-process buffered channels (indexing dispatcher, timetablegen dispatcher, mail per-school worker channels), three tickers (indexing sweeper, mail sender, indexing poll loop), and one signal handler (cmd/api/main.go). \"Queues\" are either Go channels (lost on crash) or rows in Postgres (durable).\n\n## 1. Retrieval-engine indexing (internal/service/indexing)\n\n### 1.1 Trigger and boundaries\n\n- Trigger A (publish): `internal/transport/http/library.go:createLibraryItem` (line ~921) and `updateLibraryItem` (line ~1110) both call `Server.indexOnPublish`. It acts only when `Config.RetrievalIndexing()` (RETRIEVAL_INDEX_ENABLED and base URL), `libraryIndexer != nil`, the item has just become `published` (`publishedNow`) and has an `asset_id`, and the school has a `CAS tenant slug`.\n- It opens the school's S3 client (`openObjectStore` -> `registry.S3Credentials` -> `blob.New`), calls `indexing.MarkPending` (sets content_items.index_status=pending), then `Dispatcher.Submit(client, Request{Tenant: CASTenantID, SchoolID, ItemID, Store})`. If Submit fails (queue full or closed) it calls `indexing.Abandon` which sets index_status=failed.\n- Trigger B (periodic): `Sweeper.Run` goroutine started in `cmd/api/main.go` (only inside the `if dispatcher != nil` block) re-drives stranded rows through the same `Dispatcher.Submit`.\n- Goroutine boundary: `NewDispatcher` starts `RETRIEVAL_INDEX_WORKERS` (default 2) goroutines reading a `chan job` of depth 64 (`defaultQueueDepth`). Submit is non-blocking: full queue returns `ErrQueueFull`. The job carries the tenant-scoped `*ent.Client` pointer, so no request context or auth crosses; the worker uses the dispatcher's own `context.WithCancel(Background)`.\n- Retrieval searches (`GET /library/search`) are synchronous and not queued; see section 6.\n\n### 1.2 State machine (content_items.index_status, tenant DB)\n\nEnum values (internal/ent/schema/contentitem.go:58): none, pending, indexed, failed, parked, held. Attempt counter column `index_attempts`; other columns `indexed_sha256`, `indexed_at`, `engine_document_id`, `ingest_mode` (now|defer). There is no separate \"attempt rows\" table: attempts are the `index_attempts` integer on content_items.\n\nEngine-side job status (client.go constants): queued, running, indexed, duplicate, pending_confirmation, held, failed. `Terminal()` = all but queued/running. Mapping in `indexer.go:outcomeOf`: indexed or duplicate -> indexed; pending_confirmation -> parked; held -> held; anything else -> failed. Indexed with no document id, or with `chunks == 0`, is downgraded to failed with an explanatory reason.\n\n```mermaid\nstateDiagram-v2\n    [*] --> none\n    none --> pending : indexOnPublish MarkPending / sweeper claim\n    failed --> pending : sweeper claim after RetryBase\n    pending --> pending : sweeper claim after PendingAge, attempts+1\n    pending --> indexed : engine indexed or duplicate, chunks > 0\n    pending --> failed : any error, Submit refused, empty index\n    pending --> parked : engine pending_confirmation\n    pending --> held : engine held, ingest_mode defer\n    indexed --> [*]\n    parked --> [*]\n    held --> [*]\n```\n\nparked and held are terminal and never swept (the sweeper query selects only failed, pending and none). failed is retried indefinitely with capped exponential backoff: there is no maximum attempt count in `sweeper.go` (verified: `due()` has no attempts predicate).\n\n### 1.3 Flow diagram\n\n```mermaid\nflowchart TD\n    classDef entry fill:#d9eaff,stroke:#2b6cb0\n    classDef iface fill:#eee,stroke:#666\n    classDef shared fill:#e8e8ff,stroke:#55a\n    classDef db fill:#fff2cc,stroke:#b8860b\n    classDef ext fill:#ffe0e0,stroke:#c00\n    classDef async fill:#e0ffe0,stroke:#2a2,stroke-width:3px\n    classDef err fill:#ffd6d6,stroke:#900,stroke-dasharray:4\n    classDef auth fill:#f3e0ff,stroke:#80a\n\n    A[\"ENTRY: POST/PATCH /library items (library.go)\"]:::entry\n    AU[\"AUTH: authenticate + RequireTenant + can(Library*)\"]:::auth\n    B[\"SHARED: indexOnPublish (library.go)\"]:::shared\n    C[\"DB: tenant content_items index_status=pending\"]:::db\n    D[\"ASYNC: Dispatcher.Submit chan depth 64 (dispatcher.go)\"]:::async\n    E[\"ERROR: ErrQueueFull -> Abandon index_status=failed\"]:::err\n    F[\"ASYNC: worker goroutine x2 Dispatcher.run\"]:::async\n    G[\"SHARED: Indexer.attempt / push (indexer.go)\"]:::shared\n    H[\"DB: read content_item + asset + confirmed content_placements\"]:::db\n    I[\"EXTERNAL: S3 presigned GET (blob.PresignGet)\"]:::ext\n    J[\"EXTERNAL: retrieval engine POST /ingest/file\"]:::ext\n    K[\"EXTERNAL: retrieval engine GET /ingest/{job} polled every 2s up to 15m\"]:::ext\n    L[\"DB: record() indexed/failed/parked/held + engine_document_id\"]:::db\n    M[\"ERROR: markFailed index_status=failed\"]:::err\n    S[\"ASYNC: Sweeper.Run ticker 5m (sweeper.go)\"]:::async\n    T[\"SHARED: ControlTenants.Sweepable (tenants.go)\"]:::shared\n    U[\"DB: control schools + school_profiles; tenant content_items due()\"]:::db\n\n    A --> AU --> B --> C --> D\n    D -->|full| E\n    D --> F --> G --> H\n    G --> I\n    G --> J --> K --> L\n    G -->|error| M\n    K -->|timeout or error| M\n    S --> T --> U --> D\n```\n\n| Node | Code reference |\n|---|---|\n| A | internal/transport/http/library.go:createLibraryItem, :updateLibraryItem |\n| AU | internal/transport/http/server.go (Group `authenticate()`, `mountTenantPlane` `RequireTenant`, `s.can(...)` on /library routes) |\n| B | internal/transport/http/library.go:Server.indexOnPublish |\n| C | internal/service/indexing/indexer.go:MarkPending |\n| D, E | internal/service/indexing/dispatcher.go:Dispatcher.Submit, :Abandon |\n| F | dispatcher.go:work, :run |\n| G, H | indexer.go:Indexer.Index, attempt, confirmedNodesForItem, push |\n| I | indexer.go:open -> blob.Client.PresignGet (internal/infrastructure/blob/client.go) then plain GET with `fetch` http.Client (10m) |\n| J | client.go:Client.IngestFile |\n| K | indexer.go:await, client.go:Client.Job |\n| L, M | indexer.go:record, markFailed |\n| S | sweeper.go:Sweeper.Run, Tick, sweep, due, claim |\n| T, U | tenants.go:ControlTenants.Sweepable |\n\n### 1.4 Retry, failure, backoff, shutdown\n\n- Worker-level: no retry inside the worker. Any `attempt` error (item missing, labels error, no asset, asset not `ready`, defer-mode checks, store unreadable, engine error, poll timeout) -> `markFailed` (failed, clears engine_document_id, indexed_sha256, indexed_at). Retry happens only through the sweeper.\n- Poll: `Options` defaults PollInterval 2s, PollTimeout 15m, FetchTimeout 10m (config RETRIEVAL_INDEX_POLL_INTERVAL, RETRIEVAL_INDEX_POLL_TIMEOUT). Engine HTTP client timeout RETRIEVAL_ENGINE_TIMEOUT default 60s. Bytes are streamed from the presigned URL straight into the ingest POST body (no buffering).\n- Sweeper selection (`due`): status=published AND asset_id not null AND one of (failed and updated_at <= now-RetryBase 5m), (pending and updated_at <= now-PendingAge 30m, forced >= 2x PollTimeout), (none and updated_at <= now-RetryBase). Ordered by updated_at, limited per tenant. Optimistic claim (`claim`) is an UPDATE guarded by id, status, previous index_status and exact updated_at; `n==1` wins, so two API instances cannot both claim a row. In-memory `attempts` map plus `index_attempts` give jittered backoff: window = RetryBase doubled per attempt, cap RetryCap 6h, wait = half window + random(half window).\n- Budgets: Interval 5m (min 10s), Batch 32 per tick, PerTenant 8, heartbeat log hourly. On ErrQueueFull/ErrDispatcherClosed the tick stops early. A claimed row whose Submit fails is `Abandon`ed (failed).\n- Tenant iteration: `ControlTenants.Sweepable` lists control.schools with status active ordered by code, and silently skips (debug log) any school with no `cas_tenant_id`, no postgres profile, no S3 profile; otherwise returns the pooled tenant ent client and a cached per-school blob client.\n- Shutdown (cmd/api/main.go): SIGINT/SIGTERM cancels the root ctx, which stops the sweeper (and mail sender). HTTP `srv.Shutdown` runs, then deferred `dispatcher.Close()` closes the queue and `wg.Wait()`s all workers to drain every queued job, only then cancels the dispatcher ctx. There is no timeout on that wait, so a drain can outlast the container stop grace. Potential race (code-derived, not run): the sweeper goroutine is not awaited; a tick still running while `Close()` has closed `queue` would hit a send on a closed channel in `Submit`. Unverified at runtime.\n- Rows left `pending` by a crash are recovered by the sweeper after PendingAge. Deleting or unpublishing an item never calls the engine: `Client` has only IngestFile, Job, Search (verified), so removal from the index is not implemented; search compensates with `recheckPassages` against the tenant DB.\n\n### 1.5 External calls actually made to the retrieval engine\n\nAll via `indexing.Client` (client.go), base URL RETRIEVAL_ENGINE_BASE_URL.\n\n| Method + path | Caller | Notes |\n|---|---|---|\n| POST `/ingest/file?filename&scope=school&title&subject&grade&source_type&restricted_to=<label>...&curriculum_node_ids=<json array>&mode=now|defer` | Indexer.push | body = raw file bytes, Content-Type from asset.mime_type; `source_type` book/notes/pyq from kind; response is a Job JSON |\n| GET `/ingest/{jobID}` | Indexer.await | poll |\n| POST `/retrieve` JSON `{mode:\"SEARCH\", query, document_ids?, page_range?, top_k}` | transport/http/search.go:searchLibrary via `Client.Search` | no scope labels in the body; scope is enforced by document_ids chosen from tenant DB plus 403 handling |\n\nAuth/tenant headers on every call (`Client.stamp`): `X-School-Id: <CAS tenant slug>` and, if configured, `X-Admin-Token: <RETRIEVAL_ENGINE_ADMIN_TOKEN>`. Status mapping: ingest 409 -> ErrGateUnenforceable, 415 -> ErrUnsupportedMedia, >=500 or transport error -> ErrEngineUnreachable, other non-2xx -> ErrEngineRejected; search 403 -> ErrEngineRefusedScope (HTTP 502, never retried without scope), >=500 -> unreachable (HTTP 503), other -> 502. Response body read capped at 1 MiB.\n\n### 1.6 internal/retrieval/labels.go\n\nPure functions, no I/O. `LabelsFor(Item)` returns two labels for a published item: `unrestricted_<schoolUUID>` and the audience anchor label (`school_<id>`, `grade_<id>`, `section_<id>`, `offering_<id>`, `person_<ownerId>`); errors if not published or anchor missing; labels may not contain \".\", start with \"_\", or contain whitespace. `indexing.LabelsForItem` feeds these into `restricted_to` at ingest. `ScopesFor(viewer, decision, schoolID)` computes the viewer's reachable labels (used by search only for `Scopes.Unrestricted()` to choose whole-tenant search; labels themselves are not sent in the `/retrieve` body: verified by `searchBody` fields).\n\nAlso touched by this flow: transport/http/ingestmode.go (validates ingest_mode now|defer: defer only for PDFs and not with confirmed curriculum placements; infers default mode defer for PDFs, now otherwise), which controls the `mode` query parameter.\n\n## 2. Timetable generation (internal/service/timetablegen + tools/timetable-solver)\n\n### 2.1 Trigger and boundaries\n\n- ENTRY: `POST /api/v1/timetables/{id}/generate` (transport/http/timetable.go:mountTimetable, guarded by `s.can(authorization.TimetableGenerate)`) -> `Server.generateTimetable` (timetablegenerate.go). Poll: `GET /api/v1/timetables/{id}/generate/{job}` -> `getTimetableGeneration` (TimetableRead).\n- Handler steps: 503 unless `Config.TimetableGenerating()` (TIMETABLE_SOLVER_ENABLED + base URL + token) and dispatcher set; tenant client; decode and validate payload; `scopeFor(TimetableWrite, TimetableWriteAll)`; load target restricted by `access.TimetablesWritableBy`; target must be `draft`; `max_seconds` 1..120 (default TIMETABLE_SOLVER_MAX_SECONDS 60); `generateHasRoom` (no overlapping version on the same scheme unless supersedes_id); inserts a `timetable_generation_jobs` row (status queued); `Dispatcher.Submit(client, job.ID)`; replies 202 + Location. A partial unique index on `timetable_id WHERE status IN (queued, running)` makes a second concurrent job a constraint error, returned as 409. Queue full -> `abandonGeneration` (row set failed/internal) and 503.\n- ASYNC boundary: `timetablegen.Dispatcher` (dispatcher.go): `TIMETABLE_SOLVER_WORKERS` (default 1) goroutines read a `chan work` of depth `TIMETABLE_SOLVER_QUEUE` (default 16). Submit is non-blocking (`ErrQueueFull`). The worker calls `Runner.Execute(d.ctx, client, jobID)`; only the job id and the tenant ent client cross, no request context or auth.\n- EXTERNAL: the Python solver over HTTP (2.4).\n\n### 2.2 Job state machine (timetable_generation_jobs.status)\n\nValues: queued, running, succeeded, infeasible, failed (internal/ent/schema/timetablegeneration.go). failure_reason (only when failed): invalid, unreachable, refused, timeout, clash, internal. DB check constraints require finished_at for terminal states and failure_reason iff failed.\n\n```mermaid\nstateDiagram-v2\n    [*] --> queued : handler creates row\n    queued --> failed : queue full, abandonGeneration (internal)\n    queued --> running : Runner.Execute guard status is queued\n    running --> succeeded : slots written into the draft\n    running --> infeasible : preflight or solver proved no week\n    running --> failed : invalid, unreachable, refused, timeout, clash, internal\n    succeeded --> [*]\n    infeasible --> [*]\n    failed --> [*]\n```\n\n`runner.go:failureOf`: ErrNotDraft or ErrAlreadyFilled -> invalid; ErrSolverUnreachable -> unreachable; ErrSolverRejected or ErrSolverUnreadable -> refused; ErrWeekClashes -> clash; anything else internal. Solver neither solved nor proved infeasible (UNKNOWN) -> failed/timeout.\n\n### 2.3 Flow diagram\n\n```mermaid\nflowchart TD\n    classDef entry fill:#d9eaff,stroke:#2b6cb0\n    classDef shared fill:#e8e8ff,stroke:#55a\n    classDef db fill:#fff2cc,stroke:#b8860b\n    classDef ext fill:#ffe0e0,stroke:#c00\n    classDef async fill:#e0ffe0,stroke:#2a2,stroke-width:3px\n    classDef err fill:#ffd6d6,stroke:#900,stroke-dasharray:4\n    classDef auth fill:#f3e0ff,stroke:#80a\n\n    A[\"ENTRY: POST /timetables/{id}/generate\"]:::entry\n    AU[\"AUTH: authenticate, RequireTenant, can TimetableGenerate, scopeFor TimetableWrite\"]:::auth\n    B[\"DB: insert timetable_generation_jobs queued\"]:::db\n    C[\"ASYNC: timetablegen Dispatcher.Submit chan depth 16\"]:::async\n    E[\"ERROR: queue full, job failed, HTTP 503\"]:::err\n    F[\"ASYNC: worker goroutine Runner.Execute\"]:::async\n    G[\"DB: job queued to running\"]:::db\n    H[\"SHARED: BuildExport reads tenant tables\"]:::shared\n    I[\"EXTERNAL: solver POST /v1/feasibility\"]:::ext\n    J[\"EXTERNAL: solver POST /v1/solve, client timeout 5m\"]:::ext\n    K[\"SHARED: timetable clash checker Check\"]:::shared\n    L[\"DB: tx delete replaced slots, bulk insert timetable_slots\"]:::db\n    M[\"DB: settle job row terminal status\"]:::db\n    N[\"ERROR: clash, unreachable, refused, timeout\"]:::err\n    P[\"ENTRY: GET /timetables/{id}/generate/{job} poll\"]:::entry\n\n    A --> AU --> B --> C\n    C -->|full| E\n    C --> F --> G --> H --> I\n    I -->|infeasible| M\n    I --> J --> K --> L --> M\n    J -->|error| N --> M\n    K -->|blocking clash| N\n    P --> M\n```\n\n| Node | Code reference |\n|---|---|\n| A, AU | transport/http/timetable.go:mountTimetable; timetablegenerate.go:generateTimetable |\n| B | timetablegenerate.go (`client.TimetableGenerationJob.Create()`) |\n| C, E | timetablegen/dispatcher.go:Submit; timetablegenerate.go:abandonGeneration |\n| F, G | dispatcher.go:work, run; runner.go:Runner.Execute |\n| H | export.go:BuildExport (reads PeriodScheme, Branch, BellSchedule and periods, CalendarDay and schedules, Period, Room, Section, Teacher, Staff, SubjectOffering, TeacherAssignment, StudentEnrollment, StudentSubjectEnrollment, Timetable, TimetableSlot); dailycontact.go:resolveDailyContact (Section, TeacherAssignment) |\n| I, J | client.go:Client.Feasibility, Client.Solve; runner.go:Runner.run |\n| K, L | runner.go:applyWeek using internal/service/timetable Check(AllRules) and `begin` transaction |\n| M | runner.go:settle |\n| P | timetablegenerate.go:getTimetableGeneration |\n\nRunner detail: refuses a non-draft target (ErrNotDraft); refuses a draft already holding lessons unless `replace_existing` (ErrAlreadyFilled); `buildRequest` sets request_id=job id, max_seconds, demand, pins, unavailable, room types, heavy subjects, minutes_basis, weights, daily_contact, and a `hint` of the current published slots when options.hint. A failed Feasibility call is ignored (falls through to Solve); only `err==nil && !Feasible` short-circuits as infeasible. Written slots go into the draft only; publishing is a separate human action. The clash check covers the whole branch with replaced and superseded slots excluded.\n\n### 2.4 The Python service\n\nFiles: tools/timetable-solver/server.py, run.py (CLI: solve an exported school.json and audit it), timetable_solver/{wire,solver,preflight,verify,school,dto,render}.py, export.sql and export.sh (manual export of one school as JSON).\n\n- Process: separate container. deploy/Dockerfile.timetable-solver (python:3.12-slim, ortools only, user 10001, entrypoint `python server.py`). deploy/docker-compose.timetable-solver.yml: container timetable-solver, external network emerge-db_default, port 127.0.0.1:8099 only, cpu limit default 4, memory 2g, healthcheck GET /healthz, restart unless-stopped, requires TIMETABLE_SOLVER_TOKEN. Not part of the main deploy procedure (deploy/README.md says it is optional).\n- Endpoints (stdlib ThreadingHTTPServer): `POST /v1/feasibility` (always 200, preflight arithmetic, no solver); `POST /v1/solve` (200 a week, 422 no week, 400 malformed, 401 bad token, 413 body over 8 MiB, 503 with Retry-After 30 when all TIMETABLE_SOLVER_CONCURRENCY (default 2) slots are busy, never queued); `GET /healthz` (no auth). Auth is `Authorization: Bearer` compared with hmac.compare_digest; the process refuses to start without a token.\n- Solver (one paragraph): Google OR-tools CP-SAT. Decision variables x[offering, cell]; teacher and room choice variables exist only where there is a choice; hard constraints are exact periods per week per offering, one teacher and one room per offering, no teacher or room double-booked, no student cohort in two cells at once (cohorts derived from enrolment sets), and teacher unavailability; soft rules (same subject twice a day, heavy subject in last period, room moves, teacher gaps, minutes shortfall, daily contact) are penalties minimised as a weighted objective, optionally seeded with a hint from the current week. max_seconds is clamped to a 120s ceiling. On INFEASIBLE a bounded deletion filter yields an irreducible core and an English explanation. The service holds no DB or state; everything arrives in the request body.\n- Write-back: the solver returns `slots[]` (section_id, day_of_week, period_id, subject_offering_id, teacher_id, room_id). Go `proposalsOf` parses UUIDs and day 1..7 (else ErrSolverUnreadable), clash-checks, then inserts `timetable_slots` rows in one transaction (after deleting replaced slots). The job row stores slots_written, wall_time_ms, objective, solver_status, verdict, core_keys, warnings, soft_violations; detail is truncated to 2000 characters.\n\n### 2.5 Failure, retry, shutdown (verified gaps)\n\n- No retry in Go. A solver 503 busy reaches `Solve`, which accepts only 200 and 422, so it becomes ErrSolverRejected -> job failed, reason refused. Retry-After is ignored.\n- Go HTTP client timeout TIMETABLE_SOLVER_TIMEOUT default 5m; response body read capped at 32 MiB.\n- No reaper: `queued` and `running` are referenced only by runner.go in non-test code. A crash mid-run leaves the row `running`, and because of the partial unique index that blocks any new generation for that timetable until fixed by hand. The queue is in memory, so queued jobs are lost on restart the same way.\n- Shutdown: deferred `generator.Close()` closes the queue and waits for workers to finish every queued solve (no timeout) before cancelling.\n- `Client.Health` (calls /healthz) exists but has no non-test callers.\n\n## 3. Mail outbox (internal/service/mail)\n\n### 3.1 Key finding: nothing enqueues mail\n\n`mail.Submitter` (submit.go: `NewSubmitter`, `SubmitterFromConfig`, `Submit`) is never constructed or called outside its own tests. A grep of non-test code for `Submitter`, `SubmitterFromConfig`, `NewSubmitter`, `mail.Message` shows only the definitions; the only importers of `internal/service/mail` are cmd/api/main.go (sender), cmd/mailpurge/main.go, and transport/http/server.go (type `mail.Stats` for health). No HTTP handler or job writes to `outbox_messages`. The sender drains an outbox that no production code fills (an \"unreachable capability\"). Provisioning returns a generated password in the API response instead (service/provisioning.go), not by mail. RECIPIENT_HASH_PEPPER and RECIPIENT_HASH_VERSION are read by config but only `SubmitterFromConfig` (unused) consumes them.\n\n### 3.2 Components and boundaries\n\n- Enqueue (library code only): `Submitter.Submit` validates the recipient (single address, no display name), requires template key and body, optionally dedupes on `idempotency_key`, JSON-encodes {address, subject, body, variables}, AES-GCM encrypts it with the keyring (AAD `outbox_message:<id>`), and inserts an `outbox_messages` row (control plane) with status pending, attempt_count 0, max_attempts 5, next_attempt_at now, expires_at now+72h, HMAC-SHA256 recipient hash and a redacted address.\n- Poll loop: `Sender.Run` is a goroutine started in cmd/api/main.go (`go sender.Run(ctx)`) when MAIL_SENDER_ENABLED (default true) and `NewSender` succeeds (needs control client and keyring). Ticker interval MAIL_SENDER_INTERVAL (config default 10s; package default 5s). It ticks immediately and then each interval.\n- Per-school workers: `Sender.workerFor(schoolKey)` lazily starts one goroutine per school (nil school = platform key) with a `chan *OutboxMessage` of depth 64; `dispatch` is non-blocking, and a full channel releases the lease.\n- SMTP: `send()` uses net/smtp over TCP with per-message timeout 20s (`DefaultSMTPTimeout`).\n\n### 3.3 State machine (outbox_messages.status, control DB)\n\nValues: pending, sending, sent, retrying, failed. Terminal rows have their ciphertext, nonce and key version nulled in the same UPDATE (DB check `outbox_messages_payload_absent_when_terminal`).\n\n```mermaid\nstateDiagram-v2\n    [*] --> pending : Submitter.Submit (no production caller)\n    pending --> sending : claim - lease 2m, leased_by instance\n    retrying --> sending : claim when next_attempt_at due\n    sending --> sent : SMTP accepted\n    sending --> retrying : retryable failure, backoff, attempts below max\n    sending --> failed : non-retryable, attempts exhausted, or expired\n    sending --> pending : release - worker queue full (retrying if attempts above 0)\n    sending --> sending : lapsed lease re-claimed\n    pending --> failed : expire - expires_at passed\n    retrying --> failed : expire - expires_at passed\n    sent --> [*]\n    failed --> [*]\n```\n\n### 3.4 Flow diagram\n\n```mermaid\nflowchart TD\n    classDef entry fill:#d9eaff,stroke:#2b6cb0\n    classDef shared fill:#e8e8ff,stroke:#55a\n    classDef db fill:#fff2cc,stroke:#b8860b\n    classDef ext fill:#ffe0e0,stroke:#c00\n    classDef async fill:#e0ffe0,stroke:#2a2,stroke-width:3px\n    classDef err fill:#ffd6d6,stroke:#900,stroke-dasharray:4\n\n    Q[\"ENTRY: Submitter.Submit (no caller found)\"]:::entry\n    O[\"DB: control outbox_messages pending, encrypted payload\"]:::db\n    R[\"ASYNC: Sender.Run ticker 10s (sender.go)\"]:::async\n    X[\"DB: expire stale rows to failed\"]:::db\n    S[\"DB: scan due pending, retrying, lapsed sending\"]:::db\n    C[\"DB: claim UPDATE status sending, lease 2m\"]:::db\n    W[\"ASYNC: per-school worker goroutine chan depth 64\"]:::async\n    P[\"DB: control school_profiles smtp primary, decrypt\"]:::db\n    F[\"SHARED: platform SMTP fallback from env\"]:::shared\n    M[\"EXTERNAL: SMTP server (dial, TLS or STARTTLS, AUTH, DATA)\"]:::ext\n    T[\"DB: terminal update sent or failed, payload nulled\"]:::db\n    Y[\"DB: retrying + next_attempt_at jittered backoff\"]:::db\n    B[\"ERROR: per-school breaker opens after 3 sender-fault failures, 2m\"]:::err\n    H[\"INTERFACE: GET /api/v1/health mail block\"]:::entry\n    U[\"ENTRY: cmd/mailpurge manual\"]:::entry\n    D[\"DB: delete terminal rows older than retention\"]:::db\n\n    Q --> O\n    R --> X --> S --> C --> W --> P\n    P -->|no school profile| F\n    P --> M\n    F --> M\n    M -->|ok| T\n    M -->|fail retryable| Y\n    M -->|fail| B\n    R -.stats.-> H\n    U --> D\n```\n\n| Node | Code reference |\n|---|---|\n| Q, O | mail/submit.go:Submitter.Submit; ent control OutboxMessage |\n| R | mail/sender.go:Sender.Run, Tick; cmd/api/main.go:newMailSender and `go func` |\n| X, S | sender.go:expire, scan, due, oldestFirst, apportion (batch 128, per-school burst 16, scan limit 512) |\n| C | sender.go:claim (optimistic UPDATE with status and lease predicates) |\n| W | sender.go:dispatch, workerFor, serve, deliver |\n| P, F | sender.go:resolve, ControlProfiles.SMTPCredentials (school_profiles profile_type smtp, name primary, status active, keyring-decrypted with AAD school id); platform fallback via Options.Platform |\n| M | sender.go:send, mechanism (PLAIN, LOGIN, CRAM-MD5) |\n| T, Y | sender.go:finish, settle, backoff |\n| B | sender.go:note (breaker) |\n| H | transport/http/health.go:readiness, mailHealth; server.go:WithMail, MailHealth |\n| U, D | cmd/mailpurge/main.go; mail/retention.go:Purger.Run, EntOutbox.Expired, Forget |\n\n### 3.5 Behaviour details\n\n- Sender identity: school SMTP profile if present (`ErrNoProfile` falls through), else the platform fallback from PLATFORM_SMTP_HOST, _PORT, _USERNAME, _PASSWORD, _ENCRYPTION (starttls|tls|none), _FROM_ADDRESS, _FROM_NAME, _REPLY_TO. Fallback From is `<school name> (via <platform name>)` with Reply-To set to the school email or PLATFORM_SMTP_REPLY_TO; with neither, the message is refused with retryable `no_reply_address`.\n- Security: SMTPNone is refused for non-loopback hosts; TLS verifies ServerName.\n- Retry: failure classification in `classify`/`transport`/`authFailure`/`rejection`: 421 rate_limited (retry); 450/451/452 mailbox_unavailable (retry); 550/551/553/501 invalid_recipient (give up); 552 give up; 535/530 sender_auth_failed; timeouts retry; other 5xx give up; other 4xx retry. Backoff: base 30s doubled per attempt, cap 30m, wait = half + random(half). Gives up when not retryable or attempts >= max_attempts (5).\n- Multi-instance safety: lease columns leased_by and lease_expires_at (2m) plus `LeasedByEQ(instance)` on every terminal write; abandoned `sending` rows are re-claimed after the lease lapses. If an instance stalls after SMTP success but before the terminal write, the lease expiry can cause a duplicate send (code-derived; not run).\n- Breaker: per-school in memory; opens after 3 consecutive sender-fault failures for 2m, muting that school's rows in `due()`.\n- Shutdown: root ctx cancel stops `Run`, whose deferred `Close()` cancels the sender ctx and waits for workers. In-flight rows keep their lease until it lapses.\n- Health: `/api/v1/health` (readiness, unauthenticated route registered outside the auth group) returns `mail` object: state running or disabled or unavailable; running = last tick within 3x interval; platform_fallback, ticks, sent, failed, retried, in_flight, open_breakers, last_tick_at. The root `/health` and the Docker HEALTHCHECK hit only the liveness handler, which has no mail info.\n- Retention: `cmd/mailpurge` (manual, dry-run by default, `-destroy` to delete; default age 30d, floor 7d; limit default 1000, max 50000). Deletes only sent or failed rows with payload already null, older than the window; also frees their idempotency keys. Needs only CONTROL_DATABASE_URL (no master key). Output prints no recipient data.\n\n## 4. Assets and the object store (internal/service/assets, internal/infrastructure/blob)\n\n### 4.1 Upload lifecycle (assets table, tenant DB; status pending, ready, deleted)\n\n```mermaid\nstateDiagram-v2\n    [*] --> pending : POST /library/assets createAsset - presign PUT, insert row\n    pending --> ready : PUT /assets/(id)/content streamed, size and sha256 verified\n    pending --> ready : POST /assets/(id)/ready after client PUT - HEAD size and sha256 match\n    pending --> deleted : DELETE /assets/(id) or assetreap retire\n    ready --> deleted : DELETE /assets/(id)\n    deleted --> [*]\n```\n\nRow creation records file_name, mime_type, size_bytes, sha256, uploaded_by; storage_key is server-minted `library/<uuid>` (`mintedStorageKey`); client-supplied storage_key or status is refused with 422. Size cap `MaxAssetBytes` 200 MiB (422, code `asset_too_large`); zero-length uploads cannot be presigned.\n\n### 4.2 Flow diagram\n\n```mermaid\nflowchart TD\n    classDef entry fill:#d9eaff,stroke:#2b6cb0\n    classDef shared fill:#e8e8ff,stroke:#55a\n    classDef db fill:#fff2cc,stroke:#b8860b\n    classDef ext fill:#ffe0e0,stroke:#c00\n    classDef async fill:#e0ffe0,stroke:#2a2,stroke-width:3px\n    classDef err fill:#ffd6d6,stroke:#900,stroke-dasharray:4\n    classDef auth fill:#f3e0ff,stroke:#80a\n\n    AU[\"AUTH: authenticate, RequireTenant, can LibraryCreate or LibraryRead or LibraryDelete\"]:::auth\n    A[\"ENTRY: POST /library/assets\"]:::entry\n    DB1[\"DB: insert assets pending\"]:::db\n    S3a[\"EXTERNAL: S3 presign PUT (offline signing, no network call)\"]:::ext\n    B[\"ENTRY: PUT /library/assets/{id}/content (proxied stream)\"]:::entry\n    S3b[\"EXTERNAL: S3 PutObject streamed with sha256 + length\"]:::ext\n    ER[\"ERROR: mismatch -> discardHalfObject DeleteObject, 422\"]:::err\n    DB2[\"DB: UPDATE pending to ready\"]:::db\n    C[\"ENTRY: POST /library/assets/{id}/ready (after direct PUT to presigned URL)\"]:::entry\n    S3c[\"EXTERNAL: S3 HeadObject with checksum\"]:::ext\n    D[\"ENTRY: GET /assets/{id}/content stream or /link presigned GET\"]:::entry\n    S3d[\"EXTERNAL: S3 GetObject (range supported) or presign GET 5m\"]:::ext\n    E[\"ENTRY: DELETE /library/assets/{id}\"]:::entry\n    DB3[\"DB: UPDATE status deleted (object stays)\"]:::db\n    R[\"ASYNC: cmd/assetreap manual process\"]:::async\n    S3e[\"EXTERNAL: S3 HeadObject + DeleteObject\"]:::ext\n    DB4[\"DB: retire pending to deleted if unreferenced\"]:::db\n\n    AU --> A --> S3a --> DB1\n    AU --> B --> S3b --> DB2\n    S3b -->|error| ER\n    AU --> C --> S3c --> DB2\n    AU --> D --> S3d\n    AU --> E --> DB3\n    R --> S3e --> DB4\n```\n\n| Node | Code reference |\n|---|---|\n| A, S3a, DB1 | transport/http/library.go:createAsset; blob.Client.PresignPut (binds content-length, content-type and x-amz-checksum-sha256 into the signature, checks via `assertBound`) |\n| B, S3b, ER, DB2 | library.go:uploadAssetContent (30m window via `holdOpenForUpload`), `uploadCheck` (running sha256 and length), blob.Client.Put (no retries, `withoutReplay`, signs known payload hash), `discardHalfObject` |\n| C, S3c | library.go:markAssetReady; blob.Client.Head (ChecksumMode enabled; 503 `asset_digest_unavailable` if store returns no sha256) |\n| D, S3d | transport/http/assetcontent.go:getAssetContent (Range parsing, size check, inline vs attachment, 30m window); library.go:getAssetLink (PresignGet 5m); blob.Client.Get |\n| E, DB3 | library.go:deleteAsset (soft delete only) |\n| R | cmd/assetreap/main.go:run, sweep; assets/reaper.go:Reaper.Run, judge, apply; assets/store.go:EntRows.Sweepable, Retire, BlobObjects |\n\nPresigned upload link TTL 15m (`uploadLinkTTL`), download link 5m; `blob.MaxExpiry` 1h. Asset readability gates: content and link endpoints require status ready (409 otherwise). The indexer also requires status ready (`attempt`).\n\n### 4.3 Reaper (cmd/assetreap)\n\n- Not a daemon. Manual command, dry run by default; `-destroy` acts; `-school` code or all; `-age` default 24h, floor 1h; `-limit` per school default 500, max 10000. Env: CONTROL_DATABASE_URL and SECRETS_MASTER_KEY (to decrypt each school's postgres and S3 profiles).\n- Loop: `control.School.Query().All` (all statuses, unlike the indexing sweeper), skip schools without postgres or S3 profile, then per school `Reaper.Run`: candidates are pending assets with created_at older than cutoff plus deleted assets with updated_at older than cutoff, minus any referenced by a content item (`HasContentItems`). Decision matrix in `judge`: pending with object -> delete object and retire row; pending without object -> retire row; deleted with surviving object -> delete object; pending with empty storage key -> retire. Rows are never hard-deleted. Exit code non-zero if any asset failed.\n- The 15 minute presign window versus the 24h age floor means an in-flight upload is not reaped under defaults; with `-age 1h` the floor is still above the 30 minute upload window (code-derived).\n\n### 4.4 blob client summary (internal/infrastructure/blob/client.go)\n\nAWS SDK v2 S3 client built per call from decrypted per-school S3 profile (region, bucket, access key, secret, optional endpoint, path-style). Operations: PresignPut, Put (streaming), PresignGet, Get (streaming with Range; ErrNoObject, ErrRangeRefused), Head (404 -> Exists false), Delete (404 treated as success). Errors are passed through `guard` which redacts the secret and signed URL material (`ErrWithheld` if bearer markers remain). Credentials are static; there is no connection-level timeout in the client itself, so lifetimes come from the caller contexts (30m upload and download windows, 10s discard, 10m fetch in the indexer).\n\n## 5. Every goroutine, ticker, timeout and signal handler (non-test code)\n\n| Location | What | Kind |\n|---|---|---|\n| cmd/api/main.go:45 | `signal.NotifyContext(os.Interrupt, SIGTERM)`: root ctx; cancelling it stops the mail sender and index sweeper, then main calls `srv.Shutdown` with HTTP_SHUTDOWN_TIMEOUT (default 15s) | signal |\n| cmd/api/main.go:83 | `go sender.Run(ctx)` mail outbox poller | goroutine + ticker |\n| cmd/api/main.go:107 | `go sweeper.Run(ctx)` index sweeper | goroutine + ticker |\n| cmd/api/main.go:125 | `go srv.ListenAndServe()` | goroutine |\n| indexing/dispatcher.go:57 | RETRIEVAL_INDEX_WORKERS x `d.work()` | goroutine pool, chan depth 64 |\n| indexing/indexer.go:260 | `time.NewTicker(PollInterval)` inside `await` (per job, in worker) | ticker |\n| indexing/sweeper.go:198 | `time.NewTicker(Interval)` | ticker |\n| timetablegen/dispatcher.go:60 | TIMETABLE_SOLVER_WORKERS x `d.work()` | goroutine pool, chan depth config |\n| mail/sender.go:356, :673 | ticker in `Run`; one `go s.serve(w)` per school key (lazily, never retired) | ticker, goroutine per school |\n| mail/sender.go:691..1081 | `context.WithTimeout` 10s for DB writes, SMTPTimeout 20s for send | timeouts |\n| transport/http/library.go:1639, 1659 | 10s discard window, 30m upload window | timeouts |\n| transport/http/assetcontent.go:171 | 30m download window | timeout |\n| transport/http/schools.go:36, 420-450 | 10s request timeout, credential probe timeout (postgres connect, mysql TCP dial, smtp handshake) | timeouts |\n| infrastructure/postgres/open.go:53 | connect/ping timeout | timeout |\n| transport/http/server.go:requestTimeout | chi Timeout 30s, or assetUploadWindow for streaming-body routes | middleware |\n| cmd/migrate/main.go:275, cmd/seeddemo/main.go:158 | 10s ping, 10m run | timeouts |\n\nThere is no `time.After`, `time.Tick`, cron library, scheduler, or message-queue client anywhere in non-test code (grep verified). No goroutine is a general worker framework; each is bespoke.\n\nShutdown order (cmd/api/main.go, defers LIFO): ctx cancelled -> `srv.Shutdown` (15s) -> `dispatcher.Close()` -> `generator.Close()` -> `sender.Close()` -> registry.Close -> control.Close. The two dispatcher Close calls wait without a deadline for all queued work (indexing up to 15m per job, timetable up to 5m per job), so a container stop signal followed by SIGKILL is the effective bound.\n\n## 6. cmd/* binaries and how each is run\n\n| Binary | Purpose | How run (verified source) |\n|---|---|---|\n| cmd/api | The HTTP service plus in-process mail sender, index sweeper, index dispatcher, timetable dispatcher | Root Dockerfile builds /usr/local/bin/api as the ENTRYPOINT; deploy/docker-compose.yml (service api, container emerge-core, port 127.0.0.1:8077->8081, env_file .env, healthcheck wget /health); root docker-compose.yml api service for local dev |\n| cmd/migrate | Atlas-style migrations for control and tenant planes (make, apply, status) | Built into both the api image and Dockerfile.tools; run as a one-shot `docker run --entrypoint /usr/local/bin/migrate emerge-core:<sha> apply -plane control` (deploy/README.md); CI runs `go run ./cmd/migrate apply` (.github/workflows/ci.yml) |\n| cmd/seed | Creates a school, stores credentials, makes first admin; optional CAS call with a superadmin token | Built in Dockerfile.tools only; CI runs `go run ./cmd/seed` |\n| cmd/seeddemo | Fills one school with demo data via DB and the API | Dockerfile.tools; CI `go run ./cmd/seeddemo` |\n| cmd/assetreap | Manual orphan asset sweep | Not in any Dockerfile (only api and migrate, or seed, seeddemo, migrate in tools); no cron, systemd, or compose entry found anywhere in repo; documented as an operator tool run by hand (docs/DESIGN-NOTES.md: \"operator tools for work that needs a human to decide when and how much\") |\n| cmd/mailpurge | Manual outbox retention purge | Same: not in any image, no scheduler; run by hand with `go run` or a locally built binary |\n| cmd/catalogdump | Prints the authorization catalog JSON to stdout | `go run ./cmd/catalogdump`; no deploy usage found |\n\nOther processes: tools/timetable-solver (Python container, section 2.4). seeddemo.exe and ttprobe.exe at repo root are checked-in Windows binaries (not investigated).\n\n## 7. External integrations\n\n| System | Client file | Config env vars | Call paths | Auth | Timeouts | Failure behaviour |\n|---|---|---|---|---|---|---|\n| CAS: JWKS | internal/infrastructure/cas/verifier.go | CAS_BASE_URL, CAS_ISSUER, CAS_AUDIENCE | GET `/.well-known/jwks.json` on startup (`Warm`) and on kid miss or after 15m TTL, from the `authenticate` middleware (middleware/auth.go) | none (public keys) | 10s | refresh error with a cached key -> serves cached key; no key -> `ErrUpstream` |\n| CAS: policies | cas/policies.go | CAS_CLIENT_ID, CAS_CLIENT_SECRET, CAS_SERVICE_KEY, CAS_AUDIENCE, CAS_POLICY_TTL (60s) | POST `/oauth/token` (client_credentials, Basic) then POST `/v1/policies` with header `X-Service-Authorization: Bearer <service token>` and body {token, services, audience, tenant}; per authorization decision (`Guard.Allow`) with a per user and tenant cache | OAuth2 client credentials | 10s | failure serves stale cache up to 2x TTL, else error (deny); no client creds -> `DenyAll` guard, all requests denied |\n| CAS: auth relay | cas/proxy.go | CAS_AUTH_PROXY (default true) | POST `/v1/auth/login`, `/login/verify`, `/otp/start`, `/refresh`, `/logout`, `/password/change`, `/password/reset`, GET `/v1/me`, from `/api/v1/auth/*` (unauthenticated routes in server.go) | passes caller headers, X-Forwarded-For | 15s | upstream status relayed |\n| CAS: admin | cas/admin.go | CAS_BASE_URL | `/v1/admin/users`, `/v1/admin/groups...` from service/provisioning.go and tenant.go (person provision, school create) | the caller's own bearer token (`callerToken`), not a service token | 20s | `ErrProvisioningUnavailable`; provisioning disabled when auth disabled |\n| Retrieval engine | indexing/client.go (+ indexer.go) | RETRIEVAL_INDEX_ENABLED, RETRIEVAL_SEARCH_ENABLED, RETRIEVAL_ENGINE_BASE_URL, RETRIEVAL_ENGINE_ADMIN_TOKEN, RETRIEVAL_ENGINE_TIMEOUT, RETRIEVAL_INDEX_POLL_INTERVAL, RETRIEVAL_INDEX_POLL_TIMEOUT, RETRIEVAL_INDEX_WORKERS, RETRIEVAL_SWEEP_* | POST `/ingest/file`, GET `/ingest/{id}`, POST `/retrieve` (section 1.5) | headers `X-School-Id` (CAS tenant slug) and optional `X-Admin-Token` | 60s per call, 15m poll, 10m byte fetch | search: 503 unreachable, 502 refused; indexing: row failed then sweeper retries forever with capped backoff |\n| S3 object store | blob/client.go | none in env; per-school profile `s3` stored encrypted in control school_profiles (endpoint, region, bucket, keys, path style) | library.go (create asset, upload, ready, link, delete), assetcontent.go, indexing (presigned GET), assets reaper | SigV4 static keys (presigned URLs for browser) | caller contexts (30m upload and download, 10s discard) | per-operation HTTP status mapping (503 no store, 409 object missing, 422 mismatch); presigned URLs redacted from errors |\n| SMTP | mail/sender.go (net/smtp); probe in transport/http/schools.go | PLATFORM_SMTP_*, MAIL_SENDER_ENABLED, MAIL_SENDER_INTERVAL, MAIL_SENDER_INSTANCE_ID, RECIPIENT_HASH_PEPPER (unused at runtime) | outbox drain only (nothing enqueues); probe when a school stores an smtp profile via PUT `/schools/{id}/profiles/smtp` | school profile or platform fallback; PLAIN, LOGIN, CRAM-MD5 | 20s per message | retry with backoff, breaker, expiry after 72h |\n| Timetable solver | timetablegen/client.go | TIMETABLE_SOLVER_ENABLED, _BASE_URL, _TOKEN, _TIMEOUT (5m), _MAX_SECONDS (60), _WORKERS (1), _QUEUE (16) | POST `/v1/feasibility`, POST `/v1/solve` (GET `/healthz` defined, never called) | `Authorization: Bearer <token>` | 5m | no retry; job failed with reason; section 2.5 |\n| Postgres (control + one per school) | infrastructure/postgres | CONTROL_DATABASE_URL, SECRETS_MASTER_KEY; tenant DSNs from encrypted `postgres` profiles | everywhere | DSN credentials | connect timeout in open.go | n/a |\n| MySQL | tenancy/tenant.go (types only) | none | none | n/a | n/a | see below |\n\n### MySQL: what the code does\n\nMySQL is stored but not used. `tenancy.MySQLCredentials` (host, port, database, user, password, params, `DSN()`) and `Registry.MySQLCredentials` (infrastructure/postgres/tenant.go:155) decode a `mysql` profile from control.school_profiles, and the profile type exists in the ent enum (postgres, mysql, s3, smtp). The only runtime behaviours are: `PUT /schools/{id}/profiles/mysql` validates required fields (schools.go ~322) and `reachable()` does a plain TCP dial to host:port (default 3306) as a probe (schools.go ~434). There is no MySQL driver in go.mod and no caller of `Registry.MySQLCredentials` or `MySQLCredentials.DSN()` in non-test code (grep verified). The only DB driver used for data is Postgres via pgx and ent.\n\n## 8. Overview diagram: every async boundary and what crosses it\n\n```mermaid\nflowchart LR\n    classDef entry fill:#d9eaff,stroke:#2b6cb0\n    classDef shared fill:#e8e8ff,stroke:#55a\n    classDef db fill:#fff2cc,stroke:#b8860b\n    classDef ext fill:#ffe0e0,stroke:#c00\n    classDef async fill:#e0ffe0,stroke:#2a2,stroke-width:3px\n    classDef err fill:#ffd6d6,stroke:#900,stroke-dasharray:4\n    classDef auth fill:#f3e0ff,stroke:#80a\n\n    H[\"ENTRY: HTTP handlers (chi) after AUTH authenticate + tenant + can\"]:::entry\n    CAS[\"EXTERNAL: CAS JWKS, policies, admin\"]:::ext\n    IQ[\"ASYNC: index dispatcher chan 64 x2 workers\"]:::async\n    SW[\"ASYNC: index sweeper ticker 5m\"]:::async\n    TQ[\"ASYNC: timetable dispatcher chan 16 x1 worker\"]:::async\n    MS[\"ASYNC: mail sender ticker 10s + per-school workers\"]:::async\n    TDB[\"DB: tenant Postgres per school\"]:::db\n    CDB[\"DB: control Postgres\"]:::db\n    RE[\"EXTERNAL: retrieval engine\"]:::ext\n    S3[\"EXTERNAL: S3 per school\"]:::ext\n    PY[\"EXTERNAL: Python CP-SAT solver\"]:::ext\n    SMTP[\"EXTERNAL: SMTP\"]:::ext\n    CLI[\"ENTRY: manual CLIs assetreap, mailpurge\"]:::entry\n\n    H -->|\"item id + tenant client + CAS slug\"| IQ\n    H -->|\"job id + tenant client\"| TQ\n    H -->|\"sync stream, presign\"| S3\n    H -->|\"sync search\"| RE\n    H --> CAS\n    SW -->|\"item id + tenant client\"| IQ\n    SW -->|\"list active schools, profiles\"| CDB\n    SW --> TDB\n    IQ --> TDB\n    IQ -->|\"presigned GET stream\"| S3\n    IQ -->|\"file bytes, poll\"| RE\n    TQ --> TDB\n    TQ -->|\"school JSON\"| PY\n    MS -->|\"outbox rows, profiles\"| CDB\n    MS --> SMTP\n    CLI --> CDB\n    CLI --> TDB\n    CLI --> S3\n```\n\nNodes: H = transport/http/*; IQ = indexing/dispatcher.go; SW = indexing/sweeper.go; TQ = timetablegen/dispatcher.go; MS = mail/sender.go; the rest per sections above. Crossing artefacts are in-memory only for IQ and TQ (lost on crash, recovered by sweeper for IQ only), and durable rows for mail (outbox) and for index_status.\n\n## 9. Verified vs unverified\n\nVerified by reading the function bodies:\n- All of indexing (client, dispatcher, indexer, sweeper, tenants), retrieval/labels.go, library.go publish hooks and asset handlers, ingestmode.go, search.go call site and error mapping, assetcontent.go.\n- timetablegen runner, dispatcher, client; timetablegenerate.go; the job schema and unique partial index; Python server.py endpoints, auth, concurrency gate, wire.py shapes; solver.py header docstring and solve parameters; compose and Dockerfile for the solver.\n- mail sender, submit, retention; cmd/mailpurge, cmd/assetreap, cmd/api main; assets reaper and store; blob client; config.go env vars.\n- Absence claims by grep: no non-test caller of `mail.Submitter`; no `Registry.MySQLCredentials` caller; no MySQL driver; no caller of `timetablegen.Client.Health`; no reaper for queued/running timetable jobs; no engine delete call; no cron/systemd/scheduler files; no `time.After`/`time.Tick`; assetreap and mailpurge absent from every Dockerfile.\n\nUnverified or only code-derived (not executed):\n- Possible send-on-closed-channel race between sweeper tick and `Dispatcher.Close`.\n- Possible duplicate mail after a stalled terminal write and lease lapse.\n- Behaviour of the retrieval engine itself and the exact semantics of its job statuses (only the Go client side was read; docs claim an `ingest.py` in another repo that was not opened).\n- The body of solver.py beyond the header docstring and solve parameters (high-level description relies on the docstring and the wire layer); preflight.py, verify.py, render.py not read in detail.\n- export.go details beyond the list of tables it queries; dailycontact.go internals.\n- CAS provisioning flow beyond the client files (service/provisioning.go and tenant.go skimmed only); CAS server behaviour.\n- The Go test suites, CI job contents beyond the `go run` lines, scripts/*, nginx config, seeddemo.exe and ttprobe.exe.\n- Whether production `.env` actually enables retrieval, mail or solver (only defaults and deploy docs read: RETRIEVAL_INDEX_ENABLED, RETRIEVAL_SEARCH_ENABLED and TIMETABLE_SOLVER_ENABLED default false; MAIL_SENDER_ENABLED and RETRIEVAL_SWEEP_ENABLED default true, the sweeper only runs when indexing is on).\n"},{"id":"D1","nav":"D1. People, structure, content flows","title":"D1 - Business flows part 1: people, structure, content","md":"# D1 - Business flows part 1: people, structure, content\n\nScope: onboarding, people, academic structure, library, curriculum and placements, question bank / blueprints / papers.\nAll claims below were read from code under `D:\\emerge-core`. Paths are relative to that root. Anything not read is listed under \"Verified vs unverified\" at the end.\n\n## Legend (used by every diagram)\n\n| Class | Meaning | Style |\n|---|---|---|\n| ENTRY | HTTP route, CLI main, or other entry point | blue |\n| INTERFACE | Go interface or seam the code calls through | purple |\n| SHARED | Shared helper used by many handlers | grey |\n| DB | Control-plane or tenant Postgres read/write | green |\n| EXTERNAL | Other system (CAS, S3, retrieval engine) | orange |\n| ASYNC | Async boundary (work leaves the request) | yellow |\n| ERROR | Refusal path with its HTTP status | red |\n| AUTH | Authentication / authorization / tenancy boundary | pink |\n\nClass definitions repeated in each diagram (Mermaid has no global styles):\n`classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000` / `iface fill:#e3d4ff,stroke:#6a3fb5` / `shared fill:#eeeeee,stroke:#777` / `db fill:#d4f2d4,stroke:#2e7d32` / `ext fill:#ffe0b3,stroke:#c77700` / `async fill:#fff3a8,stroke:#a68b00` / `err fill:#ffd0d0,stroke:#b00020` / `auth fill:#ffd6f0,stroke:#b0408a`.\n\n---\n\n## 0. The request pipeline every tenant-plane flow below shares\n\nRouter: `internal/transport/http/server.go:Router` (L118). Control-plane routes (`/schools`) are mounted by `mountControlPlane` (L163), tenant routes by `mountTenantPlane` (L174, wrapped in `mw.RequireTenant`). Both sit under `r.Use(s.authenticate())` (L146).\n\n```mermaid\nflowchart TD\n    REQ[\"ENTRY: HTTP request /api/v1/...\"]:::entry\n    AUTHN[\"AUTH: Authenticate or DevSubject\"]:::auth\n    TEN[\"AUTH: RequireTenant X-School-Id\"]:::auth\n    REG[\"SHARED: Registry.Get / GetByCode / GetByCASTenant\"]:::shared\n    CTRL[(\"DB: control plane schools + school_profiles\")]:::db\n    TDB[(\"DB: tenant Postgres pool per school\")]:::db\n    CAN[\"AUTH: Authorize(guard, entity) per route\"]:::auth\n    GUARD{{\"INTERFACE: authorization.Guard.Allow\"}}:::iface\n    CAS[\"EXTERNAL: CAS policies\"]:::ext\n    HAND[\"Handler\"]:::shared\n    SCOPE[\"SHARED: scopeFor(narrow, wide)\"]:::shared\n    RESOLVE[\"SHARED: access.Resolve builds Viewer\"]:::shared\n    E401[\"ERROR: 401 token invalid / 503 CAS down\"]:::err\n    E400[\"ERROR: 400 header missing / 404 unknown school / 403 inactive or tenant mismatch / 503 no profile\"]:::err\n    E403[\"ERROR: 403 not permitted entity\"]:::err\n\n    REQ --> AUTHN\n    AUTHN -->|invalid| E401\n    AUTHN --> TEN\n    TEN --> REG\n    REG --> CTRL\n    REG --> TDB\n    TEN -->|failure| E400\n    TEN --> CAN\n    CAN --> GUARD\n    GUARD --> CAS\n    CAN -->|denied| E403\n    CAN --> HAND\n    HAND --> SCOPE\n    SCOPE --> GUARD\n    SCOPE --> RESOLVE\n    RESOLVE --> TDB\n    HAND --> TDB\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef iface fill:#e3d4ff,stroke:#6a3fb5,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef ext fill:#ffe0b3,stroke:#c77700,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Node | Code |\n|---|---|\n| Router / mounts | `internal/transport/http/server.go:Router` L118, `mountControlPlane` L163, `mountTenantPlane` L174 |\n| Authenticate / DevSubject | `internal/transport/http/middleware/auth.go:Authenticate` L14 (CAS `verifier.VerifyAccessToken`; `ErrUpstream` -> 503, else 401), `DevSubject` L45 (used when `s.verifier == nil`, server.go:authenticate L446) |\n| RequireTenant | `internal/transport/http/middleware/tenant.go:RequireTenant` L23, `resolveTenant` L60 (UUID -> `Get`; else `GetByCode`; if unknown, falls back to `GetByCASTenant`), errors mapped by `writeTenantErr` L81 (unknown 404, inactive 403, no profile 503). Also 403 `token tenant does not match X-School-Id` when both `subject.TenantID` and `conn.Tenant.CASTenantID` are non-empty and differ (L41-47) |\n| Registry | `internal/infrastructure/postgres/tenant.go:Registry.Get` L51 (RW-locked cache keyed by school id), `open` L97 (refuses non-active school, decrypts postgres profile, opens pool), `Evict` L213 |\n| Authorize | `internal/transport/http/middleware/auth.go:Authorize` L59: `guard.Allow` -> 503 on `ErrUpstream`, 403 `not permitted: <entity>`; puts the `Decision` in context (`authorization.WithDecision`) |\n| Guard | `internal/authorization/authorization.go:Guard` L109 (impls `AllowAll`, `DenyAll`, and `internal/infrastructure/cas/policies.go:Guard.Allow`) |\n| scopeFor | `internal/transport/http/viewer.go:scopeFor` L12: probes `wide` entity (unrestricted only if `wide != narrow`, allowed, no constraints), then `narrow`, then `access.Resolve` |\n| Viewer | `internal/data/access/viewer.go:Resolve` L47: person by `cas_user_id`, guardian, staff+teacher, teaching sections/offerings of the CURRENT session only, own students, enrolled offerings of the CURRENT session |\n| Tenant client | `internal/transport/http/common.go:tenantClient` L21 -> `postgres.ClientFromContext` |\n\nShared helpers used by nearly every write below (all in `internal/transport/http/`): `response.DecodeFields` (which JSON keys were sent), `rejectUnauthorizedFields` / `rejectFields` (fields.go L66/L73, 403 `not permitted to write: ...`), `rejectNull` / `wasCleared` (common.go L157/L161), `writeTenantEntErr` (common.go L50: not found 404, constraint 409 generic `that value is already taken, or it references a row that does not exist`, validation 400), `wroteScopedRow` (common.go L85: 0 rows -> 404),

`mustReach` (L97), `deleteRow` / `deleteScoped` (common.go L63/L112), `attributedTo` (reach.go L110: `author`/`owner`/`created_by` are taken from the authenticated viewer; supplying them yourself is 422).\n\n---\n\n## 1. School / tenant onboarding\n\n### 1.1 Routes (control plane, no X-School-Id needed)\n\n| Method | Path | Permission | Handler | File |\n|---|---|---|---|---|\n| GET | /api/v1/schools | `SchoolsRead` | `listSchools` | internal/transport/http/schools.go L53 |\n| POST | /api/v1/schools | `SchoolsWrite` | `createSchool` | schools.go L80 |\n| GET | /api/v1/schools/{id} | `SchoolsRead` | `getSchool` | schools.go L217 |\n| PATCH | /api/v1/schools/{id} | `SchoolsWrite` | `updateSchool` | schools.go L672 |\n| DELETE | /api/v1/schools/{id} | `SchoolsDelete` | `deleteSchool` | schools.go L741 |\n| PUT | /api/v1/schools/{id}/profiles/{type} | `SchoolsWrite` | `putSchoolProfile` | schools.go L241 |\n\n### 1.2 What is and is not automated\n\nVerified: `createSchool` writes ONLY a control-plane `School` row and (best effort) a CAS tenant group. It does NOT create a database, store credentials, run migrations or seed anything. Searching Go and scripts for `CREATE DATABASE` finds only `deploy/setup-db.sh` (creates `emerge_control`) and `deploy/README.md`; there is no code that creates a per-school database. `deploy/README.md` L38 says \"emerge-core creates one database per school\" - not supported by any code I found (see unverified list).\n\nThe onboarding sequence the code actually supports:\n\n1. Operator creates the school database out of band (not in code).\n2. `POST /schools` (control row + CAS tenant ensure).\n3. `PUT /schools/{id}/profiles/postgres` (probe, encrypt, upsert, evict pool). Optionally `s3`, `smtp`, `mysql`.\n4. `go run ./cmd/migrate apply -plane tenant` (applies SQL from `migrations/tenant`, one ledger per DB).\n5. First administrator: `cmd/seed` (person + staff row) or `POST /persons` / `POST /persons/provision`.\n6. Optional demo year: `cmd/seeddemo`.\n\n```mermaid\nflowchart TD\n    OP[\"ENTRY: POST /schools\"]:::entry\n    VAL[\"createSchool validate name, code, slug, timezone\"]:::shared\n    CLASH[\"addressingClash code vs CAS slug\"]:::shared\n    E409A[\"ERROR: 409 slug is another code, or code is another slug\"]:::err\n    INS[(\"DB: control schools INSERT\")]:::db\n    E409B[\"ERROR: 409 name, code or CAS tenant exists\"]:::err\n    ENS[\"ensureTenant\"]:::shared\n    TP[\"TenantProvisioner.Ensure\"]:::shared\n    DIR{{\"INTERFACE: TenantDirectory\"}}:::iface\n    CASADM[\"EXTERNAL: CAS admin group lookup, create, tag\"]:::ext\n    SKIP[\"status skipped: no cas_tenant_id or CAS not configured\"]:::shared\n    FAIL[\"status failed with finish instructions, still 201\"]:::err\n    PROF[\"ENTRY: PUT /schools/id/profiles/type\"]:::entry\n    DEC[\"decodeCredentials shape check, 422\"]:::shared\n    PROBE[\"reachable probe 3s: pg open, mysql dial, smtp AUTH\"]:::shared\n    E422[\"ERROR: 422 not stored, profile on file unchanged\"]:::err\n    ENC[\"Registry.EncryptCredentials AES-GCM keyed by school id\"]:::shared\n    UPS[(\"DB: school_profiles upsert school_id, type, name=primary\")]:::db\n    EVICT[\"Registry.Evict closes cached pool\"]:::shared\n\n    OP --> VAL --> CLASH\n    CLASH -->|clash| E409A\n    CLASH --> INS\n    INS -->|constraint| E409B\n    INS --> ENS\n    ENS -->|no tenant| SKIP\n    ENS -->|CAS unavailable| SKIP\n    ENS --> TP --> DIR --> CASADM\n    TP -->|error| FAIL\n    PROF --> DEC --> PROBE\n    DEC -->|bad body| E422\n    PROBE -->|unreachable| E422\n    PROBE --> ENC --> UPS --> EVICT\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef iface fill:#e3d4ff,stroke:#6a3fb5,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef ext fill:#ffe0b3,stroke:#c77700,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n```\n\n| Node | Code |\n|---|---|\n| createSchool | schools.go:createSchool L80. Upper-cases `code`; `tenantSlug` (L155) enforces `^[a-z0-9][a-z0-9_-]{0,62}$` (400); default timezone `Asia/Kolkata`, country `IN`; `time.LoadLocation` check (400) |\n| addressingClash | schools.go:addressingClash L173: because `X-School-Id` tries codes before CAS slugs, a slug equal to another school's code (or a code equal to another's slug) is refused 409 |\n| INSERT / 409 | schools.go L136-145 `controlent.IsConstraintError` -> 409 |\n| ensureTenant | schools.go:ensureTenant L792: always returns 201 with a `cas_tenant` object whose `status` is `skipped`, `failed` or an outcome (`created`, `tagged`, `existing`) |\n| TenantProvisioner.Ensure | internal/service/tenant.go:Ensure L61: `LookupGroup`; if not found -> `CreateGroup` + `TagGroupTenant`; if found and tag equals tenant -> existing; untagged -> tag; tagged differently -> `ErrTenantTaken` (never retags) |\n| TenantDirectory | internal/service/tenant.go:TenantDirectory L15 (implemented by `cas.AdminClient`, internal/infrastructure/cas/admin.go L123/L154/L177) |\n| PUT profile | schools.go:putSchoolProfile L241; types `postgres, mysql, s3, smtp` (400 otherwise); school must exist (404) |\n| decodeCredentials | schools.go L306: postgres needs host+database+user or `dsn`; smtp needs host, username, password, from_address, security mode, port 0..65535, bare sender addresses; s3 is validated by `blob.New`; all 422 |\n| reachable | schools.go L412: postgres opens a 1-conn pool, mysql dials TCP, smtp does STARTTLS/TLS + AUTH (refuses cleartext non-loopback); S3 is NOT probed over the network (only constructed) |\n| Encrypt / upsert | postgres/tenant.go:EncryptCredentials L191 (nonce, ciphertext, key version); `SchoolProfile.Create ... OnConflictColumns(school_id, profile_type, name).UpdateNewValues()` (schools.go L280) |\n| Evict | postgres/tenant.go:Evict L213; called by putSchoolProfile, updateSchool, deleteSchool |\n| deleteSchool | schools.go L741: one control-plane transaction deletes the profiles then the school (409 if something still references it); no tenant DB is touched |\n\n### 1.3 Migrations and seeding (CLI entry points)\n\n```mermaid\nflowchart TD\n    MIG[\"ENTRY: cmd/migrate apply|status\"]:::entry\n    PLANES[\"selectPlanes control, tenant, all\"]:::shared\n    CTLDSN[(\"DB: control via CONTROL_DATABASE_URL\")]:::db\n    TT[\"tenantTargets: for each school, PostgresCredentials via Registry\"]:::shared\n    KEY[\"crypto.ParseKeyring SECRETS_MASTER_KEY\"]:::auth\n    SKIPPED[\"ERROR: school SKIPPED if no profile\"]:::err\n    APPLY[\"applyDir per target\"]:::shared\n    LEDGER[(\"DB: schema_migrations version + checksum\")]:::db\n    MODIFIED[\"ERROR: migration modified after being applied\"]:::err\n    ONE[\"applyOne: body + ledger INSERT in one transaction\"]:::shared\n    SEED[\"ENTRY: cmd/seed\"]:::entry\n    UPS1[(\"DB control: upsert school by code\")]:::db\n    PROF2[\"storeProfile postgres DSN encrypted, evict\"]:::shared\n    CASUSER[\"resolveCASUser: given id or mint\"]:::shared\n    CASX[\"EXTERNAL: CAS POST /v1/admin/users\"]:::ext\n    REGGET[\"registry.Get opens tenant pool\"]:::shared\n    HINT[\"ERROR: hint run migrate apply -plane tenant first\"]:::err\n    PERS[(\"DB tenant: upsert person by cas_user_id, then staff\")]:::db\n    DEMO[\"ENTRY: cmd/seeddemo seed\"]:::entry\n    ORDER[\"branch, session, grades, sections, subjects, offerings, teachers, assignments, students, subject enrollments, timetable, curriculum, exams, attendance\"]:::shared\n    APIC[\"optional -api-url: people via POST /staff /students /guardians\"]:::entry\n\n    MIG --> PLANES\n    PLANES --> CTLDSN\n    PLANES --> TT\n    TT --> KEY\n    TT -->|no profile| SKIPPED\n    PLANES --> APPLY\n    TT --> APPLY\n    APPLY --> LEDGER\n    APPLY -->|checksum differs| MODIFIED\n    APPLY --> ONE\n    SEED --> UPS1 --> PROF2 --> CASUSER\n    CASUSER --> CASX\n    CASUSER --> REGGET\n    REGGET -->|no tables or profile| HINT\n    REGGET --> PERS\n    DEMO --> ORDER\n    ORDER --> APIC\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef ext fill:#ffe0b3,stroke:#c77700,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Node | Code |\n|---|---|\n| migrate | cmd/migrate/main.go: `run` L80, `cmdApply` L162, `cmdStatus` L168 (dry-run), `walkTargets` L180, `tenantTargets` L221, `applyDir` L263, `applyOne` L324 (transaction: SQL body + `INSERT INTO schema_migrations`), `ensureLedger` L341. `make` (L101) diffs the ent schema via Atlas against `DEV_DATABASE_URL`. Planes: `migrations/control`, `migrations/tenant` (33 files in tenant; latest `20260930200209_add_paper_provenance__plane_tenant.sql`) |\n| Checksum guard | main.go L299-302: a recorded checksum that no longer matches the file is a hard error |\n| Tenant targets | tenantTargets resolves each school's postgres profile through `postgres.Registry.PostgresCredentials`; a school without a profile is printed `SKIPPED` and does not fail the run |\n| seed | cmd/seed/main.go:run L97; `upsertSchool` L200 (looks up by code first, returns existing); `storeProfile` L224 (same upsert as the API); `resolveCASUser` L250 (existing `-admin-cas-user-id`, or POST `/v1/admin/users` with a superadmin USER token, 409 -> use existing id); `upsertPerson` L313; `upsertStaff` L340 (employment `full_time`, default code `ADMIN-0001`). Everything is look-up-first, so reruns are safe |\n| seeddemo | cmd/seeddemo/main.go:`seed` L218 builds one year in the order shown; every row looked up by stable code; `-api-url/-api-token` routes people through the real handlers (people.go L100, L133, L249, L320); `-cas-token` mints CAS identities via cmd/seeddemo/cas.go; `-dry-run`, `-backfill-cas` |\n\n---\n\n## 2. People\n\n### 2.1 Routes\n\nAll under `RequireTenant`. Permission is the route-level entity; handlers then call `scopeFor(narrow, wide)` with the `_all` variant to decide unrestricted vs scoped.\n\n| Method | Path | Route permission | scopeFor (narrow, wide) | Handler | File |\n|---|---|---|---|---|---|\n| GET | /persons | `PersonsRead` | PersonsRead, PersonsReadAll | `listPersons` | persons.go L37 |\n| POST | /persons | `PersonsWrite` | PersonsWrite, PersonsWriteAll | `createPerson` | persons.go L115 |\n| POST | /persons/provision | `PersonsWrite` | `routeDecision` | `provisionPerson` | persons.go L317 |\n| POST | /persons/link | `PersonsWrite` | `routeDecision` | `linkPerson` | persons.go L412 |\n| GET/PATCH/DELETE | /persons/{uuid} | PersonsRead / Write / Delete | + All variants | `getPerson` L80, `updatePerson` L204, `deletePerson` L286 | persons.go |\n| GET | /students, /students/{id} | `StudentsRead` | StudentsRead, StudentsReadAll | `listStudents` L30, `getStudent` L77 | students.go |\n| POST | /students | `StudentsCreate` | StudentsCreate, StudentsWriteAll | `createStudent` L119 | students.go |\n| PATCH | /students/{id} | `StudentsWrite` | StudentsWrite, StudentsWriteAll | `updateStudent` L198 | students.go |\n| DELETE | /students/{id} | `StudentsDelete` | + DeleteAll | `deleteStudent` L305 | students.go |\n| GET | /students/{id}/report-card | `TimetableRead` | (not this part) | `getStudentReportCard` | reportcards.go |\n| GET, POST | /staff, /staff/{id} | `StaffRead` / `StaffWrite` (create uses StaffWrite, no Create entity) | StaffWrite, StaffWriteAll | `listStaff`, `getStaff`, `createStaff` L114 | staff.go |\n| PATCH, DELETE | /staff/{id} | `StaffWrite` / `StaffDelete` | | `updateStaff` L203, `deleteStaff` | staff.go |\n| GET | /teachers, /teachers/{id} | `TeachersRead` | | `listTeachers`, `getTeacher` | teachers.go |\n| POST | /teachers | `TeachersCreate` | TeachersCreate, TeachersCreate (wide == narrow) | `createTeacher` L110 | teachers.go |\n| PATCH, DELETE | /teachers/{id} | `TeachersWrite` / `TeachersDelete` | | `updateTeacher` L167, `deleteTeacher` | teachers.go |\n| GET | /guardians, /guardians/{id} | `GuardiansRead` | | `listGuardians` L57, `getGuardian` L100 | guardians.go |\n| POST | /guardians | `GuardiansCreate` | GuardiansCreate, GuardiansWriteAll | `createGuardian` L135 | guardians.go |\n| PATCH, DELETE | /guardians/{id} | `GuardiansWrite` / `GuardiansDelete` | | `updateGuardian` L189, `deleteGuardian` L254 | guardians.go |\n| POST | /guardians/{id}/students | `GuardiansWrite` | GuardiansWrite+All, then StudentsRead+All | `linkGuardianToStudent` L265 | guardians.go |\n| PATCH | /guardians/{id}/students/{student_id} | `StudentGuardiansWrite` | GuardiansWrite+All and StudentsRead+All | `updateGuardianLink` L364 | guardians.go |\n| GET/POST/DELETE | /student-addresses | `StudentAddressesRead/Write/Delete` | + All variants | `listAddresses` L32, `createAddress` L75, `deleteAddress` L160 | studentsub.go |\n| GET/POST/DELETE | /student-documents | `StudentDocumentsRead/Write/Delete` | | `listDocuments` L184, `createDocument` L227, `deleteDocument` L370 | studentsub.go |\n| POST | /student-documents/{id}/verify | `StudentDocumentsWrite` | | `verifyDocument` L299 | studentsub.go |\n| GET/POST/PATCH/DELETE | /student-notes | `StudentNotesRead/Write/Delete` | | `listNotes` L391, `createNote` L444, `updateNote` L510, `deleteNote` L574 | studentsub.go |\n| GET/POST/GET/PATCH/DELETE | /achievements (+/{id}) | `AchievementsRead/Write/Delete` | AchievementsRead, StudentAchievementsReadAll (list/get) | `listAchievements` L416, `createAchievement` L524, `updateAchievement` L616, `deleteAchievement` L708 | recognition.go |\n| GET/POST/GET/PATCH/PUT/DELETE | /student-achievements (+/{id}, PUT /{id}/showcase) | `StudentAchievementsRead/Write/Delete` | + All | `listStudentAchievements` L743, `awardAchievement` L855, `updateStudentAchievement` L930, `showcaseStudentAchievement` L1001, `deleteStudentAchievement` L1076 | recognition.go |\n| GET/POST/PATCH/DELETE | /praises (+/{id}/reactions) | `PraisesRead/Write/Delete`, `PraiseReactionsRead/Write` | recognitionRead / recognitionWrite | `createPraise` L1209, `updatePraise` L1305, `reactToPraise` L1492 | recognition.go |\n| DELETE | /praise-reactions/{id} | `PraiseReactionsDelete` | PraiseReactionsDelete, PraisesDeleteAll | `deletePraiseReaction` L1558 | recognition.go |\n\nRoute table source: server.go `mountTenantPlane` L174-L259, `mountStudentRecords` L424, `mountRecognition` recognition.go L1593.\n\n### 2.2 Identity model: the person is the anchor\n\n`Person.cas_user_id` is required and unique (schema/person.go L21-22; create returns 409 on duplicate); students, guardians and staff all point at a person (`SetPersonID`). A teacher points at a staff row (`staff_id`), NOT at a person (teachers.go createTeacher L137-145). So the chain is person -> staff -> teacher and person -> student / guardian.\n\n`createPerson` (persons.go L115) requires an existing CAS id (`cas_user_id`, 400 \"mint the CAS identity first\") and `first_name`; `display_name` defaults to `first + last`; unknown `status` 400 (`active` or `inactive`).\n\n### 2.3 Provision / link / inline-person flows\n\n```mermaid\nsequenceDiagram\n    participant C as ENTRY client\n    participant H as Handler provisionPerson or createStudent\n    participant PI as SHARED personIDFor\n    participant P as SHARED Provisioner.Provision\n    participant IP as INTERFACE IdentityProvider\n    participant CAS as EXTERNAL CAS admin\n    participant DB as DB tenant persons\n\n    C->>H: POST /persons/provision or POST /students with person object\n    H->>H: field gate rejectUnauthorizedFields\n    H->>PI: person_id given? use it, else need person object\n    PI->>P: Provision(username, first_name, group_keys ...)\n    P->>P: default display name, generate Eg# password if none\n    P->>IP: FindGroup(primary group) if group_keys given\n    IP->>CAS: lookup group\n    P->>IP: CreateUser\n    IP->>CAS: create user\n    alt created\n        P->>P: CreatedInCAS true, password returned once\n    else email taken\n        P->>IP: FindUser(email)\n        P->>P: LinkedToExist true\n    else username taken or user exists\n        P->>IP: FindUser(username) then FindUser(email)\n        P->>P: LinkedToExist true or ErrUnrecoverable\n    end\n    P->>IP: AddUserToGroup for remaining group keys\n    P->>DB: upsertPerson by cas_user_id (existing row is reused untouched)\n    P-->>PI: Person\n    PI-->>H: person id\n    H->>DB: Create student / guardian / staff row (separate statement, no transaction)\n    H-->>C: 201 (provision returns 200 when nothing new was created or linked)\n```\n\n| Node | Code |\n|---|---|\n| Handlers | persons.go:provisionPerson L317 (501 if `!provisioner.Available()`), `linkPerson` L412 (identifier = CAS username or email, required 400) |\n| personIDFor | internal/transport/http/inlineperson.go:personIDFor L46: `person_id` wins; else needs `person` object (400 otherwise), 501 if provisioning not configured, else `Provision`. `rejectInlinePerson` L37 refuses a `person` object on PATCH (400). `withoutPerson` L15 strips the `person` key before the field gate |\n| Used by | `createStudent` (students.go L146), `createGuardian` (guardians.go L162), `createStaff` (staff.go L140). `createTeacher` has no inline person |\n| Provision | internal/service/provisioning.go:Provision L62. Errors: `username is required`, `first_name is required` come back as plain errors |\n| Link | provisioning.go:Link L224: `FindUser` -> `upsertPerson`; fills first/last name from CAS full name, email and phone from CAS |\n| IdentityProvider | provisioning.go:IdentityProvider L17 (`CreateUser`, `FindUser`, `FindGroup`, `AddUserToGroup`); impl `cas.AdminClient` (infrastructure/cas/admin.go L86/L210/L146/L194) |\n| upsertPerson | provisioning.go L194: look up by `cas_user_id`; existing row is returned unchanged (name/email in the request are ignored) |\n| Error mapping | persons.go:writeProvisioningErr L382: `ErrCallerRejected` 401, `ErrCallerForbidden` 403, `ErrProvisioningUnavailable`/`ErrNoIdentityProvider`/`ErrLookupUnsupported` 501, `ErrUnrecoverable` / `ErrUsernameTaken` / `ErrEmailTaken` / `ErrUserExists` 409, anything else 502 |\n| Response | provisionPerson L363-379: 201 when `CreatedInCAS` or `LinkedToExist`, else 200; the generated `password` is returned only when the identity was created in CAS in this call |\n| Wiring | cmd/api/main.go:newProvisioner L185 (disabled when `!cfg.AuthEnabled()`, then people must already exist in CAS) |\n\nInvariants and sharp edges (all verified in code):\n\n- No transaction spans CAS user creation, the person upsert and the downstream student/guardian/staff insert. A failing student insert (e.g. 409 duplicate admission number) leaves the CAS user and the person row behind. A retry with the same `username` takes the \"username taken -> link\" path and reuses them.\n- `Provision` validation errors (`username is required`, `first_name is required`) are plain `errors.New` values, so `writeProvisioningErr` falls to its default and returns 502 \"the identity service could not create that person\" instead of a 400. Verified by reading both functions; no handler pre-check exists.\n- A partial group failure after the CAS user exists returns `ErrUnrecoverable` (409) even though the identity was created.\n\n### 2.4 Guardian-student links\n\n```mermaid\nflowchart TD\n    R[\"ENTRY: POST /guardians/id/students\"]:::entry\n    F1[\"rejectFields linkFields: student_id, relationship_type, is_primary, is_emergency_contact, can_pickup, can_view_academic, can_view_finance\"]:::auth\n    V[\"required: student_id, relationship_type 400\"]:::shared\n    S1[\"scopeFor GuardiansWrite + All\"]:::shared\n    RG[\"reachGuardian\"]:::shared\n    S2[\"scopeFor StudentsRead + All\"]:::shared\n    E403[\"ERROR: 403 linking requires StudentsRead\"]:::err\n    RS[\"reachStudent\"]:::shared\n    E404[\"ERROR: 404 guardian or student not found\"]:::err\n    INS[(\"DB: student_guardians INSERT\")]:::db\n    E409[\"ERROR: 409 constraint (duplicate link or bad FK)\"]:::err\n    U[\"ENTRY: PATCH /guardians/id/students/student_id\"]:::entry\n    U1[\"422 student_id in body cannot be moved\"]:::err\n    U2[\"write both scopes, reach both, linkWritableBy predicate\"]:::shared\n    UPD[(\"DB: student_guardians UPDATE\")]:::db\n\n    R --> F1 --> V --> S1 --> RG --> S2\n    S2 -->|not allowed| E403\n    S2 --> RS\n    RG -->|unreachable| E404\n    RS -->|unreachable| E404\n    RS --> INS\n    INS -->|error| E409\n    U --> U1\n    U --> U2 --> UPD\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Node | Code |\n|---|---|\n| Link create | guardians.go:linkGuardianToStudent L265. Field gate uses the fixed `linkFields` policy (L44), not the caller's field policy. Defaults for the booleans come from the schema. |\n| Link update | guardians.go:updateGuardianLink L364. Update predicate `linkWritableBy` L353 ANDs guardian scope and student scope. `status` is not in `linkFields`, so it cannot be patched here even though `linkPayload` declares it |\n| Reach helpers | internal/transport/http/reach.go:reachGuardian L51, `reachStudent` L27 (use `student.New(ctx).ByID().ForViewer().Count()`) |\n| Read-side effect | `access.Viewer.GuardianID` and `enrolledScope` (access/viewer.go L201) use `StudentsOfGuardianAcademic`, which is how `can_view_academic` links grant a guardian reach to a ward's offerings |\n\n### 2.5 Student records (addresses, documents, notes) and recognition\n\n| Behavior | Evidence |\n|---|---|\n| Address create flips other primaries off AFTER the insert, as a second statement without a transaction | studentsub.go:createAddress L144-156 |\n| `address_type` in {home, hostel, other}; `address_json` required | studentsub.go L106-132 |\n| Document create requires `student_id`, `asset_id`, `document_type`; verify sets `verified_at = now`, `verified_by` = the caller (supplying it is 422) | studentsub.go:createDocument L254, `verifyDocument` L299-L355 |\n| Note create requires `student_id`, `academic_session_id`, `category`, `body`; `author_person_id` is set from the viewer, 400 if caller has no person record, 422 if supplied | studentsub.go:createNote L471-483 |\n| Create handlers for address/document/note do NOT check that the student is reachable by the caller (only the field gate and the FK); update/delete/verify do scope by `StudentsFor` / `StudentsForAcademic` / `notesVisibleTo` | studentsub.go L75-157, L227-297, L444-508 vs L320-L333, L538 |\n| Note visibility: tenant reach sees all; self sees authored + `guardian`-visibility notes about self; guardian-ward sees `guardian` notes on wards; teacher assignment sees `staff` and `guardian` notes on taught students; no reach decision = authored OR taught OR guarded; `private` is visible only to the author at non-tenant reach | studentsub.go:visibleNotes L635 |\n| Achievement catalog (badge definitions) is school-wide: writes require a tenant-reach grant (`catalogWritable` -> `timetableWriteUnfiltered`) else 403; `auto_rule` award mode without `criteria_json` is 422; `points` must be >= 0 | recognition.go:createAchievement L524, `catalogWritable` L496 |\n| Award: student must exist (422), must be reachable by `access.StudentsForAwarding` (403 `notYoursToAward`); `source_type` and `source_id` must come together (422); `awarded_by` = viewer person; student, achievement, session, source are immutable after award (422) | recognition.go:awardAchievement L855-L928, `awardableStudent` L828, `updateStudentAchievement` L960-L972 |\n| Showcase: only on `awarded` rows (scoped update has `StatusEQ(awarded)`), `display_order` only while featured; featuring false clears order | recognition.go:showcaseStudentAchievement L1001 |\n| Praise: caller needs a person record (403); recipient must exist (422) and be inside the caller's recognition reach (403, \"or that is you or your own household\"); recipient types `student` or `staff` | recognition.go:createPraise L1209, `checkPraiseRecipient` L1183, `praiseRecipientExists` L1171 |\n| Reactions: visibility through `access.PraisesFor(reach)`; reactor = caller person | recognition.go:reactToPraise L1492 |\n\nObservation: `listAchievements`/`getAchievement` call `scopeFor(AchievementsRead, StudentAchievementsReadAll)` (recognition.go L432/L474), i.e. the wide entity belongs to a different area from the narrow one. The decision's field policy still comes from `AchievementsRead`. Not verified what the viewer's `Unrestricted` flag changes here because those handlers ignore the viewer.\n\n---\n\n## 3. Academic structure\n\n### 3.1 Routes (`mountAcademic`, server.go L315-L422)\n\n| Method | Path | Permission | Handler (internal/transport/http/) |\n|---|---|---|---|\n| GET/POST/GET/PATCH/DELETE | /academic-sessions[/{id}] | `AcademicSessionsRead/Write/Write/Write/Delete` | academic.go: `listSessions` L30, `getSession` L59, `createSession` L81, `updateSession` L152, `deleteSession` L229 |\n| GET/POST/GET/PATCH/DELETE | /branches[/{id}] | `ReferenceRead/Write/Delete` | branches.go: `listBranches` L25, `getBranch` L54, `createBranch` L76, `updateBranch` L130, `deleteBranch` L185 |\n| GET/POST/PATCH/DELETE | /grade-levels[/{id}] | `ReferenceRead/Write/Delete` | academic.go: `listGradeLevels` L270, `createGradeLevel` L299, `updateGradeLevel` L353, `deleteGradeLevel` L403 |\n| GET/POST/PATCH/DELETE | /school-houses[/{id}] | `Reference*` | academic.go: `listHouses` L417, `createHouse` L446, `updateHouse` L496, `deleteHouse` L546 |\n| GET/POST/PATCH/DELETE | /subjects[/{id}] | `Reference*` | subjects.go: `listSubjects` L30, `createSubject` L59, `updateSubject` L115, `deleteSubject` L170 |\n| GET/POST/PATCH/DELETE | /subject-groups[/{id}] | `Reference*` | subjects.go: `listSubjectGroups` L183, `createSubjectGroup` L212, `updateSubjectGroup` L259, `deleteSubjectGroup` L306 |\n| GET/POST/GET/PATCH/DELETE | /sections[/{id}] | `SectionsRead/Write/Delete` (calendar: `TimetableRead`) | sections.go: `listSections` L40, `getSection` L69, `createSection` L94, `updateSection` L160, `deleteSection` L231 |\n| GET/POST/GET/PATCH/DELETE | /subject-offerings[/{id}] | `SubjectOfferingsRead/Write/Delete` (results: `TimetableRead`) | subjects.go: `listOfferings` L327, `getOffering` L356, `createOffering` L381, `updateOffering` L465, `deleteOffering` L577 |\n| GET/POST/GET/PATCH/DELETE | /elective-groups[/{id}] | `SubjectOfferingsRead/Write/Delete` | electives.go: `listElectiveGroups` L81, `getElectiveGroup` L142, `createElectiveGroup` L175, `updateElectiveGroup` L241, `deleteElectiveGroup` L307 |\n| GET/POST/DELETE | /elective-groups/{id}/offerings[/{offeringID}] | `SubjectOfferingsRead/Write/Delete` | electives.go: `listElectiveGroupOfferings` L314, `addElectiveGroupOffering` L360, `removeElectiveGroupOffering` L450 |\n| GET/POST/PATCH | /elective-groups/{id}/choices[/{enrollmentID}] | `SubjectEnrollmentsRead/Write/Write` | electives.go: `listElectiveChoices` L485, `chooseElective` L594, `changeElectiveChoice` L688 |\n| GET/POST/GET/PATCH/DELETE | /enrollments[/{id}] | `EnrollmentsRead/Write/Delete` | enrollments.go: `createEnrollment` L109, `updateEnrollment` L193, `deleteEnrollment` L276 (+ list/get) |\n| GET/POST/PATCH/DELETE | /subject-enrollments[/{id}] | `SubjectEnrollmentsRead/Write/Delete` | subjectenrollments.go: `listSubjectEnrollments` L27, `createSubjectEnrollment` L66, `updateSubjectEnrollment` L171, `deleteSubjectEnrollment` L294 |\n| GET/POST/PATCH/DELETE | /teacher-assignments[/{id}] | `TeacherAssignmentsRead/Write/Delete` | teacherassignments.go: `listTeacherAssignments` L17, `createTeacherAssignment` L59, `updateTeacherAssignment` L146, `deleteTeacherAssignment` L224 |\n\nReference-data, section and offering handlers use `routeDecision` for the field gate and do NOT call `scopeFor`: they have no per-row scoping (any holder of the route entity reaches every row), unlike people, enrollments, library, curriculum, papers.\n\n### 3.2 Structure dependency graph (what each create requires, from required-field checks)\n\n```mermaid\nflowchart TD\n    AS[(\"DB: academic_sessions\")]:::db\n    BR[(\"DB: branches\")]:::db\n    GL[(\"DB: grade_levels, sequence required\")]:::db\n    SUBJ[(\"DB: subjects\")]:::db\n    SG[(\"DB: subject_groups\")]:::db\n    SEC[\"Section: session + branch + grade + name + code\"]:::shared\n    OFF[\"SubjectOffering: session + section + subject\"]:::shared\n    EG[\"ElectiveGroup: section, session copied from section\"]:::shared\n    ARM[\"ElectiveGroupOffering: offering must match group section and session\"]:::shared\n    ENR[\"StudentEnrollment: student + session + section + enrollment_date\"]:::shared\n    SE[\"StudentSubjectEnrollment: enrollment + offering, same section and session\"]:::shared\n    TA[\"TeacherAssignment: session + teacher + section + role_type, write_all only\"]:::shared\n    GS[\"GradingScheme / ResultScheme attach: same session, result scheme active\"]:::shared\n    STU[(\"DB: students (section 2)\")]:::db\n    TCH[(\"DB: teachers (section 2)\")]:::db\n\n    AS --> SEC\n    BR --> SEC\n    GL --> SEC\n    SEC --> OFF\n    SUBJ --> OFF\n    SG -.optional.-> OFF\n    GS -.optional.-> OFF\n    SEC --> EG\n    EG --> ARM\n    OFF --> ARM\n    STU --> ENR\n    SEC --> ENR\n    AS --> ENR\n    ENR --> SE\n    OFF --> SE\n    TCH --> TA\n    SEC --> TA\n    OFF -.optional.-> TA\n\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n```\n\n| Edge/Node | Code |\n|---|---|\n| Section | sections.go:createSection L94: 400 unless `academic_session_id`, `branch_id`, `grade_level_id`, `name`, `code`; status active/inactive; update refuses null name/code/status (`rejectNull`) and supports clearing capacity, room, class teacher |\n| Grade level | academic.go:createGradeLevel L299: `sequence` required (\"drives promotion order\") |\n| Offering | subjects.go:createOffering L381: needs session, section, subject; `marksValid` (pass <= max, both >= 0, 422), `minutesValid` (0..10080); `gradingSchemeAttachable` L612 (scheme's `academic_session_id` must equal the offering's -> 422 `grading_scheme_other_session`); `resultSchemeAttachable` L584 (same session -> 422 `result_scheme_other_session`; must be `active` -> 422 `result_scheme_not_active`). Create does NOT check that `section_id` belongs to `academic_session_id`. Update re-reads the offering to use its stored session for the scheme checks |\n| Elective group | electives.go:createElectiveGroup L175: session is copied from the section (`SetAcademicSessionID(section.AcademicSessionID)`); `(section_id, code)` unique -> 409 `electiveGroupCodeTaken`; update refuses `section_id` (422) |\n| Arm | electives.go:addElectiveGroupOffering L360: offering must share section and session with the group (422); an offering may be an arm of only one group (pre-check 409 plus unique index `electivegroupoffering_subject_offering_id`, schema/elective.go L97) |\n| Enrollment | enrollments.go:createEnrollment L109: needs student, session, section, `enrollment_date`; `(student_id, academic_session_id)` is unique (schema/enrollment.go `index.Fields(\"student_id\",\"academic_session_id\").Unique()`), so a second enrollment in the same session is 409 via `writeTenantEntErr`. No check that the section belongs to the same session; PATCH can move `section_id` with no session check |\n| Subject enrollment | subjectenrollments.go:createSubjectEnrollment L66: offering section and session must equal the enrollment's (400); `student_id` and `academic_session_id` are copied from the enrollment; `(student_enrollment_id, subject_offering_id)` unique (schema/subjectenrollment.go L47) |\n| Teacher assignment | teacherassignments.go:createTeacherAssignment L59: needs session, teacher, section, `role_type`; a viewer that is `Restricted()` gets 403 \"requires TeacherAssignmentsWriteAll\" (L100); `assigned_by` taken from viewer. No check that `subject_offering_id` matches section/session |\n\n### 3.3 Academic-session handling (\"current\" session)\n\nVerified:\n\n- `academic_sessions.is_current` is a plain boolean column with default false. I found no unique or partial index on it (`internal/ent/schema/academic.go` L26; `migrations/tenant` mentions `is_current` only in the initial table DDL).\n- `createSession` / `updateSession` set the flag and THEN, in a second non-transactional statement, `demoteOtherSessions` (academic.go L254) sets `is_current=false` on every other session. A crash or concurrent request between the two statements can leave two current sessions.\n- `end_date` must be after `start_date` (422) on create (`sessionDates` L236); PATCH does not re-check the pair.\n- Everything that scopes a person to \"their classes\" depends on the CURRENT session only: `access.Resolve` -> `teachingScope` (access/viewer.go L248, joins `AcademicSession.IsCurrent(true)`) and `enrolledScope` (L201). Teacher assignments and own/ward subject enrollments of non-current sessions therefore grant no reach.\n- Statuses: session `upcoming | active | closed` (400 otherwise); enrollment status `active | completed | withdrawn`, promotion `promoted | retained | withdrawn`; `previous_enrollment_id` chains a student across sessions (set on create only; PATCH cannot change it).\n\n### 3.4 Subject-enrollment \"one arm per elective group\" rule (the supersession flow)\n\nThe only supersession of subject enrollments is the elective arm switch. Rows are never deleted: the old arm is marked `dropped` with `dropped_on` and a new/reactivated active row is written, in one DB transaction.\n\n```mermaid\nsequenceDiagram\n    participant C as ENTRY client\n    participant H as changeElectiveChoice PATCH /elective-groups/id/choices/enrollmentID\n    participant A as SHARED electiveArmsOf, armOfGroup, reachableEnrollment\n    participant U as SHARED begin() unitOfWork\n    participant DB as DB student_subject_enrollments\n\n    C->>H: subject_offering_id, effective_from (default today UTC)\n    H->>H: scopeFor SubjectEnrollmentsWrite + All, field gate on fixed column list\n    H->>A: group exists, has arms (422 no arms), offering is an arm (422), enrollment reachable\n    A-->>H: group, arms, enrollment\n    H->>H: enrollment.section must equal group.section (422)\n    H->>U: BEGIN\n    U->>DB: activeArm(enrollment, arms) status=active\n    alt no active arm\n        H-->>C: 409 post a choice instead\n    else same arm already held\n        H-->>C: 200 dropped null, chosen = held\n    else different arm\n        U->>DB: UPDATE held SET status=dropped, dropped_on=effective_from\n        U->>DB: takeArm: reactivate existing (status active, clear dropped_on) or INSERT new, is_elective_choice true\n        U->>U: COMMIT\n        H-->>C: 200 dropped + chosen\n    end\n```\n\n| Node | Code |\n|---|---|\n| chooseElective | electives.go:chooseElective L594: same pre-checks, then in a transaction `activeArm`; 409 if the pupil already holds this arm or another arm (\"move them with PATCH\"); else `takeArm` (L885) and 201 |\n| changeElectiveChoice | electives.go L688-L800 (diagram above) |\n| activeArm | electives.go L867: first active row with `student_enrollment_id` and `subject_offering_id IN arms` |\n| Ordinary door | subjectenrollments.go:holdsNoOtherArm L257, called from `createSubjectEnrollment` (L141, only when status will be active) and `updateSubjectEnrollment` (L213, only when PATCHing status to active): 409 naming the held arm and pointing to the elective PATCH |\n| unitOfWork | internal/transport/http/attendance.go:begin L746, `unitOfWork` L741 (reuses an already-started tx via `ErrTxStarted`) |\n\nInvariant caveat (verified from schema): the \"one active arm\" rule is code-level. The only DB constraints are unique `(student_enrollment_id, subject_offering_id)` and unique `subject_offering_id` per arm; there is no constraint that prevents two active arms of one group, so two concurrent chooses can both pass `activeArm`.\n\nOther \"supersedes_id\" uses in scope are lineage pointers, not automatic supersession: curricula (section 5) and library items (section 4) merely store `supersedes_id`; nothing in the handlers archives the predecessor.\n\n---\n\n## 4. Library\n\n### 4.1 Routes (`mountTenantPlane` L224-L240; handlers in internal/transport/http/library.go unless noted)\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET | /library | `LibraryRead` | `listLibraryItems` L685 |\n| POST | /library | `LibraryCreate` | `createLibraryItem` L774 |\n| GET | /library/{uuid} | `LibraryRead` | `getLibraryItem` L734 |\n| PATCH | /library/{uuid} | `LibraryWrite` | `updateLibraryItem` L932 |\n| DELETE | /library/{uuid} | `LibraryDelete` | `deleteLibraryItem` L1180 |\n| GET | /library/scopes | `LibraryRead` | `getLibraryScopes` (scopes.go L45) |\n| GET | /library/search | `LibraryRead` | `searchLibrary` (search.go L185) |\n| POST | /library/assets | `LibraryCreate` | `createAsset` L1454 |\n| GET | /library/assets, /library/assets/{id} | `LibraryRead` | `listAssets` L1372, `getAsset` L1417 |\n| PUT | /library/assets/{id}/content | `LibraryCreate` | `uploadAssetContent` L1658 (streaming, longer timeout: server.go:requestTimeout/streamsItsBody L98-L116) |\n| GET | /library/assets/{id}/content | `LibraryRead` | `getAssetContent` (assetcontent.go) |\n| POST | /library/assets/{id}/ready | `LibraryCreate` | `markAssetReady` L1764 |\n| GET | /library/assets/{id}/link | `LibraryRead` | `getAssetLink` L1906 |\n| DELETE | /library/assets/{id} | `LibraryDelete` | `deleteAsset` L1852 |\n\nAsset surface only (lifecycle covered elsewhere): `createAsset` mints id and storage key `library/<uuid>` server-side, presigns a PUT with the declared size and sha256, inserts the row, returns upload URL + headers; client-supplied `storage_key` or `status` is 422; `size_bytes > MaxAssetBytes` is 422 `AssetTooLargeCode`. `markAssetReady` HEADs the object and compares size and sha256 (409 missing, size mismatch, digest mismatch, deleted; 503 digest unavailable) before setting `ready`.\n\n### 4.2 Create / update library item (publish and indexing hand-off)\n\n```mermaid\nflowchart TD\n    C[\"ENTRY: POST /library or PATCH /library/id\"]:::entry\n    DEC[\"DecodeFields + decodePaper (paper sidecar object)\"]:::shared\n    SCOPE[\"scopeFor LibraryCreate+LibraryWriteAll or LibraryWrite+LibraryWriteAll\"]:::shared\n    GATE[\"rejectUnauthorizedFields item + paper columns\"]:::auth\n    REQ[\"title, audience required 400, kind book|note|document|paper\"]:::shared\n    PAIR[\"checkPaperPairing: kind paper needs paper object, other kinds refuse it (422)\"]:::shared\n    AUD[\"checkAudienceScope: audience school|grade|section|offering|owner and the one anchor it needs (400)\"]:::shared\n    PUB[\"checkPublishScope audienceWithinWriteScope (403 outside what you may publish to)\"]:::auth\n    OWN[\"attributedTo owner_person_id from viewer\"]:::shared\n    MODE[\"ingest mode: explicit or inferred\"]:::shared\n    TX[\"optional Tx only when a paper sidecar is written\"]:::shared\n    ITEM[(\"DB: content_items INSERT/UPDATE\")]:::db\n    SIDE[(\"DB: question_papers sidecar\")]:::db\n    IDX[\"indexOnPublish after commit\"]:::shared\n    DISP{{\"INTERFACE: indexing.Dispatcher.Submit\"}}:::iface\n    ASYNC[\"ASYNC: engine ingest runs outside the request\"]:::async\n    ENG[\"EXTERNAL: retrieval engine\"]:::ext\n    ERR[\"ERROR: 400/403/409/422 as noted\"]:::err\n\n    C --> DEC --> SCOPE --> GATE --> REQ --> PAIR --> AUD --> PUB --> OWN --> MODE --> TX\n    TX --> ITEM --> SIDE\n    ITEM --> IDX\n    IDX --> DISP --> ASYNC --> ENG\n    GATE -->|denied| ERR\n    PAIR -->|violation| ERR\n    PUB -->|violation| ERR\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef iface fill:#e3d4ff,stroke:#6a3fb5,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef ext fill:#ffe0b3,stroke:#c77700,color:#000\n    classDef async fill:#fff3a8,stroke:#a68b00,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Node | Code |\n|---|---|\n| Audience rules | library.go:checkAudienceScope L528: audience `grade` requires `grade_level_id`, `section` requires `section_id`, `offering` requires `subject_offering_id`, `school` and `owner` carry none, and any non-matching anchor is refused (400). `patchedAnchor` L636 clears anchors when the audience changes |\n| Publish scope | library.go:audienceWithinWriteScope L567: unrestricted or tenant-reach -> any audience; else `owner` always ok, `section` must be one of the viewer's `SectionIDs`, `offering` one of `SubjectOfferingIDs`, `grade` must be a grade of a taught section; `school` is never allowed for a scoped writer |\n| Paper sidecar | library.go: kind `paper` carries a 1:1 `question_papers` row (exam_type required on create, positive year/marks/duration); create/update wrap item+sidecar in a tx only when a paper object is present (L861-L869, L1037-L1045) |\n| Immutable | `asset_id`, `owner_person_id` cannot be changed on PATCH (422) - library.go:rejectImmutableLibraryFields L646 |\n| supersedes_id | stored as given (`SetNillableSupersedesID`) with no lineage check or predecessor archive in library handlers (L886, L1058) |\n| Ingest mode | internal/transport/http/ingestmode.go: `explicitIngestMode` L30 / `inferredIngestMode` L48 (PDF asset -> `defer`, anything else or no asset -> `now`); `checkDeferrableAsset` L61 (defer needs an asset and it must be a PDF, 422); `checkDeferrablePlacements` L103 (PATCH to defer is 409 while a confirmed chapter placement exists); `checkConfirmableAgainstIngestMode` L124 (a placement with a curriculum node cannot be confirmed while the item is `defer`, 409 - called from placement.go:updatePlacement L609) |\n| Publish -> indexing | library.go:indexOnPublish L1132, called after save in both create (L921) and update (L1110). It is a silent no-op unless retrieval indexing is configured (`cfg.RetrievalIndexing()`), a `libraryIndexer` is set (`UseIndexer` L1122, wired in cmd/api/main.go L104), status just became `published`, the item has an `asset_id`, and the school has a `cas_tenant_id` (the engine partitions on it). Then `indexing.MarkPending` and `libraryIndexer.Submit(client, Request)`; failures are logged and `indexing.Abandon` is called, never returned to the caller. The HTTP response is therefore not a promise that indexing happened |\n| Dispatcher | internal/service/indexing/dispatcher.go:Submit L62 (async worker); `Engine` interface internal/service/indexing/indexer.go L36; sweeper retries pending items (cmd/api/main.go L106) |\n| Delete | library.go:deleteLibraryItem L1180: scoped by `LibraryItemsWritableBy` (owner-only unless tenant reach) |\n\n### 4.3 Visibility, scopes and search\n\n`access.LibraryItemsFor` (internal/data/access/library.go L121): unrestricted viewer or tenant reach -> every item in every status; otherwise an OR of arms (audience `school`, own `owner` items, offerings the viewer is enrolled in / a ward is enrolled in, and for teachers sections, grades of their sections and offerings they teach) AND `status = published OR owner = me`. A constrained (pinned) grant that cannot be translated yields no rows (`libraryPinsUsable`). `LibraryItemsWritableBy` L132: tenant reach, else readable AND owned.\n\n```mermaid\nflowchart TD\n    S[\"ENTRY: GET /library/search?q=&curriculum_node_id=\"]:::entry\n    CFG[\"search enabled and searcher set? else 503 retrieval_disabled\"]:::err\n    TEN[\"school has cas_tenant_id? else 409 retrieval_tenant_unmapped\"]:::err\n    OPT[\"parseSearchOptions q required, top_k 1..50\"]:::shared\n    SF[\"scopeFor LibraryRead + LibraryReadAll val.ScopesFor(viewer, decision, tenant.SchoolID)` -> labels; 409 `scope_unresolved` or `scope_pinned_unexpressible` when unresolvable |\n| Fail-closed bias | the code consistently refuses rather than widens: unreadable placements are counted and skipped, >500 documents or placements -> 409, an empty scope does not call the engine |\n\n---\n\n## 5. Curriculum and placements\n\n### 5.1 Routes (`mountCurriculum` L262-L313)\n\n| Method | Path | Permission | Handler |\n|---|---|---|---|\n| GET/POST | /curricula | `CurriculumRead` / `CurriculumCreate` | `listCurricula` L515, `createCurriculum` L601 |\n| GET/PATCH/DELETE | /curricula/{id} | `CurriculumRead/Write/Delete` | `getCurriculum` L562, `updateCurriculum` L706, `deleteCurriculum` L818 |\n| GET/POST | /curricula/{id}/nodes | `CurriculumRead` / `CurriculumCreate` | `listCurriculumNodes` L829, `createCurriculumNode` L890 |\n| PATCH/DELETE | /curriculum-nodes/{id} | `CurriculumWrite/Delete` | `updateCurriculumNode` L989, `deleteCurriculumNode` L1101 |\n| GET | /curriculum-nodes/{id}/content | `ContentPlacementsRead` | `resolveCurriculumNodeContent` (resolve.go L390) |\n| GET/POST | /placements | `ContentPlacementsRead` / `Create` | `listPlacements` L322, `createPlacement` L419 (placement.go) |\n| GET/PATCH/DELETE | /placements/{id} | `ContentPlacementsRead/Write/Delete` | `getPlacement` L375, `updatePlacement` L526, `deletePlacement` L631 |\n\n(curriculum.go and placement.go are in internal/transport/http/.)\n\n### 5.2 Curriculum and node write rules\n\n| Rule | Code |\n|---|---|\n| Create needs name, code, `academic_session_id`, `subject_id`, `grade_level_id`; viewer's reach must cover that subject and grade (\"you may only create a curriculum you could then write\", 403) | curriculum.go:createCurriculum L601, `checkCurriculumCreateReach` L396 (`viewerTeachesSubjectGrade`, tenant reach, translated pins via `gradeLevelWithinPins`) |\n| At most one `active` curriculum per (session, subject, grade): pre-check 409 `curriculum_active_exists` and a partial unique index `status = 'active'` | curriculum.go:checkActiveCurriculum L435; schema/curriculum.go Indexes L63-L68. On update the check runs only on a transition to active |\n| `supersedes_id` and `copied_from_id` are lineage references: must name a curriculum the caller can read (422), cannot name itself; no automatic archive of the old curriculum | curriculum.go:checkCurriculumLineage L245 |\n| Node: `title`, `sequence >= 0` required; `parent_id` and `copied_from_id` must be nodes of the SAME curriculum (422); on update a re-parent must not create a cycle (walks up to `maxCurriculumDepth`, 422); the curriculum id comes from the path and is never accepted in the body (422) | curriculum.go:createCurriculumNode L890, `checkCurriculumNodeParent` L451, `checkCurriculumNodeCycle` L488 |\n| Node FK deletes cascade from the curriculum; placements restrict | schema/curriculumnode.go L42-L53 |\n\n### 5.3 Placements\n\nA placement links a content item (optionally a content node/page range) to a curriculum (optionally a node).\n\n| Rule | Code |\n|---|---|\n| Needs `curriculum_id`, `content_item_id`, `grain` (`curriculum` or `node`); grain `node` requires `curriculum_node_id`, grain `curriculum` forbids it (422) | placement.go:createPlacement L419, `checkPlacementGrain` L176 |\n| Created `proposed` only; any other status in the create body is 422 (\"confirming or rejecting is a separate request\") | placement.go L476-L486 |\n| Curriculum must be writable by caller (`CurriculaWritableBy`), the node must belong to it, the content item must be readable by caller (needs `LibraryRead`, 403 otherwise) and the content node must belong to the item (422) | placement.go:checkPlacedCurriculum L279, `checkPlacedContent` L252 |\n| `created_by`, `confirmed_by`, `confirmed_at` are server-set (422 if sent); confirming sets `confirmed_by` = caller (400 if no person record) and `confirmed_at`; leaving confirmed clears both | placement.go:rejectServerSetPlacementFields L144, `placementConfirmation` L304 |\n| Re-pointing curriculum, node, item or content node is 422 (\"reject and create another\") | placement.go:rejectImmutablePlacementFields L159 |\n| Confirming a node-grain placement for a `defer` item is 409 | placement.go L609; ingestmode.go:checkConfirmableAgainstIngestMode L124 |\n\n### 5.4 resolveCurriculumNodeContent\n\nThe task called this \"fail-open\"; in code it is built to fail CLOSED. The \"fail-open\" wording appears in docs (`docs/DESIGN-NOTES.md`, `docs/LIBRARY-CURRICULUM-PLAN.md` \"Fail-open checklist\") as the class of bug the handler is designed to avoid.\n\n```mermaid\nflowchart TD\n    R[\"ENTRY: GET /curriculum-nodes/id/content?include_proposed=&include_ancestors=\"]:::entry\n    P[\"parseResolveOptions flags true|false else 400\"]:::shared\n    S1[\"scopeFor ContentPlacementsRead + All; not allowed 403\"]:::auth\n    F[\"requireResolvedFields: field policy must permit the whole tuple, else 403\"]:::auth\n    S2[\"scopeFor LibraryRead + All; not allowed 403\"]:::auth\n    N[(\"DB: curriculum_nodes visible to caller, else 404\")]:::db\n    L[\"curriculumNodeLineage when include_ancestors\"]:::shared\n    PL[(\"DB: placements confirmed (+ proposed), at node or ancestors or curriculum-grain, LIMIT 501\")]:::db\n    BIG[\"ERROR: 409 placements_unbounded when more than 500\"]:::err\n    IT[\"readablePlacedItems through LibraryItemsFor\"]:::auth\n    AS[\"placedAssets sha256 and deleted flag\"]:::shared\n    RES[\"resolvePlacements: per placement index_state and retrieval_state; unreadable counted not shown\"]:::shared\n    OUT[\"200 resolution + content[] + counts\"]:::shared\n\n    R --> P --> S1 --> F --> S2 --> N --> L --> PL\n    PL -->|over 500| BIG\n    PL --> IT --> AS --> RES --> OUT\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Node | Code |\n|---|---|\n| Handler | internal/transport/http/resolve.go:resolveCurriculumNodeContent L390-L507 |\n| Needs two grants | `ContentPlacementsRead` and `LibraryRead` (L410-L435) |\n| Placement predicate | resolve.go:placementsResolving L146: nodes IN lineage, OR (`grain = curriculum` AND same curriculum) when ancestors are included; statuses `resolvableStatuses` L139 (confirmed, plus proposed on request) |\n| States | `indexStateOf` L252: `not_indexed` unless item has `indexed_sha256` and `engine_document_id`; `current` when the asset digest matches `indexed_sha256`, else `stale`. `retrievalStateOf` L273: `source_deleted` (asset deleted) > `unpublished` (item not published) > index state |\n| Overall `resolution` | `resolutionOf` L347: `unmapped` (no placements), `restricted` (placements exist, none readable), `resolved` (any current/stale), `unindexed`, `source_deleted`, else `unpublished` |\n| Why not fail-open | `requireResolvedFields` L364 (a partial tuple would \"silently search the wrong pages\"), `maxResolvedPlacements = 500` with `LIMIT 501` (L460) and 409 `placements_unbounded` rather than truncating, unreadable placements are counted in `counts.unreadable` and omitted rather than leaking, response fields `engine_document_id` and `content_status` only when the library field policy permits them (L484-L485) |\n| Shared with search | `curriculumSearchScope` (search.go L318) reuses the same predicate/limit/asset helpers and additionally skips `not_indexed` and `source_deleted` items before building the engine document filter, with per-placement `page_start/page_end` spans |\n\n---\n\n## 6. Question bank, blueprints, papers\n\n### 6.1 Routes\n\n| Method | Path | Permission | Handler | File (internal/transport/http/) |\n|---|---|---|---|---|\n| GET/POST | /questions | `QuestionBankRead` / `QuestionBankCreate` | `listQuestions` L84, `createQuestion` L238 | questions.go |\n| GET/PATCH/DELETE | /questions/{id} | `QuestionBankRead/Write/Delete` | `getQuestion` L185, `updateQuestion` L345, `deleteQuestion` L480 | questions.go |\n| GET/POST | /questions/{id}/versions | `QuestionBankRead` / `Write` | `listQuestionVersions` L491, `createQuestionVersion` L578 | questions.go |\n| GET/PATCH | /question-versions/{id} | `QuestionBankRead` / `Write` | `getQuestionVersion` L542, `updateQuestionVersionStatus` L682 | questions.go |\n| GET/POST | /blueprints | `BlueprintsRead` / `Create` | `listBlueprints` L93, `createBlueprint` L335 | blueprints.go |\n| GET/PATCH/DELETE | /blueprints/{id} | `BlueprintsRead/Write/Delete` | `getBlueprint` L167, `updateBlueprint` L426, `deleteBlueprint` L534 | blueprints.go |\n| GET/POST | /blueprints/{id}/sections | `BlueprintsRead` / `Write` | `listBlueprintSections` L545, `createBlueprintSection` L627 | blueprints.go |\n| GET | /blueprint-sections/{id} | `BlueprintsRead` | `getBlueprintSection` L591 | blueprints.go |\n| GET/POST | /blueprint-sections/{id}/constraints | `BlueprintsRead` / `Write` | `listBlueprintConstraints` L736, `createBlueprintConstraint` L783 | blueprints.go |\n| GET/POST | /papers | `PapersRead` / `PapersCreate` | `listPapers` L157, `createPaper` L564 | papers.go |\n| GET/PATCH/DELETE | /papers/{id} | `PapersRead/Write/Delete` | `getPaper` L263, `updatePaper` L702, `deletePaper` L907 | papers.go |\n| GET/POST | /papers/{id}/sections | `PapersRead` / `Write` | `listPaperSections` L920, `createPaperSection` L1021 | papers.go |\n| GET/DELETE | /paper-sections/{id} | `PapersRead` / `PapersDelete` | `getPaperSection` L966, `deletePaperSection` L1158 | papers.go |\n| GET/POST | /paper-sections/{id}/questions | `PapersRead` / `Write` | `listPaperQuestions` L1168, `createPaperQuestion` L1214 | papers.go |\n| DELETE | /paper-questions/{id} | `PapersDelete` | `deletePaperQuestion` L1334 | papers.go |\n| GET/POST/GET/PATCH | /paper-generation-runs[/{id}] | `PaperGenerationRead/Create/Read/Write` | `listGenerationRuns` L1345, `createGenerationRun` L1484, `getGenerationRun` L1413, `updateGenerationRun` L1606 | papers.go |\n\nMounts: questions.go:`mountQuestionBank` L58, blueprints.go:`mountBlueprints` L66, papers.go:`mountPapers` L109. There are no update/delete routes for blueprint sections, blueprint constraints, paper sections (PATCH) or paper questions (PATCH); only create and delete (paper parts) exist.\n\n### 6.2 Scope (who sees and writes what) for the bank\n\nEach handler calls `scopeFor(<X>Read|Write, <X>ReadAll|WriteAll)` through `questionScope` (questions.go L75), `blueprintScope` (blueprints.go L84), `paperScope` (papers.go L139), `runScope` (papers.go L148). The row predicates live in `internal/data/access/papers.go`:\n\n- `bankReadReach` L83 / `bankWriteReach` L102: no reach decision -> teaching reach (write) or any-role reach (read); tenant reach -> all; self -> studied pairs and enrolled offerings; guardian-ward -> ward pairs/offerings; teacher assignment -> taught pairs, sections, offerings.\n- Questions and blueprints are matched on (subject, grade) pairs and on grade levels containing the viewer's sections (`questionArms`, `blueprintArms`); a question with NULL subject or grade is reachable school-wide only (`bankWriteReaches` in questions.go L755: 422 \"name the subject and the grade, or hold the school-wide write key\").\n- Papers (`paperArms`): reachable through (a) their blueprint, (b) their exam's subject offerings, or (c) their target sections (`paperTargetArm`). A student/guardian read reach carries no sections, so the target-section arm admits teachers/tenant readers; students reach papers only through blueprint or exam arms. Pins (constrained grants) translate through `papersPinnedBy`.\n\n### 6.3 Question bank rules\n\n```mermaid\nflowchart TD\n    Q[\"ENTRY: POST /questions\"]:::entry\n    QV[\"canonical_key required 400, ranges 422, bankWriteReaches 422\"]:::shared\n    QI[(\"DB: questions, unique canonical_key\")]:::db\n    Q409[\"ERROR: 409 canonical_key exists\"]:::err\n    V[\"ENTRY: POST /questions/id/versions\"]:::entry\n    VV[\"stem required, version_number must NOT be sent 422\"]:::shared\n    NEXT[\"next = latest version_number + 1\"]:::shared\n    VI[(\"DB: question_versions unique question_id, version_number\")]:::db\n    V409[\"ERROR: 409 another version recorded at same time, retry\"]:::err\n    VS[\"ENTRY: PATCH /question-versions/id\"]:::entry\n    VSV[\"only status accepted; stem, explanation, answer_data_json, version_number are 422 never edited in place\"]:::shared\n    VSU[(\"DB: question_versions status UPDATE\")]:::db\n\n    Q --> QV --> QI\n    QI -->|violates index| Q409\n    V --> VV --> NEXT --> VI\n    VI -->|violates index| V409\n    VS --> VSV --> VSU\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n```\n\n| Node | Code |\n|---|---|\n| Create question | questions.go:createQuestion L238: `canonical_key` required and is the stable identity (PATCH refuses it, 422); `created_by` from viewer; `difficulty_score` 0..100, `estimated_seconds > 0` (422, `questionText` L212); enums through `timetableEnum` |\n| Versions | questions.go:createQuestionVersion L578 (next number computed with a read, the unique index `questionversion_question_id_version_number` is the arbiter, so a race surfaces as 409) and `updateQuestionVersionStatus` L682 (versions are immutable except `status`) |\n| Reading a version | scoped through its question: `HasQuestionWith(QuestionsFor)` (questions.go L563) |\n\n### 6.4 Blueprints\n\n- `createBlueprint` (blueprints.go L335): needs `grade_level_id`, `subject_id`, `code`, `name`, `total_marks`, `duration_minutes`, and a `cognitive_scheme` (validated by `cognitiveSchemeValid` L243 and `unitWeightageValid` L289); unique `(code, version)` -> 409; `bankWriteReaches` (422).\n- `updateBlueprint` (L426): `code`, `version`, `subject_id`, `grade_level_id`, `academic_session_id` are immutable (422, \"record a new version rather than changing it\"). Nothing in the handler checks `status`, so a `published` blueprint remains editable and sections can still be added; only papers get a publish lock.\n- Sections: unique `(blueprint_id, section_code)` and `(blueprint_id, position)` -> 409; positive counts and marks (422). Constraints: type in `difficulty|bloom|topic|outcome|type`, `max_value >= min_value` (422), `value_json` must be an object.\n\n### 6.5 Papers: creation, provenance, publish/lock, target sections\n\n```mermaid\nflowchart TD\n    C[\"ENTRY: POST /papers\"]:::entry\n    GATE[\"scopeFor PapersWrite + All; rejectUnauthorizedFields; target field gate\"]:::auth\n    REQ[\"required: academic_session_id, paper_code, title, total_marks; approved_by / approved_at not allowed 422\"]:::shared\n    PROV[\"paperProvenanceOK persona_id, seed <= 128 runes; engine_document_id <= 128 bytes\"]:::shared\n    GR[\"paperGradeReaches grade_level_id writable for papers, else 422\"]:::auth\n    TR[\"paperTargetsReach: every section writable for papers, in the paper's session, in grade_level_id, max 60\"]:::auth\n    AN[\"paperAnchorsReach: blueprint writable, or exam writable, or class-anchored, else school-wide key required\"]:::auth\n    TX[\"begin() tx\"]:::shared\n    PI[(\"DB: papers INSERT\")]:::db\n    PT[(\"DB: paper_target_sections delete + bulk create\")]:::db\n    E409[\"ERROR: 409 paper_code + version exists in session\"]:::err\n    U[\"ENTRY: PATCH /papers/id\"]:::entry\n    LOCK[\"current status published -> 422 paper_is_published\"]:::err\n    APP[\"status approved by first time -> approved_by = caller, approved_at = now\"]:::shared\n    RE[\"retarget replaces the whole target set\"]:::shared\n    DEL[\"ENTRY: DELETE /papers/id and parts\"]:::entry\n    DLK[\"published: paper delete returns 404; part delete returns 422 paper_is_published\"]:::err\n\n    C --> GATE --> REQ --> PROV --> GR --> TR --> AN --> TX --> PI --> PT\n    PI -->|violates index| E409\n    U --> LOCK\n    U --> APP\n    U --> RE\n    DEL --> DLK\n\n    classDef entry fill:#cfe8ff,stroke:#1f5fa8,color:#000\n    classDef shared fill:#eeeeee,stroke:#777,color:#000\n    classDef db fill:#d4f2d4,stroke:#2e7d32,color:#000\n    classDef err fill:#ffd0d0,stroke:#b00020,color:#000\n    classDef auth fill:#ffd6f0,stroke:#b0408a,color:#000\n```\n\n| Rule | Evidence |\n|---|---|\n| Status enum `draft, reviewed, approved, published` (default draft). Create accepts any of them, including `published`, with no ordering check | schema/paper.go Fields; papers.go:createPaper L637-L644 |\n| Publish lock: a published paper is frozen. PATCH refuses with 422 `paper_is_published` BEFORE looking at the new status, so nothing (including archiving) can be PATCHed on a published paper. Adding sections/questions is refused the same way (`writablePaper` L1001). \"Supersede, not edit\": publish a new `version` of the same `paper_code` | papers.go:updatePaper L775, `refusePublishedPaper` L900, `writablePaper` L1001 |\n| Deleting a published paper returns 404 `paper not found` (the scoped delete has `StatusNEQ(published)`); deleting a part of a published paper returns 422 `paper_is_published` | papers.go:deletePaper L907-L918, `deletePaperPart` L1108-L1155 |\n| Approval: first transition to `approved` records `approved_by` from the authenticated caller and `approved_at`; supplying `approved_by` without a status change is 422; `approved_at` cannot be patched | papers.go L732-L742, L854-L871 |\n| Immutable on PATCH: `paper_code`, `version`, `academic_session_id`, `generation_run_id`, `approved_at` (422). `(academic_session_id, paper_code, version)` unique -> 409 | papers.go L732-L742, create L673 |\n| Provenance | `provenance_json` = `shared.PaperProvenance{persona_id, seed}` (domain/shared/types.go L26), `engine_document_id` (<= 128 bytes), `generation_run_id` link to `paper_generation_runs`; all are plain data fields set by the caller. `provenance_json` can be set or cleared on a draft PATCH. The generation run record (blueprint, method ai/manual/hybrid, model, tokens, cost) is created and updated through `/paper-generation-runs`; nothing in this repo generates papers (createGenerationRun only records). `createPaper` does not verify that `generation_run_id` is reachable or exists beyond the FK |\n| Target sections (\"which sections may reach a paper\") | `section_ids` in create/PATCH -> `paper_target_sections`. Each section must be writable by the caller for papers (`SectionsWritableForPapers`), belong to the paper's session, and to `grade_level_id` when one is set (422); at most 60 (`paperTargetSectionsCap`), duplicates collapsed, nil UUID rejected. Retargeting rewrites the whole set in the same transaction as the paper update (`writePaperTargets` L427: delete then bulk create). Read-side, a teacher whose sections (or sections of taught offerings) appear in the set reaches the paper (`access/papers.go:paperTargetArm`); listing can filter `?section_id=` |\n| Class anchoring | a paper must be anchored by `blueprint_id`, `exam_id` or at least one target section; an unanchored paper is school-wide and needs the bank write key (`access.BankWriteReaches` all) - papers.go:paperAnchorsReach L514 |\n| Paper questions | `createPaperQuestion` L1214 requires question, version, number, marks > 0, position > 0; the version must exist and belong to that question (422 `question_version_belongs_elsewhere`); `(paper_section_id, position)` unique -> 409. It does NOT check that the caller can read the question or that the version/question is in an approved state |\n| Nested read | `getPaper` L263 returns paper, sections with their questions, and `section_ids`; list returns a `paper_targets` side array |\n| Library paper vs exam paper | Not the same thing: the `kind=paper` library item with `question_papers` metadata (section 4) is a past-paper document; `papers` here are authored assessment papers |\n\n---\n\n## 7. Go interfaces encountered (cross-layer)\n\n| Interface | Location | Implementations / notes |\n|---|---|---|\n| `authorization.Guard` | internal/authorization/authorization.go:109 | `AllowAll` L114, `DenyAll` L122, `cas.Guard` (internal/infrastructure/cas/policies.go:223) |\n| `service.IdentityProvider` | internal/service/provisioning.go:17 | `cas.AdminClient` |\n| `service.TenantDirectory` | internal/service/tenant.go:15 | `cas.AdminClient` |\n| `http.MailHealth` | internal/transport/http/server.go:38 | mail sender |\n| `http.objectStore` | internal/transport/http/library.go:1291 | wraps `blob.New(creds)` per school via `openObjectStore` L1305 |\n| `indexing.SignedSource` | internal/service/indexing/indexer.go:32 | object store `PresignGet` |\n| `indexing.Engine` | internal/service/indexing/indexer.go:36 | retrieval engine client |\n| `indexing.Submitter` | internal/service/indexing/sweeper.go:47 | `*Dispatcher` (dispatcher.go:62) |\n| `indexing.Tenants` | internal/service/indexing/sweeper.go:43 | sweeper's tenant lister |\n| `cas.TokenSource` | internal/infrastructure/cas/admin.go:36 | service token for admin calls |\n| `transport.forgetter` | internal/transport/http/auth.go:192 | token verifier cache invalidation |\n| `assets.Rows`, `assets.Objects` | internal/service/assets/reaper.go:43, :48 | asset reaper (cmd/assetreap) |\n| `mail.Profiles`, `mail.PurgeRows` | internal/service/mail/sender.go:57, retention.go:43 | mail outbox |\n\nFunction-typed seams used as test hooks: `openObjectStore` (library.go:1300) and `openIndexerStore` (library.go:1124).\n\n---\n\n## 8. Verified vs unverified\n\n### Verified by reading the code path\n\n- Route tables, permission constants and handler names in sections 1-6 (server.go L163-L444 and the `mountRecognition`, `mountQuestionBank`, `mountBlueprints`, `mountPapers` functions).\n- Full bodies read: schools.go, tenant.go (service), provisioning.go, inlineperson.go, persons.go, students.go, guardians.go, studentsub.go, academic.go, sections.go (create/update), subjects.go (offerings and scheme checks), enrollments.go (create/update), subjectenrollments.go, electives.go, teacherassignments.go (create/update), ingestmode.go, scopes.go, search.go, resolve.go, questions.go, blueprints.go (create/update/sections/constraints), papers.go (create/update/delete/sections/questions/read), curriculum.go (create/update/nodes/helpers), placement.go (create/update/helpers), middleware/auth.go, middleware/tenant.go, postgres/tenant.go, viewer.go, reach.go, fields.go, common.go, access/viewer.go, access/library.go, access/papers.go, cmd/migrate/main.go, cmd/seed/main.go, cmd/seeddemo/main.go.\n- Partially read (key functions only): library.go (item create/update, audience/publish helpers, indexOnPublish, createAsset, markAssetReady), recognition.go (catalog, award, showcase, praise, reaction), staff.go and teachers.go (create paths), cmd/seeddemo (people.go call sites).\n- Findings that rest on cross-reading code, not on running anything: createSchool does not create a DB or run migrations; `Provision` validation errors surface as 502; `is_current` has no DB uniqueness; no DB constraint on one active elective arm; `createAddress` / `createDocument` / `createNote` do not reach-check the student; published papers cannot be PATCHed at all; blueprints have no publish lock; deleting a published paper is a 404.\n\n### Unverified / not read (excluded from diagrams)\n\n- `deploy/README.md` L38 claim that emerge-core \"creates one database per school\": no Go code found that does this (only `emerge_control` is created by `deploy/setup-db.sh`). Treated as stale or a manual step.\n- Internals of `retrieval.ScopesFor` / `Scopes.Labels` (internal/retrieval), `indexing.Client.Search`, `indexing.MarkPending`/`Abandon`, `Dispatcher.Submit` worker behavior, and the sweeper: only call sites read.\n- CAS policy evaluation (`cas.PolicyClient.Policies`, `PolicySet.Allows`, field policy and constraint semantics in internal/authorization/*.go and infrastructure/cas): used only through the `Decision` it returns.\n- `internal/data/access` predicates for enrollments, curricula, placements, recognition, streams (`StudentsFor`, `StudentsForAcademic`, `EnrollmentsFor`, `CurriculaFor`, `ContentPlacementsFor`, `StudentsForAwarding`, `PraisesFor`): signatures and uses read, bodies not.\n- `internal/data/school`, `person`, `student`, `guardian`, `staff`, `teacher`, `enrollment` query builders (`ForViewer`, `ApplyFilters`): used by list/get handlers, not read.\n- Handlers not read in full: branches.go, subject-group CRUD, list/get variants of most resources, `uploadAssetContent`, `getAssetContent`, `getAssetLink`, `deleteAsset`, `listGenerationRuns`/`updateGenerationRun`, `listCurricula*`, `listPlacements`.\n- Whether any ent hooks or DB triggers (beyond schema indexes and checks seen) add constraints, for example on `academic_sessions.is_current` or on active elective arms. Only `internal/ent/schema/*.go` files named above and the migration directory listing were checked.\n- `docs/` contents were not relied on except to locate the \"fail-open\" terminology.\n- Student assignments, exams, timetable, attendance, marks, results and report cards are out of scope for this part.\n"},{"id":"D2","nav":"D2. Timetable, exams, results flows","title":"D2. Business flows part 2: timetable, attendance, exams, results, engagement","md":"# D2. Business flows part 2: timetable, attendance, exams, results, engagement\n\nAll paths are relative to `D:\\emerge-core\\internal` unless stated. Transport = `transport/http`. All handlers below run inside the tenant plane: `server.go:mountTenantPlane` puts them behind `s.authenticate()` and `mw.RequireTenant(s.registry)`, and each route is wrapped by `s.can(<entity>)` = `mw.Authorize(guard, entity)` (`transport/http/middleware/auth.go:59`, 403 `not permitted: <entity>` when denied). Handlers then call `s.scopeFor(ctx, narrowEntity, wideEntity)` (`transport/http/viewer.go:12`) which asks the `authorization.Guard` a second time and resolves an `access.Viewer`; the resulting `Viewer` + `Decision` feed row-level predicates in `data/access/*.go` (read arm / writable arm per entity). Those predicates, not the route permission, decide which rows a caller can touch.\n\n## Legend (used in every diagram)\n\n| Class | Meaning |\n|---|---|\n| ENTRY | HTTP route entry (chi) |\n| AUTH | Authorization boundary (route guard, `scopeFor`, access predicates) |\n| SHARED | Shared helper or service used by several flows |\n| INTERFACE | Go interface or contract boundary |\n| DB | Tenant Postgres read or write via ent |\n| EXTERNAL | Process or system outside the Go core (solver) |\n| ASYNC | Asynchronous boundary (goroutine/queue) |\n| ERROR | Error or refusal path |\n\nMermaid class names: `entry`, `auth`, `shared`, `iface`, `db`, `ext`, `async`, `err`.\n\n---\n\n## 0. Cross-cutting pieces referenced by every flow\n\n| Piece | Where | What it does (verified) |\n|---|---|---|\n| Route guard | `transport/http/middleware/auth.go:Authorize` (line 59) | Calls `guard.Allow(ctx, subject, entity, nil)`; 503 on `ErrUpstream`, 403 if not allowed; stores Decision in ctx |\n| Scope | `transport/http/viewer.go:scopeFor` | Probes the `wide` entity (the `...All` permission); if allowed with no constraints, viewer is `Unrestricted`. Then `Allow(narrow)`, then `access.Resolve` |\n| Field policy | `transport/http/fields.go:rejectUnauthorizedFields`, `projectAll`, `traceProjection` | Rejects writes to fields the Decision denies; projects reads |\n| Scoped write helpers | `transport/http/common.go:wroteScopedRow` (85), `deleteScoped` (112), `tenantClient` (21) | Zero rows affected is reported as 404 so unreachable rows look absent |\n| Unit of work | `transport/http/attendance.go:unitOfWork` (741) + `begin` | `client.Tx`; falls back to the same client if a tx is already open (`ErrTxStarted`); used for transactions in attendance, marks, publish, sittings, scheme supersession |\n| Timetable service | `service/timetable/service.go:Service` (wraps `*tenantent.Client`; `FromContext` pulls the tenant client from ctx) | Pure service layer over ent, no repository interface |\n\n---\n\n## 1. Timetable authoring\n\n### 1.1 Route table\n\nMounted in `transport/http/timetable.go:mountTimetable` (line 64), `server.go:mountAcademic` (sections/subject-offerings routes), `absences.go:mountTeacherAbsences` (43).\n\n| Method | Path | Permission constant | Handler | File |\n|---|---|---|---|---|\n| GET | /timetables | TimetableRead | listTimetables | timetable.go |\n| POST | /timetables | TimetableWrite | createTimetable | timetable.go |\n| GET | /timetables/{id} | TimetableRead | getTimetable | timetable.go |\n| PATCH | /timetables/{id} | TimetableWrite | updateTimetable | timetable.go |\n| DELETE | /timetables/{id} | TimetableDelete | deleteTimetable | timetable.go |\n| GET | /timetables/{id}/slots | TimetableRead | listTimetableSlots | timetable.go |\n| POST | /timetables/{id}/slots | TimetableWrite | createTimetableSlot | timetable.go |\n| POST | /timetables/{id}/publish | TimetableWrite | publishTimetable | timetablepublish.go |\n| GET | /timetables/{id}/sections | TimetableRead | listTimetableSections | timetablepublish.go |\n| POST | /timetables/{id}/sections | TimetableWrite | attachTimetableSections | timetablepublish.go |\n| POST | /timetables/{id}/clash-check | TimetableWrite | checkTimetableClashes | timetable.go |\n| POST | /timetables/{id}/generate | TimetableGenerate | generateTimetable | timetablegenerate.go |\n| GET | /timetables/{id}/generate/{job} | TimetableRead | getTimetableGeneration | timetablegenerate.go |\n| DELETE | /timetable-sections/{id} | TimetableDelete | detachTimetableSection | timetablepublish.go |\n| GET/PATCH/DELETE | /timetable-slots/{id} | TimetableRead / TimetableWrite / TimetableDelete | getTimetableSlot / updateTimetableSlot / deleteTimetableSlot | timetable.go |\n| GET/POST | /timetable-deviations | TimetableRead / TimetableWrite | listTimetableDeviations / createTimetableDeviation | timetable.go |\n| GET/PATCH/DELETE | /timetable-deviations/{id} | TimetableRead / TimetableWrite / TimetableDelete | getTimetableDeviation / updateTimetableDeviation / deleteTimetableDeviation | timetable.go |\n| GET | /timetable-occurrences | TimetableRead | resolveTimetableOccurrences | timetable.go |\n| GET | /timetable-export.xlsx | TimetableRead | exportTimetableWorkbook | timetableexport.go |\n| GET | /timetable-calendar, /timetable-calendar/in-session | CalendarRead | listSessionDays / getInSession | timetable.go |\n| GET | /sections/{id}/calendar | TimetableRead | getSectionCalendar | sectioncalendar.go (route in server.go:364) |\n| CRUD | /rooms, /rooms/{id} | RoomsRead / RoomsWrite / RoomsDelete | listRooms, createRoom, getRoom, updateRoom, deleteRoom | timetable.go |\n| CRUD | /period-schemes, /period-schemes/{id} | TimetableRead / TimetableWrite / TimetableDelete | listPeriodSchemes ... deletePeriodScheme | timetable.go |\n| GET/POST | /period-schemes/{id}/periods | TimetableRead / TimetableWrite | listPeriods / createPeriod | timetable.go |\n| GET/POST | /period-schemes/{id}/bell-schedules | TimetableRead / TimetableWrite | listBellSchedules / createBellSchedule | timetable.go |\n| GET/POST | /period-schemes/{id}/grade-levels | TimetableRead / TimetableWrite | listSchemeGradeLevels / attachSchemeGradeLevels | periodgrades.go |\n| POST | /period-schemes/{id}/clone | TimetableWrite | clonePeriodScheme | periodgrades.go |\n| DELETE | /period-scheme-grade-levels/{id} | TimetableDelete | detachSchemeGradeLevel | periodgrades.go |\n| GET/PATCH/DELETE | /periods/{id} | TimetableRead / Write / Delete | getPeriod / updatePeriod / deletePeriod | timetable.go |\n| GET/PATCH/DELETE | /bell-schedules/{id} | TimetableRead / Write / Delete | getBellSchedule / updateBellSchedule / deleteBellSchedule | timetable.go |\n| GET/POST | /bell-schedules/{id}/periods | TimetableRead / TimetableWrite | listBellSchedulePeriods / createBellSchedulePeriod (the \"period run\" row: start_minute, end_minute, `runs` flag) | timetable.go |\n| PATCH/DELETE | /bell-schedule-periods/{id} | TimetableWrite / TimetableDelete | updateBellSchedulePeriod / deleteBellSchedulePeriod | timetable.go |\n| CRUD | /calendar-days, /calendar-days/{id} | CalendarRead / CalendarWrite / CalendarDelete | list/create/get/update/deleteCalendarDay | timetable.go |\n| GET/POST | /calendar-days/{id}/schedules | CalendarRead / CalendarWrite | listCalendarDaySchedules / createCalendarDaySchedule (binds a period scheme + bell schedule to a day) | timetable.go |\n| PATCH/DELETE | /calendar-day-schedules/{id} | CalendarWrite / CalendarDelete | updateCalendarDaySchedule / deleteCalendarDaySchedule | timetable.go |\n| GET/POST | /calendar-days/{id}/section-patterns | CalendarRead / CalendarWrite | listCalendarDaySectionPatterns / createCalendarDaySectionPattern (the per-section \"day pattern\") | timetablepublish.go |\n| PATCH/DELETE | /calendar-day-section-patterns/{id} | CalendarWrite / CalendarDelete | updateCalendarDaySectionPattern / deleteCalendarDaySectionPattern | timetablepublish.go |\n| GET/POST | /teacher-absences | TimetableRead / TimetableWrite | listTeacherAbsences / createTeacherAbsence | absences.go |\n| GET/PATCH | /teacher-absences/{id} | TimetableRead / TimetableWrite | getTeacherAbsence / updateTeacherAbsence | absences.go |\n| DELETE | /teacher-absences/{id} | TimetableDelete | withdrawTeacherAbsence (soft: sets status withdrawn) | absences.go |\n| GET | /teacher-absences/{id}/lessons | TimetableRead | getTeacherAbsenceLessons | absences.go |\n\nNotes on terminology that differ from what the names suggest:\n- \"Period runs\" = `bell_schedule_periods.runs` (bool) plus the minute span. `plan.suppressed()` drops a slot when the span exists and `Runs` is false (`service/timetable/plan.go:suppressed`).\n- \"Day patterns\" are two layers: `calendar_days.substitute_day_of_week` (whole day runs another weekday's timetable) and `calendar_day_section_patterns` (per section override). Resolution order in `plan.dayOfWeekFor`: section pattern, then day pattern, then ISO weekday of the date.\n- \"Student timetable\": there is no student-specific endpoint and `service/timetable/students.go` is NOT a student timetable. It only builds enrolment sets (`loadStudentSets`, `intersect`) for the `student_set` clash rule. A student or guardian reads their timetable through `GET /timetable-occurrences` / `GET /sections/{id}/calendar`, narrowed by `access.TimetableSlotsFor` studied/ward arms (`data/access/timetable.go:timetableSlotStudiedArms`, `timetableSlotWardArms`): slots for offerings they are enrolled in plus section-wide slots (null offering) of sections where they hold an active enrolment.\n- \"Substitution\" is not an automatic assignment engine. A substitution is a `timetable_deviations` row with `kind=substitution` and `substitute_teacher_id` (requires slot id and teacher; `deviationShapeValid`, timetable.go). Absences (`teacher_absences`) are a separate record; `getTeacherAbsenceLessons` classifies the affected lessons as covered/uncovered/cancelled based on the resolved occurrence, it never creates deviations.\n\n### 1.2 Slot create/update with clash detection (sequence)\n\n```mermaid\nsequenceDiagram\n    participant C as \"Client\"\n    participant R as \"chi route (TimetableWrite)\"\n    participant H as \"createTimetableSlot\"\n    participant S as \"scopeFor + access.TimetablesWritableBy\"\n    participant O as \"settleSlotClash\"\n    participant SV as \"timetable.Service.Check\"\n    participant DB as \"Tenant DB (ent)\"\n    C->>R: \"POST /timetables/{id}/slots\"\n    R->>H: \"after Authorize(TimetableWrite)\"\n    H->>S: \"viewer + decision\"\n    H->>H: \"readSlotOverride (reason required if clash_override)\"\n    H->>S: \"mayOverrideClash needs TimetableOverride when overriding\"\n    H->>DB:

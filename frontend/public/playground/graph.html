<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphing Calculator</title>
<meta name="description" content="Type any function, equation, inequality or curve and see it — sliders, tables, intersections, roots, derivatives and integrals, all computed live, for any maths chapter from Class 8 to 12.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="play.css">
<style>
/* ---- this page only: a Desmos-grade calculator laid out beside the graph -- */
:root, body{ --accent:#3f7fd8; --accent-soft:#e7eefb;
  --grid-minor: rgba(30,40,50,.055); --grid-major: rgba(30,40,50,.13); --axis-ink:#6b7580; --paper:#ffffff; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{ --accent-soft:#1b2c4a;
  --grid-minor: rgba(255,255,255,.06); --grid-major: rgba(255,255,255,.14); --axis-ink:#9aa7b2; --paper:#1a2024; } }
:root[data-theme="dark"] body{ --accent-soft:#1b2c4a;
  --grid-minor: rgba(255,255,255,.06); --grid-major: rgba(255,255,255,.14); --axis-ink:#9aa7b2; --paper:#1a2024; }
html, body{ height:100%; }
body{ overflow:hidden; }

/* ---- header: a slim strip, title left, icon buttons right --------------- */
.gc-top{height:48px; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--hair); background:var(--card); flex-shrink:0}
.gc-home{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink-2); font-weight:600; font-size:13px; white-space:nowrap}
.gc-home .dot{width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #8fb4ee, var(--accent))}
.gc-title{font-family:var(--font-head); font-size:15px; font-weight:700; white-space:nowrap; color:var(--ink)}
.gc-sp{flex:1}
.gc-headicons{display:flex; align-items:center; gap:2px}
.gc-icon{width:34px; height:34px; border-radius:8px; border:1px solid transparent; background:none; cursor:pointer;
  color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; font-size:16px; position:relative}
.gc-icon:hover{background:var(--sunk); border-color:var(--hair-2)}
.gc-icon[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
.gc-icon svg{width:18px; height:18px; display:block}
.gc-icon.sm{width:26px; height:26px; font-size:12px}
.gc-icon.sm svg{width:14px; height:14px}
.gc-icon:disabled{opacity:.35; cursor:default}

.gc-wrap{display:grid; grid-template-columns:380px minmax(0,1fr); gap:0; padding:0; height:calc(100vh - 48px); min-height:0}
@media (max-width:1023px){ .gc-wrap{grid-template-columns:1fr; height:auto; overflow:auto} .gc-list{max-height:46vh} .gc-stagecol{height:60vh} }

/* ---- expression list: white, numbered gutter, + menu, undo/redo -------- */
.gc-list{display:flex; flex-direction:column; min-height:0; background:var(--card); border-right:1px solid var(--hair); overflow:hidden}
.gc-listhead{display:flex; gap:4px; padding:7px 8px; border-bottom:1px solid var(--hair); align-items:center}
.gc-listbody{flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 0 40px}
.gc-addwrap{position:relative}
.gc-addbtn{width:30px; height:30px; border-radius:50%; border:1px solid var(--hair-2); background:var(--card); color:var(--ink-2);
  font-size:19px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center}
.gc-addbtn:hover{background:var(--sunk); border-color:var(--accent); color:var(--accent)}
.gc-addmenu{position:absolute; top:36px; left:0; z-index:50; background:var(--card); border:1px solid var(--hair-2); border-radius:10px;
  box-shadow:var(--shadow); min-width:180px; padding:4px; display:flex; flex-direction:column}
.gc-addmenu button{display:flex; align-items:center; gap:9px; padding:8px 10px; border:0; background:none; text-align:left;
  font-size:13px; color:var(--ink); border-radius:6px; cursor:pointer}
.gc-addmenu button:hover{background:var(--sunk)}
.gc-addmenu .ic{width:18px; text-align:center; color:var(--ink-3)}

.gc-row{display:grid; grid-template-columns:10px 30px minmax(0,1fr) auto; gap:2px; align-items:start; padding:5px 6px 5px 2px; border-bottom:1px solid var(--hair); position:relative}
.gc-row:hover{background:var(--sunk)}
.gc-row.dragging{opacity:.5}
.gc-grip{opacity:0; cursor:grab; background:none; border:0; color:var(--ink-3); font-size:10px; padding:9px 0; touch-action:none; line-height:1}
.gc-row:hover .gc-grip{opacity:1}
.gc-grip:active{cursor:grabbing}
.gc-gutter{display:flex; flex-direction:column; align-items:center; gap:1px; padding-top:5px}
.gc-num{font-family:var(--font-mono); font-size:11px; color:var(--ink-3)}
.gc-disc{width:21px; height:21px; border-radius:50%; border:2px solid var(--c, var(--ink-3)); background:transparent;
  color:var(--c, var(--ink-3)); font-size:10px; font-weight:700; font-family:var(--font-mono); display:flex; align-items:center;
  justify-content:center; cursor:pointer; padding:0}
.gc-disc.on{background:var(--c, var(--accent)); color:#fff}
.gc-disc.plain{border-style:solid; border-color:var(--hair-2); color:var(--ink-3); cursor:default}
/* The way to change a line's colour has to be visible. Hiding this caret until the row was
   hovered meant anyone on a touch screen, or anyone who simply did not think to hover, had no
   way to find it at all — and "I can't change the colour" is exactly what came back. */
.gc-caret{opacity:.55; border:0; background:none; color:var(--ink-3); font-size:11px; cursor:pointer;
  padding:0; line-height:1; width:21px; height:14px; border-radius:4px; display:flex; align-items:center; justify-content:center}
.gc-caret:hover, .gc-row:hover .gc-caret, .gc-row:focus-within .gc-caret{opacity:1; background:var(--hair); color:var(--ink)}
.gc-caret:focus-visible{outline:2px solid var(--accent); outline-offset:1px; opacity:1}

.gc-body{min-width:0; display:flex; flex-direction:column; gap:2px; padding-top:1px; overflow:hidden}
.gc-mathwrap{position:relative; min-height:27px}
.gc-input{width:100%; border:1px solid transparent; background:transparent; font:inherit; font-family:var(--font-mono); font-size:14.5px;
  color:var(--ink); padding:5px 5px; border-radius:6px; outline:none; position:relative; z-index:1; box-sizing:border-box}
.gc-body:not(.editing) .gc-input{opacity:0; position:absolute; inset:0; z-index:2; cursor:text; padding:0; border:0}
.gc-body.editing .gc-input{opacity:1; background:var(--sunk)}
.gc-mathview{display:none; padding:6px 5px; font-size:15.5px; color:var(--ink); min-height:16px; line-height:1.3;
  font-family:var(--font-head); flex-wrap:wrap; align-items:baseline; cursor:text}
.gc-body:not(.editing) .gc-mathview{display:flex}
.gc-mathview .gc-hint{color:var(--ink-3); opacity:.7; font-style:italic}
.gc-row.err .gc-input{color:var(--bad)}
.gc-err{font-size:11.5px; color:var(--bad); padding:2px 5px 4px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.gc-fixrow{display:flex; flex-wrap:wrap; gap:5px}
.gc-fixbtn{border:1px solid var(--accent); color:var(--accent); background:var(--accent-soft); border-radius:99px; padding:2px 9px; font-size:11px; font-weight:700; cursor:pointer}
.gc-fixbtn:hover{background:var(--accent); color:#fff}
.gc-note{font-size:11.5px; color:var(--ink-3); padding:0 5px}
.gc-acts{display:flex; flex-direction:column; gap:2px; align-items:center; padding-top:2px}
.gc-mini{width:23px; height:21px; border:0; background:none; color:var(--ink-3); cursor:pointer; border-radius:6px; font-size:12px; font-family:var(--font-mono)}
.gc-mini:hover{background:var(--hair); color:var(--ink)}
.gc-mini.on{background:var(--accent); color:#fff}

/* ---- math typesetting: superscripts, fractions, radicals, greek --------- */
.mexpr{display:inline-flex; align-items:baseline; flex-wrap:wrap}
.mvar{font-style:italic; font-family:var(--font-head)}
.mfn{font-style:normal}
.mop{padding:0 3px; color:var(--ink-2)}
.mdot{padding:0 1px}
.msup{display:inline-flex; align-items:baseline; vertical-align:super; font-size:.7em; position:relative; top:-.5em}
.msub{display:inline-flex; align-items:baseline; vertical-align:sub; font-size:.7em; position:relative; top:.3em}
.mfrac{display:inline-flex; flex-direction:column; align-items:center; justify-content:center; vertical-align:middle; margin:0 3px; font-size:.88em; line-height:1.1}
.mfrac .mnumer{padding:0 3px 2px}
.mfrac .mdenom{padding:2px 3px 0; border-top:1.3px solid currentColor}
.msqrt{display:inline-flex; align-items:flex-start; margin:0 1px}
.msqrt .mradsym{font-size:1.1em; transform:translateY(-2px) scaleY(1.1)}
.msqrt .mradicand{border-top:1.3px solid currentColor; padding:1px 2px 0; margin-left:-1px}
.mparen{padding:0 1px}

.gc-slider{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 8px; align-items:center; padding:2px 5px}
.gc-slider input[type=range]{height:26px; min-width:0; width:100%}
.gc-slider .val{font-family:var(--font-mono); font-weight:700; font-size:13px; min-width:52px; text-align:right}
.gc-bounds{display:flex; gap:4px; align-items:center; font-size:11px; color:var(--ink-3); flex-wrap:wrap; min-width:0; padding:0 5px}
.gc-bounds input{width:40px; min-width:0; font:inherit; font-size:11px; border:1px solid var(--hair-2); border-radius:6px; padding:2px 3px; background:var(--card); color:var(--ink)}
.gc-mini-num{width:56px; font:inherit; font-size:11px; border:1px solid var(--hair-2); border-radius:6px; padding:2px 4px; background:var(--card); color:var(--ink)}
.gc-inline{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--ink-3); padding:0 5px}
.gc-noteedit{width:100%; border:1px solid transparent; background:transparent; font:inherit; font-family:var(--font-head); font-size:13.5px;
  color:var(--ink-2); padding:5px; border-radius:6px; outline:none; resize:none; min-height:24px}
.gc-noteedit:focus{background:var(--sunk); border-color:var(--hair-2)}
.gc-stub{font-size:11.5px; color:var(--ink-3); padding:6px 5px; font-style:italic}

.gc-pop{position:absolute; z-index:40; top:34px; left:24px; background:var(--card); border:1px solid var(--hair-2); border-radius:12px; box-shadow:var(--shadow); padding:10px; width:220px}
.gc-swrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.gc-sw{width:20px; height:20px; border-radius:50%; border:2px solid transparent; cursor:pointer}
.gc-sw.sel{border-color:var(--ink)}
.gc-pop label{display:block; font-size:11px; color:var(--ink-3); margin:6px 0 2px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.gc-pop select, .gc-pop input[type=range]{width:100%}
.gc-pop input[type=text]{width:100%; font:inherit; padding:4px 6px; border:1px solid var(--hair-2); border-radius:6px; background:var(--card); color:var(--ink)}

/* ---- the graph paper: white to the edges, zoom stack, keypad ------------- */
.gc-stagecol{display:flex; flex-direction:column; min-width:0; min-height:0}
.gc-stage{position:relative; flex:1; min-height:0; background:var(--paper); overflow:hidden}
.gc-stage svg{display:block; width:100%; height:100%; touch-action:none; cursor:grab; background:var(--paper)}
.gc-stage svg.panning{cursor:grabbing}
.gc-stage svg.tracing{cursor:crosshair}
.gc-corner{position:absolute; z-index:5}
.gc-corner.tr{top:12px; right:12px; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
.gc-corner.br{bottom:12px; right:12px; display:flex; align-items:flex-end; gap:8px}
.gc-corner.bl{bottom:12px; left:12px}
.gc-zoomstack{display:flex; flex-direction:column; background:var(--card); border:1px solid var(--hair-2); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.gc-zoomstack button{width:32px; height:32px; border:0; background:none; border-bottom:1px solid var(--hair); color:var(--ink-2); font-size:16px; cursor:pointer; font-family:var(--font-head)}
.gc-zoomstack button:last-child{border-bottom:0}
.gc-zoomstack button:hover{background:var(--sunk)}
.gc-fab{width:38px; height:38px; border-radius:50%; border:1px solid var(--hair-2); background:var(--card); box-shadow:var(--shadow);
  color:var(--ink-2); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
.gc-fab[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.gc-fab svg{width:18px; height:18px}

.gc-keypad{position:absolute; z-index:6; right:12px; bottom:60px; width:min(360px, calc(100% - 24px)); background:var(--card);
  border:1px solid var(--hair-2); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.gc-kptabs{display:flex; border-bottom:1px solid var(--hair)}
.gc-kptabs button{flex:1; padding:8px 0; border:0; background:none; font-size:12px; font-weight:700; color:var(--ink-3); cursor:pointer; font-family:var(--font-head)}
.gc-kptabs button.active{color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent)}
.gc-kpgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:8px}
.gc-kpgrid button{height:36px; border-radius:8px; border:1px solid var(--hair-2); background:var(--card); font-size:14px; cursor:pointer; color:var(--ink); font-family:var(--font-head)}
.gc-kpgrid button:hover{background:var(--sunk)}
.gc-kpgrid button.wide{grid-column:span 2}

.gc-help{position:absolute; z-index:60; top:44px; right:8px; background:var(--card); border:1px solid var(--hair-2); border-radius:12px; box-shadow:var(--shadow); padding:12px; width:250px; font-size:12.5px; color:var(--ink-2)}
.gc-help h5{margin:8px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3)}
.gc-help h5:first-child{margin-top:0}
.gc-help .row2{display:flex; justify-content:space-between; gap:8px; padding:3px 0}
.gc-help kbd{font-family:var(--font-mono); background:var(--sunk); border:1px solid var(--hair-2); border-radius:4px; padding:0 5px; font-size:11px}

.gc-readouts{display:flex; gap:8px; flex-wrap:wrap; max-height:150px; overflow-y:auto; padding:8px 12px}
.gc-rcard{flex:1 1 180px; min-width:160px}
.gc-rcard h4{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin:0 0 6px; font-weight:700}
.gc-rcard .line{font-size:12.5px; font-family:var(--font-mono); display:flex; justify-content:space-between; gap:6px; padding:2px 0}
.gc-rcard .empty{font-size:12px; color:var(--ink-3)}

.gc-table{border-collapse:collapse; font-size:12.5px; font-family:var(--font-mono)}
.gc-table td{padding:1px}
.gc-table input{width:64px; font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--hair-2); border-radius:6px; background:var(--card); color:var(--ink)}
.gc-table button{border:0; background:none; color:var(--ink-3); cursor:pointer; font-size:12px}

.gc-settings{position:absolute; z-index:40; top:44px; right:8px; background:var(--card); border:1px solid var(--hair-2); border-radius:12px; box-shadow:var(--shadow); padding:12px; width:230px}
.gc-settings label{display:block; font-size:11px; color:var(--ink-3); margin:6px 0 2px; font-weight:700}
.gc-settings input{width:100%; font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--hair-2); border-radius:6px; background:var(--card); color:var(--ink)}
.gc-settings .r2{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.gc-settings .chk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); margin-top:8px}
.gc-settings .chk input{width:auto}
[hidden]{display:none!important}
.gc-hint{font-size:12px; color:var(--ink-3); padding:2px 8px 6px}
</style>
</head>
<body>
<header class="gc-top">
  <a class="gc-home" href="index.html"><span class="dot"></span></a>
  <span class="gc-title">Graphing calculator</span>
  <span class="gc-sp"></span>
  <div class="gc-headicons" role="toolbar" aria-label="Graph tools">
    <button class="gc-icon" id="btnShare" title="Save &amp; share a link" aria-label="Share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
    </button>
    <button class="gc-icon" id="btnSettings" title="Graph settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.4.55.72.66.31.11.53.15.88.15H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="gc-icon" id="btnHelp" title="Keyboard shortcuts &amp; help" aria-label="Help">?</button>
  </div>
</header>

<main class="gc-wrap">
  <aside class="gc-list">
    <div class="gc-listhead">
      <div class="gc-addwrap">
        <button class="gc-addbtn" id="btnAdd" title="Add item" aria-haspopup="true" aria-expanded="false">+</button>
        <div class="gc-addmenu" id="addMenu" hidden>
          <button data-add="expression"><span class="ic">ƒ</span> Expression</button>
          <button data-add="note"><span class="ic">▤</span> Note</button>
          <button data-add="table"><span class="ic">▦</span> Table</button>
          <button data-add="folder"><span class="ic">▸</span> Folder</button>
          <button data-add="image"><span class="ic">▢</span> Image</button>
        </div>
      </div>
      <span class="gc-sp"></span>
      <button class="gc-icon sm" id="btnUndo" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 0 10h-2"/><polyline points="7 5 3 10 7 15"/></svg>
      </button>
      <button class="gc-icon sm" id="btnRedo" title="Redo" aria-label="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H11a5 5 0 0 0 0 10h2"/><polyline points="17 5 21 10 17 15"/></svg>
      </button>
    </div>
    <div class="gc-listbody" id="rowList"></div>
  </aside>

  <section class="gc-stagecol">
    <div class="gc-stage" id="stageWrap">
      <svg id="stage" tabindex="0" role="img" aria-label="The graph"></svg>
      <div class="gc-corner tr">
        <div class="gc-zoomstack">
          <button id="btnZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="btnZoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button id="btnHome" title="Reset the window" aria-label="Reset view">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          </button>
        </div>
        <button class="gc-fab gc-autofit" id="btnAutoFit" aria-pressed="true" title="Auto-fit: keep whatever's typed nicely in view" aria-label="Auto-fit">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/></svg>
        </button>
      </div>
      <div class="gc-corner bl">
        <button class="gc-fab" id="btnTrace" aria-pressed="false" title="Trace a curve" aria-label="Trace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
        </button>
      </div>

function paintGrid(V){

  }

  }
  for (const x of xt) {
    const px = toXpx(x);

    if (x !== 0) axes += `<text x="${px + 3}" y="${clamp(toYpx(0) - 4, 12, H - 4)}" font-size="11" font-family="var(--font-head)" fill="var(--axis-ink)">${fmt(x, decimalsFor(xs))}</text>`;
  }
  for (const y of yt) {
    const py = toYpx(y);

    if (y !== 0) axes += `<text x="${clamp(toXpx(0) + 4, 4, W - 24)}" y="${py - 4}" font-size="11" font-family="var(--font-head)" fill="var(--axis-ink)">${fmt(y, decimalsFor(ys))}</text>`;
  }

  axes += `<line x1="${ox}" y1="0" x2="${ox}" y2="${H}" stroke="var(--axis-ink)" stroke-width="1.4"/>`;
  axes += `<text x="${W - 14}" y="${oy - 6}" font-size="13" font-weight="700" font-family="var(--font-head)" fill="var(--ink-2)">${esc(axisLabels.x)}</text>`;
  axes += `<text x="${ox + 16}" y="16" font-size="13" font-weight="700" font-family="var(--font-head)" fill="var(--ink-2)">${esc(axisLabels.y)}</text>`;

     drawn unconditionally at x="4", which pinned it to the left edge of the plot
     whatever the view — so on the default view a 0 sat on the x axis a whole screen
     away from x = 0, while the real origin had no label at all. Below-left of the
     crossing, because up-and-right is where the first x tick and the first y tick
     already are. */
  if (toXpx(0) >= 0 && toXpx(0) <= W && toYpx(0) >= 0 && toYpx(0) <= H)
    axes += `<text x="${clamp(ox - 11, 2, W - 10).toFixed(1)}" y="${clamp(oy + 14, 12, H - 2).toFixed(1)}" font-size="10.5" font-family="var(--font-head)" fill="var(--axis-ink)">0</text>`;

}
function decimalsFor(step){ if (step >= 1) return 0; if (step >= 0.1) return 1; if (step >= 0.01) return 2; return 3; }

/* ---- path building --------------------------------------------------------- */
function segPath(segs){
  return segs.map(seg => 'M' + seg.map(([x, y]) => toXpx(x).toFixed(2) + ' ' + toYpx(y).toFixed(2)).join('L')).join(' ');
}
function dashFor(row, opStrict){
  if (opStrict) return '6 5';
  if (row.lineStyle === 'dashed') return '8 6';
  if (row.lineStyle === 'dotted') return '1.6 5';
  return null;
}
function pathFromSegments(segs, row, opts){
  opts = opts || {};

  if (!d) return '';
  const dash = dashFor(row, opts.strict);
  const path = `<path d="${d}" fill="none" stroke="${row.color}" stroke-width="${opts.deriv ? Math.max(1.2, row.lineWidth - 1) : row.lineWidth}"
    stroke-opacity="${opts.deriv ? row.opacity * 0.7 : row.opacity}" stroke-linecap="round" stroke-linejoin="round"
    ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  /* The style panel offers a label on every row and says it is "shown on the curve", but only
     parametric rows ever drew one — so typing a label on an ordinary curve did nothing at all.
     Put it on the curve itself: the last point that is comfortably inside the plot, so the text
     sits at the end of the line the way a legend-free graph wants it. */

    let best = null;
    for (const seg of segs) for (const [x, y] of seg) {
      const px = toXpx(x), py = toYpx(y);
      if (px > 40 && px < W - 90 && py > 20 && py < H - 24 && (!best || px > best[0])) best = [px, py];
    }
    if (best) return path + `<text x="${(best[0] + 8).toFixed(1)}" y="${(best[1] - 8).toFixed(1)}" font-size="12"
      font-weight="700" fill="${row.color}" opacity="${row.opacity}" paint-order="stroke" stroke="var(--card)"

  }

}
function vlineSVG(xv, row, V){
  if (!isFinite(xv)) return '';

  const dash = dashFor(row, false);
  return `<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="${row.color}" stroke-width="${row.lineWidth}" stroke-opacity="${row.opacity}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
}
function implicitPathSVG(segs, row){
  const d = segs.map(([[x1, y1], [x2, y2]]) => `M${toXpx(x1).toFixed(2)} ${toYpx(y1).toFixed(2)}L${toXpx(x2).toFixed(2)} ${toYpx(y2).toFixed(2)}`).join(' ');
  if (!d) return '';

}
function inequalityShadeSVG(segs, row, V){
  const edgeY = (row.op === '<' || row.op === '<=') ? V.ymin : V.ymax;
  let d = '';

    if (seg.length < 2) continue;
    const pts = seg.map(([x, y]) => [toXpx(x), toYpx(y)]);
    const first = seg[0], last = seg[seg.length - 1];
    d += 'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L');
    d += `L${toXpx(last[0]).toFixed(2)} ${toYpx(edgeY).toFixed(2)}L${toXpx(first[0]).toFixed(2)} ${toYpx(edgeY).toFixed(2)}Z`;
  }

}
function implicitIneqSVG(F, op, row, V, grid){
  const {nx, ny} = grid;

  /* Every scanline run used to be its own <rect>, each padded slightly so no hairline gap showed

     so a shaded region filled up with horizontal seam lines — a block of colour ruled with
     stripes, which is what "it turned into a rectangle with coloured lines" was describing. One
     path filled once has neither problem: overlapping subpaths inside a single fill are painted
     exactly once, and it is one element instead of thousands. */
  let d = '';
  for (let j = 0; j < ny; j++) {
    const cy = V.ymin + (j + 0.5) * dy;
    const y0 = V.ymin + j * dy;

    const top = Math.min(pa, pb), bot = Math.max(pa, pb);

      const l = Math.min(xa, xb), r = Math.max(xa, xb);
      d += 'M' + l.toFixed(1) + ' ' + top.toFixed(1) + 'H' + r.toFixed(1) + 'V' + bot.toFixed(1) + 'H' + l.toFixed(1) + 'Z';

}

    const r = row.pointSize;
    return `<path d="M${px - r} ${py - r}L${px + r} ${py + r}M${px - r} ${py + r}L${px + r} ${py - r}" stroke="${row.color}" stroke-width="2.4" opacity="${row.opacity}"/>`;
  }

}
function pointsSVG(row, params, ctx){
  let out = '';

    let xv, yv;
    try { xv = evalNode(g.xAst, params, {deg: DEG, funcs: ctx.funcs}); yv = evalNode(g.yAst, params, {deg: DEG, funcs: ctx.funcs}); } catch (e) { continue; }
    if (Array.isArray(xv) && Array.isArray(yv)) {
      const n = Math.min(xv.length, yv.length);
      for (let i = 0; i < n; i++) if (isFinite(xv[i]) && isFinite(yv[i])) out += pointMarker(xv[i], yv[i], row);
    } else if (isFinite(xv) && isFinite(yv)) out += pointMarker(xv, yv, row);
  }
  if (row.label) {
    const g0 = row.groups[0];
    try { const x0 = evalNode(g0.xAst, params, {deg: DEG}); const y0 = evalNode(g0.yAst, params, {deg: DEG}); out += `<text x="${toXpx(x0) + 9}" y="${toYpx(y0) - 8}" font-size="12" font-weight="700" fill="${row.color}">${esc(row.label)}</text>`; } catch (e) {}

}
function tablePointsSVG(row){
  let out = '';

  }

}
function tableXY(row){
  const xs = [], ys = [];

}
function regressionForTable(row){
  const {xs, ys} = tableXY(row);

}

/* ---- integral bound handles: persistent draggable elements ---------------- */
function ensureIntegralHandles(row){
  if ($('intA-' + row.id)) return;
  const mk = (id, edge) => {
    const g = el('g', {id, class: 'gc-handle'});
    g.appendChild(el('path', {d: 'M-7,-10 L7,-10 L0,4 Z', fill: 'var(--warm)', stroke: '#fff', 'stroke-width': 1.5}));
    $('handleLayer').appendChild(g);
    drag(g, svg, {
      start(){ return true; },
      move(p){
        const xv = fromXpx(p.x);
        if (edge === 'a') row.integral.a = Math.min(xv, row.integral.b - 1e-6);
        else row.integral.b = Math.max(xv, row.integral.a + 1e-6);
        scheduleRender();
      },
      end(){ pushHistory(); },
    });
  };
  mk('intA-' + row.id, 'a'); mk('intB-' + row.id, 'b');
}
function positionIntegralHandles(row){
  const ha = $('intA-' + row.id), hb = $('intB-' + row.id);
  if (ha) ha.setAttribute('transform', `translate(${toXpx(row.integral.a)},${toYpx(0)})`);
  if (hb) hb.setAttribute('transform', `translate(${toXpx(row.integral.b)},${toYpx(0)})`);
}
function removeIntegralHandles(row){
  const ha = $('intA-' + row.id), hb = $('intB-' + row.id);
  if (ha) ha.remove(); if (hb) hb.remove();
}
function integralShadeSVG(row, f, V){
  const a = row.integral.a, b = row.integral.b;
  const segs = buildSegments(f, Math.max(a, V.xmin - 1e6), Math.min(b, V.xmax + 1e6), Math.max(60, Math.round(W / 3)));
  let d = '';
  for (const seg of segs) {
    if (seg.length < 2) continue;
    d += 'M' + seg.map(([x, y]) => toXpx(x).toFixed(2) + ' ' + toYpx(y).toFixed(2)).join('L');
    d += `L${toXpx(seg[seg.length - 1][0]).toFixed(2)} ${toYpx(0).toFixed(2)}L${toXpx(seg[0][0]).toFixed(2)} ${toYpx(0).toFixed(2)}Z`;
  }
  row.integral.value = simpson(f, a, b, 400);
  if (!d) return '';
  return `<path d="${d}" fill="${row.color}" fill-opacity="0.28" stroke="none"/>`;

/* ============================================================================
   PART 6 — the main render pass.
   ========================================================================== */
buildStageOnce();
let renderScheduled = false;
function scheduleRender(){ if (renderScheduled) return; renderScheduled = true; requestAnimationFrame(() => { renderScheduled = false; render(); }); }

function gridN(interacting){
  const base = interacting ? 46 : Math.max(60, Math.round(Math.min(W, H) / 6));
  return {nx: base, ny: Math.round(base * H / W)};
}
let interacting = false;

/* A row that parses fine can still fail to draw at runtime — most often
   because it depends on another row (a slider, a function) that currently
   has no value. buildSegments already swallows per-sample throws so the
   curve just quietly has nothing in it; probing once here, outside that
   swallow, is what turns "empty graph, no explanation" into a message on
   the row that caused it. Only a genuine thrown error counts (an unresolved
   name) — an ordinary domain gap like sqrt(-1) returns NaN without throwing
   and must stay silent, that's just the curve having a gap. */
function probeThrow(fn){ try { fn(); return null; } catch (e) { return e.message || String(e); } }

function render(){
  const funcs = buildFuncs();
  const params = buildParams(funcs);
  const ctx = {params, funcs, deg: DEG};
  const V = bounds();
  Object.assign(V, {}); view.xmin = V.xmin; view.xmax = V.xmax; view.ymin = V.ymin; view.ymax = V.ymax;
  paintGrid(V);
  const curvesHTML = [], pointsHTML = [], shadeHTML = [];
  const shadedRows = rows.filter(r => !r.hidden && !r.error && (r.kind === 'inequality' || r.kind === 'implicit-ineq')).length;

    if (row.hidden) { if (row.integral) removeIntegralHandles(row); continue; }
    try {
      switch (row.kind) {
        case 'function': case 'funcdef': {
          if (row.kind === 'funcdef' && !row.plottable1D) break;
          const f = getPlotFn(row, ctx);
          row.error = probeThrow(() => f((V.xmin + V.xmax) / 2));
          if (row.error) computeUndefinedVars(row, [row.fnAst || row.bodyAst], new Set(row.kind === 'funcdef' ? row.params : ['x']), params);
          else row.undefinedVars = null;

          const tr = row.trange || {min: 0, max: 2 * Math.PI};

          if (row.error) computeUndefinedVars(row, [row.rAst], new Set(['theta']), params); else row.undefinedVars = null;
          const segs = buildParamSegments(t => f(t) * Math.cos(t), t => f(t) * Math.sin(t), tr.min, tr.max, Math.max(500, Math.round(W * 2)));

          const fy = t => evalNode(row.yAst, Object.assign({}, params, {t}), {deg: DEG, funcs});
          const tr = row.trange || {min: 0, max: 2 * Math.PI};
          row.error = probeThrow(() => { fx((tr.min + tr.max) / 2); fy((tr.min + tr.max) / 2); });
          if (row.error) computeUndefinedVars(row, [row.xAst, row.yAst], new Set(['t']), params); else row.undefinedVars = null;
          const segs = buildParamSegments(fx, fy, tr.min, tr.max, Math.max(500, Math.round(W * 2)));
          curvesHTML.push(pathFromSegments(segs, row));

        }
        case 'points': pointsHTML.push(pointsSVG(row, params, ctx)); break;
        case 'inequality': {

          row.error = probeThrow(() => f((V.xmin + V.xmax) / 2));
          if (row.error) computeUndefinedVars(row, [row.fnAst], new Set(['x']), params); else row.undefinedVars = null;
          const segs = buildSegments(f, V.xmin, V.xmax, Math.max(300, Math.round(W * 1.4)));

        case 'implicit': {
          const F = (x, y) => evalNode(row.lhsAst, Object.assign({}, params, {x, y}), {deg: DEG, funcs}) - evalNode(row.rhsAst, Object.assign({}, params, {x, y}), {deg: DEG, funcs});
          row.error = probeThrow(() => F((V.xmin + V.xmax) / 2, (V.ymin + V.ymax) / 2));
          if (row.error) computeUndefinedVars(row, [row.lhsAst, row.rhsAst], new Set(['x', 'y']), params); else row.undefinedVars = null;
          const g = gridN(interacting);
          const segs = marchingSquares(F, V.xmin, V.xmax, V.ymin, V.ymax, g.nx, g.ny);

        }
        case 'implicit-ineq': {
          const F = (x, y) => evalNode(row.lhsAst, Object.assign({}, params, {x, y}), {deg: DEG, funcs}) - evalNode(row.rhsAst, Object.assign({}, params, {x, y}), {deg: DEG, funcs});
          row.error = probeThrow(() => F((V.xmin + V.xmax) / 2, (V.ymin + V.ymax) / 2));
          if (row.error) computeUndefinedVars(row, [row.lhsAst, row.rhsAst], new Set(['x', 'y']), params); else row.undefinedVars = null;
          const g = gridN(interacting);

        }
        case 'table': {
          pointsHTML.push(tablePointsSVG(row));
          if (row.regression && row.regression.on) {

            row.regression.fit = fit;

  }
  for (const row of rows) if (!(row.integral && row.integral.on)) removeIntegralHandles(row);

  const interList = [];

      let pts = [];
      try { pts = findIntersections(A.f, B.f, V.xmin, V.xmax, 900); } catch (e) {}
      for (const p of pts) if (isFinite(p.y) && p.y > V.ymin - (V.ymax - V.ymin) && p.y < V.ymax + (V.ymax - V.ymin)) { interList.push(p); marks.push({x: p.x, y: p.y, kind: 'inter'}); }
    }
    for (const {row, f} of fnRows) {
      let roots = [], extrema = [];
      try { roots = findRoots(f, V.xmin, V.xmax, 1200); } catch (e) {}
      try { extrema = findExtrema(f, V.xmin, V.xmax, 1200); } catch (e) {}

      for (const rx of roots) marks.push({x: rx, y: 0, kind: 'root', color: row.color});

     inside it. Keep a marker only where there is room to read it — nothing within MARK_GAP

    return true;

  for (const mrk of order) {
    const px = toXpx(mrk.x), py = toYpx(mrk.y);

    else if (mrk.kind === 'root') markHTML += `<circle cx="${px}" cy="${py}" r="4.5" fill="var(--card)" stroke="${mrk.color}" stroke-width="2.2"/>`;
    else markHTML += `<path d="M${px - 5},${py + (mrk.kind === 'max' ? 4 : -4)} L${px + 5},${py + (mrk.kind === 'max' ? 4 : -4)} L${px},${py + (mrk.kind === 'max' ? -5 : 5)} Z" fill="${mrk.color}"/>`;
  }

  $('curvesLayer').innerHTML = curvesHTML.join('');
  $('pointsLayer').innerHTML = pointsHTML.join('');
  $('shadeLayer').innerHTML = shadeHTML.join('');
  $('markLayer').innerHTML = markHTML;
  drawPin();
  updateReadouts(interList);
  updateRowReadouts();
}
function updateReadouts(interList){
  const V = bounds();
  const io = $('interOut');
  if (!interList.length) io.innerHTML = '<span class="empty">None in view.</span>';
  else io.innerHTML = interList.slice(0, 12).map(p => `<div class="line"><span>(x, y)</span><span>(${fmt(p.x, 3)}, ${fmt(p.y, 3)})</span></div>`).join('');
  const ro = $('rootsOut');
  const lines = [];
  for (const row of rows) {
    if (row.hidden || !isFnRow(row)) continue;
    /* A periodic curve has dozens of roots in view; listing the first six found means listing
       whichever happen to lie furthest left, which is rarely what the learner is looking at.
       Show the ones nearest the middle of the window, and say how many were left out. */
    const mid = (V.xmin + V.xmax) / 2;
    const nearest = (arr, key) => arr.slice().sort((a, b) => Math.abs(key(a) - mid) - Math.abs(key(b) - mid));
    const rts = row._roots || [], exs = row._extrema || [];
    for (const rx of nearest(rts, v => v).slice(0, 6)) lines.push(`<div class="line"><span style="color:${row.color}">root</span><span>x = ${fmt(rx, 4)}</span></div>`);
    if (rts.length > 6) lines.push(`<div class="line"><span class="empty">and ${rts.length - 6} more roots in view</span><span></span></div>`);
    for (const ex of nearest(exs, v => v.x).slice(0, 6)) lines.push(`<div class="line"><span style="color:${row.color}">${ex.kind}</span><span>(${fmt(ex.x, 3)}, ${fmt(ex.y, 3)})</span></div>`);
    if (exs.length > 6) lines.push(`<div class="line"><span class="empty">and ${exs.length - 6} more turning points in view</span><span></span></div>`);
  }

}
function updateRowReadouts(){
  for (const row of rows) {
    /* a row that parsed fine but can't currently be evaluated (a runtime
       error caught in render()/buildParams, e.g. it depends on a slider
       that has no value yet) must say so — never just draw nothing and stay
       quiet about why. Sync that onto the same error strip a parse error
       uses, since render() runs far more often than the list is rebuilt. */
    const rowEl = document.querySelector(`.gc-row[data-id="${row.id}"]`);
    if (rowEl) {
      const errEl = rowEl.querySelector('[data-role="err"]');
      const sig = (row.error || '') + '|' + (row.undefinedVars ? row.undefinedVars.join(',') : '');
      if (errEl && errEl.dataset.sig !== sig) { errEl.hidden = !row.error; errEl.innerHTML = errorRowHTML(row); errEl.dataset.sig = sig; }
      rowEl.classList.toggle('err', !!row.error);
    }
    /* A slider's markup is written once, before its bounds have been derived, and the row body
       is deliberately never rebuilt while the person is typing — so the min/max/step boxes were
       left showing nothing at all, and the range's own limits were stale. Sync them here, and
       never touch the box the person is editing. This sits above the `ro` guard below, because
       a slider row has no readout element and would otherwise never be reached. */
    if (row.kind === 'param' && row.isSlider && row.min != null){
      const rng = document.getElementById('range-' + row.id);
      if (rng){
        rng.min = row.min; rng.max = row.max; rng.step = row.step;
        if (document.activeElement !== rng) rng.value = row.value;
      }
      const host = rng && rng.closest('.gc-row');
      for (const k of ['min', 'max', 'step']){
        const box = host && host.querySelector(`[data-act="${k}"]`);
        if (box && document.activeElement !== box && box.value !== String(row[k])) box.value = row[k];
      }
      const v = document.getElementById('val-' + row.id);
      if (v) v.textContent = fmt(row.value, 4);
    }
    const ro = document.getElementById('ro-' + row.id);
    if (!ro) continue;
    if (row.kind === 'param') ro.textContent = row.isSlider ? '' : (row.error ? '' : '= ' + fmt(row.value, 4));
    else if (row.kind === 'value') ro.textContent = row.error ? '' : '= ' + fmt(row.value, 6);
    else if (row.kind === 'list') ro.textContent = '= [' + (row.listValue || []).slice(0, 8).map(v => fmt(v, 2)).join(', ') + ((row.listValue || []).length > 8 ? ', …' : '') + ']';
    else if (row.kind === 'table' && row.regression && row.regression.on && row.regression.fit) {
      const f = row.regression.fit;
      ro.textContent = `slope ${fmt(f.slope, 4)}  intercept ${fmt(f.intercept, 4)}  r² ${fmt(f.r2, 4)}`;
    } else if (row.integral && row.integral.on) ro.textContent = `∫ = ${fmt(row.integral.value, 4)} on [${fmt(row.integral.a, 2)}, ${fmt(row.integral.b, 2)}]`;
    const valEl = document.getElementById('val-' + row.id);
    if (valEl && row.kind === 'param' && row.isSlider) valEl.textContent = fmt(row.value, 4);
  }
}

   PART 7 — pan, zoom, pinch, trace.

function homeView(){ view = Object.assign({}, INITIAL_VIEW); userAdjustedView = true; scheduleRender(); }
function zoomAt(px, py, factor, axis){

  else if (!SQUARE && axis === 'y') view.sy *= factor;

let pinchStartDist = 0, pinchStartView = null, pinchAxis = null, pinchStartDX = 1, pinchStartDY = 1;

  if (pointers.size === 1) {
    pointerDownAt = ptrPos(e);
    if (TRACE_ON) { interacting = true; updateTrace(ptrPos(e)); return; }
    panActive = true; interacting = true; svg.classList.add('panning');
    panStart = ptrPos(e); panOrigin = {cx: view.cx, cy: view.cy};

    panActive = false;
    userAdjustedView = true; /* a pinch is as deliberate as a drag or a scroll */

    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    pinchStartDX = Math.abs(pts[0].x - pts[1].x) || 1;
    pinchStartDY = Math.abs(pts[0].y - pts[1].y) || 1;
    pinchStartView = Object.assign({}, view);

       the way Desmos lets you unlock the aspect ratio on one dimension */

function endPointer(e){

function setPin(p){

    const f = getPlotFn(row, {params, funcs, deg: DEG});
    for (let dxp = -24; dxp <= 24; dxp += 2) {
      const xx = fromXpx(p.x + dxp);
      let yy; try { yy = f(xx); } catch (err) { continue; }
      if (!isFinite(yy)) continue;
      const d = Math.hypot(toXpx(xx) - p.x, toYpx(yy) - p.y);

  if (!isFinite(px) || !isFinite(py) || px < -40 || px > W + 40 || py < -40 || py > H + 40) { g.innerHTML = ''; return; }
  const col = PIN.color || 'var(--ink)';
  const ax = Math.max(6, Math.min(W - 6, toXpx(0)));      // where the y-axis sits, clamped on screen
  const ay = Math.max(6, Math.min(H - 6, toYpx(0)));      // and the x-axis

    `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700"

    onTick(dt){

    const overEl = els.find(el2 => { const r = el2.getBoundingClientRect(); return ev.clientY >= r.top && ev.clientY <= r.bottom; });

      const [item] = rows.splice(fromIdx, 1);

/* ============================================================================
   AUTO-FIT — "the only thing wrong is the window doesn't adjust so plots are
   visible." A fixed ±10 window makes a correct curve read as broken: a steep
   parabola is a wall, a shallow line is the x-axis, a shifted one is nothing
   at all. This is deliberately built ON zoomToFit rather than beside it —
   the manual "Zoom to fit" button and the automatic version share every line
   of the actual fitting logic; only whether it's triggered, and whether it
   pushes its own undo step, differ.
   ========================================================================== */
function robustRange(vals){
  if (!vals || !vals.length) return null;
  const s = vals.slice().sort((a, b) => a - b);
  const n = s.length;
  const lo = s[Math.max(0, Math.floor(n * 0.05))];
  const hi = s[Math.min(n - 1, Math.ceil(n * 0.95))];
  return {lo, hi};
}
/* every row kind that draws something in the plane, sampled over a given
   domain — the one function both "is this well-framed?" (sampled over the
   CURRENT window) and "where does this actually live?" (sampled over a wide
   search box) are built from, so they can never disagree with each other. */
function rowPointsForFit(row, ctx, domain, dense){
  domain = domain || {};
  try {
    switch (row.kind) {
      case 'function': case 'funcdef': case 'inequality': {
        const f = getPlotFn(row, ctx);
        if (!f || !(domain.xmax > domain.xmin)) return null;
        const N = dense ? 3000 : 500;
        const step = (domain.xmax - domain.xmin) / N;
        const xs = [], ys = [];
        for (let i = 0; i <= N; i++) {
          const x = domain.xmin + i * step;
          let y; try { y = f(x); } catch (e) { y = NaN; }
          if (isFinite(y)) { xs.push(x); ys.push(y); }
        }
        return {xs, ys};
      }
      case 'parametric': {
        const fx = t => evalNode(row.xAst, Object.assign({}, ctx.params, {t}), {deg: ctx.deg, funcs: ctx.funcs});
        const fy = t => evalNode(row.yAst, Object.assign({}, ctx.params, {t}), {deg: ctx.deg, funcs: ctx.funcs});
        const tr = row.trange || {min: 0, max: 2 * Math.PI};
        const N = dense ? 3000 : 800;
        const step = (tr.max - tr.min) / N;
        const xs = [], ys = [];
        for (let i = 0; i <= N; i++) {
          const t = tr.min + i * step;
          let x, y; try { x = fx(t); y = fy(t); } catch (e) { x = NaN; y = NaN; }
          if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); }
        }
        return {xs, ys};
      }
      case 'polar': {
        const f = theta => evalNode(row.rAst, Object.assign({}, ctx.params, {theta}), {deg: ctx.deg, funcs: ctx.funcs});
        const tr = row.trange || {min: 0, max: 2 * Math.PI};
        const N = dense ? 3000 : 800;
        const step = (tr.max - tr.min) / N;
        const xs = [], ys = [];
        for (let i = 0; i <= N; i++) {
          const t = tr.min + i * step;
          let r, x, y; try { r = f(t); x = r * Math.cos(t); y = r * Math.sin(t); } catch (e) { x = NaN; y = NaN; }
          if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); }
        }
        return {xs, ys};
      }
      case 'implicit': case 'implicit-ineq': {
        if (!(domain.xmax > domain.xmin) || !(domain.ymax > domain.ymin)) return null;
        const F = (x, y) => evalNode(row.lhsAst, Object.assign({}, ctx.params, {x, y}), {deg: ctx.deg, funcs: ctx.funcs}) - evalNode(row.rhsAst, Object.assign({}, ctx.params, {x, y}), {deg: ctx.deg, funcs: ctx.funcs});
        const g = dense ? 220 : 90;
        const segs = marchingSquares(F, domain.xmin, domain.xmax, domain.ymin, domain.ymax, g, g);
        const xs = [], ys = [];
        for (const seg of segs) for (const [x, y] of seg) { xs.push(x); ys.push(y); }
        return {xs, ys};
      }
      case 'points': {
        const xs = [], ys = [];
        for (const gr of row.groups) {
          let xv, yv;

  'f(x)': [
    {label: 'sin', ins: 'sin()', cur: 4}, {label: 'cos', ins: 'cos()', cur: 4}, {label: 'tan', ins: 'tan()', cur: 4},
    {label: '&radic;', ins: 'sqrt()', cur: 5}, {label: '|x|', ins: 'abs()', cur: 4},
    {label: 'ln', ins: 'ln()', cur: 3}, {label: 'log', ins: 'log()', cur: 4}, {label: 'π', ins: 'pi'},
    {label: 'x&sup2;', ins: '^2'}, {label: 'x!', ins: '!'},
  ],
};
const KEYPAD_MAP = {'÷': '/', '×': '*'};
let kpTab = '123';
function normKey(k){ return typeof k === 'string' ? {label: k, ins: KEYPAD_MAP[k] || k} : k; }
function buildKeypad(){
  const keys = KEYPAD_RAW[kpTab].map(normKey);
  $('keypadPop').innerHTML = `<div class="gc-keypad">
    <div class="gc-kptabs">${Object.keys(KEYPAD_RAW).map(t => `<button data-tab="${esc(t)}" class="${t === kpTab ? 'active' : ''}">${esc(t)}</button>`).join('')}</div>
    <div class="gc-kpgrid">${keys.map(k => k.act === 'back' ? `<button data-act="kpback" title="Backspace">⌫</button>` : `<button data-ins="${esc(k.ins)}"${k.cur != null ? ` data-cur="${k.cur}"` : ''}>${k.label}</button>`).join('')}</div>
  </div>`;
  $('keypadPop').querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { kpTab = b.dataset.tab; buildKeypad(); }));
  $('keypadPop').querySelectorAll('[data-ins]').forEach(b => b.addEventListener('click', () => keypadInsert(b.dataset.ins, b.dataset.cur != null ? +b.dataset.cur : null)));
  const backBtn = $('keypadPop').querySelector('[data-act="kpback"]'); if (backBtn) backBtn.addEventListener('click', keypadBackspace);
}
function activeMathInput(){
  if (lastActiveInput && document.body.contains(lastActiveInput)) return lastActiveInput;
  let last = rows[rows.length - 1];
  if (last.manualKind) { last = addRow(''); renderRowList(); }
  return document.querySelector(`.gc-row[data-id="${last.id}"] .gc-input`);
}
function keypadInsert(text, curFromStart){
  const input = activeMathInput(); if (!input) return;
  input.focus();
  const start = input.selectionStart != null ? input.selectionStart : input.value.length;
  const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
  input.value = input.value.slice(0, start) + text + input.value.slice(end);
  const pos = curFromStart != null ? start + curFromStart : start + text.length;
  input.setSelectionRange(pos, pos);
  input.dispatchEvent(new Event('input', {bubbles: true}));
}
function keypadBackspace(){
  const input = activeMathInput(); if (!input) return;
  input.focus();
  const start = input.selectionStart != null ? input.selectionStart : input.value.length;
  const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
  const from = start === end ? Math.max(0, start - 1) : start;
  input.value = input.value.slice(0, from) + input.value.slice(end);
  input.setSelectionRange(from, from);
  input.dispatchEvent(new Event('input', {bubbles: true}));
}
$('btnKeypad').addEventListener('click', e => {
  e.stopPropagation();
  const wasOpen = openPanel === 'keypad'; closeAllPanels(); closeAddMenu();
  if (!wasOpen) { openPanel = 'keypad'; buildKeypad(); $('btnKeypad').setAttribute('aria-pressed', 'true'); }
});
document.addEventListener('click', e => {
  if (openPanel === 'settings' && !$('settingsPop').contains(e.target) && !e.target.closest('#btnSettings')) closePanel('settings');
  if (openPanel === 'help' && !$('helpPop').contains(e.target) && !e.target.closest('#btnHelp')) closePanel('help');
  if (openPanel === 'keypad' && !$('keypadPop').contains(e.target) && !e.target.closest('#btnKeypad')) closePanel('keypad');
});

function shareURL(){
  const s = btoa(unescape(encodeURIComponent(JSON.stringify(snapshot()))));
  return location.href.split('#')[0] + '#s=' + encodeURIComponent(s);
}
shareState(() => snapshot());
$('btnShare').addEventListener('click', async () => {
  const url = shareURL();
  try { await navigator.clipboard.writeText(url); toast('Link copied — it opens exactly this graph.'); }
  catch (e) { history.replaceState(null, '', url); toast('The link is in the address bar.'); }
  track('share');
});

document.addEventListener('keydown', e => {
  if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
});

/* ============================================================================
   PART 10 — boot.
   ========================================================================== */
const ro = new ResizeObserver(() => { resizeStage(); scheduleRender(); });
ro.observe($('stageWrap'));

(function boot(){
  const shared = sharedState();
  const saved = shared || store.get('graph:state', null);
  if (saved && saved.rows && saved.rows.length) {
    try { restoreSnapshot(saved); } catch (e) { rows = [newRow('')]; renderRowList(); }
  } else {
    renderRowList();
  }
  resizeStage();
  syncToolbar();
  render();
  addEventListener('pointerdown', () => {}, {once: true});
})();

/* Autosave to this browser so a reopened tab is where the student left it. */
let saveT = 0;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(() => store.set('graph:state', snapshot()), 500); }
const _origSchedule = scheduleRender;
scheduleRender = function(){ scheduleSave(); _origSchedule(); };

track('open');

/* ============================================================================
   PART 11 — expose for tests.
   ========================================================================== */
/* The two lists of function names must agree. FUNC_NAMES is what the tokenizer matches
   and FUNCS is what evaluation calls, so a name in one and not the other is either a
   function nobody can type or a name that tokenizes and then cannot be evaluated. This
   is a console.error and not a throw: shipping a page that refuses to load over a
   missing alias would be worse than the alias being missing. */
(() => {
  const named = new Set(FUNC_NAMES), impl = new Set(Object.keys(FUNCS));
  const noImpl = [...named].filter(n => !impl.has(n));
  const noName = [...impl].filter(n => !named.has(n));
  if (noImpl.length || noName.length)
    console.error('graph.html: FUNC_NAMES and FUNCS disagree —' +
      (noImpl.length ? ' typable but not implemented: ' + noImpl.join(', ') + '.' : '') +
      (noName.length ? ' implemented but not typable: ' + noName.join(', ') + '.' : ''));
})();
window.PG_MODEL = M;
window.PG_STATE = () => {
  const V = bounds();
  return {
    rows: rows.map(r => ({
      id: r.id, raw: r.raw, kind: r.kind, error: r.error, color: r.color, hidden: r.hidden,
      value: r.value, min: r.min, max: r.max, step: r.step, isSlider: r.isSlider,
      showDeriv: r.showDeriv, integral: r.integral ? Object.assign({}, r.integral) : null,
      roots: r._roots || [], extrema: r._extrema || [],
      listValue: r.listValue, regression: r.regression, noteText: r.noteText, undefinedVars: r.undefinedVars,
    })),
    view: {xmin: V.xmin, xmax: V.xmax, ymin: V.ymin, ymax: V.ymax, cx: view.cx, cy: view.cy, sx: view.sx, sy: view.sy},
    initialView: INITIAL_VIEW,
    deg: DEG, square: SQUARE, traceOn: TRACE_ON, analysisOn: ANALYSIS_ON, autoFit: AUTO_FIT, userAdjustedView,
  };
};
/* Escape clears the pinned point wherever the focus happens to be — the row-level handler only
   fires while an expression input is focused, which is exactly where the learner is not when
   they have just clicked on the graph. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && PIN) { PIN = null; drawPin(); }
});
window.PG_PIN = () => PIN;
window.PG_ACTIONS = {undo, redo, homeView, zoomToFit, needsFit};
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rhyme Wheel</title>
<meta name="description" content="Class 1: tap a letter to spin it in front of -at, -en or -op, and hear Mimi the parrot blend the sounds — a picture pops out only for real words.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../../play.css">
<style>
.pg-main.tiny-main{grid-template-columns:minmax(0,1fr) 250px; padding-top:12px; padding-bottom:12px}
.tiny-main .pg-stage{align-self:start; min-height:0}
.pg-intro{display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding-top:12px}
.pg-intro p{margin:0}
#stage{background:#cdeeff}
.hit{cursor:pointer}
svg [tabindex]:focus{outline:none}
svg [tabindex]:focus-visible{outline:none; stroke:#ff7a2f; stroke-width:4; stroke-dasharray:8 8}
.hear{width:100%; min-height:76px; font-size:24px; font-family:var(--font-head); border-radius:var(--radius)}
.hear .ic{font-size:30px}
.try{padding:10px; text-align:center; cursor:pointer; border:2px solid var(--hair-2); transition:transform .2s var(--spring)}
.try:hover{border-color:var(--accent)}
.try:active{transform:scale(.97)}
.try svg{display:block; width:100%; height:auto}
.try .kicker{margin:2px 0 0}
@media (max-width:980px){ .pg-main.tiny-main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="pg-top"></header>

<div class="pg-intro">
  <h1>The rhyme wheel</h1>
  <p>Spin a letter onto <b>-at</b>, <b>-en</b> or <b>-op</b> and hear which words are real.</p>
</div>

<main class="pg-main tiny-main">
  <section class="pg-stage" id="stageWrap">
    <svg id="stage" viewBox="0 0 1000 660" role="img" aria-label="A wheel of letters that spins to sit in front of a word ending. Mimi the parrot reads out the letter and the ending together. Three round buttons choose the ending: -at, -en or -op."></svg>
  </section>

  <aside class="pg-side">
    <button class="btn primary hear" id="hear" aria-label="Hear what to do"><span class="ic">🔊</span> Hear it</button>
    <button class="card try" id="tryCard" aria-label="What to try next. Tap to hear it."><svg id="tryArt" viewBox="-80 -55 160 110"></svg><div class="kicker">Try this</div></button>
    <div class="card"><h3>⭐ Found</h3><div id="finds"></div></div>
  </aside>
</main>

<script src="../../play.js"></script>
<script>
'use strict';
const {$, clamp, lerp, loop, tween, sleep, sound, tone, say, track, confetti, findings, discover, found,
       mount, reduced, ease} = Play;
mount({thread: 'rhymes', band: 'tiny'});

/* MODEL:start ==================================================================
   The rhyme wheel (NCERT Mridang, Class 1 Ch 3 "Picture Time" — the book's own
   "h_en, p_en, m_en, d_en" activity — and Class 2 Ch 2, the short vowel "e" as
   in "pen"), extended with two more endings the same way, -at and -op.

   Eight onset letters sit on the wheel; each is checked against the CURRENT
   ending using one small word list per ending (no guessing, no invented
   spellings). Whichever letter the spin lands on, in front of whichever
   ending is chosen, the model looks up EXACTLY that pair — nothing is a
   scripted reaction to "the letter c" or "the ending -at" on their own, only
   to the combination the learner made.
   ============================================================================ */
const ENDINGS = ['at', 'en', 'op'];
const ONSETS = ['b', 'c', 'd', 'g', 'h', 'm', 'p', 't'];
const REAL = {
  at: {b: 'bat', c: 'cat', h: 'hat', m: 'mat', p: 'pat'},
  en: {d: 'den', h: 'hen', m: 'men', p: 'pen', t: 'ten'},
  op: {h: 'hop', m: 'mop', p: 'pop', t: 'top'},
};
const ONSET_SOUND = {b: 'buh', c: 'kuh', d: 'duh', g: 'guh', h: 'huh', m: 'mmm', p: 'puh', t: 'tuh'};
function wordFor(onset, ending){ return (REAL[ending][onset]) || (onset + ending); }
const isReal = (onset, ending) => !!REAL[ending][onset];
/* MODEL:end */

/* ---- the world (stage units) -------------------------------------------------- */
const WHEEL = {x: 320, y: 340}, R = 178, PETAL = 78;
const POINTER = {x: WHEEL.x, y: WHEEL.y - R - 62};
const PLATE = {x: 640, y: 96, w: 320, h: 232};
const TABS = ENDINGS.map((e, i) => ({id: e, x: 700 + i * 105, y: 380}));
const PARROT = {x: 800, y: 540};
const PETAL_COL = ['#ff7a5c', '#ffc53d', '#5cc26e', '#3f9fe0', '#a084e8', '#e0567a', '#f29a1f', '#4fb8b0'];

/* ---- state: plain data --------------------------------------------------------- */
const S = {ending: 'at', wheelAngle: 0, spinning: false, current: null,
  found: new Set(), byEnding: {at: new Set(), en: new Set(), op: new Set()}};

/* ---- picture library: each centred at (0,0), small reward icons ------------------- */
const K = '#3a2a1a';
const PICS = {
  bat: `<path d="M0 -6 C-14 -22 -34 -20 -38 -6 C-30 -6 -26 2 -30 10 C-20 4 -14 8 -10 14 L0 4 L10 14 C14 8 20 4 30 10 C26 2 30 -6 38 -6 C34 -20 14 -22 0 -6 Z" fill="#6b4fa8" stroke="#3e2a6e" stroke-width="2.5" stroke-linejoin="round"/><circle cx="-4" cy="-4" r="2" fill="#fff"/><circle cx="4" cy="-4" r="2" fill="#fff"/>`,
  cat: `<path d="M-24 -14 L-30 -34 L-10 -22 Z M24 -14 L30 -34 L10 -22 Z" fill="#f2a154" stroke="#b86d1f" stroke-width="2.5" stroke-linejoin="round"/><circle r="26" fill="#f2a154" stroke="#b86d1f" stroke-width="2.5"/><circle cx="-9" cy="-2" r="3" fill="${K}"/><circle cx="9" cy="-2" r="3" fill="${K}"/><path d="M0 6 l-3 4 h6 Z" fill="#e0567a"/><path d="M-10 9 h-16 M-10 12 h-14 M10 9 h16 M10 12 h14" stroke="#b86d1f" stroke-width="1.4"/>`,
  hat: `<ellipse cy="10" rx="34" ry="8" fill="#f2a154" stroke="#b86d1f" stroke-width="2.5"/><path d="M-18 10 Q-18 -22 0 -22 Q18 -22 18 10 Z" fill="#f7c07a" stroke="#b86d1f" stroke-width="2.5"/><rect x="-18" y="0" width="36" height="6" fill="#e0567a"/>`,
  mat: `<rect x="-32" y="-16" width="64" height="32" rx="5" fill="#c98f2e" stroke="#8a5a2b" stroke-width="2.5"/><path d="M-24 -8 h48 M-24 0 h48 M-24 8 h48" stroke="#8a5a2b" stroke-width="2"/>`,
  pat: `<circle cx="-14" cy="4" r="16" fill="#e3b27a" stroke="#8a5a2b" stroke-width="2.5"/><circle cx="-20" cy="0" r="2" fill="${K}"/><circle cx="-9" cy="0" r="2" fill="${K}"/><path d="M-18 9 q4 3 8 0" stroke="${K}" stroke-width="1.6" fill="none"/><path d="M10 -20 q16 -6 20 8 q2 10 -8 16 q4 6 -2 10 q-8 -2 -10 -10 q-10 -2 -10 -14 q0 -8 10 -10 Z" fill="#fff" stroke="#8a5a2b" stroke-width="2.2"/>`,
  den: `<path d="M-30 16 Q-30 -14 0 -14 Q30 -14 30 16 Z" fill="#8a5a2b"/><ellipse cy="16" rx="30" ry="6" fill="#6b4423"/><circle cy="4" r="14" fill="#f27a2a" stroke="#a84a12" stroke-width="2.2"/><path d="M-8 -8 L-12 -16 L-2 -12 Z M8 -8 L12 -16 L2 -12 Z" fill="#f27a2a" stroke="#a84a12" stroke-width="2"/><circle cx="-5" cy="4" r="1.8" fill="${K}"/><circle cx="5" cy="4" r="1.8" fill="${K}"/>`,
  hen: `<ellipse cy="6" rx="22" ry="18" fill="#fff" stroke="#b9ab9a" stroke-width="2.4"/><circle cx="-14" cy="-14" r="10" fill="#fff" stroke="#b9ab9a" stroke-width="2.2"/><path d="M-22 -22 q2 -6 5 -2 q2 -6 5 -1 q3 -3 3 3 Z" fill="#e2453d"/><path d="M-24 -12 l-8 3 l8 3 Z" fill="#f2b21f"/><circle cx="-16" cy="-15" r="1.8" fill="${K}"/>`,
  men: `<circle cx="-14" cy="-14" r="8" fill="#e3b27a"/><path d="M-14 -6 L-14 14 M-22 0 L-6 0 M-14 14 L-20 24 M-14 14 L-8 24" stroke="#3f7fd8" stroke-width="4" stroke-linecap="round"/><circle cx="14" cy="-14" r="8" fill="#e3b27a"/><path d="M14 -6 L14 14 M6 0 L22 0 M14 14 L8 24 M14 14 L20 24" stroke="#2f9e5b" stroke-width="4" stroke-linecap="round"/>`,
  pen: `<g transform="rotate(-30)"><rect x="-30" y="-6" width="50" height="12" rx="4" fill="#3f7fd8" stroke="#24508f" stroke-width="2.2"/><path d="M20 -6 L34 0 L20 6 Z" fill="#f3d6b0" stroke="#8a6a44" stroke-width="1.8"/></g>`,
  ten: `<text x="0" y="12" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="34" fill="#2f7de1">10</text>`,
  hop: `<ellipse cx="4" cy="8" rx="20" ry="14" fill="#f3d9ae" stroke="#c9975a" stroke-width="2.2"/><path d="M-10 -10 L-16 -30 M2 -12 L2 -32" stroke="#f3d9ae" stroke-width="8" stroke-linecap="round"/><circle cx="14" cy="0" r="2" fill="${K}"/><path d="M-20 20 q-10 4 -14 -4 M-24 24 q-10 2 -12 -8" stroke="#c9975a" stroke-width="2" fill="none"/>`,
  mop: `<rect x="-3" y="-30" width="6" height="34" fill="#c98f2e"/><path d="M-16 4 q0 -10 16 -10 q16 0 16 10 q0 8 -16 14 q-16 -6 -16 -14 Z" fill="#8fd0ee" stroke="#3f8fb8" stroke-width="2"/><path d="M-10 4 v14 M0 6 v16 M10 4 v14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`,
  pop: `<circle cx="-9" cy="6" r="10" fill="#fff6c8" stroke="#e8c04a" stroke-width="2"/><circle cx="9" cy="1" r="12" fill="#fff6c8" stroke="#e8c04a" stroke-width="2"/><circle cy="-13" r="9" fill="#fff6c8" stroke="#e8c04a" stroke-width="2"/>`,
  top: `<path d="M-16 -14 L16 -14 L8 20 L-8 20 Z" fill="#e2453d" stroke="#8f2e22" stroke-width="2.2" stroke-linejoin="round"/><path d="M-8 20 L0 34 L8 20 Z" fill="#8f2e22"/><circle cy="-14" r="6" fill="#ffd84a" stroke="#b9860e" stroke-width="2"/>`,
};
const SILLY_FACE = `<circle r="30" fill="#ffe27a" stroke="#f29a1f" stroke-width="2.5"/><path d="M-14 -8 l8 6 M-14 -2 l8 -6 M6 -8 l8 6 M6 -2 l8 -6" stroke="${K}" stroke-width="2.6" stroke-linecap="round"/><path d="M-12 8 q12 12 24 0" fill="#7a2a1a" stroke="${K}" stroke-width="2.2" stroke-linejoin="round"/>`;

/* ============================================================================
   The stage: drawn once, then only patched.
   ============================================================================ */
const svg = $('stage');
const f1 = n => (+n).toFixed(1);
const FONT = 'font-family="Fredoka, Nunito, sans-serif" font-weight="600"';
const D2R = Math.PI / 180;

function parrotArt(){
  return `
  <path id="pWingL" d="M-20 -6 C-46 -6 -58 18 -46 34 C-38 24 -28 20 -18 22 Z" fill="#2f9e5b" stroke="#1f6e3c" stroke-width="2.6" stroke-linejoin="round"/>
  <ellipse cy="6" rx="30" ry="38" fill="#3fbf7a" stroke="#1f6e3c" stroke-width="3"/>
  <ellipse cy="30" rx="16" ry="20" fill="#ffd84a" stroke="#c99a12" stroke-width="2.4"/>
  <path d="M0 58 L-14 78 M0 58 L14 78" stroke="#e08a1f" stroke-width="5" stroke-linecap="round"/>
  <circle cy="-24" r="20" fill="#3fbf7a" stroke="#1f6e3c" stroke-width="3"/>
  <path d="M-4 -60 Q0 -70 8 -62" fill="none" stroke="#e2453d" stroke-width="5" stroke-linecap="round"/>
  <g id="pEyeOpen"><circle cx="7" cy="-27" r="7" fill="#fff" stroke="#1f6e3c" stroke-width="1.6"/><circle cx="8" cy="-27" r="3.4" fill="${K}"/></g>
  <path id="pLid" d="M0 -27 q7 -8 14 0" stroke="#3fbf7a" stroke-width="7" opacity="0"/>
  <path d="M14 -26 Q28 -24 30 -18 Q22 -14 12 -20 Z" fill="#f2b21f" stroke="#c9860e" stroke-width="2" stroke-linejoin="round"/>
  <path id="pWingR" d="M20 -6 C46 -6 58 18 46 34 C38 24 28 20 18 22 Z" fill="#2f9e5b" stroke="#1f6e3c" stroke-width="2.6" stroke-linejoin="round"/>`;
}
function build(){
  let clouds = '';
  [[110, 90, 46], [860, 130, 34]].forEach(([x, y, w]) => { clouds += `<g fill="#fff" opacity=".92"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .42}"/><circle cx="${x - w * .3}" cy="${y - w * .3}" r="${w * .38}"/><circle cx="${x + w * .3}" cy="${y - w * .3}" r="${w * .34}"/></g>`; });
  const wedges = ONSETS.map((o, i) => { const a0 = -90 + i * 45 - 22.5, a1 = a0 + 45, rr = R + 56;
    return `<path d="M${WHEEL.x} ${WHEEL.y} L${f1(WHEEL.x + rr * Math.cos(a0 * D2R))} ${f1(WHEEL.y + rr * Math.sin(a0 * D2R))} A${rr} ${rr} 0 0 1 ${f1(WHEEL.x + rr * Math.cos(a1 * D2R))} ${f1(WHEEL.y + rr * Math.sin(a1 * D2R))} Z" fill="${PETAL_COL[i]}" opacity=".28"/>`; }).join('');
  svg.innerHTML = `
  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#eafaff"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1d2327" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1000" height="660" fill="url(#gSky)"/>
  ${clouds}
  <rect y="580" width="1000" height="80" fill="#bfe08a"/>
  <rect y="576" width="1000" height="8" fill="#8fbf5a"/>

  <!-- the wheel: a decorative disc (rotates), the petals (stay upright), a hub -->
  <g id="wheelDisc" filter="url(#soft)">${wedges}<circle cx="${WHEEL.x}" cy="${WHEEL.y}" r="${R + 56}" fill="none" stroke="#fff" stroke-width="6" opacity=".7"/></g>
  <g id="petals">${ONSETS.map((o, i) => `<g id="petal-${o}"><rect x="${-PETAL / 2}" y="${-PETAL / 2}" width="${PETAL}" height="${PETAL}" rx="18" fill="${PETAL_COL[i]}" stroke="#fff" stroke-width="5"/>
    <text y="16" text-anchor="middle" ${FONT} font-size="44" fill="#fff">${o}</text></g>`).join('')}</g>
  <circle cx="${WHEEL.x}" cy="${WHEEL.y}" r="46" fill="#fff6c8" stroke="#e8c04a" stroke-width="5"/>
  <path d="M${WHEEL.x - 36} ${WHEEL.y} l16 -6 l-4 -16 l14 12 l16 -6 l-6 16 l12 14 l-16 -4 l-6 16 l-6 -16 l-16 -4 l14 -12 Z" fill="#ffd84a" opacity=".9" transform-origin="${WHEEL.x} ${WHEEL.y}"/>
  <path d="M${POINTER.x - 22} ${POINTER.y} L${POINTER.x + 22} ${POINTER.y} L${POINTER.x} ${POINTER.y + 34} Z" fill="#e2453d" stroke="#8f2e22" stroke-width="3" stroke-linejoin="round"/>

  <!-- Mimi the parrot, on a perch -->
  <rect x="${PARROT.x - 6}" y="${PARROT.y + 40}" width="12" height="70" rx="4" fill="#8a5a2b"/>
  <rect x="${PARROT.x - 46}" y="${PARROT.y + 82}" width="92" height="14" rx="7" fill="#a8672e"/>
  <g id="parrot" transform="translate(${PARROT.x} ${PARROT.y})">${parrotArt()}</g>

  <!-- the reading plate, over empty sky -->
  <g filter="url(#soft)"><rect x="${PLATE.x}" y="${PLATE.y}" width="${PLATE.w}" height="${PLATE.h}" rx="24" fill="#fff" stroke="#8a94a6" stroke-width="3"/></g>
  <rect id="onsetTile" x="${PLATE.x + 30}" y="${PLATE.y + 26}" width="76" height="76" rx="16" fill="#eef2f6" stroke="#8a94a6" stroke-width="3"/>
  <text id="onsetT" x="${PLATE.x + 68}" y="${PLATE.y + 80}" text-anchor="middle" ${FONT} font-size="46" fill="#2f4f8f"></text>
  <text id="endingT" x="${PLATE.x + 230}" y="${PLATE.y + 80}" text-anchor="middle" ${FONT} font-size="46" fill="#8a94a6">-${S.ending}</text>
  <g id="wordPop" transform="translate(${PLATE.x + PLATE.w / 2} ${PLATE.y + 168})">
    <g id="wordPic" transform="scale(1.15)"></g>
    <text id="wordT" y="46" text-anchor="middle" ${FONT} font-size="22" fill="#2f4f8f"></text>
  </g>

  <!-- the three endings to choose -->
  ${TABS.map(t => `<g id="tabJ-${t.id}" transform="translate(${t.x} ${t.y})"><circle r="42" fill="#fff" stroke="#8a94a6" stroke-width="3"/><text y="10" text-anchor="middle" ${FONT} font-size="24" fill="#2f4f8f">-${t.id}</text></g>`).join('')}
  <circle id="tabRing" r="48" fill="none" stroke="#ff7a2f" stroke-width="5" pointer-events="none"/>

  <!-- hit targets: fixed slots -->
  ${ONSETS.map(o => `<circle id="petalHit-${o}" class="hit" cx="0" cy="0" r="${PETAL * 0.62}" fill="transparent" role="button" tabindex="0" aria-label="Letter ${o}. Tap to spin it to the front."/>`).join('')}
  ${TABS.map(t => `<circle id="tabHit-${t.id}" class="hit" cx="${t.x}" cy="${t.y}" r="44" fill="transparent" role="button" tabindex="0" aria-label="Ending -${t.id}"/>`).join('')}
  <circle id="parrotHit" class="hit" cx="${PARROT.x}" cy="${PARROT.y - 10}" r="70" fill="transparent" role="button" tabindex="0" aria-label="Mimi the parrot. Tap to hear the word again."/>
  `;
}
build();

/* ---- positioning: petals stay upright; only their (x,y) orbits the wheel ------------ */
function petalXY(i, angleDeg){
  const a = (-90 + i * 45 + angleDeg) * D2R;
  return {x: WHEEL.x + R * Math.cos(a), y: WHEEL.y + R * Math.sin(a)};
}
function paintWheel(angleDeg){
  ONSETS.forEach((o, i) => {
    const p = petalXY(i, angleDeg);
    $('petal-' + o).setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`);
    $('petalHit-' + o).setAttribute('cx', f1(p.x)); $('petalHit-' + o).setAttribute('cy', f1(p.y));
  });
  $('wheelDisc').setAttribute('transform', `rotate(${f1(angleDeg)} ${WHEEL.x} ${WHEEL.y})`);
}
paintWheel(0);
const selectedIndex = angleDeg => (((Math.round(-angleDeg / 45) % 8) + 8) % 8);

/* ---- Mimi: face, and the plate ------------------------------------------------------ */
function hop(el, h = 12, ms = 380){
  if (reduced()) return Promise.resolve();
  return tween(0, 1, ms, t => el.setAttribute('transform', `translate(${PARROT.x} ${f1(PARROT.y - Math.sin(t * Math.PI) * h)})`), v => v)
    .then(() => el.setAttribute('transform', `translate(${PARROT.x} ${PARROT.y})`));
}
function clientOf(x, y){
  const m = svg.getScreenCTM(); if (!m) return {x: innerWidth / 2, y: innerHeight / 2};
  const p = svg.createSVGPoint(); p.x = x; p.y = y; const q = p.matrixTransform(m); return {x: q.x, y: q.y};
}
function showResult(onset, ending, real, word){
  $('onsetT').textContent = onset;
  $('onsetT').setAttribute('fill', real ? '#fff' : '#8a5a2b');
  $('onsetTile').setAttribute('fill', real ? '#2f9e5b' : '#eef2f6');
  $('onsetTile').setAttribute('stroke', real ? '#1f6e3c' : '#8a94a6');
  $('endingT').textContent = '-' + ending;
  $('wordPic').innerHTML = real ? PICS[word] : SILLY_FACE;
  $('wordT').textContent = real ? word : word + '?';
  $('wordT').setAttribute('fill', real ? '#2f9e5b' : '#b5620a');
}
function paintTabs(){
  TABS.forEach(t => $('tabJ-' + t.id).querySelector('circle').setAttribute('fill', t.id === S.ending ? '#fff6c8' : '#fff'));
  const t = TABS.find(t => t.id === S.ending);
  $('tabRing').setAttribute('transform', `translate(${t.x} ${t.y})`);
}
paintTabs();

/* ============================================================================
   The moves.
   ============================================================================ */
async function spinTo(i){
  hello();
  if (S.spinning) return;
  const cur = selectedIndex(S.wheelAngle);
  if (cur === i && S.current) { announce(); return; }
  S.spinning = true;
  sound('whoosh');
  let target = -45 * i;
  while (target > S.wheelAngle) target -= 360;
  target -= 360 * 2;
  const from = S.wheelAngle;
  await tween(0, 1, reduced() ? 0 : 1600, t => { paintWheel(lerp(from, target, t)); }, ease.inOut);
  S.wheelAngle = ((target % 360) + 360) % 360;
  paintWheel(S.wheelAngle);
  sound('tick');
  S.spinning = false;
  announce();
  track('spin', {onset: ONSETS[i]});
}
/* Speak, but never wait longer than the cap: real speech (Windows/Chrome TTS) can take
   several real seconds, and the interaction must not hang on it. */
const speak = (text, o = {}, cap = 1200) => Promise.race([say(text, o), sleep(cap)]);
async function announce(){
  const i = selectedIndex(S.wheelAngle), onset = ONSETS[i], ending = S.ending;
  S.current = {onset, ending};
  const real = isReal(onset, ending), word = wordFor(onset, ending);
  await speak(ONSET_SOUND[onset], {pitch: 1.3, interrupt: true});
  await speak(ending, {pitch: 1.3, interrupt: false});
  showResult(onset, ending, real, word);
  const at = clientOf(PLATE.x + PLATE.w / 2, PLATE.y + PLATE.h - 20);
  if (real) {
    sound('chime');
    speak(word + '! A real word.', {pitch: 1.25, interrupt: false}, 1800);
    hop($('parrot'));
    const first = !S.found.has(word);
    S.found.add(word); S.byEnding[ending].add(word);
    if (first) confetti(at.x, at.y, 40);
    if (!found('first_real')) discover('first_real', at);
    if (S.found.size >= 5) discover('five_words', at);
    if (ENDINGS.every(e => S.byEnding[e].size > 0)) discover('all_families', at);
    if (S.byEnding[ending].size >= 3) discover('rhymers', at);
  } else {
    sound('boing');
    speak(word + '. Not a word! Silly!', {pitch: 1.35, interrupt: false}, 1800);
    discover('silly', at);
  }
  track('word', {onset, ending, word, real});
}
function chooseEnding(id){
  hello();
  if (S.spinning || id === S.ending) { if (id === S.ending) { sound('tick'); if (S.current) announce(); } return; }
  S.ending = id;
  sound('pop');
  paintTabs();
  $('endingT').textContent = '-' + id;
  if (S.current) announce();
  track('ending', {ending: id});
}

/* ============================================================================
   Wiring
   ============================================================================ */
const onTap = (id, fn) => { $(id).addEventListener('click', fn); $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
ONSETS.forEach((o, i) => onTap('petalHit-' + o, () => spinTo(i)));
TABS.forEach(t => onTap('tabHit-' + t.id, () => chooseEnding(t.id)));
onTap('parrotHit', () => { hello(); if (S.current) announce(); else say('Tap a letter on the wheel!', {pitch: 1.3}); hop($('parrot')); });

/* ---- idle: blinking ------------------------------------------------------------------ */
let T = 0;
function idle(dt){
  T += dt;
  if (!reduced()) $('pLid').setAttribute('opacity', (T % 3.6) < 0.12 ? 1 : 0);
}
loop(idle);

/* ---- the "Try this" card --------------------------------------------------------------- */
const T_ = (x, y, t, c = '#2f4f8f', fs = 22) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="${fs}" fill="${c}">${t}</text>`;
const TRY = {
  first_real: {line: 'Tap a letter on the wheel, then hear it read in front of -at, -en or -op.', art: `${T_(0, -6, 'c', '#2f9e5b', 40)}${T_(30, -6, 'at', '#8a94a6', 40)}${T_(0, 30, '→ cat!', '#2f9e5b')}`},
  silly: {line: 'Some letters make a silly word, not a real one — that is funny, not wrong!', art: SILLY_FACE},
  all_families: {line: 'Find a real word on -at, on -en, AND on -op!', art: `${T_(-46, 0, '-at', '#e2453d')}${T_(0, 0, '-en', '#2f9e5b')}${T_(46, 0, '-op', '#3f9fe0')}`},
  rhymers: {line: 'Find three real words that all end the same way, like cat, bat and hat!', art: `${T_(-40, -10, 'cat')}${T_(0, -10, 'bat')}${T_(40, -10, 'hat')}${T_(0, 22, 'they rhyme!', '#2f9e5b', 18)}`},
  five_words: {line: 'Find five real words on the wheel!', art: `${T_(0, 0, '5', '#f29a1f', 46)}`},
};
const TRY_ORDER = ['first_real', 'silly', 'all_families', 'rhymers', 'five_words'];
const currentTry = () => TRY_ORDER.find(g => !found(g)) || null;
let shownTry;
function paintTry(){
  const g = currentTry();
  if (g === shownTry) return;
  shownTry = g;
  $('tryArt').innerHTML = g ? TRY[g].art : `<path d="M0 -40 L12 -12 L42 -10 L18 8 L26 38 L0 22 L-26 38 L-18 8 L-42 -10 L-12 -12 Z" fill="#ffc53d" stroke="#f29a1f" stroke-width="3" stroke-linejoin="round"/>`;
  if (!reduced()) $('tryCard').animate([{transform: 'scale(.9)'}, {transform: 'scale(1.04)'}, {transform: 'scale(1)'}], {duration: 450, easing: 'ease-out'});
}
function sayTry(){ const g = currentTry(); say(g ? TRY[g].line : 'You found everything! You are a rhyming champion.'); track('hear', {goal: g}); }
let spoke = false;
$('tryCard').addEventListener('click', () => { spoke = true; sayTry(); });
$('hear').addEventListener('click', () => { spoke = true; sayTry(); });
function hello(){ if (spoke) return; spoke = true; setTimeout(() => { if (!Play.EVENTS.some(e => e.type === 'finding' || e.type === 'word')) say('Tap a letter on the wheel!', {pitch: 1.3, interrupt: false}); }, 1200); }

/* ============================================================================
   Start
   ============================================================================ */
findings($('finds'), [
  {id: 'first_real',   icon: '🐦', label: 'Your first real word', say: 'A real word! Mimi is happy.'},
  {id: 'silly',        icon: '😄', label: 'A silly not-word',     say: 'Not a real word — that’s funny, not wrong!'},
  {id: 'all_families', icon: '🎡', label: '-at, -en and -op',     say: 'A real word on every ending!'},
  {id: 'rhymers',      icon: '🎵', label: 'Three that rhyme',     say: 'They all rhyme — they end the same way!'},
  {id: 'five_words',   icon: '⭐', label: 'Five real words',      say: 'Five real words! You are a rhyming champion.'},
], () => { say('You found them all! Rhyming words end the same way.', {pitch: 1.25}); paintTry(); });
paintTry();
window.applyFeatures = () => { paintWheel(S.wheelAngle); paintTabs(); };
window.PG_STATE = () => ({ending: S.ending, wheelAngle: S.wheelAngle, selected: ONSETS[selectedIndex(S.wheelAngle)],
  current: S.current, found: [...S.found], byEnding: {at: [...S.byEnding.at], en: [...S.byEnding.en], op: [...S.byEnding.op]}, goal: currentTry()});
window.PG_MODEL = {ENDINGS, ONSETS, REAL, wordFor, isReal, ONSET_SOUND};
</script>
</body>
</html>

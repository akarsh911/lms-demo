<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Word Train</title>
<meta name="description" content="Class 1–2: put letter sounds in the train's carriages and hear them blend into a word.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../../play.css">
<style>
.pg-main.tiny-main{grid-template-columns:minmax(0,1fr) 250px; padding-top:12px; padding-bottom:12px}
.tiny-main .pg-stage{align-self:start; min-height:0}
.pg-intro{display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding-top:12px}
.pg-intro p{margin:0}
.pg-intro .syl{font-size:14px; font-weight:700; color:var(--ink-3); background:var(--sunk); padding:3px 12px; border-radius:99px}
#stage{background:#bfe7ff}
.tile, .carHit{cursor:grab}
.tile.dragging, .carHit.dragging{cursor:grabbing}
#engineHit, #addCar{cursor:pointer}
svg [tabindex]:focus{outline:none}
svg [tabindex]:focus-visible{outline:none; stroke:#ff7a2f; stroke-width:4; stroke-dasharray:8 8}
svg text{font-family:"Fredoka","Nunito",sans-serif}
.fade{transition:opacity .35s}
.hear{width:100%; min-height:76px; font-size:24px; font-family:var(--font-head); border-radius:var(--radius)}
.hear .ic{font-size:30px}
.try{padding:10px; text-align:center; cursor:pointer; border:2px solid var(--hair-2); transition:transform .2s var(--spring)}
.try:hover{border-color:var(--accent)}
.try:active{transform:scale(.97)}
.try svg{display:block; width:100%; height:auto}
.try .kicker{margin:2px 0 0}
@media (max-width:980px){ .pg-main.tiny-main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="pg-top"></header>

<div class="pg-intro">
  <h1>The word train</h1>
  <p>Put sounds in the carriages and hear the word come to life.</p>
  <p class="syl">Class 1–2 English: letter sounds and blending</p>
</div>

<main class="pg-main tiny-main">
  <section class="pg-stage" id="stageWrap">
    <svg id="stage" viewBox="0 0 1000 660" role="img" aria-label="A little steam train with empty carriages, and a shelf of letter blocks. Drag letters into the carriages to make a word."></svg>
  </section>

  <aside class="pg-side">
    <button class="btn primary hear" id="hear" aria-label="Hear what to do"><span class="ic">🔊</span> Hear it</button>
    <button class="card try" id="tryCard" aria-label="What to try next. Tap to hear it."><svg id="tryArt" viewBox="-80 -55 160 110"></svg><div class="kicker">Try this</div></button>
    <div class="card"><h3>⭐ Found</h3><div id="finds"></div></div>
  </aside>
</main>

<script src="../../play.js"></script>
<script>
'use strict';
const {$, clamp, lerp, loop, tween, sleep, sound, tone, say, track, confetti, findings, discover, found,
       shareState, sharedState, mount, reduced, drag, mulberry32, ease} = Play;
mount({thread: 'words', band: 'tiny'});

/* MODEL:start ==================================================================
   Letters -> sounds -> a blended word.

   A word is split into its SOUNDS (phonemes) left to right; the four digraphs a
   Class 1–2 reader meets (sh, ch, th, ck) are one sound each, so "ship" is sh-i-p
   and "duck" is d-u-ck. Each sound has a short spoken form (the table below) that
   the voice says; the blend is the letters read together as one word.

   The train decides nothing by itself: it reads exactly the letters placed in its
   carriages. If they spell a word the page knows, the word's picture comes out
   (PICTURES, drawn in code); a real word without a picture still counts; anything
   else is read out as a silly word.
   ============================================================================ */
const SOUND = {a: 'ah', b: 'buh', c: 'kuh', d: 'duh', e: 'eh', f: 'fff', g: 'guh', h: 'huh', i: 'ih', k: 'kuh', l: 'lll',
  n: 'nnn', o: 'aw', p: 'puh', r: 'rrr', s: 'sss', t: 'tuh', u: 'uh', v: 'vvv', x: 'ks', sh: 'shhh', ch: 'chuh', th: 'thh', ck: 'kuh'};
const DIGRAPHS = ['sh', 'ch', 'th', 'ck'];
const VOWELS = new Set(['a', 'e', 'i', 'o', 'u']);
const ANIMALS = new Set(['cat', 'bat', 'rat', 'dog', 'pig', 'hen', 'fox', 'fish', 'frog', 'duck', 'pup', 'cub', 'bug', 'hog']);
/* Real words a child may build from these letters that have no picture here. */
const EXTRA = new Set(('bad bag big bit bed beg bet bin bud bug but cab can cap cob cot cub cut dad did dig dip dot dug fat fed fig fin fit fix fog fun ' +
  'gap gas get got had has hid hip hit hog hop hot hub hug hut kid kit lab lad lap led leg let lid lip lit lot nap net nib nod not nut pad pan pat peg pet ' +
  'pin pit pod pot pup put rag ran rap red rib rip rod rot rub rug run sad sat set sit six sob tab tag tan tap ten tin tip top tub tug vet ' +
  'back pack sack rack tick pick sick kick lick rock sock lock dock luck tuck neck deck ' +
  'dish rush hush cash dash shop shed shut chip chop chin chat thin that this then bath path ' +
  'crab crib grab grin grip trip trap drop drip drag flag flap flip flat clap clip slip spot spin stop step snap ' +
  'nest best rest test vest desk help hand band land sand pond bend send tent bent gift lift soft raft fist list lost').split(' '));

function phonemes(word){
  const out = [];
  for (let i = 0; i < word.length; i++) {
    const two = word.slice(i, i + 2);
    if (DIGRAPHS.includes(two)) { out.push(two); i++; } else out.push(word[i]);
  }
  return out;
}
function isWord(w){ return w in PICTURES || EXTRA.has(w); }
function hasPicture(w){ return w in PICTURES; }
const rhymes = (a, b) => a !== b && a.length >= 3 && b.length >= 3 && a.slice(-2) === b.slice(-2);
function oneChange(a, b){ if (!a || !b || a.length !== b.length || a === b) return false; let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; return d === 1; }
/* The spoken sounds for a word, one per phoneme. */
const soundsOf = w => phonemes(w).map(p => SOUND[p] || p);
/* MODEL:end */

/* ---- juice helpers --------------------------------------------------------- */
function clientOf(x, y){
  const m = svg.getScreenCTM(); if (!m) return {x: innerWidth / 2, y: innerHeight / 2};
  const p = svg.createSVGPoint(); p.x = x; p.y = y; const q = p.matrixTransform(m); return {x: q.x, y: q.y};
}
function squash(el, cx, cy, amt = 0.15, ms = 460){
  return tween(0, 1, ms, t => {
    const k = Math.sin(t * Math.PI * 3) * (1 - t) * amt;
    el.setAttribute('transform', `translate(${cx} ${cy}) scale(${(1 + k).toFixed(3)} ${(1 - k).toFixed(3)}) translate(${-cx} ${-cy})`);
  }, x => x).then(() => el.removeAttribute('transform'));
}
const toot = () => { tone(523, 0.28, 'square', 0.05, 0); tone(659, 0.28, 'square', 0.05, 0); tone(523, 0.4, 'square', 0.05, 0.32); tone(784, 0.4, 'square', 0.04, 0.32); };
const chuff = () => tone(120, 0.08, 'sawtooth', 0.025, 0, 60);
/* Speak, but never wait longer than the cap (voices can be missing). */
const speak = (text, o = {}, cap = 1400) => Promise.race([say(text, o), sleep(cap)]);

/* ---- paint ------------------------------------------------------------------ */
let MOOD = 'idle', moodT = 0;
function setMood(m, secs = 0){ MOOD = m; moodT = secs; paintFace(); }
function paintFace(){
  const show = (id, on) => $(id).setAttribute('opacity', on ? 1 : 0);
  show('eyeOpen', MOOD === 'idle' || MOOD === 'say' || MOOD === 'look');
  show('eyeHappy', MOOD === 'cheer'); show('eyeSilly', MOOD === 'silly');
  show('mSmile', MOOD === 'idle' || MOOD === 'look'); show('mOpen', MOOD === 'cheer'); show('mSilly', MOOD === 'silly'); show('mSay', MOOD === 'say');
}
function word(){ let w = ''; for (let i = 0; i < S.nCar; i++) { if (!S.cars[i]) break; w += S.cars[i]; } return w; }
function filled(){ return S.cars.slice(0, S.nCar).filter(Boolean).length; }
function paint(){
  const w = word(), real = isWord(w) && w.length === filled() && S.lastRead === w;
  for (let c = 0; c < 4; c++) {
    const on = c < S.nCar, l = S.cars[c];
    $('car' + c).setAttribute('opacity', on ? 1 : 0);
    $('carHit' + c).style.display = on ? '' : 'none';
    $('blk' + c).setAttribute('opacity', l ? 1 : 0);
    $('slot' + c).setAttribute('opacity', on && !l ? 1 : 0);
    $('blkT' + c).textContent = l;
    $('blkR' + c).setAttribute('fill', real && l ? NOUN : '#fff6e3');
    $('blkR' + c).setAttribute('stroke', real && l ? '#24508f' : '#d9b98a');
    $('blkT' + c).setAttribute('fill', real && l ? '#fff' : (VOWELS.has(l) ? '#e0567a' : '#2f4f8f'));
    $('carHit' + c).setAttribute('aria-label', `Carriage ${c + 1}: ${l ? 'letter ' + l : 'empty'}`);
  }
  $('addCarG').setAttribute('opacity', S.nCar === 3 ? 1 : 0);
  $('addCar').style.display = S.nCar === 3 ? '' : 'none';
  $('engine').setAttribute('transform', `translate(${S.nCar * CAR_W} 0)`);
  $('engineHit').setAttribute('x', S.nCar * CAR_W);
  placeTrain();
  const made = S.made.slice(-5);
  for (let k = 0; k < 5; k++) {
    const w2 = made[k];
    $('shelfPic' + k).innerHTML = w2 ? (PICTURES[w2] || WORD_ONLY) : '';
    $('frame' + k).setAttribute('stroke-dasharray', w2 ? '' : '6 6');
    $('frame' + k).setAttribute('fill-opacity', w2 ? 1 : 0.6);
  }
  paintFace();
  paintTry();
}
let bob = 0;
function placeTrain(){ $('train').setAttribute('transform', `translate(${f1(S.x0 + S.trip)} ${f1(bob)})`); }

/* ---- reading the train: sounds one by one, then the blend -------------------- */
async function readTrain(){
  const w = word();
  if (!w || S.busy) return;
  S.busy = true; hintOff();
  const ph = phonemes(w), real = isWord(w);
  track('read', {word: w, real, sounds: ph});
  setMood('say');
  /* each sound: its carriage(s) hop, and the voice says the sound */
  let ci = 0;
  for (let k = 0; k < ph.length; k++) {
    const n = ph[k].length, cars = Array.from({length: n}, (_, j) => ci + j); ci += n;
    cars.forEach(c => { squash($('blkJ' + c), 0, 44, 0.22, 420); });
    Play.sound('note', 392 + k * 98, 0.16);
    const wait = Promise.all([speak(SOUND[ph[k]] || ph[k], {interrupt: k === 0}), sleep(reduced() ? 250 : 520)]);
    await wait;
  }
  await sleep(reduced() ? 60 : 180);
  /* the blend */
  for (let c = 0; c < w.length; c++) setTimeout(() => squash($('blkJ' + c), 0, 44, 0.16, 380), reduced() ? 0 : c * 60);
  S.lastRead = w;
  if (real) {
    setMood('cheer');
    paint();
    const blend = speak(w + '!', {interrupt: false, rate: 0.85}, 1600);
    Play.sound('chime');
    await showPicture(w);
    await blend;
    await sleep(reduced() ? 100 : 400);
    toot();
    await puffOff();
    const first = !S.made.includes(w);
    if (first) S.made.push(w);
    hidePicture();
    paint();
    celebrate(w);
    S.lastReal = w;
  } else {
    setMood('silly', 2.4);
    Play.sound('boing');
    showSilly();
    await speak(w + '! A silly word!', {interrupt: false, rate: 0.9}, 1600);
    await wobble();
    await sleep(reduced() ? 100 : 500);
    hidePicture();
    paint();
  }
  S.busy = false;
  setMood('idle');
}
/* A word can earn more than one discovery; they arrive one after another, each with its own voice line. */
function celebrate(w){
  const c = clientOf(500, 300);
  const ids = ['first'];
  if (ANIMALS.has(w)) ids.push('animal');
  if (oneChange(S.lastReal, w)) ids.push('change');
  if (S.made.some(m => rhymes(m, w))) ids.push('rhyme');
  if (w.length === 4) ids.push('four');
  if (new Set(S.made).size >= 5) ids.push('five');
  const fresh = ids.filter(id => !found(id));
  if (!fresh.length) { confetti(c.x, c.y, 40); say(pick(['Well done!', 'Yay!', 'Choo choo!', 'Great word!'])); return; }
  fresh.forEach((id, k) => setTimeout(() => { discover(id, c); setTimeout(paintTry, 1200); }, k * 2600));
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
async function showPicture(w){
  $('popPic').innerHTML = PICTURES[w] || WORD_ONLY;
  $('popWord').textContent = w;
  $('popWord').setAttribute('fill', NOUN);
  const P = $('pop'); P.setAttribute('opacity', 1);
  await tween(0, 1, 620, k => P.setAttribute('transform', `translate(500 ${f1(lerp(300, 150, k))}) scale(${Math.max(0.01, k).toFixed(3)})`), ease.back);
  squash($('popJ'), 0, 0, 0.1, 400);
}
function showSilly(){
  $('popPic').innerHTML = SILLY; $('popWord').textContent = word(); $('popWord').setAttribute('fill', '#f29a1f');
  const P = $('pop'); P.setAttribute('opacity', 1);
  tween(0, 1, 420, k => P.setAttribute('transform', `translate(500 ${f1(lerp(300, 150, k))}) scale(${Math.max(0.01, k).toFixed(3)})`), ease.back);
}
function hidePicture(){ $('pop').setAttribute('opacity', 0); }
async function wobble(){
  const T = $('train');
  await tween(0, 1, 700, k => { bob = Math.sin(k * Math.PI * 6) * (1 - k) * 8; placeTrain(); }, x => x);
  bob = 0; placeTrain();
}
/* off it goes, round the world, and back */
let moving = 0;
async function puffOff(){
  if (reduced()) { S.trip = 0; placeTrain(); return; }
  moving = 1;
  await tween(0, 1150, 1300, x => { S.trip = x; placeTrain(); }, t => t * t);
  S.trip = -1150; placeTrain();
  await tween(-1150, 0, 1300, x => { S.trip = x; placeTrain(); }, ease.out);
  moving = 0;
}

/* ---- dragging letters -------------------------------------------------------- */
let DRAGPOS = null, lastDragEnd = 0;
function carAt(p){
  for (let c = 0; c < S.nCar; c++) {
    const x = S.x0 + c * CAR_W;
    if (p.x > x - 10 && p.x < x + 142 && p.y > 210 && p.y < 440) return c;
  }
  return -1;
}
function showGhost(l, p){ $('ghostT').textContent = l; $('ghostT').setAttribute('fill', VOWELS.has(l) ? '#e0567a' : '#2f4f8f'); $('ghost').setAttribute('opacity', 1); $('ghost').setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`); }
function flyGhostTo(x, y){
  if (reduced()) { $('ghost').setAttribute('opacity', 0); return Promise.resolve(); }
  const m = $('ghost').transform.baseVal.consolidate(); const x0 = m ? m.matrix.e : x, y0 = m ? m.matrix.f : y;
  return tween(0, 1, 260, k => $('ghost').setAttribute('transform', `translate(${f1(lerp(x0, x, k))} ${f1(lerp(y0, y, k))}) scale(${(1 - 0.2 * k).toFixed(2)})`), ease.out)
    .then(() => $('ghost').setAttribute('opacity', 0));
}
function wireSource(el, get, fromCar){
  let p0 = null, t0 = 0, moved = 0, letter = '';
  drag(el, svg, {
    start(p){ if (S.busy) return false; hello(); letter = get(); if (!letter) return false; p0 = p; t0 = performance.now(); moved = 0; },
    move(p){
      moved = Math.max(moved, Math.hypot(p.x - p0.x, p.y - p0.y));
      if (moved < 8) return;
      if (DRAGPOS === null) { Play.sound('pop'); setMood('look'); if (fromCar != null) { S.cars[fromCar] = ''; S.lastRead = ''; paint(); } }
      DRAGPOS = p; showGhost(letter, p);
    },
    end(p){
      const wasDrag = DRAGPOS !== null; DRAGPOS = null; setMood('idle');
      if (wasDrag) lastDragEnd = performance.now();
      if (!wasDrag) { if (performance.now() - t0 < 800) tapLetter(letter, fromCar); return; }
      const c = carAt(p);
      if (c >= 0) {
        if (fromCar != null && S.cars[c] && c !== fromCar) S.cars[fromCar] = S.cars[c];   /* swap */
        S.cars[c] = letter; S.lastRead = ''; S.placed++;
        $('ghost').setAttribute('opacity', 0);
        Play.sound('snap');
        paint();
        squash($('blkJ' + c), 0, 44, 0.2, 420);
        say(SOUND[letter], {interrupt: false});
        track('place', {letter, car: c, word: word()});
        afterChange();
      } else {
        const i = LETTERS.indexOf(letter), tp = tilePos(i);
        flyGhostTo(tp.x + TILE / 2, tp.y + TILE / 2);
        Play.sound(fromCar != null ? 'whoosh' : 'tick');
        if (fromCar != null) { track('remove', {letter, car: fromCar}); afterChange(); }
      }
    },
  });
}
function tapLetter(l, car){
  if (!l) return;
  Play.sound('note', 440 + LETTERS.indexOf(l) * 18, 0.12);
  say(SOUND[l]);
  if (car != null) squash($('blkJ' + car), 0, 44, 0.2, 420);
  else squash($('tileJ-' + l), 0, 0, 0.18, 420);
  track('letter', {letter: l, sound: SOUND[l]});
}
LETTERS.forEach(l => {
  wireSource($('tile-' + l), () => l, null);
  /* keyboard: Enter puts the letter in the first empty carriage */
  $('tile-' + l).addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); if (S.busy) return;
    const c = S.cars.slice(0, S.nCar).indexOf('');
    if (c < 0) return tapLetter(l, null);
    S.cars[c] = l; S.lastRead = ''; S.placed++; Play.sound('snap'); paint(); say(SOUND[l]); afterChange();
  });
});
for (let c = 0; c < 4; c++) {
  wireSource($('carHit' + c), () => S.cars[c], c);
  $('carHit' + c).addEventListener('keydown', e => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && !S.busy && S.cars[c]) { S.cars[c] = ''; S.lastRead = ''; paint(); afterChange(); }
  });
}
/* After every change: read the train when it is full, or as soon as it spells a word. */
let autoT = 0;
function afterChange(){
  clearTimeout(autoT);
  const w = word(), n = filled();
  if (!w) return;
  const full = n === S.nCar && w.length === n;
  const spells = w.length === n && w.length >= 3 && isWord(w);
  if (full || spells) autoT = setTimeout(readTrain, reduced() ? 150 : 450);
}

/* ---- the engine and the extra carriage --------------------------------------- */
function tapEngine(){
  hello();
  if (S.busy) return;
  squash($('engine'), S.nCar * CAR_W + 130, 400, 0.08, 420);
  if (!word()) { toot(); say('Put some letters in my carriages!'); return; }
  readTrain();
}
function setCars(n){
  if (S.busy || n === S.nCar) return;
  if (n === 3) S.cars[3] = '';
  const from = S.x0, to = trainX0(n);
  S.nCar = n; S.lastRead = '';
  Play.sound(n === 4 ? 'snap' : 'whoosh');
  if (n === 4) say('One more carriage! Can you make a longer word?');
  paint();
  tween(from, to, 380, x => { S.x0 = x; placeTrain(); }, ease.out).then(() => { S.x0 = to; placeTrain(); });
  track('carriages', {n});
}
const onTap = (id, fn) => { $(id).addEventListener('click', fn); $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
onTap('engineHit', tapEngine);
onTap('addCar', () => setCars(4));
/* tapping the fourth carriage while it is empty unhooks it */
$('carHit3').addEventListener('click', () => { if (S.nCar === 4 && !S.cars[3] && !S.busy && performance.now() - lastDragEnd > 400) setCars(3); });

/* ---- idle life: clouds, blinking, smoke, the hint ---------------------------- */
let T = 0, blinkT = 2, puffT = 0, hintPhase = 'on';
const puffs = [];
function hintOff(){ hintPhase = 'off'; $('hint').setAttribute('opacity', 0); }
function idle(dt){
  T += dt;
  if (moodT > 0) { moodT -= dt; if (moodT <= 0 && !S.busy) setMood('idle'); }
  /* the engine looks at a letter being carried, or at its carriages */
  const ex = S.x0 + S.trip + S.nCar * CAR_W + 173, ey = 338;
  const tgt = DRAGPOS || {x: S.x0 + S.trip + 60, y: 300};
  const dx = tgt.x - ex, dy = tgt.y - ey, L = Math.hypot(dx, dy) || 1;
  $('pupils').setAttribute('transform', `translate(${(dx / L * 5).toFixed(1)} ${(dy / L * 5).toFixed(1)})`);
  if (reduced()) { $('hint').setAttribute('opacity', 0); return; }
  blinkT -= dt;
  const lid = blinkT > 0 && blinkT < 0.13 ? 38 : 0;
  $('lid1').setAttribute('height', lid); $('lid2').setAttribute('height', lid);
  if (blinkT < 0) blinkT = 2 + Math.random() * 3;
  /* clouds drift */
  [[120, 90, 8], [760, 150, 5], [420, 60, 11]].forEach(([x, y, v], i) => {
    const xx = ((x + T * v) % 1160) - 80;
    $('cl' + i).setAttribute('transform', `translate(${f1(xx)} ${y})`);
  });
  /* the wheels turn when the train moves; the chimney puffs */
  const spin = moving ? T * 600 : 0;
  $$('.spokes').forEach(g => g.setAttribute('transform', `rotate(${f1(spin % 360)})`));
  puffT -= dt;
  if (puffT < 0) { puffT = moving ? 0.12 : 1.1; addPuff(); if (moving) chuff(); }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    const k = p.t / 1.6;
    if (k >= 1) { p.el.remove(); puffs.splice(i, 1); continue; }
    p.el.setAttribute('cx', f1(p.x - k * (moving ? 90 : 18))); p.el.setAttribute('cy', f1(p.y - k * 70)); p.el.setAttribute('r', f1(8 + k * 16)); p.el.setAttribute('opacity', (0.85 * (1 - k)).toFixed(2));
  }
  /* the hint: a hand carries a "c" from the shelf to the first carriage */
  if (hintPhase === 'on') {
    if (S.placed >= 3) { hintOff(); return; }
    const c = S.cars.slice(0, S.nCar).indexOf(''); if (c < 0) return;
    const a = tilePos(2), b = {x: S.x0 + c * CAR_W + 66 - 37, y: 252};
    const k = (T * 0.45) % 1, e = ease.inOut(clamp(k / 0.8, 0, 1));
    $('hint').setAttribute('transform', `translate(${f1(lerp(a.x, b.x, e) + 37)} ${f1(lerp(a.y, b.y, e) + 37)})`);
    $('hint').setAttribute('opacity', k > 0.9 ? 0 : 1);
  }
}
function addPuff(){
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('fill', '#fff');
  $('puffs').appendChild(c);
  puffs.push({el: c, t: 0, x: 207, y: 236});
}
const $$ = sel => Array.from(svg.querySelectorAll(sel));

/* ---- the "try this" card ------------------------------------------------------- */
const miniBlock = (x, y, l, blue) => `<rect x="${x - 15}" y="${y - 15}" width="30" height="30" rx="7" fill="${blue ? NOUN : '#fff6e3'}" stroke="${blue ? '#24508f' : '#d9b98a'}" stroke-width="2"/><text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="600" fill="${blue ? '#fff' : VOWELS.has(l) ? '#e0567a' : '#2f4f8f'}">${l}</text>`;
const TRY = {
  first: {line: 'Drag letters into the train to make a word. Try c, a, t. Cat!', art: `${miniBlock(-52, 30, 'c')}${miniBlock(-18, 30, 'a')}${miniBlock(16, 30, 't')}<g transform="translate(46 -12) scale(.62)">${PICTURES.cat}</g>
    <path d="M-50 -2 q30 -40 62 -24" fill="none" stroke="#ffb42a" stroke-width="3" stroke-dasharray="4 6"/>`},
  animal: {line: 'Can you make an animal? A dog, a pig, a hen, a fox?', art: `<g transform="translate(-44 -8) scale(.55)">${PICTURES.dog}</g><g transform="translate(0 -8) scale(.55)">${PICTURES.pig}</g><g transform="translate(44 -8) scale(.55)">${PICTURES.hen}</g>
    <text x="0" y="46" text-anchor="middle" font-size="22" font-weight="600" fill="#b5620a">?</text>`},
  change: {line: 'Change just one letter. Cat can become bat!', art: `${miniBlock(-56, -14, 'c')}${miniBlock(-24, -14, 'a')}${miniBlock(8, -14, 't')}
    <path d="M-56 4 v14" stroke="#ffb42a" stroke-width="4" stroke-linecap="round"/><path d="M-62 14 l6 7 l6 -7" fill="none" stroke="#ffb42a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${miniBlock(-56, 38, 'b')}${miniBlock(-24, 38, 'a')}${miniBlock(8, 38, 't')}<g transform="translate(52 12) scale(.5)">${PICTURES.bat}</g>`},
  rhyme: {line: 'Make two words that sound the same at the end. Cat and hat!', art: `<g transform="translate(-40 -10) scale(.55)">${PICTURES.cat}</g><g transform="translate(40 -10) scale(.55)">${PICTURES.hat}</g>
    <text x="-40" y="46" text-anchor="middle" font-size="22" font-weight="600" fill="#2f4f8f">c<tspan fill="#e0567a">at</tspan></text><text x="40" y="46" text-anchor="middle" font-size="22" font-weight="600" fill="#2f4f8f">h<tspan fill="#e0567a">at</tspan></text>`},
  four: {line: 'Tap the dotted carriage to add one more. Then make a long word, like fish!', art: `${[0, 1, 2].map(i => `<rect x="${-72 + i * 34}" y="10" width="30" height="22" rx="5" fill="${CAR_COLS[i]}"/>`).join('')}
    <rect x="30" y="10" width="30" height="22" rx="5" fill="#fff" stroke="#8a94a6" stroke-width="2" stroke-dasharray="4 4"/><path d="M45 14 v14 M38 21 h14" stroke="#8a94a6" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(0 -24) scale(.5)">${PICTURES.fish}</g>`},
  five: {line: 'Make five words! Watch them fill the frames at the top.', art: `${[0, 1, 2, 3, 4].map(i => `<rect x="${-74 + i * 30}" y="-14" width="26" height="26" rx="6" fill="${i < 3 ? '#fff' : 'none'}" stroke="#8a94a6" stroke-width="2" ${i < 3 ? '' : 'stroke-dasharray="4 4"'}/>`).join('')}
    <g transform="translate(-61 -1) scale(.2)">${PICTURES.cat}</g><g transform="translate(-31 -1) scale(.2)">${PICTURES.sun}</g><g transform="translate(-1 -1) scale(.2)">${PICTURES.bus}</g>
    <text x="0" y="44" text-anchor="middle" font-size="24" font-weight="600" fill="#b5620a">5</text>`},
};
const TRY_ORDER = ['first', 'animal', 'change', 'rhyme', 'four', 'five'];
const currentTry = () => TRY_ORDER.find(g => !found(g)) || null;
let shownTry;
function paintTry(){
  const g = currentTry();
  if (g === shownTry) return;
  shownTry = g;
  $('tryArt').innerHTML = g ? TRY[g].art : WORD_ONLY;
  if (!reduced()) $('tryCard').animate([{transform: 'scale(.9)'}, {transform: 'scale(1.04)'}, {transform: 'scale(1)'}], {duration: 450, easing: 'ease-out'});
}
function sayTry(){ const g = currentTry(); say(g ? TRY[g].line : 'You found everything! Keep making words.'); track('hear', {goal: g}); }
$('tryCard').addEventListener('click', () => { spoke = true; sayTry(); });
$('hear').addEventListener('click', () => { spoke = true; sayTry(); });
let spoke = false;
function hello(){ if (spoke) return; spoke = true; say('Choo choo! Put letters in my carriages, and I will read them to you!'); }
svg.addEventListener('pointerdown', hello);

/* ============================================================================
   Start
   ============================================================================ */
findings($('finds'), [
  {id: 'first',  icon: '🚂', label: 'First word',                  say: 'Your first word! The sounds joined up into a word.'},
  {id: 'animal', icon: '🐾', label: 'An animal word',              say: 'An animal word!'},
  {id: 'change', icon: '🔁', label: 'Change one letter, new word', say: 'You changed one letter, and made a new word!'},
  {id: 'rhyme',  icon: '🎵', label: 'Rhyming words',               say: 'They rhyme! They sound the same at the end.'},
  {id: 'four',   icon: '🐟', label: 'Four-letter word',            say: 'A long word, with four letters!'},
  {id: 'five',   icon: '🖐️', label: '5 words made',                say: 'Five words! You are a word maker!'},
], () => { say('You found them all! Sounds join up to make words.'); paintTry(); });
paint();
loop(dt => idle(dt));
window.applyFeatures = () => paint();
window.PG_STATE = () => ({nCar: S.nCar, cars: S.cars.slice(), word: word(), busy: S.busy, made: S.made.slice(), lastRead: S.lastRead, mood: MOOD, goal: currentTry()});
window.PG_MODEL = {phonemes, isWord, hasPicture, rhymes, oneChange, soundsOf, SOUND, LETTERS, PICTURES: Object.keys(PICTURES), ANIMALS: [...ANIMALS]};
</script>

    html += "<h4>" + label + "</h4>";
    for (const id of ids) {
      const p = PAGES.find(x => x.id === id);
      html += '<a class="page" href="#' + p.id + '" data-page="' + p.id + '">' + escapeHtml(p.nav) + "</a>";
      html += '<div class="subs" data-for="' + p.id + '"></div>';
    }
  }
  side.innerHTML = html;
}

function fillSubs(pageId) {
  $$(".subs").forEach(d => { d.innerHTML = ""; });
  const holder = $('.subs[data-for="' + pageId + '"]');
  if (!holder) return;
  holder.innerHTML = outlines[pageId]
    .filter(o => o.depth === 2 || o.depth === 3)
    .map(o => '<a class="sub h' + o.depth + '" href="#' + pageId + "/" + o.id + '" data-id="' + o.id + '">' + escapeHtml(o.text) + "</a>")
    .join("");
}

const rs = { seen: {}, sources: {} };
const renderer = {
  heading(text, level, raw) {
    const base = slug(raw);
    rs.seen[base] = (rs.seen[base] || 0) + 1;
    const id = rs.seen[base] > 1 ? base + "-" + rs.seen[base] : base;
    return "<h" + level + ' id="' + id + '">' + text + "</h" + level + ">\n";
  },
  table(header, body) {
    return '<div class="tw"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>\n";
  },
  code(code, lang) {
    if (lang === "mermaid") {
      const n = state.ids++;
      rs.sources[n] = code;
      const kind = code.trim().split(/\s|\n/)[0].replace(/-v2$/, "");
      return '<figure class="dg" data-n="' + n + '" data-kind="' + kind + '"><div class="dg-bar"><span class="kind">' + kind +
        '</span><span class="caption"></span></div><div class="dg-body"><div class="dg-load">Rendering diagram</div></div>' +
        '<div class="dg-info"></div><pre class="dg-src"><code>' + escapeHtml(code) + "</code></pre></figure>\n";
    }
    return "<pre><code>" + escapeHtml(code) + "</code></pre>\n";
  }
};

function theme() {
  return document.documentElement.dataset.theme === "dark" ? "dark" : "default";
}
function initMermaid() {
  mermaid.initialize({
    startOnLoad: false,
    theme: theme(),
    securityLevel: "strict",
    flowchart: { htmlLabels: true, curve: "basis", useMaxWidth: false },
    sequence: { useMaxWidth: false, mirrorActors: false },
    er: { useMaxWidth: false },
    class: { useMaxWidth: false },
    state: { useMaxWidth: false },
    maxTextSize: 200000
  });
}

function showPage(id, anchor) {
  const page = PAGES.find(p => p.id === id) || PAGES[0];
  state.page = page.id;
  stopSteps();
  if (state.observer) state.observer.disconnect();
  if (state.seenObserver) state.seenObserver.disconnect();
  rs.seen = {};
  rs.sources = {};
  state.ids = 0;
  main.innerHTML = '<div class="page" id="page">' + marked.parse(page.md) + "</div>";
  if (page.id === "0") appendFlowIndex();
  decoratePaths(main);
  $$(".page > h1").forEach(h => { h.style.marginTop = "0"; });
  $$("nav.side a.page").forEach(a => a.classList.toggle("active", a.dataset.page === page.id));
  fillSubs(page.id);
  observeDiagrams();
  observeHeadings();
  document.title = page.title + " | emerge-core architecture map";
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 60);
  } else {
    window.scrollTo(0, 0);
  }
  $("#side").classList.remove("open");
}

function decoratePaths(root) {
  $$("code", root).forEach(c => {
    if (c.closest("pre")) return;
    const t = c.textContent.trim();
    if (/[A-Za-z0-9_\-]+\/[A-Za-z0-9_\-\/.]+|\.(go|py|sql|yml|yaml|sh|proto|json|md|conf)\b/.test(t) && !/\s{2,}/.test(t)) {
      c.classList.add("path");
      c.title = "Click to copy";
      c.addEventListener("click", () => {
        copy(t);
        c.classList.add("copied");
        setTimeout(() => c.classList.remove("copied"), 900);
      });
    }
  });
}

function appendFlowIndex() {
  const wrap = document.createElement("div");
  wrap.className = "cards";
  const parts = PAGES.filter(p => p.id !== "0");
  wrap.innerHTML = parts.map(p => {
    const outline2 = outlines[p.id].filter(o => o.depth === 2);
    const diagrams = (p.md.match(/```mermaid/g) || []).length;
    const items = outlines[p.id].filter(o => o.depth === 2 || o.depth === 3)
      .map(o => '<li class="h' + o.depth + '"><a href="#' + p.id + "/" + o.id + '">' + escapeHtml(o.text) + "</a></li>").join("");
    return '<div class="card"><h3><a href="#' + p.id + '">' + escapeHtml(p.nav) + '</a></h3><div class="meta">' +
      outline2.length + " sections, " + diagrams + " diagrams</div><ul>" + items + "</ul></div>";
  }).join("");
  $("#page").appendChild(wrap);
}

function observeHeadings() {
  const heads = $$("#page h2, #page h3");
  const subs = $$("nav.side .subs a.sub");
  if (state.spy) state.spy.disconnect();
  state.spy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      subs.forEach(a => a.classList.toggle("on", a.dataset.id === e.target.id));
      const on = subs.find(a => a.classList.contains("on"));
      if (on) on.scrollIntoView({ block: "nearest" });
    });
  }, { rootMargin: "-120px 0px -70% 0px" });
  heads.forEach(h => state.spy.observe(h));
}

function observeDiagrams() {
  const figs = $$("figure.dg");
  state.seenObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("seen"); });
  }, { threshold: 0.05 });
  state.observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      state.observer.unobserve(e.target);
      renderDiagram(e.target);
    });
  }, { rootMargin: "700px 0px" });
  figs.forEach(f => {
    state.seenObserver.observe(f);
    state.observer.observe(f);
    f.classList.toggle("flow", state.animate);
  });
}

async function renderDiagram(fig) {
  const n = Number(fig.dataset.n);
  const src = rs.sources[n];
  const body = $(".dg-body", fig);
  try {
    const out = await mermaid.render("mmd-" + n + "-" + Date.now(), src);
    body.innerHTML = out.svg;
    fig.dataset.rendered = "1";
    enhance(fig);
  } catch (err) {
    const msg = (err && err.message ? err.message : String(err)).split("\n").slice(0, 3).join(" ");
    body.innerHTML = '<div class="dg-err">This diagram could not be rendered: ' + escapeHtml(msg) +
      ". The source is under View source.</div>";
    fig.classList.add("show-src");
  }
  buildBar(fig);
}

function buildBar(fig) {
  const bar = $(".dg-bar", fig);
  if ($(".tools", bar)) return;
  const kind = fig.dataset.kind;
  const tools = document.createElement("span");
  tools.className = "tools";
  const mk = (label, fn) => {
    const b = document.createElement("button");
    b.className = "tool";
    b.textContent = label;
    b.addEventListener("click", () => fn(b));
    tools.appendChild(b);
    return b;
  };
  if (fig.dataset.rendered) {
    if (kind === "sequenceDiagram") {
      mk("Play", b => playSequence(fig, b));
      mk("Step", () => stepSequence(fig, 1));
      mk("Reset", () => resetSteps(fig));
    } else if (kind === "flowchart" || kind === "graph") {
      mk("Trace edges", b => traceFlow(fig, b));
      mk("Reset", () => resetSteps(fig));
    }
    mk("Expand", () => expand(fig));
  }
  mk("View source", b => {
    fig.classList.toggle("show-src");
    b.textContent = fig.classList.contains("show-src") ? "Hide source" : "View source";
  });
  mk("Copy source", () => copy(rs.sources[Number(fig.dataset.n)]));
  bar.insertBefore(tools, $(".caption", bar));
}

function tableAfter(fig) {
  let el = fig.nextElementSibling;
  while (el) {
    if (el.classList.contains("dg") || /^H[1-4]$/.test(el.tagName)) return null;
    if (el.classList.contains("tw")) return el.querySelector("table");
    el = el.nextElementSibling;
  }
  return null;
}

function normalize(s) {
  return s.toLowerCase().replace(/[`'"]/g, "").replace(/\s+/g, " ").trim();
}

function matchRow(fig, label) {
  const table = tableAfter(fig);
  if (!table) return null;
  const text = normalize(label.replace(CAT_RE, ""));
  let best = null;
  let bestScore = 0;
  $$("tbody tr", table).forEach(tr => {
    const key = tr.cells[0] ? normalize(tr.cells[0].textContent) : "";
    const toks = key.split(/\s*(?:\/|,|\bor\b|\band\b)\s*/).map(t => t.replace(/\(.*?\)/g, "").trim()).filter(t => t.length >= 3);
    toks.forEach(t => {
      if (text.includes(t) && t.length > bestScore) { best = tr; bestScore = t.length; }
    });
  });
  return best;
}

function showInfo(fig, label, el) {
  const box = $(".dg-info", fig);
  const tr = matchRow(fig, label);
  const clean = label.replace(/\s+/g, " ").trim();
  if (!tr) {
    box.innerHTML = "<b>" + escapeHtml(clean) + '</b> <span class="miss">no matching row in the table below this diagram</span>';
  } else {
    const cells = Array.from(tr.cells).map(c => c.innerHTML);
    box.innerHTML = "<b>" + escapeHtml(clean) + "</b><br>" + cells.map((c, i) => (i ? "<div>" + c + "</div>" : "")).join("");
    decoratePaths(box);
    tr.classList.remove("hit");
    void tr.offsetWidth;
    tr.classList.add("hit");
  }
  box.classList.add("open");
}

function enhance(fig) {
  const svg = $("svg", fig);
  if (!svg) return;
  const kind = fig.dataset.kind;
  if (kind === "flowchart" || kind === "graph") {
    $$("g.node", svg).forEach(g => {
      const label = g.textContent || "";
      const m = CAT_RE.exec(label);
      if (m) { g.classList.add("cat-" + m[1]); g.dataset.cat = m[1]; }
      g.addEventListener("click", ev => {
        ev.stopPropagation();
        selectNode(fig, g, label);
      });
    });
    $$("g.cluster", svg).forEach(g => {
      const m = CAT_RE.exec(g.textContent || "");
      if (m) g.dataset.cat = m[1];
    });
    svg.addEventListener("click", () => clearSel(fig));
  } else if (kind === "sequenceDiagram") {
    $$("g", svg).forEach(g => {
      const r = g.querySelector(":scope > rect.actor");
      if (!r) return;
      const label = g.textContent || "";
      const m = CAT_RE.exec(label);
      g.classList.add("cat");
      if (m) { g.classList.add("cat-" + m[1]); g.dataset.cat = m[1]; }
      g.addEventListener("click", ev => {
        ev.stopPropagation();
        $$("g.cat.sel", svg).forEach(x => x.classList.remove("sel"));
        g.classList.add("sel");
        showInfo(fig, label, g);
      });
    });
  }
  applyFocus(fig);
}

function edgeEnds(path, nodeIds) {
  const id = path.id || "";
  const m = /^L[_-](.+)[_-]\d+$/.exec(id);
  if (!m) return null;
  const mid = m[1];
  for (const a of nodeIds) {
    if (mid.startsWith(a + "_")) {
      const rest = mid.slice(a.length + 1);
      if (nodeIds.includes(rest)) return [a, rest];
    }
  }
  return null;
}

function nodeIdOf(g) {
  const m = /^flowchart-(.+)-\d+$/.exec(g.id || "");
  return m ? m[1] : null;
}

function selectNode(fig, g, label) {
  const svg = $("svg", fig);
  clearSel(fig, true);
  g.classList.add("sel");
  const nodes = $$("g.node", svg);
  const ids = nodes.map(nodeIdOf).filter(Boolean);
  const me = nodeIdOf(g);
  const near = new Set([me]);
  $$("path.flowchart-link", svg).forEach(p => {
    const ends = edgeEnds(p, ids);
    if (ends && (ends[0] === me || ends[1] === me)) {
      p.classList.add("lit");
      ends.forEach(e => near.add(e));
    }
  });
  nodes.forEach(n => n.classList.toggle("dim", !near.has(nodeIdOf(n))));
  $$("path.flowchart-link", svg).forEach(p => { if (!p.classList.contains("lit")) p.classList.add("dim"); });
  showInfo(fig, label, g);
}

function clearSel(fig, keepInfo) {
  const svg = $("svg", fig);
  if (!svg) return;
  $$(".sel", svg).forEach(x => x.classList.remove("sel"));
  $$(".lit", svg).forEach(x => x.classList.remove("lit"));
  $$("g.node, path.flowchart-link", svg).forEach(x => x.classList.remove("dim"));
  applyFocus(fig);
  if (!keepInfo) $(".dg-info", fig).classList.remove("open");
}

function applyFocus(fig) {
  const svg = $("svg", fig);
  if (!svg) return;
  $$("g.node, g.cat", svg).forEach(g => {
    if (state.focus) g.classList.toggle("dim", g.dataset.cat !== state.focus);
    else if (!svg.querySelector(".sel")) g.classList.remove("dim");
  });
}

let timer = null;
function stopSteps() {
  if (timer) { clearInterval(timer); timer = null; }
  $$(".tools button").forEach(b => { if (b.dataset.label) { b.textContent = b.dataset.label; delete b.dataset.label; } });
}

function resetSteps(fig) {
  stopSteps();
  const svg = $("svg", fig);
  if (!svg) return;
  $$(".step-hidden, .step-now, .on", svg).forEach(x => x.classList.remove("step-hidden", "step-now", "on"));
  $(".caption", fig).textContent = "";
  fig._i = 0;
}

function seqParts(fig) {
  const svg = $("svg", fig);
  if (fig._parts) return fig._parts;
  const lines = $$("line.messageLine0, line.messageLine1, path.messageLine0, path.messageLine1", svg);
  const texts = $$("text.messageText", svg);
  const n = Math.min(lines.length, texts.length);
  const parts = [];
  for (let i = 0; i < n; i++) parts.push({ line: lines[i], text: texts[i] });
  fig._parts = parts;
  return parts;
}

function stepSequence(fig, dir) {
  const parts = seqParts(fig);
  if (!parts.length) return false;
  if (fig._i === undefined || fig._i === 0) parts.forEach(p => { p.line.classList.add("step-hidden"); p.text.classList.add("step-hidden"); });
  let i = fig._i || 0;
  if (dir > 0 && i >= parts.length) { resetSteps(fig); return false; }
  parts.forEach(p => p.text.classList.remove("step-now"));
  parts.forEach(p => p.line.classList.remove("step-now"));
  const p = parts[i];
  p.line.classList.remove("step-hidden");
  p.text.classList.remove("step-hidden");
  p.line.classList.add("step-now");
  p.text.classList.add("step-now");
  $(".caption", fig).textContent = "step " + (i + 1) + " of " + parts.length + ": " + p.text.textContent.trim().slice(0, 140);
  fig._i = i + 1;
  return true;
}

function playSequence(fig, btn) {
  if (timer) { stopSteps(); return; }
  if (fig._i && fig._i >= seqParts(fig).length) resetSteps(fig);
  btn.dataset.label = btn.textContent;
  btn.textContent = "Pause";
  timer = setInterval(() => {
    if (!stepSequence(fig, 1)) stopSteps();
    else if (fig._i >= seqParts(fig).length) { clearInterval(timer); timer = null; btn.textContent = btn.dataset.label; delete btn.dataset.label; }
  }, 900);
}

function traceFlow(fig, btn) {
  if (timer) { stopSteps(); return; }
  resetSteps(fig);
  const svg = $("svg", fig);
  const edges = $$("path.flowchart-link", svg);
  const nodes = $$("g.node", svg);
  const ids = nodes.map(nodeIdOf).filter(Boolean);
  if (!edges.length) return;
  nodes.forEach(n => n.classList.add("step-hidden"));
  edges.forEach(e => e.classList.add("step-hidden"));
  let i = 0;
  btn.dataset.label = btn.textContent;
  btn.textContent = "Stop";
  timer = setInterval(() => {
    $$(".step-now", svg).forEach(x => x.classList.remove("step-now"));
    if (i >= edges.length) { stopSteps(); $$(".step-hidden", svg).forEach(x => x.classList.remove("step-hidden")); $$(".on", svg).forEach(x => x.classList.remove("on")); $(".caption", fig).textContent = "trace finished"; return; }
    const e = edges[i];
    e.classList.remove("step-hidden");
    e.classList.add("on");
    const ends = edgeEnds(e, ids);
    if (ends) {
      ends.forEach(id => {
        const g = nodes.find(n => nodeIdOf(n) === id);
        if (g) { g.classList.remove("step-hidden"); g.classList.add("step-now"); }
      });
    }
    $(".caption", fig).textContent = "edge " + (i + 1) + " of " + edges.length + " in diagram source order";
    i++;
  }, 650);
  const first = nodes.filter(n => !n.classList.contains("step-hidden"));
  if (!first.length && !ids.length) nodes.forEach(n => n.classList.remove("step-hidden"));
}

const stage = $("#stage");
const inner = $("#inner");
const view = { x: 0, y: 0, k: 1 };
function applyView() {
  inner.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.k + ")";
}
function fitView() {
  const svg = $("svg", inner);
  if (!svg) return;
  const w = svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width ? svg.viewBox.baseVal.width : svg.getBoundingClientRect().width;
  const h = svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.height ? svg.viewBox.baseVal.height : svg.getBoundingClientRect().height;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.style.maxWidth = "none";
  const sw = stage.clientWidth, sh = stage.clientHeight;
  view.k = Math.min(sw / w, sh / h, 2) * 0.95;
  view.x = (sw - w * view.k) / 2;
  view.y = (sh - h * view.k) / 2;
  applyView();
}
function expand(fig) {
  const svg = $("svg", fig);
  if (!svg) return;
  inner.innerHTML = "";
  const clone = svg.cloneNode(true);
  clone.classList.remove("dim");
  inner.appendChild(clone);
  const holder = document.createElement("div");
  holder.className = "dg flow seen";
  holder.style.cssText = "border:0;box-shadow:none;background:transparent;opacity:1;transform:none;margin:0;overflow:visible";
  inner.appendChild(holder);
  holder.appendChild(clone);
  $("#otitle").textContent = (fig.previousElementSibling && /^H/.test(fig.previousElementSibling.tagName) ? fig.previousElementSibling.textContent : "Diagram");
  $("#overlay").classList.add("open");
  fitView();
}
function closeOverlay() { $("#overlay").classList.remove("open"); inner.innerHTML = ""; }
let drag = null;
stage.addEventListener("pointerdown", e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if (!drag) return; view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); });
stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("drag"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const k = Math.max(0.1, Math.min(8, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = px - (px - view.x) * (k / view.k);
  view.y = py - (py - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });
function zoomBy(f) {
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
  const k = Math.max(0.1, Math.min(8, view.k * f));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  applyView();
}
$("#zin").onclick = () => zoomBy(1.25);
$("#zout").onclick = () => zoomBy(0.8);
$("#zfit").onclick = fitView;
$("#zclose").onclick = closeOverlay;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeOverlay(); $("#results").classList.remove("open"); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
});

function buildChips() {
  const holder = $("#chips");
  holder.innerHTML = '<span style="font-size:12px;color:var(--muted)">Dim all but:</span>';
  CATS.forEach(([name, key]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = name;
    b.style.setProperty("--c", "var(--" + key + ")");
    b.style.setProperty("--cs", "var(--" + key + "-s)");
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      state.focus = state.focus === name ? null : name;
      $$(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.textContent === state.focus)));
      $$("figure.dg").forEach(applyFocus);
    });
    holder.appendChild(b);
  });
}

function search(q) {
  const box = $("#results");
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) { box.classList.remove("open"); return; }
  const hits = [];
  for (const s of INDEX) {
    if (!terms.every(t => s.hay.includes(t))) continue;
    const first = s.hay.indexOf(terms[0]);
    const body = (s.title + " " + s.body).replace(/\s+/g, " ");
    const at = Math.max(0, first - 50);
    let snip = escapeHtml(body.slice(at, at + 150));
    terms.forEach(t => { snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), m => "<mark>" + m + "</mark>"); });
    hits.push({ s, score: (s.title.toLowerCase().includes(terms[0]) ? 100 : 0) - first / 1000, snip });
  }
  hits.sort((a, b) => b.score - a.score);
  box.innerHTML = hits.slice(0, 40).map(h =>
    '<button data-page="' + h.s.page + '" data-id="' + h.s.id + '"><strong>' + escapeHtml(h.s.title) + "</strong><small>" +
    escapeHtml(h.s.pageTitle) + " &middot; " + h.snip + "</small></button>").join("") ||
    '<button disabled><small>No section matches</small></button>';
  box.classList.add("open");
}

function route() {
  const raw = location.hash.replace(/^#/, "");
  const [id, anchor] = raw.split("/");
  const target = PAGES.find(p => p.id === id) ? id : "0";
  if (state.page === target && anchor) {
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ block: "start" });
    return;
  }
  if (state.page === target && !anchor) return;
  showPage(target, anchor);
}

function init() {
  const saved = (() => { try { return localStorage.getItem("emerge-map-theme"); } catch (e) { return null; } })();
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  marked.setOptions({ gfm: true, breaks: false });
  marked.use({ renderer });
  PAGES.forEach(p => { outlines[p.id] = outline(p); INDEX.push(...sections(p)); });
  initMermaid();
  buildNav();
  buildChips();
  $("#anim").addEventListener("click", e => {
    state.animate = !state.animate;
    e.currentTarget.setAttribute("aria-pressed", String(state.animate));
    $$("figure.dg").forEach(f => f.classList.toggle("flow", state.animate));
  });
  $("#theme").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("emerge-map-theme", next); } catch (e) {}
    initMermaid();
    const id = state.page;
    const y = window.scrollY;
    state.page = null;
    showPage(id);
    window.scrollTo(0, y);
  });
  $("#menu").addEventListener("click", () => $("#side").classList.toggle("open"));
  const q = $("#q");
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("focus", () => { if (q.value) search(q.value); });
  $("#results").addEventListener("click", e => {
    const b = e.target.closest("button[data-page]");
    if (!b) return;
    location.hash = "#" + b.dataset.page + "/" + b.dataset.id;
    $("#results").classList.remove("open");
    if (state.page === b.dataset.page) route();
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".search")) $("#results").classList.remove("open");
    const a = e.target.closest("a[href^='#']");
    if (a && main.contains(a)) {
      const h = a.getAttribute("href");
      if (h === location.hash) route();
    }
  });
  window.addEventListener("hashchange", route);
  route();
}
init();
</script>
</body>
</html>
